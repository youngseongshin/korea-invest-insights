<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Supply shock transmission to inflation and earnings"><title>Supply shock transmission to inflation and earnings</title><rect width="1000" height="640" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="black"><text x="40" y="48" font-size="28" font-weight="bold" >02 / A SUPPLY SHOCK HAS TWO EQUITY CHANNELS</text><text x="40" y="82" font-size="20" font-weight="normal" >Conceptual transmission, not an estimated lag or pass-through rate</text><rect x="40" y="115" width="420" height="110" fill="black" opacity="0.08"/><text x="60" y="152" font-size="22" font-weight="bold" >1  Transport constraints</text><text x="60" y="191" font-size="19" font-weight="normal" >Ports, insurance, shipping routes</text><rect x="540" y="115" width="420" height="110" fill="black" opacity="0.08"/><text x="560" y="152" font-size="22" font-weight="bold" >2  Deliverable oil falls</text><text x="560" y="191" font-size="19" font-weight="normal" >Output shut-ins and inventory draws</text><rect x="40" y="280" width="420" height="110" fill="black" opacity="0.08"/><text x="60" y="317" font-size="22" font-weight="bold" >3  Refining / diesel bottleneck</text><text x="60" y="356" font-size="19" font-weight="normal" >Crude recovery alone may not fix this</text><rect x="540" y="280" width="420" height="110" fill="black" opacity="0.08"/><text x="560" y="317" font-size="22" font-weight="bold" >4  Costs reach businesses</text><text x="560" y="356" font-size="19" font-weight="normal" >Fuel, freight and working capital</text><rect x="40" y="465" width="420" height="110" fill="black" opacity="0.08"/><text x="60" y="502" font-size="22" font-weight="bold" >5A  Costs passed to consumers</text><text x="60" y="541" font-size="19" font-weight="normal" >CPI / expectations / policy pressure</text><rect x="540" y="465" width="420" height="110" fill="black" opacity="0.08"/><text x="560" y="502" font-size="22" font-weight="bold" >5B  Costs absorbed by firms</text><text x="560" y="541" font-size="19" font-weight="normal" >Lower margins and cash generation</text><line x1="465" y1="170" x2="535" y2="170" stroke="black" stroke-width="2"/><polygon points="535,170 525.0,165.0 525.0,175.0"/><line x1="700" y1="230" x2="300" y2="272" stroke="black" stroke-width="2"/><polygon points="300,272 310.46745631706716,275.9284040334836 309.42319701702723,265.9830773664364"/><line x1="465" y1="335" x2="535" y2="335" stroke="black" stroke-width="2"/><polygon points="535,335 525.0,330.0 525.0,340.0"/><line x1="730" y1="400" x2="730" y2="457" stroke="black" stroke-width="2"/><polygon points="730,457 735.0,447.0 725.0,447.0"/><line x1="680" y1="400" x2="310" y2="457" stroke="black" stroke-width="2"/><polygon points="310,457 320.64469749683076,460.41912491742625 319.12211843203943,450.5357169529911"/><text x="40" y="618" font-size="19" font-weight="normal" >Supply repair targets the bottleneck; monetary policy targets second-round effects.</text></g></svg>