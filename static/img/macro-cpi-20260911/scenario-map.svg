<text x="618" y="492" font-size="18" font-weight="normal" >Protect liquidity and resilience</text><text x="40" y="229" font-size="24" font-weight="bold" >CORE</text><text x="40" y="264" font-size="24" font-weight="bold" >COOLS</text><text x="40" y="434" font-size="24" font-weight="bold" >CORE</text><text x="40" y="469" font-size="22" font-weight="bold" >BROADENS</text><text x="40" y="600" font-size="19" font-weight="normal" >Analytical framework, not a forecast. Falling yields can also signal weaker growth.</text></g></svg>