<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Cash flow and discount rate sensitivity model"><title>Cash flow and discount rate sensitivity model</title><rect width="1000" height="640" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="black"><text x="40" y="48" font-size="27" font-weight="bold" >06 / EARNINGS AND DISCOUNT RATES HIT THE SAME VALUE</text><text x="40" y="83" font-size="20" font-weight="normal" >Illustration: value = next-year cash flow / (discount rate - 3% growth)</text><text x="280" y="146" font-size="25" font-weight="bold" >r = 8%</text><text x="505" y="146" font-size="25" font-weight="bold" >r = 9%</text><text x="730" y="146" font-size="25" font-weight="bold" >r = 10%</text><text x="40" y="222" font-size="23" font-weight="bold" >CF = 90</text><rect x="220" y="173" width="212" height="100" fill="black" opacity="0.05"/><text x="237" y="213" font-size="29" font-weight="bold" >1,800.0</text><text x="237" y="249" font-size="20" font-weight="normal" >+8.0% vs base</text><rect x="445" y="173" width="212" height="100" fill="black" opacity="0.05"/><text x="462" y="213" font-size="29" font-weight="bold" >1,500.0</text><text x="462" y="249" font-size="20" font-weight="normal" >-10.0% vs base</text><rect x="670" y="173" width="212" height="100" fill="black" opacity="0.05"/><text x="687" y="213" font-size="29" font-weight="bold" >1,285.7</text><text x="687" y="249" font-size="20" font-weight="normal" >-22.9% vs base</text><text x="40" y="335" font-size="23" font-weight="bold" >CF = 100</text><rect x="220" y="286" width="212" height="100" fill="black" opacity="0.05"/><text x="237" y="326" font-size="29" font-weight="bold" >2,000.0</text><text x="237" y="362" font-size="20" font-weight="normal" >+20.0% vs base</text><rect x="445" y="286" width="212" height="100" fill="black" opacity="0.16"/><text x="462" y="326" font-size="29" font-weight="bold" >1,666.7</text><text x="462" y="362" font-size="20" font-weight="normal" >BASE</text><rect x="670" y="286" width="212" height="100" fill="black" opacity="0.05"/><text x="687" y="326" font-size="29" font-weight="bold" >1,428.6</text><text x="687" y="362" font-size="20" font-weight="normal" >-14.3% vs base</text><text x="40" y="448" font-size="23" font-weight="bold" >CF = 110</text><rect x="220" y="399" width="212" height="100" fill="black" opacity="0.05"/><text x="237" y="439" font-size="29" font-weight="bold" >2,200.0</text><text x="237" y="475" font-size="20" font-weight="normal" >+32.0% vs base</text><rect x="445" y="399" width="212" height="100" fill="black" opacity="0.05"/><text x="462" y="439" font-size="29" font-weight="bold" >1,833.3</text><text x="462" y="475" font-size="20" font-weight="normal" >+10.0% vs base</text><rect x="670" y="399" width="212" height="100" fill="black" opacity="0.05"/><text x="687" y="439" font-size="29" font-weight="bold" >1,571.4</text><text x="687" y="475" font-size="20" font-weight="normal" >-5.7% vs base</text><text x="40" y="560" font-size="24" font-weight="bold" >CF -10% plus discount rate +1 percentage point: value -22.9%.</text><text x="40" y="602" font-size="18" font-weight="normal" >Assumptions, not a company target price. Rates need not move one-for-one with bonds.</text></g></svg>