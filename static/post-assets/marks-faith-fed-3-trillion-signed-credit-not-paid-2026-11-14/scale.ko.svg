<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="이미 맺은 약정은 막스가 본 연간 필요 자본의 3년 치"><rect x="0" y="0" width="760" height="410" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">이미 맺은 약정은 막스가 본 AI 연간 필요 자본의 3년 치입니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">십억달러. 약정 잔액과 발행 흐름을 한 축에 둔 크기 비교</text><line x1="330.0" y1="76.0" x2="330.0" y2="306.0" stroke="#e3e7eb" stroke-width="1"/><text x="330.0" y="320.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">0</text><line x1="445.6" y1="76.0" x2="445.6" y2="306.0" stroke="#e3e7eb" stroke-width="1"/><text x="445.6" y="320.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">1,000</text><line x1="561.2" y1="76.0" x2="561.2" y2="306.0" stroke="#e3e7eb" stroke-width="1"/><text x="561.2" y="320.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">2,000</text><line x1="676.9" y1="76.0" x2="676.9" y2="306.0" stroke="#e3e7eb" stroke-width="1"/><text x="676.9" y="320.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">3,000</text><text x="320.0" y="104.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">골드만: 2026 AI 채권(막스 인용)</text><rect x="330.0" y="90.0" width="69.4" height="22.0" fill="#9dbbe0" rx="3"/><text x="405.4" y="106.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">~600</text><text x="320.0" y="150.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">BofA: 10월까지 AI 부채 발행(연준 인용)</text><rect x="330.0" y="136.0" width="78.6" height="22.0" fill="#2563a8" rx="3"/><text x="414.6" y="152.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">&gt;680</text><text x="320.0" y="196.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">같은 속도의 연율(총발행, 상한)</text><rect x="330.0" y="182.0" width="94.4" height="22.0" fill="#2563a8" rx="3"/><text x="430.4" y="198.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">816</text><text x="320.0" y="242.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">막스: AI 연간 필요 신규 자본(출처 미기재)</text><rect x="330.0" y="228.0" width="115.6" height="22.0" fill="#8a96a3" rx="3"/><text x="451.6" y="244.0" font-size="12" fill="#8a96a3" text-anchor="start" font-weight="bold">1,000</text><text x="320.0" y="288.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">7개사 장부 밖 의무(비할인)</text><rect x="330.0" y="274.0" width="346.9" height="22.0" fill="#d9822b" rx="3"/><text x="682.9" y="290.0" font-size="12" fill="#d9822b" text-anchor="start" font-weight="bold">&gt;3,000</text><line x1="445.6" y1="274.0" x2="445.6" y2="302.0" stroke="#ffffff" stroke-width="2"/><line x1="561.2" y1="274.0" x2="561.2" y2="302.0" stroke="#ffffff" stroke-width="2"/><text x="503.4" y="346.0" font-size="12.5" fill="#c2410c" text-anchor="middle" font-weight="bold">= 막스 연간 필요액의 3.0배</text><text x="24.0" y="396.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: 오크트리 메모(11/11), 연준 금융안정보고서(11/13). 계산은 저희</text><text x="24.0" y="381.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">골드만과 BofA 집계는 시점·정의가 다른데도 12% 안에서 만남(600 ÷ 680 = 88%).</text></svg>
