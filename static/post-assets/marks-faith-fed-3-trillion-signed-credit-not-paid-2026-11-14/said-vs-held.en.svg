<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Worry about AI rose to 87% while leverage hit records"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">What they said: AI is the top risk. What they held: record leverage</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Federal Reserve FSR, November 2026</text><text x="24.0" y="88.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">SAID</text><text x="24.0" y="106.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Survey: AI named as a risk</text><rect x="50.0" y="215.0" width="80.0" height="85.0" fill="#9dbbe0" rx="3"/><text x="90.0" y="207.0" font-size="18" fill="#9dbbe0" text-anchor="middle" font-weight="bold">50%</text><text x="90.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">Spring 2026</text><rect x="180.0" y="152.1" width="80.0" height="147.9" fill="#c2410c" rx="3"/><text x="220.0" y="144.1" font-size="18" fill="#c2410c" text-anchor="middle" font-weight="bold">87%</text><text x="220.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">Fall 2026</text><text x="155.0" y="336.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">20 of 23 respondents in the fall</text><line x1="330.0" y1="80.0" x2="330.0" y2="340.0" stroke="#c9d0d7" stroke-width="1"/><text x="350.0" y="88.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">HELD</text><rect x="350.0" y="100.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="122.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Hedge fund gross leverage</text><text x="366.0" y="150.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">Highest since 2013</text><text x="720.0" y="150.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">Form PF, 2026 Q1</text><rect x="350.0" y="180.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="202.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Leveraged equity ETPs</text><text x="366.0" y="230.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">&gt;$170B</text><text x="720.0" y="230.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">Daily rebalancing can deepen falls</text><rect x="350.0" y="260.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="282.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Equities' share of dealer trading profit</text><text x="366.0" y="310.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">1/3 → 1/2</text><text x="720.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">Dealer survey</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Samples and dates differ: 23 market contacts (Sep-Oct) versus full Form PF data (Q1). Same people cannot be inferred.</text></svg>
