<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Next checkpoints"><rect x="0" y="0" width="760" height="470" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">What would show credit starting to charge for AI risk</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Existing checkpoints, scored against this post's two calls</text><line x1="110.0" y1="86.0" x2="110.0" y2="386.0" stroke="#c9d0d7" stroke-width="2"/><circle cx="110.0" cy="98.0" r="7" fill="#2563a8"/><text x="96.0" y="102.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">Nov 18</text><text x="130.0" y="102.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Nvidia FQ3; 10-Q notes Nov 19-25</text><text x="130.0" y="122.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Residual value guarantees up: chip-life risk stays with the chipmaker. Down: it moved back to lenders</text><circle cx="110.0" cy="162.0" r="7" fill="#c2410c"/><text x="96.0" y="166.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">Dec 10</text><text x="130.0" y="166.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">FOMC; AA and high-yield spreads</text><text x="130.0" y="186.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">AA ≥75bp or HY ≥350bp: credit has started to charge for the risk</text><circle cx="110.0" cy="226.0" r="7" fill="#2563a8"/><text x="96.0" y="230.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">Dec 11</text><text x="130.0" y="230.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Fed Z.1, 2026 Q3</text><text x="130.0" y="250.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Corporate private credit growth below 10% (from 13.2%): slower inflows reached lending</text><circle cx="110.0" cy="290.0" r="7" fill="#2563a8"/><text x="96.0" y="294.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">~Feb 2027</text><text x="130.0" y="294.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Seven firms' annual filings</text><text x="130.0" y="314.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Obligations keep rising: more locked in. Renegotiation: a credit event</text><circle cx="110.0" cy="354.0" r="7" fill="#2563a8"/><text x="96.0" y="358.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">May 2027</text><text x="130.0" y="358.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Next Financial Stability Report</text><text x="130.0" y="378.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Does hedge fund leverage come off its record? Does the AI share of the survey hold?</text><text x="24.0" y="456.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Checkpoints are where we look again, not automatic trading rules. Dates in KST.</text></svg>
