<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="가장 불확실한 층을 가장 약한 돈이 들고 있습니다"><rect x="0" y="0" width="760" height="420" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">예측 가능성이 낮은 층일수록 돈을 댄 쪽이 약합니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">예측 가능성 1~10(막스 메모가 인용한 Claude 답, 데이터 아님)과 층별 자금 제공자(연준)</text><text x="200.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">예측 가능성</text><text x="410.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">누가 돈을 댔나(연준)</text><text x="190.0" y="115.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">규제 전력</text><rect x="200.0" y="102.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="102.0" width="108.0" height="20.0" fill="#2563a8" rx="3"/><text x="314.0" y="117.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">6</text><text x="410.0" y="117.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">은행 AI 관련 노출 약 1조달러의 일부</text><line x1="24.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="155.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">빅테크 장기 임대 데이터센터</text><rect x="200.0" y="142.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="142.0" width="90.0" height="20.0" fill="#2563a8" rx="3"/><rect x="290.0" y="142.0" width="18.0" height="20.0" fill="#2563a888" rx="0"/><text x="314.0" y="157.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">5–6</text><text x="410.0" y="157.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">하이퍼스케일러 리스를 담보로 한 선순위 부채</text><line x1="24.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="195.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">하이퍼스케일러</text><rect x="200.0" y="182.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="182.0" width="90.0" height="20.0" fill="#2563a8" rx="3"/><text x="296.0" y="197.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">5</text><text x="410.0" y="197.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">회사채는 펀드·연기금·보험사, 손실 1층은 주주</text><line x1="24.0" y1="210.0" x2="736.0" y2="210.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="235.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">칩</text><rect x="200.0" y="222.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="222.0" width="72.0" height="20.0" fill="#d9822b" rx="3"/><text x="278.0" y="237.0" font-size="12" fill="#d9822b" text-anchor="start" font-weight="bold">4</text><text x="410.0" y="237.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU 제조사가 담보 잔존가치 보증</text><line x1="24.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="275.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">네오클라우드·투기적 DC</text><rect x="200.0" y="262.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="262.0" width="36.0" height="20.0" fill="#c2410c" rx="3"/><rect x="236.0" y="262.0" width="18.0" height="20.0" fill="#c2410c88" rx="0"/><text x="260.0" y="277.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="bold">2–3</text><text x="410.0" y="277.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="bold">후순위·지분: 하이일드 펀드·생보·BDC</text><line x1="24.0" y1="290.0" x2="736.0" y2="290.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="315.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">프런티어 랩</text><rect x="200.0" y="302.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="302.0" width="36.0" height="20.0" fill="#c2410c" rx="3"/><text x="242.0" y="317.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="bold">2</text><text x="410.0" y="317.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="bold">하이퍼스케일러·GPU 제조사 지분(순환 금융)</text><line x1="24.0" y1="330.0" x2="736.0" y2="330.0" stroke="#e3e7eb" stroke-width="1"/><text x="410.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">생보: 레버리지 역사적 고점, 비전통 부채 5,800억달러 초과</text><text x="410.0" y="370.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">비상장 영구 BDC: 유입 급감, 순유출</text><text x="24.0" y="406.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: 오크트리 메모(점수는 언어모델 답), 연준 금융안정보고서 박스 2.2·4장</text></svg>
