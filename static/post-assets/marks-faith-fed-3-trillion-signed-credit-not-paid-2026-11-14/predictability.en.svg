<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="The least predictable layers are funded by the weakest balance sheets"><rect x="0" y="0" width="760" height="420" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">The lower the predictability, the weaker the money behind it</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Predictability 1-10 (Claude's answer quoted in Marks's memo, not data) and who funds each layer (Fed)</text><text x="200.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Predictability</text><text x="410.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Who funds it (Fed)</text><text x="190.0" y="115.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Regulated utilities</text><rect x="200.0" y="102.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="102.0" width="108.0" height="20.0" fill="#2563a8" rx="3"/><text x="314.0" y="117.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">6</text><text x="410.0" y="117.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Part of banks' ~$1T AI-related exposure</text><line x1="24.0" y1="130.0" x2="736.0" y2="130.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="155.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Big Tech-leased data centers</text><rect x="200.0" y="142.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="142.0" width="90.0" height="20.0" fill="#2563a8" rx="3"/><rect x="290.0" y="142.0" width="18.0" height="20.0" fill="#2563a888" rx="0"/><text x="314.0" y="157.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">5–6</text><text x="410.0" y="157.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Senior debt backed by hyperscaler leases</text><line x1="24.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="195.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Hyperscalers</text><rect x="200.0" y="182.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="182.0" width="90.0" height="20.0" fill="#2563a8" rx="3"/><text x="296.0" y="197.0" font-size="12" fill="#2563a8" text-anchor="start" font-weight="bold">5</text><text x="410.0" y="197.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Bonds: mutual funds, pensions, insurers. Equity = first loss</text><line x1="24.0" y1="210.0" x2="736.0" y2="210.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="235.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Chips</text><rect x="200.0" y="222.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="222.0" width="72.0" height="20.0" fill="#d9822b" rx="3"/><text x="278.0" y="237.0" font-size="12" fill="#d9822b" text-anchor="start" font-weight="bold">4</text><text x="410.0" y="237.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU makers guarantee collateral residual value</text><line x1="24.0" y1="250.0" x2="736.0" y2="250.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="275.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Neocloud / speculative DCs</text><rect x="200.0" y="262.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="262.0" width="36.0" height="20.0" fill="#c2410c" rx="3"/><rect x="236.0" y="262.0" width="18.0" height="20.0" fill="#c2410c88" rx="0"/><text x="260.0" y="277.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="bold">2–3</text><text x="410.0" y="277.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="bold">Junior tranches: HY funds, life insurers, BDCs</text><line x1="24.0" y1="290.0" x2="736.0" y2="290.0" stroke="#e3e7eb" stroke-width="1"/><text x="190.0" y="315.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Frontier labs</text><rect x="200.0" y="302.0" width="180.0" height="20.0" fill="#f1f3f5" rx="3"/><rect x="200.0" y="302.0" width="36.0" height="20.0" fill="#c2410c" rx="3"/><text x="242.0" y="317.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="bold">2</text><text x="410.0" y="317.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="bold">Equity from hyperscalers &amp; GPU makers (circular)</text><line x1="24.0" y1="330.0" x2="736.0" y2="330.0" stroke="#e3e7eb" stroke-width="1"/><text x="410.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Life insurers: leverage at a historic high, &gt;$580B nontraditional liabilities</text><text x="410.0" y="370.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Nontraded BDCs: inflows slowed sharply, net outflows</text><text x="24.0" y="406.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Sources: Oaktree memo (scores are a language-model answer); Federal Reserve FSR, Box 2.2 and Section 4.</text></svg>
