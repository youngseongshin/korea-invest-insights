<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="다음 확인 일정"><rect x="0" y="0" width="760" height="470" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">신용이 AI 위험의 값을 받기 시작하는 신호</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">기존 일정에 이 글의 판단을 붙인 채점표</text><line x1="110.0" y1="86.0" x2="110.0" y2="386.0" stroke="#c9d0d7" stroke-width="2"/><circle cx="110.0" cy="98.0" r="7" fill="#2563a8"/><text x="96.0" y="102.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">11/18</text><text x="130.0" y="102.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">엔비디아 3분기, 10-Q 주석 11/19~25</text><text x="130.0" y="122.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">잔존가치 보증 증가면 칩 수명 위험은 제조사에, 감소면 대출자 쪽으로 이동</text><circle cx="110.0" cy="162.0" r="7" fill="#c2410c"/><text x="96.0" y="166.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">12/10</text><text x="130.0" y="166.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">FOMC, AA·하이일드 스프레드</text><text x="130.0" y="186.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">AA 75bp 이상 또는 HY 350bp 이상이면 신용이 값을 받기 시작</text><circle cx="110.0" cy="226.0" r="7" fill="#2563a8"/><text x="96.0" y="230.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">12/11</text><text x="130.0" y="230.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">연준 자금순환 통계 3분기</text><text x="130.0" y="250.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">법인 사모신용 증가율 10% 미만(직전 13.2%)이면 유입 둔화가 대출로 번짐</text><circle cx="110.0" cy="290.0" r="7" fill="#2563a8"/><text x="96.0" y="294.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">2027-02경</text><text x="130.0" y="294.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">7개사 연차 공시</text><text x="130.0" y="314.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">의무 증가 지속이면 잠김 진행, 재협상 공시면 신용 사건</text><circle cx="110.0" cy="354.0" r="7" fill="#2563a8"/><text x="96.0" y="358.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">2027-05</text><text x="130.0" y="358.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">다음 금융안정보고서</text><text x="130.0" y="378.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">헤지펀드 레버리지가 최고에서 내려오나, 설문 AI 비율은</text><text x="24.0" y="456.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">다시 보는 시점이며 자동 매매 규칙이 아님. 날짜는 한국 시간</text></svg>
