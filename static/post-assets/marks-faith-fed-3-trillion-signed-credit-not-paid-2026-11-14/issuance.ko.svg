<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="AI 부채 발행 5.2배, 비금융 IG 발행의 31%"><rect x="0" y="0" width="760" height="380" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">AI는 3년 만에 투자등급 발행의 6% 미만에서 약 31%가 됐습니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">AI 관련 부채 발행(BofA 집계, 연준 인용)</text><text x="40.0" y="86.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">발행액, 십억달러</text><line x1="40.0" y1="300.0" x2="340.0" y2="300.0" stroke="#c9d0d7" stroke-width="1"/><rect x="75.0" y="267.5" width="80.0" height="32.5" fill="#9dbbe0" rx="3"/><text x="115.0" y="259.5" font-size="15" fill="#9dbbe0" text-anchor="middle" font-weight="bold">130</text><text x="115.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2023년 연간</text><rect x="225.0" y="130.0" width="80.0" height="170.0" fill="#2563a8" rx="3"/><text x="265.0" y="122.0" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="bold">680+</text><text x="265.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026년 10월까지</text><text x="190.0" y="200.0" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="bold">5.2배</text><text x="420.0" y="86.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">비금융 IG 발행 중 비중</text><line x1="420.0" y1="300.0" x2="720.0" y2="300.0" stroke="#c9d0d7" stroke-width="1"/><rect x="455.0" y="267.4" width="80.0" height="32.6" fill="#9dbbe0" rx="3"/><text x="495.0" y="259.4" font-size="15" fill="#9dbbe0" text-anchor="middle" font-weight="bold">&lt;6%</text><text x="495.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2023</text><rect x="605.0" y="131.7" width="80.0" height="168.3" fill="#d9822b" rx="3"/><text x="645.0" y="123.7" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="bold">~31%</text><text x="645.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026</text><text x="24.0" y="366.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">144A 포함, 4(a)(2) 사모 제외. 출처: 연준 이사회 금융안정보고서 2026년 11월호(자료 기준 10/28)</text><text x="24.0" y="351.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">공개시장 AI 관련 부채 잔액 1조1,000억달러 초과(2026-10). 사모 거래 제외라 실제는 더 큼.</text></svg>
