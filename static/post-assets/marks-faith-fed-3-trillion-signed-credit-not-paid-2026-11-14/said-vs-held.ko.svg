<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="AI 걱정은 87%로, 레버리지는 최고로"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">말한 것은 'AI가 최대 위험', 잡은 것은 기록적 레버리지</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">연준 금융안정보고서 2026년 11월호</text><text x="24.0" y="88.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">말한 것</text><text x="24.0" y="106.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">설문: AI를 위험으로 꼽은 비율</text><rect x="50.0" y="215.0" width="80.0" height="85.0" fill="#9dbbe0" rx="3"/><text x="90.0" y="207.0" font-size="18" fill="#9dbbe0" text-anchor="middle" font-weight="bold">50%</text><text x="90.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026년 봄</text><rect x="180.0" y="152.1" width="80.0" height="147.9" fill="#c2410c" rx="3"/><text x="220.0" y="144.1" font-size="18" fill="#c2410c" text-anchor="middle" font-weight="bold">87%</text><text x="220.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026년 가을</text><text x="155.0" y="336.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">가을 23명 중 20명</text><line x1="330.0" y1="80.0" x2="330.0" y2="340.0" stroke="#c9d0d7" stroke-width="1"/><text x="350.0" y="88.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">잡은 것</text><rect x="350.0" y="100.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="122.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">헤지펀드 총 레버리지</text><text x="366.0" y="150.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">2013년 이후 최고</text><text x="720.0" y="150.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">Form PF, 2026년 1분기</text><rect x="350.0" y="180.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="202.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">주식 연계 레버리지 ETP</text><text x="366.0" y="230.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">1,700억달러 초과</text><text x="720.0" y="230.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">일일 재조정이 하락을 키울 수 있음</text><rect x="350.0" y="260.0" width="386.0" height="70.0" fill="#fbf3ea" rx="6"/><text x="366.0" y="282.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">딜러 트레이딩 이익 중 주식 몫</text><text x="366.0" y="310.0" font-size="19" fill="#d9822b" text-anchor="start" font-weight="bold">3분의 1 → 2분의 1</text><text x="720.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">딜러 설문</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">표본·시점이 다름: 시장 접촉 23명(9~10월) 대 Form PF 전체(1분기). 같은 주체로 단정할 수 없음</text></svg>
