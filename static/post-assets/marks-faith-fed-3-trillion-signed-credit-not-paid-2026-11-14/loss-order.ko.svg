<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="손실 순서: 주주, 후순위 보유층, 은행"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">회수가 실망스러우면 손실은 이 사다리를 타고 내려갑니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">연준이 그린 AI 조달 그물의 손실 순서</text><rect x="24.0" y="78.0" width="712.0" height="80.0" fill="#2563a818" rx="6" stroke="#2563a8" stroke-width="1"/><rect x="24.0" y="78.0" width="6.0" height="80.0" fill="#2563a8" rx="0"/><text x="44.0" y="104.0" font-size="14" fill="#2563a8" text-anchor="start" font-weight="bold">1. 7개사 주주</text><text x="44.0" y="126.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">장부 밖 의무 3조달러 이상</text><text x="44.0" y="145.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">가장 강한 신용. 연준에겐 완충, 주주에겐 노출</text><polygon points="64.0,162.0 78.0,162.0 71.0,174.0" fill="#2563a8"/><rect x="94.0" y="178.0" width="642.0" height="80.0" fill="#d9822b18" rx="6" stroke="#d9822b" stroke-width="1"/><rect x="94.0" y="178.0" width="6.0" height="80.0" fill="#d9822b" rx="0"/><text x="114.0" y="204.0" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">2. 후순위 보유층</text><text x="114.0" y="226.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">SPE 후순위·지분: 하이일드 펀드·생보·BDC</text><text x="114.0" y="245.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">생보 레버리지 고점, BDC 순유출</text><polygon points="134.0,262.0 148.0,262.0 141.0,274.0" fill="#d9822b"/><rect x="164.0" y="278.0" width="572.0" height="80.0" fill="#c2410c18" rx="6" stroke="#c2410c" stroke-width="1"/><rect x="164.0" y="278.0" width="6.0" height="80.0" fill="#c2410c" rx="0"/><text x="184.0" y="304.0" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">3. 은행</text><text x="184.0" y="326.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">대형 은행지주 AI 관련 노출 약 1조달러</text><text x="184.0" y="345.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">비은행 약정 2.8조달러 초과, SPE·CLO·ABS 약정 1년 +약 30%</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">지금 어느 칸도 위험의 값을 더 받지 않습니다. 출처: 연준 금융안정보고서 2026년 11월호 박스 2.2·3장</text></svg>
