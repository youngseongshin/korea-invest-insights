<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="막스가 묻고 연준은 '누가 얼마를 걸었나'만 답했습니다"><rect x="0" y="0" width="760" height="524" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">연준은 '누가 얼마를 걸었나'만 채웠고 '돌아오나'는 아무도 답하지 않았습니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">하워드 막스 메모(11/11)의 질문과 연준 금융안정보고서(11/13)의 답</text><text x="24.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">막스의 질문</text><text x="330.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">연준</text><text x="440.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">연준이 준 숫자·서술</text><line x1="24.0" y1="92.0" x2="736.0" y2="92.0" stroke="#c9d0d7" stroke-width="1"/><text x="24.0" y="125.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">한 부문 의존(단층선)</text><rect x="318.0" y="110.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="125.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">답함</text><text x="440.0" y="125.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">근접 위험 1번: 기업 투자 수익 실망</text><line x1="24.0" y1="140.0" x2="736.0" y2="140.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="163.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">AI 채권 규모(골드만 약 6,000억달러)</text><rect x="318.0" y="148.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="163.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">답함</text><text x="440.0" y="163.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">10월까지 6,800억달러 초과, 비금융 IG 발행의 약 31%</text><line x1="24.0" y1="178.0" x2="736.0" y2="178.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="201.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">AI 차입이 국채 금리를 올렸나</text><rect x="318.0" y="186.0" width="108.0" height="22.0" fill="#8a96a3" rx="11"/><text x="372.0" y="201.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">근거 없음</text><text x="440.0" y="201.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">설문 요인은 에너지·재정·해외 수요, AI 차입 없음</text><line x1="24.0" y1="216.0" x2="736.0" y2="216.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="239.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">부외 SPV 부채의 모회사 책임</text><rect x="318.0" y="224.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="239.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">답함</text><text x="440.0" y="239.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">경제적 노출이 장부 부채보다 "상당히 크다"</text><line x1="24.0" y1="254.0" x2="736.0" y2="254.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="277.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">칩 담보 수명이 부채보다 짧다</text><rect x="318.0" y="262.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="277.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">위치 확인</text><text x="440.0" y="277.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU 제조사가 담보 잔존가치를 보증</text><line x1="24.0" y1="292.0" x2="736.0" y2="292.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="315.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">누가 어느 위험을 졌나</text><rect x="318.0" y="300.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="315.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">지도화</text><text x="440.0" y="315.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">후순위는 하이일드 펀드·생보·BDC, 은행 약 1조달러</text><line x1="24.0" y1="330.0" x2="736.0" y2="330.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="353.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">하이퍼스케일러 등급이 바뀌나</text><rect x="318.0" y="338.0" width="108.0" height="22.0" fill="#d9822b" rx="11"/><text x="372.0" y="353.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">견해 다름</text><text x="440.0" y="353.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">공개 비금융 부채 75% 넘게 IG, 이자보상 견고</text><line x1="24.0" y1="368.0" x2="736.0" y2="368.0" stroke="#e3e7eb" stroke-width="1"/><rect x="20.0" y="368.0" width="720.0" height="36.0" fill="#fdf1ec" rx="4"/><text x="24.0" y="391.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">이익 귀속, 경쟁, 기업 이익</text><rect x="318.0" y="376.0" width="108.0" height="22.0" fill="#c2410c" rx="11"/><text x="372.0" y="391.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">답 없음</text><text x="440.0" y="391.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">—</text><line x1="24.0" y1="406.0" x2="736.0" y2="406.0" stroke="#e3e7eb" stroke-width="1"/><rect x="20.0" y="406.0" width="720.0" height="36.0" fill="#fdf1ec" rx="4"/><text x="24.0" y="429.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">사용자 가치가 수조달러를 회수하나</text><rect x="318.0" y="414.0" width="108.0" height="22.0" fill="#c2410c" rx="11"/><text x="372.0" y="429.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">답 없음</text><text x="440.0" y="429.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">—</text><line x1="24.0" y1="444.0" x2="736.0" y2="444.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="468.0" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="bold">채워진 칸은 모두 조달이고, 빈칸은 모두 회수입니다.</text><text x="24.0" y="510.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: 연준 이사회 금융안정보고서 2026년 11월호(자료 기준 10/28), 오크트리 메모. 분류는 저희 판단</text></svg>
