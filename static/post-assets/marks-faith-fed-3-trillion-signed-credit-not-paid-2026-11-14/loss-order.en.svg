<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Loss order: shareholders, junior holders, banks"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">If AI payback disappoints, losses run down this ladder</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Loss order in the AI funding web, as mapped by the Fed</text><rect x="24.0" y="78.0" width="712.0" height="80.0" fill="#2563a818" rx="6" stroke="#2563a8" stroke-width="1"/><rect x="24.0" y="78.0" width="6.0" height="80.0" fill="#2563a8" rx="0"/><text x="44.0" y="104.0" font-size="14" fill="#2563a8" text-anchor="start" font-weight="bold">1. Shareholders of the seven firms</text><text x="44.0" y="126.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Carry &gt;$3T of off-balance-sheet obligations</text><text x="44.0" y="145.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Strongest credit. A cushion for the Fed, exposure for owners</text><polygon points="64.0,162.0 78.0,162.0 71.0,174.0" fill="#2563a8"/><rect x="94.0" y="178.0" width="642.0" height="80.0" fill="#d9822b18" rx="6" stroke="#d9822b" stroke-width="1"/><rect x="94.0" y="178.0" width="6.0" height="80.0" fill="#d9822b" rx="0"/><text x="114.0" y="204.0" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">2. Junior tranche holders</text><text x="114.0" y="226.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">SPE subordinated &amp; equity: HY funds, life insurers, BDCs</text><text x="114.0" y="245.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Record insurer leverage; BDC net outflows</text><polygon points="134.0,262.0 148.0,262.0 141.0,274.0" fill="#d9822b"/><rect x="164.0" y="278.0" width="572.0" height="80.0" fill="#c2410c18" rx="6" stroke="#c2410c" stroke-width="1"/><rect x="164.0" y="278.0" width="6.0" height="80.0" fill="#c2410c" rx="0"/><text x="184.0" y="304.0" font-size="14" fill="#c2410c" text-anchor="start" font-weight="bold">3. Banks</text><text x="184.0" y="326.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">~$1T exposure at largest bank holding companies</text><text x="184.0" y="345.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">&gt;$2.8T commitments to nonbanks; SPE/CLO/ABS lines +~30% in a year</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">No rung is being paid more for its risk today. Source: Federal Reserve FSR, November 2026, Box 2.2 and Section 3.</text></svg>
