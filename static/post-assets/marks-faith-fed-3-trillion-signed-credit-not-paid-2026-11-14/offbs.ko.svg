<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" width="760" height="505" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="장부 밖 의무가 장부 부채의 0.3배에서 3.4배 이상으로"><rect x="0" y="0" width="760" height="505" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">장부 밖 의무는 1년 반 만에 장부 부채와 같은 크기에서 3.4배 이상이 됐습니다</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">7개사(아마존·알파벳·브로드컴·메타·MS·엔비디아·오라클), 십억달러, 비할인 명목</text><rect x="24.0" y="66.0" width="12.0" height="12.0" fill="#2563a8" rx="2"/><text x="42.0" y="76.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">장부 부채</text><rect x="121.5" y="66.0" width="12.0" height="12.0" fill="#f2c38f" rx="2"/><text x="139.5" y="76.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">개시 전 리스</text><rect x="242.0" y="66.0" width="12.0" height="12.0" fill="#d9822b" rx="2"/><text x="260.0" y="76.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">보증·계약 약정</text><line x1="70.0" y1="400.0" x2="740.0" y2="400.0" stroke="#e3e7eb" stroke-width="1"/><text x="62.0" y="404.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">0</text><line x1="70.0" y1="325.0" x2="740.0" y2="325.0" stroke="#e3e7eb" stroke-width="1"/><text x="62.0" y="329.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">800</text><line x1="70.0" y1="250.0" x2="740.0" y2="250.0" stroke="#e3e7eb" stroke-width="1"/><text x="62.0" y="254.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">1,600</text><line x1="70.0" y1="175.0" x2="740.0" y2="175.0" stroke="#e3e7eb" stroke-width="1"/><text x="62.0" y="179.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">2,400</text><line x1="70.0" y1="100.0" x2="740.0" y2="100.0" st