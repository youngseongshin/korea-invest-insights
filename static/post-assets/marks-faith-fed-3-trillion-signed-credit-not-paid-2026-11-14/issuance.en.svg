<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="AI debt issuance rose 5.2 times and took 31% of nonfinancial IG issuance"><rect x="0" y="0" width="760" height="380" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">AI went from under 6% to about 31% of investment-grade issuance in three years</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">AI-related debt issuance (BofA, cited by the Fed)</text><text x="40.0" y="86.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Issuance, $ billion</text><line x1="40.0" y1="300.0" x2="340.0" y2="300.0" stroke="#c9d0d7" stroke-width="1"/><rect x="75.0" y="267.5" width="80.0" height="32.5" fill="#9dbbe0" rx="3"/><text x="115.0" y="259.5" font-size="15" fill="#9dbbe0" text-anchor="middle" font-weight="bold">130</text><text x="115.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2023 full year</text><rect x="225.0" y="130.0" width="80.0" height="170.0" fill="#2563a8" rx="3"/><text x="265.0" y="122.0" font-size="15" fill="#2563a8" text-anchor="middle" font-weight="bold">680+</text><text x="265.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026 to October</text><text x="190.0" y="200.0" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="bold">x5.2</text><text x="420.0" y="86.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Share of nonfinancial IG issuance</text><line x1="420.0" y1="300.0" x2="720.0" y2="300.0" stroke="#c9d0d7" stroke-width="1"/><rect x="455.0" y="267.4" width="80.0" height="32.6" fill="#9dbbe0" rx="3"/><text x="495.0" y="259.4" font-size="15" fill="#9dbbe0" text-anchor="middle" font-weight="bold">&lt;6%</text><text x="495.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2023</text><rect x="605.0" y="131.7" width="80.0" height="168.3" fill="#d9822b" rx="3"/><text x="645.0" y="123.7" font-size="15" fill="#d9822b" text-anchor="middle" font-weight="bold">~31%</text><text x="645.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">2026</text><text x="24.0" y="366.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Includes 144A; excludes 4(a)(2) private placements. Source: Federal Reserve Board, Financial Stability Report, November 2026 (data as of Oct 28)</text><text x="24.0" y="351.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Outstanding public AI-related debt: &gt;$1.1 trillion (Oct 2026); private deals excluded, so the true total is larger.</text></svg>
