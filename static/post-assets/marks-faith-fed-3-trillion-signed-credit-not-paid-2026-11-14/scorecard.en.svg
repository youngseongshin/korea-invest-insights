<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Marks asked; the Fed answered who bet how much, not whether it comes back"><rect x="0" y="0" width="760" height="524" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">The Fed answered who bet how much. Nobody answered whether it comes back</text><text x="24.0" y="52.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Howard Marks's questions (Nov 11 memo) against the Fed's Financial Stability Report (Nov 13)</text><text x="24.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Marks's question</text><text x="330.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Fed</text><text x="440.0" y="84.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">What the Fed gave</text><line x1="24.0" y1="92.0" x2="736.0" y2="92.0" stroke="#c9d0d7" stroke-width="1"/><text x="24.0" y="125.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Single-sector dependence ("fault line")</text><rect x="318.0" y="110.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="125.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Answered</text><text x="440.0" y="125.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Near-term risk #1: disappointing returns on business investment</text><line x1="24.0" y1="140.0" x2="736.0" y2="140.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="163.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">AI bond volume (Goldman ~$600B)</text><rect x="318.0" y="148.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="163.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Answered</text><text x="440.0" y="163.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">&gt;$680B by October; ~31% of nonfinancial IG issuance</text><line x1="24.0" y1="178.0" x2="736.0" y2="178.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="201.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Did AI borrowing lift Treasury yields?</text><rect x="318.0" y="186.0" width="108.0" height="22.0" fill="#8a96a3" rx="11"/><text x="372.0" y="201.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Not supported</text><text x="440.0" y="201.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Survey named energy, fiscal, foreign demand; not AI</text><line x1="24.0" y1="216.0" x2="736.0" y2="216.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="239.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Parent liability for off-balance SPVs</text><rect x="318.0" y="224.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="239.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Answered</text><text x="440.0" y="239.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Economic exposure "substantially larger" than debt</text><line x1="24.0" y1="254.0" x2="736.0" y2="254.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="277.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Chip collateral shorter-lived than debt</text><rect x="318.0" y="262.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="277.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Located</text><text x="440.0" y="277.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU makers guarantee collateral residual value</text><line x1="24.0" y1="292.0" x2="736.0" y2="292.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="315.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Who holds which risk</text><rect x="318.0" y="300.0" width="108.0" height="22.0" fill="#159a6c" rx="11"/><text x="372.0" y="315.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Mapped</text><text x="440.0" y="315.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Junior: HY funds, life insurers, BDCs. Banks: ~$1T</text><line x1="24.0" y1="330.0" x2="736.0" y2="330.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="353.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Will hyperscaler ratings change?</text><rect x="318.0" y="338.0" width="108.0" height="22.0" fill="#d9822b" rx="11"/><text x="372.0" y="353.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Disagree</text><text x="440.0" y="353.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">&gt;75% of public nonfinancial debt IG; coverage solid</text><line x1="24.0" y1="368.0" x2="736.0" y2="368.0" stroke="#e3e7eb" stroke-width="1"/><rect x="20.0" y="368.0" width="720.0" height="36.0" fill="#fdf1ec" rx="4"/><text x="24.0" y="391.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Profit capture, competition, earnings</text><rect x="318.0" y="376.0" width="108.0" height="22.0" fill="#c2410c" rx="11"/><text x="372.0" y="391.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">No answer</text><text x="440.0" y="391.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">—</text><line x1="24.0" y1="406.0" x2="736.0" y2="406.0" stroke="#e3e7eb" stroke-width="1"/><rect x="20.0" y="406.0" width="720.0" height="36.0" fill="#fdf1ec" rx="4"/><text x="24.0" y="429.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Will users pay back trillions?</text><rect x="318.0" y="414.0" width="108.0" height="22.0" fill="#c2410c" rx="11"/><text x="372.0" y="429.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">No answer</text><text x="440.0" y="429.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">—</text><line x1="24.0" y1="444.0" x2="736.0" y2="444.0" stroke="#e3e7eb" stroke-width="1"/><text x="24.0" y="468.0" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="bold">Every filled box is about funding. Every empty box is about payback.</text><text x="24.0" y="510.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Source: Federal Reserve Board, Financial Stability Report, November 2026 (data as of Oct 28); Oaktree memo. Our classification.</text></svg>
