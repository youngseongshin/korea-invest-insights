<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="삼성전자가 2% 이상 오른 9일 동안 바이오는 평균 +1.38%로 여섯 바스켓 가운데 가장 많이 올랐습니다. 2% 이상 내린 14일 동안 바이오는 -1.89%로, 조선 -3.01%, 원전 -3.22%, 방산 -3.44%, 이차전지 -3.82%보다 덜 내렸습니다. 데이터센터는 -0.34%였지만 삼성전자와 거의 같이 움직이지 않습니다."><rect x="-20" y="-20" width="800" height="528" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">삼성전자가 크게 오른 날 바이오가 가장 많이 올랐고,</text><text x="24.0" y="48.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">크게 내린 날에는 조선·방산·원전·이차전지보다 훨씬 덜 내렸습니다</text><text x="24.0" y="70.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">삼성전자가 ±2% 넘게 움직인 날의 바스켓 평균 수익률(최근 40거래일: 상승 9일, 하락 14일)</text><rect x="24.0" y="82.0" width="12.0" height="12.0" fill="#138a9e" rx="2"/><text x="42.0" y="92.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">삼성전자 +2% 이상 (9일)</text><rect x="220.0" y="82.0" width="12.0" height="12.0" fill="#d9622b" rx="2"/><text x="238.0" y="92.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">삼성전자 -2% 이하 (14일)</text><line x1="560.0" y1="102" x2="560.0" y2="428" stroke="#5b6774" stroke-width="1"/><text x="24.0" y="116.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">데이터센터 (삼성전자와 상관계수 0.06)</text><rect x="560.0" y="122.0" width="4.0" height="14.0" fill="#138a9e" rx="2"/><text x="570.0" y="133.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">+0.05%</text><rect x="532.8" y="139.0" width="27.2" height="14.0" fill="#d9622b" rx="2"/><text x="526.8" y="150.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">−0.34%</text><rect x="14.0" y="156.0" width="732.0" height="52.0" fill="#fff3ea" rx="4"/><text x="24.0" y="170.0" font-size="12.