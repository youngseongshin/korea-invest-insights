<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="삼성전자가 20만원대 초반에서 쉴 때의 순서: 1 대형 바이오·제약, 2 데이터센터, 3 조선·방산·원전, 4 이차전지. 넷 모두 기준에 못 미칠 가능성도 남아 있습니다."><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">삼성전자가 20만원대 초반에서 쉬면 이런 순서로 봅니다</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">앞으로 20거래일 동안 주도할 가능성이 큰 순서와 대표 근거</text><rect x="24.0" y="72.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="99.0" r="16" fill="#138a9e"/><text x="54.0" y="104.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="84.0" y="94.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">대형 바이오·제약</text><text x="84.0" y="114.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">연기금 20거래일 8,707억원 순매수, 삼성전자 하락일 -1.89%</text><rect x="24.0" y="136.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="163.0" r="16" fill="#9d92ea"/><text x="54.0" y="168.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="bold">2</text><text x="84.0" y="158.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">데이터센터</text><text x="84.0" y="178.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">5일 +10.0%, 삼성전자와 상관 0.06: 피난처 성격</text><rect x="24.0" y="200.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="227.0" r="16" fill="#f0a77f"/><text x="54.0" y="232.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="bold">3</text><text x="84.0" y="222.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">조선·방산·원전</text><text x="84.0" y="242.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">조선이 가장 낫고 원전이 가장 약함, 연기금은 셋 모두 순매도</text><rect x="24.0" y="264.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="291.0" r="16" fill="#9aa3ad"/><text x="54.0" y="296.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="84.0" y="286.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">이차전지</text><text x="84.0" y="306.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">외국인 1조 3,878억원 순매도, 삼성전자 하락일 -3.82%</text><rect x="24" y="328.0" width="712" height="54" fill="#ffffff" rx="6" stroke="#d5dbe1" stroke-width="1" stroke-dasharray="5 4"/><text x="84.0" y="350.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">함께 남아 있는 경우: 넷 모두 기준 미달</text><text x="84.0" y="370.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">11/6 5일 스캔에서 확인된 주도는 항공 하나뿐</text><text x="24.0" y="404.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">순위는 이 글의 근거에 따른 저희의 판단이며 매매 지시가 아닙니다.</text></svg>