<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Our order if Samsung stalls near 200,000 won: 1 large-cap biotech and pharma, 2 data centers, 3 shipbuilding, defense and nuclear, 4 batteries; none of the four qualifying also stays possible."><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Our order if Samsung Electronics stalls near ₩200,000</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Which basket is likeliest to lead over the next 20 trading days, with the main evidence for each</text><rect x="24.0" y="72.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="99.0" r="16" fill="#138a9e"/><text x="54.0" y="104.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="84.0" y="94.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Large-cap biotech and pharma</text><text x="84.0" y="114.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Pension funds bought ₩871B in 20 days; Samsung down days −1.89%</text><rect x="24.0" y="136.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="163.0" r="16" fill="#9d92ea"/><text x="54.0" y="168.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="bold">2</text><text x="84.0" y="158.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Data centers</text><text x="84.0" y="178.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">+10.0% in 5 days, but correlation with Samsung is 0.06: a shelter</text><rect x="24.0" y="200.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="227.0" r="16" fill="#f0a77f"/><text x="54.0" y="232.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="bold">3</text><text x="84.0" y="222.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Shipbuilding, defense, nuclear</text><text x="84.0" y="242.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Shipbuilding best, nuclear weakest; pension funds sold all three</text><rect x="24.0" y="264.0" width="712.0" height="54.0" fill="#f6f8fa" rx="6"/><circle cx="54" cy="291.0" r="16" fill="#9aa3ad"/><text x="54.0" y="296.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="84.0" y="286.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Batteries</text><text x="84.0" y="306.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Foreign selling −1.39T won; Samsung down days −3.82%</text><rect x="24" y="328.0" width="712" height="54" fill="#ffffff" rx="6" stroke="#d5dbe1" stroke-width="1" stroke-dasharray="5 4"/><text x="84.0" y="350.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Also live: none of the four qualifies</text><text x="84.0" y="370.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Only airlines held confirmed leadership in the Nov 6 five-day scan</text><text x="24.0" y="404.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">Ranking is our judgment from the evidence in this post, not a trading instruction.</text></svg>