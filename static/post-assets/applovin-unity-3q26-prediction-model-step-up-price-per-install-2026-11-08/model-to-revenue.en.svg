<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="476" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Two ways a better prediction model turns into revenue</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Advertisers raise budgets as long as they still hit their return target (ROAS)</text><rect x="24.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="36.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">1. The model gets</text><text x="36.0" y="106.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">sharper</text><text x="36.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">It better predicts who</text><text x="36.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">will install and spend</text><line x1="177.0" y1="118.0" x2="207.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="207.0,118.0 197.3,123.3 197.3,112.7" fill="#5b6774"/><rect x="210.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="222.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">2. Bids go up</text><text x="222.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Higher bids on valuable</text><text x="222.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">slots, and bids on slots</text><text x="222.0" y="160.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">that used to lose</text><text x="222.0" y="176.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">money</text><line x1="363.0" y1="118.0" x2="393.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="393.0,118.0 383.3,123.3 383.3,112.7" fill="#5b6774"/><rect x="396.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="408.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">3. Advertisers still</text><text x="408.0" y="106.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">hit their target</text><text x="408.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">The same ad dollar</text><text x="408.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">earns the same or</text><text x="408.0" y="160.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">more</text><line x1="549.0" y1="118.0" x2="579.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="579.0,118.0 569.3,123.3 569.3,112.7" fill="#5b6774"/><rect x="582.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="594.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">4. Advertisers raise</text><text x="594.0" y="106.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">budgets</text><text x="594.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">More money flows to</text><text x="594.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">what works</text><line x1="657.0" y1="186.0" x2="657.0" y2="214.0" stroke="#5b6774" stroke-width="2"/><line x1="657.0" y1="214.0" x2="99.0" y2="214.0" stroke="#5b6774" stroke-width="2"/><line x1="99.0" y1="214.0" x2="99.0" y2="188.0" stroke="#5b6774" stroke-width="2"/><polygon points="99.0,188.0 104.3,197.7 93.7,197.7" fill="#5b6774"/><text x="380.0" y="232.0" font-size="12" fill="#5b6774" text-anchor="middle" font-weight="normal">More results data accumulates and the model improves again</text><line x1="24.0" y1="254.0" x2="736.0" y2="254.0" stroke="#d5dbe3" stroke-width="1"/><text x="24.0" y="278.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Revenue then grows along two paths</text><rect x="24.0" y="292.0" width="344.0" height="120.0" rx="8" fill="#eef7f1" stroke="#7fc29b" stroke-width="1" /><text x="38.0" y="316.0" font-size="13" fill="#1b7f4b" text-anchor="start" font-weight="bold">Path 1. Each install is worth more</text><text x="38.0" y="338.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">A higher predicted value on the same impression lifts</text><text x="38.0" y="356.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">the bid.</text><text x="38.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">AppLovin net revenue per install +55%</text><rect x="392.0" y="292.0" width="344.0" height="120.0" rx="8" fill="#fdf4e3" stroke="#ecd29b" stroke-width="1" /><text x="406.0" y="316.0" font-size="13" fill="#b26a00" text-anchor="start" font-weight="bold">Path 2. More advertisers become viable</text><text x="406.0" y="338.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Advertisers and categories that did not pay off</text><text x="406.0" y="356.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">before start to.</text><text x="406.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">AppLovin installs −18% → −2% → +2%; Unity advertiser</text><text x="406.0" y="396.5" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">accounts +27% q/q</text></svg>