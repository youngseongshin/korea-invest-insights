<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="340" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">다음 확인 일정</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">앞의 지속 조건이 맞는지 가려 줄 사건들</text><line x1="70.0" y1="96.0" x2="690.0" y2="96.0" stroke="#5b6774" stroke-width="3"/><circle cx="70.0" cy="96" r="9" fill="#2f5fd0" stroke="#ffffff" stroke-width="3"/><text x="70.0" y="78.0" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="bold">11/15</text><rect x="24.0" y="132.0" width="164.0" height="148.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="36.0" y="156.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">유니티 전환사채 상환</text><text x="36.0" y="181.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">5.58억 달러를 현금으로</text><text x="36.0" y="197.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">갚는지. 상환 뒤 현금은 약</text><text x="36.0" y="213.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">21억 달러</text><circle cx="276.7" cy="96" r="9" fill="#2f5fd0" stroke="#ffffff" stroke-width="3"/><text x="276.7" y="78.0" font-size="13" fill="#2f5fd0" text-anchor="middle" font-weight="bold">12/31</text><rect x="194.7" y="132.0" width="164.0" height="148.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="206.7" y="156.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">유니티 Spark 비공개</text><text x="206.7" y="173.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">베타</text><text x="206.7" y="198.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">연말까지 베타가</text><text x