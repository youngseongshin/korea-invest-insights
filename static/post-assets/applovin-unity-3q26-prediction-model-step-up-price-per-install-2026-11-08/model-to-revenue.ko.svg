<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="476" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">예측 모델이 좋아지면 매출이 되는 두 갈래 길</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">광고주는 광고비 대비 성과(ROAS) 목표를 지키는 한도 안에서 예산을 늘립니다</text><rect x="24.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="36.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">① 모델이 더 정확해짐</text><text x="36.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">누가 설치하고 돈을 쓸지</text><text x="36.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">더 잘 맞힘</text><line x1="177.0" y1="118.0" x2="207.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="207.0,118.0 197.3,123.3 197.3,112.7" fill="#5b6774"/><rect x="210.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="222.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">② 입찰가가 올라감</text><text x="222.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">가치가 큰 자리에는 더</text><text x="222.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">높게, 이전에는 손해였던</text><text x="222.0" y="160.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">자리에도 입찰</text><line x1="363.0" y1="118.0" x2="393.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="393.0,118.0 383.3,123.3 383.3,112.7" fill="#5b6774"/><rect x="396.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="408.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">③ 광고주 목표는</text><text x="408.0" y="106.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">그대로 충족</text><text x="408.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">같은 광고비로 같거나 더</text><text x="408.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">큰 성과</text><line x1="549.0" y1="118.0" x2="579.0" y2="118.0" stroke="#5b6774" stroke-width="2"/><polygon points="579.0,118.0 569.3,123.3 569.3,112.7" fill="#5b6774"/><rect x="582.0" y="66.0" width="150.0" height="120.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="594.0" y="90.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">④ 광고주가 예산을</text><text x="594.0" y="106.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">늘림</text><text x="594.0" y="128.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">성과가 나는 곳에 돈이 더</text><text x="594.0" y="144.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">들어옴</text><line x1="657.0" y1="186.0" x2="657.0" y2="214.0" stroke="#5b6774" stroke-width="2"/><line x1="657.0" y1="214.0" x2="99.0" y2="214.0" stroke="#5b6774" stroke-width="2"/><line x1="99.0" y1="214.0" x2="99.0" y2="188.0" stroke="#5b6774" stroke-width="2"/><polygon points="99.0,188.0 104.3,197.7 93.7,197.7" fill="#5b6774"/><text x="380.0" y="232.0" font-size="12" fill="#5b6774" text-anchor="middle" font-weight="normal">더 많은 광고 결과 데이터가 쌓여 모델이 다시 좋아집니다</text><line x1="24.0" y1="254.0" x2="736.0" y2="254.0" stroke="#d5dbe3" stroke-width="1"/><text x="24.0" y="278.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">그 결과 매출이 늘어나는 길은 둘입니다</text><rect x="24.0" y="292.0" width="344.0" height="120.0" rx="8" fill="#eef7f1" stroke="#7fc29b" stroke-width="1" /><text x="38.0" y="316.0" font-size="13" fill="#1b7f4b" text-anchor="start" font-weight="bold">길 1. 설치 한 건의 값이 오름</text><text x="38.0" y="338.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">같은 노출에서 더 높은 가치를 예측하면 입찰가가</text><text x="38.0" y="356.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">오릅니다.</text><text x="38.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">앱러빈 설치당 순매출 +55%</text><rect x="392.0" y="292.0" width="344.0" height="120.0" rx="8" fill="#fdf4e3" stroke="#ecd29b" stroke-width="1" /><text x="406.0" y="316.0" font-size="13" fill="#b26a00" text-anchor="start" font-weight="bold">길 2. 서비스할 수 있는 광고주가 늘어남</text><text x="406.0" y="338.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">이전에는 수익이 안 나던 광고주·카테고리가 돈이 되기</text><text x="406.0" y="356.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">시작합니다.</text><text x="406.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">앱러빈 설치 수 −18% → −2% → +2%, 유니티 광고주 계정</text><text x="406.0" y="396.5" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">전분기비 +27%</text></svg>