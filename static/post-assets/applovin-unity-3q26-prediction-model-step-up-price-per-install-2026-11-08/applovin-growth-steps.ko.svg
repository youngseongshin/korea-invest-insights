<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="468" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">앱러빈 분기 성장은 계단처럼 움직입니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">전분기 대비 매출 증가율(%). 4Q26은 회사 전망 범위</text><line x1="70.0" y1="300.0" x2="710.0" y2="300.0" stroke="#d5dbe3" stroke-width="1"/><text x="62.0" y="304.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">0</text><line x1="70.0" y1="242.5" x2="710.0" y2="242.5" stroke="#d5dbe3" stroke-width="1"/><text x="62.0" y="246.5" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">5</text><line x1="70.0" y1="185.0" x2="710.0" y2="185.0" stroke="#d5dbe3" stroke-width="1"/><text x="62.0" y="189.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">10</text><line x1="70.0" y1="127.5" x2="710.0" y2="127.5" stroke="#d5dbe3" stroke-width="1"/><text x="62.0" y="131.5" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">15</text><line x1="70.0" y1="70.0" x2="710.0" y2="70.0" stroke="#d5dbe3" stroke-width="1"/><text x="62.0" y="74.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">20</text><rect x="92.3" y="166.6" width="62.0" height="133.4" rx="0" fill="#2f5fd0" /><text x="123.3" y="159.6" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+11.6</text><text x="123.3" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">3Q25</text><rect x="199.0" y="93.0" width="62.0" height="207.0" rx="0" fill="#2f5fd0" /><text x="230.0" y="86.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+18.0</text><text x="230.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">4Q25</text><rect x="305.7" y="172.4" width="62.0" height="127.6" rx="0" fill="#2f5fd0" /><text x="336.7" y="165.4" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+11.1</text><text x="336.7" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">1Q26</text><rect x="412.3" y="249.4" width="62.0" height="50.6" rx="0" fill="#b3261e" /><text x="443.3" y="242.4" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+4.4</text><text x="443.3" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">2Q26</text><rect x="519.0" y="143.6" width="62.0" height="156.4" rx="0" fill="#1b7f4b" /><text x="550.0" y="136.6" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+13.6</text><text x="550.0" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">3Q26</text><rect x="625.7" y="189.6" width="62.0" height="110.4" rx="0" fill="#ffffff" stroke="#5b6774" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="625.7" y="189.6" width="62.0" height="16.1" rx="0" fill="#dfe8fb" stroke="#5b6774" stroke-width="1.5" /><text x="656.7" y="182.6" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+8.2~9.6</text><text x="656.7" y="318.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">4Q26 전망</text><rect x="363.3" y="173.4" width="160.0" height="56.0" rx="0" fill="#ffffff" /><text x="443.3" y="187.4" font-size="11" fill="#b3261e" text-anchor="middle" font-weight="bold">개선은 분기 뒤에 도착</text><text x="443.3" y="203.4" font-size="11" fill="#b3261e" text-anchor="middle" font-weight="normal">중간값 소폭 하회</text><text x="443.3" y="219.4" font-size="11" fill="#b3261e" text-anchor="middle" font-weight="normal">주가 −16%</text><text x="550.0" y="97.6" font-size="11" fill="#1b7f4b" text-anchor="middle" font-weight="bold">개선이 분기 초에 반영</text><text x="550.0" y="113.6" font-size="11" fill="#1b7f4b" text-anchor="middle" font-weight="normal">전망 상단 +1.0억 달러</text><text x="24.0" y="352.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">두 분기를 합치면 증가율은 평균으로 돌아옵니다. 같은 변수(모델 개선이 언제 도착하느냐)가 한 분기는 약점으로, 다음 분기는 서프라이즈로</text><text x="24.0" y="368.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">나타났습니다. 4Q26 전망은 이미 가동 중인 개선만 반영하고, 과거 4분기(+20%, +18%)보다 낮게 잡혀 있습니다.</text></svg>