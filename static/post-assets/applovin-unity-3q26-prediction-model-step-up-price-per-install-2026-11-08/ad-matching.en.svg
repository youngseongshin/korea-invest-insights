<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="436" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">How one ad gets matched to one game slot</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">AppLovin and Unity sell the middle box, the ad engine</text><rect x="24.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="130.0" y="96.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">Game maker (advertiser)</text><text x="130.0" y="124.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">wants new players</text><text x="130.0" y="148.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">Goal: revenue per ad dollar (ROAS)</text><rect x="274.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#2f5fd0" /><text x="380.0" y="96.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Ad engine</text><text x="380.0" y="124.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">A prediction model sets the bid</text><text x="380.0" y="148.0" font-size="11" fill="#dfe8fb" text-anchor="middle" font-weight="normal">AppLovin Axon · Unity Vector</text><rect x="524.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="630.0" y="96.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">Apps and games</text><text x="630.0" y="124.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">show the ad, share revenue</text><text x="630.0" y="148.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">via MAX and LevelPlay</text><line x1="236.0" y1="104.0" x2="274.0" y2="104.0" stroke="#5b6774" stroke-width="2"/><polygon points="274.0,104.0 264.3,109.3 264.3,98.7" fill="#5b6774"/><line x1="486.0" y1="104.0" x2="524.0" y2="104.0" stroke="#5b6774" stroke-width="2"/><polygon points="524.0,104.0 514.3,109.3 514.3,98.7" fill="#5b6774"/><text x="255.0" y="92.0" font-size="10" fill="#5b6774" text-anchor="middle" font-weight="normal">budget</text><text x="505.0" y="92.0" font-size="10" fill="#5b6774" text-anchor="middle" font-weight="normal">ad</text><line x1="630.0" y1="176.0" x2="630.0" y2="212.0" stroke="#1b7f4b" stroke-width="2"/><line x1="630.0" y1="212.0" x2="380.0" y2="212.0" stroke="#1b7f4b" stroke-width="2"/><line x1="380.0" y1="212.0" x2="380.0" y2="178.0" stroke="#1b7f4b" stroke-width="2"/><polygon points="380.0,178.0 385.3,187.7 374.7,187.7" fill="#1b7f4b"/><text x="505.0" y="230.0" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Installs and in-app purchases flow back, and the model keeps retraining</text><rect x="24.0" y="258.0" width="344.0" height="124.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1" /><text x="38.0" y="282.0" font-size="13" fill="#2f5fd0" text-anchor="start" font-weight="bold">AppLovin</text><text x="38.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Data: auction records from its ad switchboard (MAX),</text><text x="38.0" y="322.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">install and purchase events, transaction data shared</text><text x="38.0" y="340.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">by advertisers</text><text x="38.0" y="362.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Revenue: only the part left after paying app owners</text><rect x="392.0" y="258.0" width="344.0" height="124.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1" /><text x="406.0" y="282.0" font-size="13" fill="#2f5fd0" text-anchor="start" font-weight="bold">Unity</text><text x="406.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Data: game engine runtime information (opted-in</text><text x="406.0" y="322.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">projects), install and billing records from its ad</text><text x="406.0" y="340.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">network</text><text x="406.0" y="362.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Vector revenue: not disclosed, our estimate</text></svg>