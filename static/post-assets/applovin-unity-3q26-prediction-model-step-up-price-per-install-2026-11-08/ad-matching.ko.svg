<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="436" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">광고 한 건이 정해지는 과정</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">앱러빈과 유니티가 파는 것은 이 가운데 가운데 상자, 즉 광고 엔진입니다</text><rect x="24.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="130.0" y="96.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">게임 회사 (광고주)</text><text x="130.0" y="124.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">새 이용자를 모으고 싶음</text><text x="130.0" y="148.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">목표: 광고비 1달러당 매출(ROAS)</text><rect x="274.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#2f5fd0" /><text x="380.0" y="96.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">광고 엔진</text><text x="380.0" y="124.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">예측 모델이 입찰가를 정함</text><text x="380.0" y="148.0" font-size="11" fill="#dfe8fb" text-anchor="middle" font-weight="normal">앱러빈 Axon · 유니티 Vector</text><rect x="524.0" y="64.0" width="212.0" height="112.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1" /><text x="630.0" y="96.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">앱·게임 (광고 자리 보유)</text><text x="630.0" y="124.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">광고를 보여 주고 수익을 나눠 받음</text><text x="630.0" y="148.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">앱러빈 MAX · 유니티 LevelPlay가 연결</text><line x1="236.0" y1="104.0" x2="274.0" y2="104.0" stroke="#5b6774" stroke-width="2"/><polygon points="274.0,104.0 264.3,109.3 264.3,98.7" fill="#5b6774"/><line x1="486.0" y1="104.0" x2="524.0" y2="104.0" stroke="#5b6774" stroke-width="2"/><polygon points="524.0,104.0 514.3,109.3 514.3,98.7" fill="#5b6774"/><text x="255.0" y="92.0" font-size="10" fill="#5b6774" text-anchor="middle" font-weight="normal">예산</text><text x="505.0" y="92.0" font-size="10" fill="#5b6774" text-anchor="middle" font-weight="normal">광고</text><line x1="630.0" y1="176.0" x2="630.0" y2="212.0" stroke="#1b7f4b" stroke-width="2"/><line x1="630.0" y1="212.0" x2="380.0" y2="212.0" stroke="#1b7f4b" stroke-width="2"/><line x1="380.0" y1="212.0" x2="380.0" y2="178.0" stroke="#1b7f4b" stroke-width="2"/><polygon points="380.0,178.0 385.3,187.7 374.7,187.7" fill="#1b7f4b"/><text x="505.0" y="230.0" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">설치와 인앱 구매 결과가 되돌아와 모델이 계속 다시 학습합니다</text><rect x="24.0" y="258.0" width="344.0" height="124.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1" /><text x="38.0" y="282.0" font-size="13" fill="#2f5fd0" text-anchor="start" font-weight="bold">앱러빈</text><text x="38.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">데이터: 광고 중개(MAX) 경매 기록, 설치·구매 이벤트,</text><text x="38.0" y="322.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">광고주가 공유한 거래 데이터</text><text x="38.0" y="344.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">매출 인식: 광고주가 쓴 돈에서 앱 운영자 몫을 뺀 금액만 매출</text><rect x="392.0" y="258.0" width="344.0" height="124.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1" /><text x="406.0" y="282.0" font-size="13" fill="#2f5fd0" text-anchor="start" font-weight="bold">유니티</text><text x="406.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">데이터: 게임 엔진 실행 정보(동의한 프로젝트), 광고</text><text x="406.0" y="322.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">네트워크의 설치·과금 기록</text><text x="406.0" y="344.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Vector 매출은 공시하지 않음(회사 발언으로 추정)</text></svg>