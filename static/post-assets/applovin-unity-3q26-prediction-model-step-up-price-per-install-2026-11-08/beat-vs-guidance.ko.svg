<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="370" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">회사가 스스로 낸 전망 상단을 얼마나 넘었나</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">3분기 실제 값 ÷ 회사 전망 상단 − 1 (세 분기 전망 방식은 같음)</text><line x1="232.0" y1="62.0" x2="232.0" y2="262.0" stroke="#d5dbe3" stroke-width="1"/><text x="232.0" y="280.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">0</text><line x1="314.0" y1="62.0" x2="314.0" y2="262.0" stroke="#d5dbe3" stroke-width="1"/><text x="314.0" y="280.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">+10%</text><line x1="396.0" y1="62.0" x2="396.0" y2="262.0" stroke="#d5dbe3" stroke-width="1"/><text x="396.0" y="280.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">+20%</text><line x1="478.0" y1="62.0" x2="478.0" y2="262.0" stroke="#d5dbe3" stroke-width="1"/><text x="478.0" y="280.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">+30%</text><line x1="560.0" y1="62.0" x2="560.0" y2="262.0" stroke="#d5dbe3" stroke-width="1"/><text x="560.0" y="280.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">+40%</text><text x="24.0" y="89.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">앱러빈 매출</text><rect x="232.0" y="74.0" width="39.4" height="22.0" rx="0" fill="#2f5fd0" /><text x="279.4" y="90.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+4.8%</text><text x="736.0" y="90.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">20.85억 → 21.85억 달러</text><text x="24.0" y="127.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">앱러빈 조정 EBITDA</text><rect x="232.0" y="112.0" width="48.4" height="22.0" rx="0" fill="#2f5fd0" /><text x="288.4" y="128.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+5.9%</text><text x="736.0" y="128.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">17.40억 → 18.42억 달러</text><text x="24.0" y="165.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">유니티 전략 매출</text><rect x="232.0" y="150.0" width="69.7" height="22.0" rx="0" fill="#b26a00" /><text x="309.7" y="166.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+8.5%</text><text x="736.0" y="166.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">5.50억 → 5.97억 달러</text><text x="24.0" y="203.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">유니티 전략 Grow(광고)</text><rect x="232.0" y="188.0" width="99.2" height="22.0" rx="0" fill="#b26a00" /><text x="339.2" y="204.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+12.1%</text><text x="736.0" y="204.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">3.85억 → 4.32억 달러</text><text x="24.0" y="241.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">유니티 조정 EBITDA</text><rect x="232.0" y="226.0" width="287.0" height="22.0" rx="0" fill="#b26a00" /><text x="527.0" y="242.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+35%</text><text x="736.0" y="242.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">1.90억 → 2.57억 달러</text><text x="24.0" y="308.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">유니티는 초과분이 거의 전부 광고 쪽(Grow)이었고, 게임 제작 도구 쪽(Create)은 전망 상단을 1.3%만 넘었습니다.</text></svg>