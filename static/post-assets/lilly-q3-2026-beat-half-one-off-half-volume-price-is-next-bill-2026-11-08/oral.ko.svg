<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="420" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">경구 경쟁: 릴리가 뒤집니다</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">왼쪽은 3분기 매출(억달러), 오른쪽은 9월 초 주간 처방(언론 보도, IQVIA).</text><line x1="60.0" y1="300.0" x2="380.0" y2="300.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="304.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0.0</text><line x1="60.0" y1="250.0" x2="380.0" y2="250.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="254.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2.5</text><line x1="60.0" y1="200.0" x2="380.0" y2="200.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="204.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">5.0</text><line x1="60.0" y1="150.0" x2="380.0" y2="150.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="154.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">7.5</text><line x1="60.0" y1="100.0" x2="380.0" y2="100.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="104.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">10.0</text><rect x="90.0" y="126.0" width="80.0" height="16.0" fill="#f7cdb4" fill-opacity="1.0" rx="3" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="5 3"/><text x="130.0" y="119.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">7.9~8.7</text><text x="130.0" y="318.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">위고비 알약(노보)</text><rect x="240.0" y="263.2" width="80.0" height="36.8" fill="#2a6fc9" fill-opacity="0.92" rx="3"/><text x="280.0" y="256.2" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">1.84</text><text x="280.0" y="318.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">파운다요(릴리)</text><line x1="440.0" y1="300.0" x2="740.0" y2="300.0" stroke="#e3e7ec" stroke-width="1"/><text x="432.0" y="304.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0</text><line x1="440.0" y1="250.0" x2="740.0" y2="250.0" stroke="#e3e7ec" stroke-width="1"/><text x="432.0" y="254.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">50</text><line x1="440.0" y1="200.0" x2="740.0" y2="200.0" stroke="#e3e7ec" stroke-width="1"/><text x="432.0" y="204.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">100</text><line x1="440.0" y1="150.0" x2="740.0" y2="150.0" stroke="#e3e7ec" stroke-width="1"/><text x="432.0" y="154.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">150</text><line x1="440.0" y1="100.0" x2="740.0" y2="100.0" stroke="#e3e7ec" stroke-width="1"/><text x="432.0" y="104.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">200</text><rect x="490.0" y="119.0" width="80.0" height="181.0" fill="#d9622b" fill-opacity="0.9" rx="3"/><text x="530.0" y="112.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">~181k</text><text x="530.0" y="318.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">위고비 알약</text><rect x="610.0" y="256.0" width="80.0" height="44.0" fill="#2a6fc9" fill-opacity="0.92" rx="3"/><text x="650.0" y="249.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">~44k</text><text x="650.0" y="318.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">파운다요</text><text x="24.0" y="350.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">노보 알약: 53.94억크로네를 달러당 6.2~6.8크로네로 환산. 릴리의 '경구 신규 환자의 약 40%'는 신규 환자 기준이고 누적 처방은 노보가 앞섭니다.</text><text x="24.0" y="366.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">매출은 파운다요가 4.3~4.7배 작습니다. 주간 처방은 2차 보도입니다.</text></svg>