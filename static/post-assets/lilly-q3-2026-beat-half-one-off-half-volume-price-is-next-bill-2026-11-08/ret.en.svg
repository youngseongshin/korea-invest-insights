<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="400" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">Retatrutide: the only 25%+ weight loss we found in phase 3</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">TRIUMPH-1, 80 weeks, mean weight change, percent</text><line x1="294.4" y1="74.0" x2="294.4" y2="274.0" stroke="#e3e7ec" stroke-width="1"/><text x="294.4" y="290.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">−30%</text><line x1="416.7" y1="74.0" x2="416.7" y2="274.0" stroke="#e3e7ec" stroke-width="1"/><text x="416.7" y="290.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">−20%</text><line x1="538.9" y1="74.0" x2="538.9" y2="274.0" stroke="#e3e7ec" stroke-width="1"/><text x="538.9" y="290.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">−10%</text><line x1="661.1" y1="74.0" x2="661.1" y2="274.0" stroke="#e3e7ec" stroke-width="1"/><text x="661.1" y="290.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">0%</text><text x="24.0" y="98.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">12 mg, efficacy estimand</text><rect x="315.2" y="84.0" width="345.9" height="20.0" fill="#159a6c" fill-opacity="0.92" rx="4"/><text x="307.2" y="98.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−28.3%</text><text x="24.0" y="138.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">12 mg, treatment-regimen estimand</text><rect x="355.6" y="124.0" width="305.6" height="20.0" fill="#159a6c" fill-opacity="0.92" rx="4"/><text x="347.6" y="138.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−25.0%</text><text x="24.0" y="178.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">4 mg (one dose step up)</text><rect x="428.9" y="164.0" width="232.2" height="20.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="420.9" y="178.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−19.0%</text><text x="24.0" y="218.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Placebo, efficacy estimand</text><rect x="634.2" y="204.0" width="26.9" height="20.0" fill="#9aa4b0" fill-opacity="0.92" rx="4"/><text x="626.2" y="218.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−2.2%</text><text x="24.0" y="258.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Placebo, treatment-regimen estimand</text><rect x="613.4" y="244.0" width="47.7" height="20.0" fill="#9aa4b0" fill-opacity="0.92" rx="4"/><text x="605.4" y="258.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−3.9%</text><line x1="661.1" y1="74.0" x2="661.1" y2="274.0" stroke="#8a94a0" stroke-width="1.4"/><text x="24.0" y="316.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Stopping because of adverse events: 11.3% on retatrutide versus 4.9% on placebo. Skin-sensation changes (paresthesia): 12.5%.</text><text x="24.0" y="332.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">U.S. filing planned for the first quarter of 2027 (company).</text></svg>