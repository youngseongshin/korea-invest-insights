</text><rect x="265.6" y="124.0" width="84.4" height="18.0" fill="#c0392b" fill-opacity="0.92" rx="4"/><text x="257.6" y="137.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−8.44</text><text x="24.0" y="175.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Free cash flow</text><rect x="350.0" y="162.0" width="189.8" height="18.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="547.8" y="175.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">18.98</text><text x="24.0" y="213.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Business development cash</text><rect x="350.0" y="200.0" width="182.0" height="18.0" fill="#d9622b" fill-opacity="0.92" rx="4"/><text x="540.0" y="213.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">18.20</text><text x="24.0" y="251.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Dividends and buybacks</text><rect x="350.0" y="238.0" width="89.7" height="18.0" fill="#6250d6" fill-opacity="0.92" rx="4"/><text x="447.7" y="251.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">8.97</text><text x="24.0" y="289.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Rise in gross borrowings</text><rect x="350.0" y="276.0" width="70.0" height="18.0" fill="#c8811a" fill-opacity="0.92" rx="4"/><text x="428.0" y="289.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">7.00</text><line x1="350.0" y1="76.0" x2="350.0" y2="304.0" stroke="#8a94a0" stroke-width="1.4"/><text x="24.0" y="336.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Business development took 96% of free cash flow. Uses ($27.2B) exceeded free cash flow by about $8.2B; gross borrowings rose from $42.5B to $49.5B.</text><text x="24.0" y="352.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Cash balance changes were not checked, so the borrowing link is a coincidence in size, not a proven funding source.</text></svg>