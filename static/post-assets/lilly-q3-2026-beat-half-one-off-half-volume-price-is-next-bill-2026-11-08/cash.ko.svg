18.0" fill="#c0392b" fill-opacity="0.92" rx="4"/><text x="257.6" y="137.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−84.4</text><text x="24.0" y="175.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">잉여현금흐름</text><rect x="350.0" y="162.0" width="189.8" height="18.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="547.8" y="175.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">189.8</text><text x="24.0" y="213.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">사업개발 현금</text><rect x="350.0" y="200.0" width="182.0" height="18.0" fill="#d9622b" fill-opacity="0.92" rx="4"/><text x="540.0" y="213.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">182.0</text><text x="24.0" y="251.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">배당·자사주</text><rect x="350.0" y="238.0" width="89.7" height="18.0" fill="#6250d6" fill-opacity="0.92" rx="4"/><text x="447.7" y="251.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">89.7</text><text x="24.0" y="289.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">총차입 증가</text><rect x="350.0" y="276.0" width="70.0" height="18.0" fill="#c8811a" fill-opacity="0.92" rx="4"/><text x="428.0" y="289.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">70.0</text><line x1="350.0" y1="76.0" x2="350.0" y2="304.0" stroke="#8a94a0" stroke-width="1.4"/><text x="24.0" y="336.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">사업개발 현금이 잉여현금흐름의 96%였습니다. 사용처(271.7억달러)가 잉여현금흐름을 약 82억달러 넘었고, 총차입은 425억달러에서 495억달러로 늘었습니다.</text><text x="24.0" y="352.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">현금 잔액 변동은 확인하지 않았으므로 차입과의 연결은 크기가 비슷하다는 뜻이지 확인된 조달원이 아닙니다.</text></svg>