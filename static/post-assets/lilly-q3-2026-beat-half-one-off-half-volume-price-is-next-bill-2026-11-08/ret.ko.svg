t="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−25.0%</text><text x="24.0" y="178.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">4mg(한 단계 증량)</text><rect x="428.9" y="164.0" width="232.2" height="20.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="420.9" y="178.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−19.0%</text><text x="24.0" y="218.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">위약, 효능 추정치</text><rect x="634.2" y="204.0" width="26.9" height="20.0" fill="#9aa4b0" fill-opacity="0.92" rx="4"/><text x="626.2" y="218.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−2.2%</text><text x="24.0" y="258.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">위약, 치료 정책 추정치</text><rect x="613.4" y="244.0" width="47.7" height="20.0" fill="#9aa4b0" fill-opacity="0.92" rx="4"/><text x="605.4" y="258.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−3.9%</text><line x1="661.1" y1="74.0" x2="661.1" y2="274.0" stroke="#8a94a0" stroke-width="1.4"/><text x="24.0" y="316.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">이상반응으로 중단한 비율은 레타트루타이드 11.3% 대 위약 4.9%입니다. 감각이상(paresthesia)은 12.5%입니다.</text><text x="24.0" y="332.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">미국 허가 신청은 2027년 1분기 예정(회사).</text></svg>