<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="사업은 올랐고 주가는 내렸습니다. DDR5 16Gb 현물, 9/16 → 10/23 +11.7%; 한국 반도체 수출, 10/1~20 전년 대비 +222.5%; 마이크론 2027 회계연도 EPS 컨센서스, 30일 +12.8%; 삼성전자 2027년 영업이익 컨센서스 554조원 → 561조원; TSMC 2026년 설비투자 가이던스(10/15) 600억~640억달러 유지. SK하이닉스 −31.4%; 삼성전자 −22.6%; 마이크론 −20.0%; SOX −18.4%" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="360" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">사업은 올랐고 주가는 내렸습니다</text><rect x="16" y="50" width="520" height="270" rx="8" fill="#2e8b57" fill-opacity="0.05" stroke="#2e8b57" stroke-width="1.4"/><rect x="548" y="50" width="396" height="270" rx="8" fill="#eb6834" fill-opacity="0.05" stroke="#eb6834" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="700">사업은 이렇게 움직였습니다</text><text x="564" y="76" font-size="13" fill="#c2410c" text-anchor="start" font-weight="700">주가는 이렇게 움직였습니다(10월 종가 고점 → 10/23)</text><path d="M36,106 l7,-10 l7,10 z" fill="#2e8b57"/><text x="58" y="108" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">DDR5 16Gb 현물, 9/16 → 10/23</text><text x="520" y="108" font-size="15" fill="#121821" text-anchor="end" font-weight="700">+11.7%</text><line x1="32" y1="126" x2="520" y2="126" stroke="#e4e8ed"/><path d="M36,152 l7,-10 l7,10 z" fill="#2e8b57"/><text x="58" y="154" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">한국 반도체 수출, 10/1~20 전년 대비</text><text x="520" y="154" font-size="15" fill="#121821" text-anchor="end" font-weight="700">+222.5%</text><line x1="32" y1="172" x2="520" y2="172" stroke="#e4e8ed"/><path d="M36,198 l7,-10 l7,10 z" fill="#2e8b57"/><text x="58" y="200" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">마이크론 2027 회계연도 EPS 컨센서스, 30일</text><text x="520" y="200" font-size="15" fill="#121821" text-anchor="end" font-weight="700">+12.8%</text><line x1="32" y1="218" x2="520" y2="218" stroke="#e4e8ed"/><path d="M36,244 l7,-10 l7,10 z" fill="#2e8b57"/><text x="58" y="246" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">삼성전자 2027년 영업이익 컨센서스</text><text x="520" y="246" font-size="15" fill="#121821" text-anchor="end" font-weight="700">554조원 → 561조원</text><line x1="32" y1="264" x2="520" y2="264" stroke="#e4e8ed"/><path d="M36,290 l7,-10 l7,10 z" fill="#2e8b57"/><text x="58" y="292" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">TSMC 2026년 설비투자 가이던스(10/15)</text><text x="520" y="292" font-size="15" fill="#121821" text-anchor="end" font-weight="700">600억~640억달러 유지</text><text x="564" y="104" font-size="13" fill="#121821" text-anchor="start" font-weight="600">SK하이닉스</text><rect x="564" y="112" width="224" height="16" rx="3" fill="#eb6834"/><text x="796.2857142857142" y="125" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−31.4%</text><text x="564" y="156" font-size="13" fill="#121821" text-anchor="start" font-weight="600">삼성전자</text><rect x="564" y="164" width="161" height="16" rx="3" fill="#eb6834"/><text x="733.4285714285714" y="177" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−22.6%</text><text x="564" y="208" font-size="13" fill="#121821" text-anchor="start" font-weight="600">마이크론</text><rect x="564" y="216" width="143" height="16" rx="3" fill="#eb6834"/><text x="714.8571428571429" y="229" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−20.0%</text><text x="564" y="260" font-size="13" fill="#121821" text-anchor="start" font-weight="600">SOX</text><rect x="564" y="268" width="131" height="16" rx="3" fill="#eb6834"/><text x="703.4285714285714" y="281" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−18.4%</text><text x="24" y="342" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">컨센서스는 2차 자료(FnGuide, 마이크론 컨센서스)입니다. 한국 수출은 관세청 잠정치입니다.</text></svg>