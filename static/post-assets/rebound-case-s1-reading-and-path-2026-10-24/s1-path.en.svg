<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="How S1 would unfold: four steps and the switches that end it. Oct 28–30 1. Earnings clear: SK hynix: 2027 deals + buyback, Microsoft passes 3 of 4 tests, Capex held; memory cost absorbed, FOMC holds without hike language; Oct 29–Nov 4 2. Rebound window: Most-shorted neoclouds cover first, Memory rises on long re-buying, Korea: Samsung foreign buying first,, SK hynix after its results; Oct 30–Nov 7 3. Bond window clears: HY spread 330bp or less, IG spread 85bp or less, New-issue concessions narrow; Nov 3–10 4. Rates set the ceiling: Midterms, jobs, CPI, December hike still priced, Rebound, but capped. What ends S1: HY 350bp+ with failed deals → S2; A 2027 capex cut → S3; Inflation-type oil days → S4; Foreign cash −KRW 1tn/day with futures buying" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">How S1 would unfold: four steps and the switches that end it</text><rect x="16" y="52" width="220" height="212" rx="8" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-width="1.4"/><text x="30" y="76" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">Oct 28–30</text><text x="30" y="98" font-size="15" fill="#121821" text-anchor="start" font-weight="700">1. Earnings clear</text><text x="30" y="126" font-size="12" fill="#465160" text-anchor="start" font-weight="400">SK hynix: 2027 deals + buyback</text><text x="30" y="150" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Microsoft passes 3 of 4 tests</text><text x="30" y="174" font-size="12" fill="#465160" text-anchor="start" font-wei