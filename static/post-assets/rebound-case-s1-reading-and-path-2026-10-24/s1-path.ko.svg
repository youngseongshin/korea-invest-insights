<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="S1이 펼쳐지는 순서: 네 단계와 S1을 끝내는 스위치. 10/28~30 1. 실적 통과: SK하이닉스: 2027 계약·새 자사주, MS 네 시험 중 셋 통과, capex 유지, 메모리 원가 흡수, FOMC 동결, 인상 문구 없음; 10/29~11/4 2. 반등 창: 숏이 많은 네오클라우드부터 커버, 메모리는 롱 재매수로 상승, 한국: 삼성전자 외국인 매수 먼저,, SK하이닉스는 실적 뒤; 10/30~11/7 3. 회사채 창 통과: 하이일드 330bp 이하, 투자등급 85bp 이하, 신규 발행 프리미엄 축소; 11/3~10 4. 금리가 천장: 중간선거, 고용, CPI, 12월 인상은 여전히 반영, 반등하되 상단 제한. S1을 끝내는 것: 발행 실패 동반 HY 350bp+ → S2; 2027 capex 축소 → S3; 물가형 유가 상승일 → S4; 선물 매수 동반 외국인 현물 하루 −1조원" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">S1이 펼쳐지는 순서: 네 단계와 S1을 끝내는 스위치</text><rect x="16" y="52" width="220" height="212" rx="8" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-width="1.4"/><text x="30" y="76" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">10/28~30</text><text x="30" y="98" font-size="15" fill="#121821" text-anchor="start" font-weight="700">1. 실적 통과</text><text x="30" y="126" font-size="12" fill="#465160" text-anchor="start" font-weight="400">SK하이닉스: 2027 계약·새 자사주</text><text x="30" y="150" font-size="12" fill="#465160" text-anchor="start" font-weight="400">MS 네 시험 중 셋 통과</text><text x="30" y="174" font-size="12" fill="#465160" text-anchor="start" font-weight="400">capex 유지, 메모리 원가 흡수</text><text x="30" y="198" font-size="12" fill="#465160" text-anchor="start" font-weight="400">FOMC 동결, 인상 문구 없음</text><line x1="237" y1="158" x2="248" y2="158" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="250" y="52" width="220" height="212" rx="8" fill="#2e8b57" fill-opacity="0.07" stroke="#2e8b57" stroke-width="1.4"/><text x="264" y="76" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">10/29~11/4</text><text x="264" y="98" font-size="15" fill="#121821" text-anchor="start" font-weight="700">2. 반등 창</text><text x="264" y="126" font-size="12" fill="#465160" text-anchor="start" font-weight="400">숏이 많은 네오클라우드부터 커버</text><text x="264" y="150" font-size="12" fill="#465160" text-anchor="start" font-weight="400">메모리는 롱 재매수로 상승</text><text x="264" y="174" font-size="12" fill="#465160" text-anchor="start" font-weight="400">한국: 삼성전자 외국인 매수 먼저,</text><text x="264" y="198" font-size="12" fill="#465160" text-anchor="start" font-weight="400">SK하이닉스는 실적 뒤</text><line x1="471" y1="158" x2="482" y2="158" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="484" y="52" width="220" height="212" rx="8" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-width="1.4"/><text x="498" y="76" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">10/30~11/7</text><text x="498" y="98" font-size="15" fill="#121821" text-anchor="start" font-weight="700">3. 회사채 창 통과</text><text x="498" y="126" font-size="12" fill="#465160" text-anchor="start" font-weight="400">하이일드 330bp 이하</text><text x="498" y="150" font-size="12" fill="#465160" text-anchor="start" font-weight="400">투자등급 85bp 이하</text><text x="498" y="174" font-size="12" fill="#465160" text-anchor="start" font-weight="400">신규 발행 프리미엄 축소</text><line x1="705" y1="158" x2="716" y2="158" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="718" y="52" width="220" height="212" rx="8" fill="#6250d6" fill-opacity="0.07" stroke="#6250d6" stroke-width="1.4"/><text x="732" y="76" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">11/3~10</text><text x="732" y="98" font-size="15" fill="#121821" text-anchor="start" font-weight="700">4. 금리가 천장</text><text x="732" y="126" font-size="12" fill="#465160" text-anchor="start" font-weight="400">중간선거, 고용, CPI</text><text x="732" y="150" font-size="12" fill="#465160" text-anchor="start" font-weight="400">12월 인상은 여전히 반영</text><text x="732" y="174" font-size="12" fill="#465160" text-anchor="start" font-weight="400">반등하되 상단 제한</text><rect x="16" y="280" width="928" height="82" rx="8" fill="#c2410c" fill-opacity="0.05" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="5 4"/><text x="32" y="304" font-size="13.5" fill="#c2410c" text-anchor="start" font-weight="700">S1을 끝내는 것:</text><text x="32" y="330" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 발행 실패 동반 HY 350bp+ → S2</text><text x="482" y="330" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 2027 capex 축소 → S3</text><text x="32" y="352" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 물가형 유가 상승일 → S4</text><text x="482" y="352" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 선물 매수 동반 외국인 현물 하루 −1조원</text></svg>