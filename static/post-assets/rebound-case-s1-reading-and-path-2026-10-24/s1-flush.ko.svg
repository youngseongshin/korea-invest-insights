<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="강제 매도는 대부분 끝났습니다. CTA 주식 롱(골드만삭스 모델): 1,250억달러 to 390억달러; 반도체를 최다 쏠림으로 꼽은 펀드매니저(BofA): 82% to 45%; 외국인 코스피 현물 순매도: 27.0조원 to 0.31조원. 남은 부담: 헤지펀드 총레버리지 311.7%(10/16 주간)" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">강제 매도는 대부분 끝났습니다</text><rect x="12" y="56" width="936" height="80" rx="6" fill="#f6f8fa"/><text x="28" y="78" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">CTA 주식 롱(골드만삭스 모델)</text><text x="28" y="98" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">7월~10월 초 → 10/16 주간</text><text x="420" y="80" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">이전</text><rect x="430" y="68" width="360" height="16" rx="3" fill="#6f7a88" fill-opacity="0.45"/><text x="798" y="81" font-size="13" fill="#465160" text-anchor="start" font-weight="600">1,250억달러</text><text x="420" y="110" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">지금</text><rect x="430" y="98" width="112" height="16" rx="3" fill="#2a78d6"/><text x="550.3199999999999" y="111" font-size="13" fill="#121821" text-anchor="start" font-weight="700">390억달러</text><rect x="12" y="144" width="936" height="80" rx="6" fill="#f6f8fa"/><text x="28" y="166" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">반도체를 최다 쏠림으로 꼽은 펀드매니저(BofA)</text><text x="28" y="186" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">7월 → 10월 설문</text><text x="420" y="168" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">이전</text><rect x="430" y="156" width="360" height="16" rx="3" fill="#6f7a88" fill-opacity="0.45"/><text x="798" y="169" font-size="13" fill="#465160" text-anchor="start" font-weight="600">82%</text><text x="420" y="198" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">지금</text><rect x="430" y="186" width="198" height="16" rx="3" fill="#2a78d6"/><text x="635.560975609756" y="199" font-size="13" fill="#121821" text-anchor="start" font-weight="700">45%</text><rect x="12" y="232" width="936" height="80" rx="6" fill="#f6f8fa"/><text x="28" y="254" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">외국인 코스피 현물 순매도</text><text x="28" y="274" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">9/24~10/15 → 10/16~23</text><text x="420" y="256" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">이전</text><rect x="430" y="244" width="360" height="16" rx="3" fill="#6f7a88" fill-opacity="0.45"/><text x="798" y="257" font-size="13" fill="#465160" text-anchor="start" font-weight="600">27.0조원</text><text x="420" y="286" font-size="11.5" fill="#6f7a88" text-anchor="end" font-weight="400">지금</text><rect x="430" y="274" width="4" height="16" rx="3" fill="#2a78d6"/><text x="442.1333333333333" y="287" font-size="13" fill="#121821" text-anchor="start" font-weight="700">0.31조원</text><rect x="16" y="320" width="928" height="58" rx="8" fill="#b7791f" fill-opacity="0.08" stroke="#b7791f" stroke-width="1.4"/><text x="32" y="344" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">남은 부담: 헤지펀드 총레버리지 311.7%(10/16 주간)</text><text x="32" y="365" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">최고 수준이라 롱과 숏이 반대로 움직이면 한 번 더 강제 축소가 나올 수 있습니다.</text><text x="24" y="414" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">CTA와 BofA 수치는 2차 요약입니다. 한국 수급은 네이버 금융 투자자별 매매동향(KRX)입니다.</text></svg>