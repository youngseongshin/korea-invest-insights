<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="&quot;Securing GPUs&quot; has five steps. Most Korean numbers sit on step one.. Steps: Plan announced, Binding order, Delivered, owned, Installed, powered, tested, Customers billed. NAVER: 60,000+ GPUs (NVIDIA deployment plan, Oct 2025): reached step 1; NAVER: 200MW ≈ 100,000 GPUs (Rough conversion of an expansion plan, 2026): reached step 1; SK Group: 50,000+ GPUs (Group-wide plan, not allocated to SKT or SK Hyper): reached step 1; SKT: up to 2GW AI Factory (Letter of intent with NVIDIA, first site 2027): reached step 1; SKT GPU cloud (H100) (Paid service running since 2025): reached step 5" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="450" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">"Securing GPUs" has five steps. Most Korean numbers sit on step one.</text><rect x="332" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="391.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">1</text><text x="391.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">Plan announced</text><rect x="454" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="513.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">2</text><text x="513.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">Binding order</text><rect x="576" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="635.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">3</text><text x="635.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">Delivered, owned</text><rect x="698" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="757.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">4</text><text x="757.0" y="84" font-size="10.5" fill="#465160" text-anchor="middle" font-weight="600">Installed, powered,</text><text x="757.0" y="96" font-size="10.5" fill="#465160" text-anchor="middle" font-weight="600">tested</text><rect x="820" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="879.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">5</text><text x="879.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">Customers billed</text><text x="24" y="132" font-size="13" fill="#121821" text-anchor="start" font-weight="700">NAVER: 60,000+ GPUs</text><text x="24" y="149" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">NVIDIA deployment plan, Oct 2025</text><rect x="340" y="122" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="122" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="184" font-size="13" fill="#121821" text-anchor="start" font-weight="700">NAVER: 200MW ≈ 100,000 GPUs</text><text x="24" y="201" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Rough conversion of an expansion plan, 2026</text><rect x="340" y="174" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="174" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="236" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SK Group: 50,000+ GPUs</text><text x="24" y="253" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Group-wide plan, not allocated to SKT or SK Hyper</text><rect x="340" y="226" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="226" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="288" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SKT: up to 2GW AI Factory</text><text x="24" y="305" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Letter of intent with NVIDIA, first site 2027</text><rect x="340" y="278" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="278" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="340" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SKT GPU cloud (H100)</text><text x="24" y="357" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Paid service running since 2025</text><rect x="340" y="330" width="590.0" height="18" rx="9" fill="#2e8b57"/><rect x="340" y="382" width="28" height="12" rx="6" fill="#2a78d6"/><text x="376" y="393" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Confirmed by public sources</text><rect x="580" y="382" width="28" height="12" rx="6" fill="none" stroke="#6f7a88" stroke-dasharray="4 3"/><text x="616" y="393" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Not yet disclosed</text><text x="24" y="424" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">NVIDIA releases (Oct 2025, Jul 2026), SKT releases. The two NAVER numbers should not be added together; neither is a delivery count.</text></svg>