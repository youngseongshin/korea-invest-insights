<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="해외 사례의 교훈: 매출 성장이 스스로 자금을 대지는 못합니다. 2026년 상반기 현금 유입과 유출(억달러): CoreWeave: 영업현금흐름 36.6, 장비·시설에 쓴 현금 141.2, 차액 −104.5; Nebius: 영업현금흐름 45.0, 장비·시설에 쓴 현금 81.3, 차액 −36.3. Nebius 영업현금흐름 45.0 가운데 44.0은 고객 선급금. Core Scientific: 임대 대 청구 용량(MW): CoreWeave에 임대한 590MW, 청구 중 395MW, 건설·시운전 195MW. 임대한 MW가 아니라 청구하는 MW를 세야 합니다." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">해외 사례의 교훈: 매출 성장이 스스로 자금을 대지는 못합니다</text><rect x="16" y="50" width="560" height="286" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">2026년 상반기 현금 유입과 유출(억달러)</text><text x="32" y="130" font-size="14" fill="#121821" text-anchor="start" font-weight="700">CoreWeave</text><rect x="130" y="108" width="85.5" height="20" rx="3" fill="#2e8b57"/><text x="223.53824362606233" y="123" font-size="13" fill="#121821" text-anchor="start" font-weight="700">36.6</text><rect x="130" y="134" width="330.0" height="20" rx="3" fill="#c2410c"/><text x="468.0" y="149" font-size="13" fill="#121821" text-anchor="start" font-weight="700">141.2</text><text x="130" y="174" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">차액 −104.5</text><text x="32" y="226" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Nebius</text><rect x="130" y="204" width="105.2" height="20" rx="3" fill="#2e8b57"/><text x="243.1699716713881" y="219" font-size="13" fill="#121821" text-anchor="start" font-weight="700">45.0</text><rect x="130" y="230" width="190.0" height="20" rx="3" fill="#c2410c"/><text x="328.0070821529745" y="245" font-size="13" fill="#121821" text-anchor="start" font-weight="700">81.3</text><text x="130" y="270" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">차액 −36.3</text><text x="240" y="270" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Nebius 영업현금흐름 45.0 가운데 44.0은 고객 선급금</text><rect x="32" y="306" width="12" height="12" rx="2" fill="#2e8b57"/><text x="50" y="316" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">영업현금흐름</text><rect x="230" y="306" width="12" height="12" rx="2" fill="#c2410c"/><text x="248" y="316" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">장비·시설에 쓴 현금</text><rect x="588" y="50" width="356" height="286" rx="8" fill="#2e8b57" fill-opacity="0.03" stroke="#2e8b57" stroke-width="1.4"/><text x="604" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Core Scientific: 임대 대 청구 용량(MW)</text><rect x="604.0" y="112" width="216.9" height="38" fill="#2e8b57"/><text x="612" y="136" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700">395</text><text x="606" y="170" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">청구 중</text><rect x="820.9" y="112" width="107.1" height="38" fill="#b7791f"/><text x="828.9152542372881" y="136" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700">195</text><text x="822.9152542372881" y="170" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">건설·시운전</text><text x="604" y="102" font-size="12" fill="#121821" text-anchor="start" font-weight="600">CoreWeave에 임대한 590MW</text><text x="604" y="196" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="700">395 / 590 = 67%</text><text x="604" y="240" font-size="13" fill="#121821" text-anchor="start" font-weight="400">임대한 MW가 아니라</text><text x="604" y="260" font-size="13" fill="#121821" text-anchor="start" font-weight="700">청구하는 MW를 세야 합니다.</text><text x="24" y="364" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">CoreWeave·Core Scientific 10-Q, Nebius 6-K(모두 2026년 6월 30일까지). 차액은 단순 뺄셈이며 회사 정의 FCF가 아닙니다.</text></svg>