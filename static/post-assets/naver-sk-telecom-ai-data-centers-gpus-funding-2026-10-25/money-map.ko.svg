<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-label="돈의 흐름: 누가, 어떤 형태로 받는가. 네이버: 10억달러, NVIDIA의 네이버 신주 인수, 계약·이사회 결의 확인. 납입은 미확인, 최대 기한 10월 30일.; 최대 90억달러, Brookfield 주도 프로젝트 회사 자금, 7월 비구속 조건표, 9월 commitment 표현. 최종 종결 미확인.; 4,000억원, 정책 대출, 5년, 3%대 금리, 2026년 4월 승인. 실행액 미공개.. SK호라이즌: 1.88조원, SKT가 받는 구주 매각대금, 계약 체결. 종결 조건 충족 시 2027년 3월 4일 처분 예정.; 약 1.2조원, 호라이즌이 받는 성장용 신주 자금, 후속 신주 발행 예정. 조건 변경 가능.; 51 / 29 / 20, 최종 지분: SKT / KKR / IMM 컨소시엄, 승인 등 종결 조건이 남아 있음.. SK하이퍼: 최대 7,500억원, 2030년까지 SKT 출자, 부지·변전소용, 이사회 승인 한도. 이미 납입된 돈이 아님.; 약 3,500억달러, 첫 5GW의 총사업비 추산, CEO 추산의 보도 인용. 고객·투자자·PF가 나눌 구상이며 서명된 금액 없음.; 약 0.16%, 3,500억달러 대비 7,500억원, 규모 비교일 뿐 조달 부족률이 아님.." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="584" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">돈의 흐름: 누가, 어떤 형태로 받는가</text><text x="20" y="66" font-size="15" fill="#2a78d6" text-anchor="start" font-weight="700">네이버</text><rect x="16" y="80" width="300" height="134" rx="8" fill="#f6f8fa"/><rect x="16" y="80" width="5" height="134" rx="2" fill="#b7791f"/><text x="34" y="110" font-size="20" fill="#121821" text-anchor="start" font-weight="700">10억달러</text><text x="34" y="134" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">NVIDIA의 네이버 신주 인수</text><text x="34" y="160" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">계약·이사회 결의 확인. 납입은 미확인,</text><text x="34" y="175" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">최대 기한 10월 30일.</text><rect x="16" y="226" width="300" height="134" rx="8" fill="#f6f8fa"/><rect x="16" y="226" width="5" height="134" rx="2" fill="#b7791f"/><text x="34" y="256" fo