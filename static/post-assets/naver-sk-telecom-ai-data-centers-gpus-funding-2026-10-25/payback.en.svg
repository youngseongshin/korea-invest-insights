<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="How fast the chips wear out decides the yearly bill. Yearly cash a hypothetical $10bn AI site must earn to pay back its cost ($bn): 3-year chip life 3.92; 4-year chip life 3.23; 6-year chip life 2.54. Two fewer years of chip life (6 → 4) adds about $0.69bn a year. Assumes $8bn of GPUs and servers at a 10% required return, $2bn of buildings at 8% over 20 years, $0.5bn a year of cash running costs, no resale value." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="340" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">How fast the chips wear out decides the yearly bill</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Yearly cash a hypothetical $10bn AI site must earn to pay back its cost ($bn)</text><text x="24" y="106" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3-year chip life</text><rect x="170" y="88" width="420.0" height="28" rx="4" fill="#c2410c"/><text x="600.0" y="108" font-size="15" fill="#121821" text-anchor="start" font-weight="700">3.92</text><text x="24" y="164" font-size="13" fill="#121821" text-anchor="start" font-weight="700">4-year chip life</text><rect x="170" y="146" width="346.1" height="28" rx="4" fill="#b7791f"/><text x="526.0714285714287" y="166" font-size="15" fill="#121821" text-anchor="start" font-weight="700">3.23</text><text x="24" y="222" font-size="13" fill="#121821" text-anchor="start" font-weight="700">6-year chip life</text><rect x="170" y="204" width="272.1" height="28" rx="4" fill="#2e8b57"/><text x="452.14285714285717" y="224" font-size="15" fill="#121821" text-anchor="start" font-weight="700">2.54</text><rect x="668" y="84" width="276" height="84" rx="8" fill="#6250d6" fill-opacity="0.06" stroke="#6250d6" stroke-width="1.4"/><text x="684" y="116" font-size="13" fill="#6250d6" text-anchor="start" font-weight="400">Two fewer years of chip life (6 → 4)</text><text x="684" y="138" font-size="13" fill="#6250d6" text-anchor="start" font-weight="700">adds about $0.69bn a year.</text><text x="24" y="276" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Assumes $8bn of GPUs and servers at a 10% required return, $2bn of buildings at 8% over 20 years, $0.5bn a year of cash running costs, no resale</text><text x="24" y="292" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">value.</text><text x="24" y="326" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Our illustration, not a NAVER or SKT forecast. Taxes, ramp-up and replacement costs are left out.</text></svg>