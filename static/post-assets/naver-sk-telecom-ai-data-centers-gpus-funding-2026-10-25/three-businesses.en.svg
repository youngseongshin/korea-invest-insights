SKT can put in up to ₩750bn by 2030.</text><text x="664" y="348" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">First 5GW estimated at about $350bn in</text><text x="664" y="365" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">total.</text><text x="664" y="400" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">Next proof</text><text x="664" y="419" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">A named anchor customer and outside</text><text x="664" y="436" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">investors with signed terms.</text><text x="24" y="484" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Company releases, filings and NVIDIA announcements, as of Oct 25, 2026. SKT's separate NVIDIA AI Cloud plan (up to 2GW, first site 2027) and AWS Ulsan</text><text x="24" y="499" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">are not added to these.</text></svg>