<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="Three different businesses, at three different stages. NAVER AI Factory (Most concrete new compute business): What it is: Sells AI computing from its Sejong data center, linked to its cloud, own models and business customers. When revenue comes: 55MW live from 1H 2027, revenue expected then. 200MW targeted for 2028. The money: $1bn NVIDIA share deal (conditional). Up to $9bn of Brookfield-led project financing. Next proof: NVIDIA payment (deadline Oct 30), financing close, first customer contracts. SK Horizon (Most visible cash today): What it is: SK Broadband's existing data centers and subsea cables, split off and paired with infrastructure-fund money. When revenue comes: Already earns money. Spin-off and deal close targeted for 1Q 2027. The money: About ₩3.08tn deal: ₩1.88tn to SKT for existing shares, about ₩1.2tn of new equity. Next proof: Deal close, new money received, more megawatts billed to customers. SK Hyper (Long-dated development option): What it is: New SKT unit that secures land, substations and customers for gigawatt-scale campuses. When revenue comes: First 5GW opens in phases from 2029. Expansion toward 15GW is planned around 2035. The money: SKT can put in up to ₩750bn by 2030. First 5GW estimated at about $350bn in total. Next proof: A named anchor customer and outside investors with signed terms." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="510" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Three different businesses, at three different stages</text><rect x="16" y="50" width="300" height="410" rx="8" fill="#2a78d6" fill-opacity="0.04" strok