ll="#465160" text-anchor="start" font-weight="400">financing close, first customer</text><text x="32" y="436" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">contracts.</text><rect x="332" y="50" width="300" height="410" rx="8" fill="#2e8b57" fill-opacity="0.04" stroke="#2e8b57" stroke-width="1.4"/><rect x="332" y="50" width="300" height="62" rx="8" fill="#2e8b57" fill-opacity="0.13"/><text x="348" y="78" font-size="16" fill="#2e8b57" text-anchor="start" font-weight="700">SK Horizon</text><text x="348" y="100" font-size="12" fill="#121821" text-anchor="start" font-weight="600">Most visible cash today</text><text x="348" y="136" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">What it is</text><text x="348" y="155" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">SK Broadband's existing data centers and</text><text x="348" y="172" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">subsea cables, split off and paired with</text><text x="348" y="189" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">infrastructure-fund money.</text><text x="348" y="224" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">When revenue comes</text><text x="348" y="243" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Already earns money. Spin-off and deal</text><text x="348" y="260" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">close targeted for 1Q 2027.</text><text x="348" y="295" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">The money</text><text x="348" y="314" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">About ₩3.08tn deal: ₩1.88tn to SKT for</text><text x="348" y="331" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">existing shares, about ₩1.2tn of new</text><text x="348" y="348" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">equity