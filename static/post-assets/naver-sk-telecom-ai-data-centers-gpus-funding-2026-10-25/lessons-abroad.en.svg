<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Lessons from abroad: revenue growth does not fund itself. Cash in and out, first half of 2026 ($bn): CoreWeave: Operating cash flow 3.66, Cash spent on equipment and property 14.12, Gap −10.45; Nebius: Operating cash flow 4.5, Cash spent on equipment and property 8.13, Gap −3.63. 4.40 of Nebius's 4.50 came from customers paying in advance. Core Scientific: leased vs. billing (MW): 590MW leased to CoreWeave, Billing 395MW, Building or testing 195MW. Count megawatts that bill, not megawatts that are leased." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Lessons from abroad: revenue growth does not fund itself</text><rect x="16" y="50" width="560" height="286" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Cash in and out, first half of 2026 ($bn)</text><text x="32" y="130" font-size="14" fill="#121821" text-anchor="start" font-weight="700">CoreWeave</text><rect x="130" y="108" width="85.5" height="20" rx="3" fill="#2e8b57"/><text x="223.53824362606233" y="123" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3.66</text><rect x="130" y="134" width="330.0" height="20" rx="3" fill="#c2410c"/><text x="468.0" y="149" font-size="13" fill="#121821" text-anchor="start" font-weight="700">14.12</text><text x="130" y="174" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">Gap −10.45</text><text x="32" y="226" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Nebius</text><rect x="130" y="204" width="105.2" height="20" rx="3" fill="#2e8b57"/><text x="243.1699716713881" y="219" font-size="13" fill="#121821" text-anchor="start" font-weight="700">4.50</text><rect x="130" y="230" width="190.0" height="20" rx="3" fill="#c2410c"/><text x="328.00708215297453" y="245" font-size="13" fill="#121821" text-anchor="start" font-weight="700">8.13</text><text x="130" y="270" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">Gap −3.63</text><text x="250" y="270" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">4.40 of Nebius's 4.50 came from customers paying in advance</text><rect x="32" y="306" width="12" height="12" rx="2" fill="#2e8b57"/><text x="50" y="316" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Operating cash flow</text><rect x="230" y="306" width="12" height="12" rx="2" fill="#c2410c"/><text x="248" y="316" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Cash spent on equipment and property</text><rect x="588" y="50" width="356" height="286" rx="8" fill="#2e8b57" fill-opacity="0.03" stroke="#2e8b57" stroke-width="1.4"/><text x="604" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Core Scientific: leased vs. billing (MW)</text><rect x="604.0" y="112" width="216.9" height="38" fill="#2e8b57"/><text x="612" y="136" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700">395</text><text x="606" y="170" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">Billing</text><rect x="820.9" y="112" width="107.1" height="38" fill="#b7791f"/><text x="828.9152542372881" y="136" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700">195</text><text x="822.9152542372881" y="170" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">Building or testing</text><text x="604" y="102" font-size="12" fill="#121821" text-anchor="start" font-weight="600">590MW leased to CoreWeave</text><text x="604" y="196" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="700">395 / 590 = 67%</text><text x="604" y="240" font-size="13" fill="#121821" text-anchor="start" font-weight="400">Count megawatts that bill,</text><text x="604" y="260" font-size="13" fill="#121821" text-anchor="start" font-weight="700">not megawatts that are leased.</text><text x="24" y="364" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">CoreWeave and Core Scientific 10-Q, Nebius 6-K (all to Jun 30, 2026). Gap is our simple subtraction, not company-defined free cash flow.</text></svg>