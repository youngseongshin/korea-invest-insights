<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="'GPU 선확보'는 다섯 단계입니다. 국내 숫자는 대부분 첫 단계에 있습니다. 단계: 계획 발표, 구속력 있는 발주, 납품·소유권 이전, 설치·전력·검수, 고객 과금. 네이버: 6만개 초과(NVIDIA 배치 계획, 2025년 10월): 1단계까지 확인; 네이버: 200MW ≈ 약 10만개(확장 계획의 대략적 환산, 2026년): 1단계까지 확인; SK그룹: 5만개 초과(그룹 전체 구상, SKT·하이퍼 몫으로 배분 안 됨): 1단계까지 확인; SKT: 최대 2GW AI Factory(NVIDIA와의 LOI, 첫 시설 2027년): 1단계까지 확인; SKT GPU 클라우드(H100)(2025년부터 유료 서비스 운영): 5단계까지 확인" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="450" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">'GPU 선확보'는 다섯 단계입니다. 국내 숫자는 대부분 첫 단계에 있습니다</text><rect x="332" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="391.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">1</text><text x="391.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">계획 발표</text><rect x="454" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="513.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">2</text><text x="513.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">구속력 있는 발주</text><rect x="576" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="635.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">3</text><text x="635.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">납품·소유권 이전</text><rect x="698" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="757.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">4</text><text x="757.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">설치·전력·검수</text><rect x="820" y="52" width="118" height="44" rx="6" fill="#f6f8fa"/><text x="879.0" y="70" font-size="12" fill="#6f7a88" text-anchor="middle" font-weight="700">5</text><text x="879.0" y="84" font-size="11" fill="#465160" text-anchor="middle" font-weight="600">고객 과금</text><text x="24" y="132" font-size="13" fill="#121821" text-anchor="start" font-weight="700">네이버: 6만개 초과</text><text x="24" y="149" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">NVIDIA 배치 계획, 2025년 10월</text><rect x="340" y="122" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="122" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="184" font-size="13" fill="#121821" text-anchor="start" font-weight="700">네이버: 200MW ≈ 약 10만개</text><text x="24" y="201" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">확장 계획의 대략적 환산, 2026년</text><rect x="340" y="174" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="174" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="236" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SK그룹: 5만개 초과</text><text x="24" y="253" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">그룹 전체 구상, SKT·하이퍼 몫으로 배분 안 됨</text><rect x="340" y="226" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="226" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="288" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SKT: 최대 2GW AI Factory</text><text x="24" y="305" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">NVIDIA와의 LOI, 첫 시설 2027년</text><rect x="340" y="278" width="102.0" height="18" rx="9" fill="#2a78d6"/><rect x="448.0" y="278" width="482.0" height="18" rx="9" fill="none" stroke="#6f7a88" stroke-dasharray="5 4"/><text x="24" y="340" font-size="13" fill="#121821" text-anchor="start" font-weight="700">SKT GPU 클라우드(H100)</text><text x="24" y="357" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">2025년부터 유료 서비스 운영</text><rect x="340" y="330" width="590.0" height="18" rx="9" fill="#2e8b57"/><rect x="340" y="382" width="28" height="12" rx="6" fill="#2a78d6"/><text x="376" y="393" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">공개 자료로 확인</text><rect x="580" y="382" width="28" height="12" rx="6" fill="none" stroke="#6f7a88" stroke-dasharray="4 3"/><text x="616" y="393" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">아직 공개되지 않음</text><text x="24" y="424" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">NVIDIA 발표(2025년 10월, 2026년 7월), SKT 발표. 네이버의 두 숫자는 합산하면 안 되고, 둘 다 납품 수량이 아닙니다.</text></svg>