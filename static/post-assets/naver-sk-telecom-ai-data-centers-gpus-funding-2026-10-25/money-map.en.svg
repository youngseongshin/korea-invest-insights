<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-label="Follow the money: who receives it, and in what form. NAVER: $1bn, NVIDIA buys new NAVER shares, Signed and board-approved. Payment not yet confirmed; latest deadline Oct 30.; Up to $9bn, Brookfield-led money for a project company, Non-binding term sheet in July, called a commitment in September. Final close not confirmed.; ₩400bn, Policy loan, 5 years, rate in the 3% range, Approved in April 2026. Amount drawn not disclosed.. SK Horizon: ₩1.88tn, To SKT, for selling existing shares, Signed. Scheduled for Mar 4, 2027, once closing conditions are met.; About ₩1.2tn, To Horizon, as new equity for growth, Planned new-share issue; terms can change.; 51 / 29 / 20, Final stakes: SKT / KKR / IMM group, Conditions remain, including approvals.. SK Hyper: Up to ₩750bn, From SKT through 2030, for land and substations, A board limit, not money already paid in.; About $350bn, Estimated total cost of the first 5GW, CEO estimate via press. To be shared by customers, investors and project loans; nothing signed.; ≈ 0.16%, ₩750bn as a share of $350bn, A scale comparison only. Not a funding gap.." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="584" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Follow the money: who receives it, and in what form</text><text x="20" y="66" font-size="15" fill="#2a78d6" text-anchor="start" font-weight="700">NAVER</text><rect x="16" y="80" width="300" height="134" rx="8" fill="#f6f8fa"/><rect x="16" y="80" width="5" height="134" rx="2" fill="#b7791f"/><text x="34" y="110" font-size="20" fill="#121821" text-anchor="start" font-weight="700">$1bn</text><text 