-anchor="start" font-weight="400">Signed or approved</text><rect x="224" y="532" width="12" height="12" rx="2" fill="#b7791f"/><text x="242" y="542" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Not closed or not paid</text><rect x="424" y="532" width="12" height="12" rx="2" fill="#c2410c"/><text x="442" y="542" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Estimate only</text><text x="24" y="568" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">KIND and SEC filings, company and NVIDIA releases, press reports. Status as of Oct 25, 2026. Won figures are not converted.</text></svg>