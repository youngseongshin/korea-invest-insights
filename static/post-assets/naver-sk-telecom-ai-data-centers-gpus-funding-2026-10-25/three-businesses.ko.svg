<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="서로 다른 세 사업, 서로 다른 세 단계. 네이버 AI Factory (신규 컴퓨팅 사업 중 가장 구체적): 무엇인가: 각 세종에서 AI 연산을 팝니다. 클라우드·자체 모델·기업 고객과 연결됩니다. 매출은 언제: 2027년 상반기 55MW 가동과 매출 예상. 2028년 200MW 목표. 돈: NVIDIA 10억달러 증자(조건부). Brookfield 주도 프로젝트 금융 최대 90억달러. 다음 증거: NVIDIA 납입(기한 10/30), 금융 종결, 첫 고객 계약. SK호라이즌 (지금 현금 가시성이 가장 높음): 무엇인가: SK브로드밴드의 기존 데이터센터·해저케이블을 분할하고 인프라펀드 자본을 붙입니다. 매출은 언제: 이미 매출이 납니다. 분할·거래 종결은 2027년 1분기 목표. 돈: 약 3.08조원 거래. SKT 구주대금 1.88조원, 신주 약 1.2조원. 다음 증거: 거래 종결, 신규 자금 유입, 고객 청구 MW 증가. SK하이퍼 (장기 개발 옵션): 무엇인가: 부지·변전소·고객을 확보해 GW급 단지를 개발하는 SKT 신설 자회사입니다. 매출은 언제: 2029년부터 첫 5GW 단계 개통. 2035년 무렵 15GW를 향한 순차 확장 계획. 돈: SKT 출자 한도 2030년까지 7,500억원. 첫 5GW 총사업비 추산 약 3,500억달러. 다음 증거: 이름이 공개된 앵커 고객, 조건이 서명된 외부 투자자." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="510" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">서로 다른 세 사업, 서로 다른 세 단계</text><rect x="16" y="50" width="300" height="410" rx="8" fill="#2a78d6" fill-opacity="0.04" stroke="#2a78d6" stroke-width="1.4"/><rect x="16" y="50" width="300" height="62" rx="8" fill="#2a78d6" fill-opacity="0.13"/><text x="32" y="78" font-size="16" fill="#2a78d6" text-anchor="start" font-weight="700">네이버 AI Factory</text><text x="32" y="100" font-size="12" fill="#121821" text-anchor="start" font-weight="600">신규 컴퓨팅 사업 중 가장 구체적</text><text x="32" y="136" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">무엇인가</text><text x="32" y="155" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">각 세종에서 AI 연산을 팝니다.</text><text x="32" y="172" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">클라우드·자체 모델·기업 고객과</text><text x="32" y="189" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">연결됩니다.</text><text x="32" y="224" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">매출은 언제</text><text x="32" y="243" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">2027년 상반기 55MW 가동과 매출</text><text x="32" y="260" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">예상. 2028년 200MW 목표.</text><text x="32" y="295" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">돈</text><text x="32" y="314" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">NVIDIA 10억달러 증자(조건부).</text><text x="32" y="331" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">Brookfield 주도 프로젝트 금융</text><text x="32" y="348" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">최대 90억달러.</text><text x="32" y="383" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">다음 증거</text><text x="32" y="402" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">NVIDIA 납입(기한 10/30),</text><text x="32" y="419" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">금융 종결, 첫 고객 계약.</text><rect x="332" y="50" width="300" height="410" rx="8" fill="#2e8b57" fill-opacity="0.04" stroke="#2e8b57" stroke-width="1.4"/><rect x="332" y="50" width="300" height="62" rx="8" fill="#2e8b57" fill-opacity="0.13"/><text x="348" y="78" font-size="16" fill="#2e8b57" text-anchor="start" font-weight="700">SK호라이즌</text><text x="348" y="100" font-size="12" fill="#121821" text-anchor="start" font-weight="600">지금 현금 가시성이 가장 높음</text><text x="348" y="136" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">무엇인가</text><text x="348" y="155" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">SK브로드밴드의 기존</text><text x="348" y="172" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">데이터센터·해저케이블을 분할하고</text><text x="348" y="189" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">인프라펀드 자본을 붙입니다.</text><text x="348" y="224" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">매출은 언제</text><text x="348" y="243" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">이미 매출이 납니다. 분할·거래 종결은</text><text x="348" y="260" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">2027년 1분기 목표.</text><text x="348" y="295" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">돈</text><text x="348" y="314" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">약 3.08조원 거래. SKT 구주대금</text><text x="348" y="331" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">1.88조원, 신주 약 1.2조원.</text><text x="348" y="366" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">다음 증거</text><text x="348" y="385" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">거래 종결, 신규 자금 유입, 고객</text><text x="348" y="402" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">청구 MW 증가.</text><rect x="648" y="50" width="300" height="410" rx="8" fill="#6250d6" fill-opacity="0.04" stroke="#6250d6" stroke-width="1.4"/><rect x="648" y="50" width="300" height="62" rx="8" fill="#6250d6" fill-opacity="0.13"/><text x="664" y="78" font-size="16" fill="#6250d6" text-anchor="start" font-weight="700">SK하이퍼</text><text x="664" y="100" font-size="12" fill="#121821" text-anchor="start" font-weight="600">장기 개발 옵션</text><text x="664" y="136" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">무엇인가</text><text x="664" y="155" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">부지·변전소·고객을 확보해 GW급</text><text x="664" y="172" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">단지를 개발하는 SKT 신설</text><text x="664" y="189" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">자회사입니다.</text><text x="664" y="224" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">매출은 언제</text><text x="664" y="243" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">2029년부터 첫 5GW 단계 개통.</text><text x="664" y="260" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">2035년 무렵 15GW를 향한 순차</text><text x="664" y="277" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">확장 계획.</text><text x="664" y="312" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">돈</text><text x="664" y="331" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">SKT 출자 한도 2030년까지</text><text x="664" y="348" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">7,500억원. 첫 5GW 총사업비</text><text x="664" y="365" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">추산 약 3,500억달러.</text><text x="664" y="400" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="700">다음 증거</text><text x="664" y="419" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">이름이 공개된 앵커 고객, 조건이</text><text x="664" y="436" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">서명된 외부 투자자.</text><text x="24" y="484" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">회사 발표·공시·NVIDIA 발표, 2026년 10월 25일 기준. SKT의 별도 NVIDIA AI Cloud 계획(최대 2GW, 첫 시설</text><text x="24" y="499" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">2027년)과 AWS 울산은 합산하지 않았습니다.</text></svg>