<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="칩이 얼마나 빨리 낡느냐가 연간 회수 부담을 정합니다. 가상의 100억달러 AI 데이터센터가 매년 벌어야 하는 회수 금액(억달러): 칩 수명 3년 39.2; 칩 수명 4년 32.3; 칩 수명 6년 25.4. 칩 수명이 6년에서 4년으로 줄면 매년 약 6.9억달러가 더 필요합니다. GPU·서버 80억달러(요구수익률 10%), 건물 20억달러(8%, 20년), 연간 현금 운영비 5억달러, 잔존가치 0을 가정했습니다." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="340" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">칩이 얼마나 빨리 낡느냐가 연간 회수 부담을 정합니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">가상의 100억달러 AI 데이터센터가 매년 벌어야 하는 회수 금액(억달러)</text><text x="24" y="106" font-size="13" fill="#121821" text-anchor="start" font-weight="700">칩 수명 3년</text><rect x="170" y="88" width="420.0" height="28" rx="4" fill="#c2410c"/><text x="600.0" y="108" font-size="15" fill="#121821" text-anchor="start" font-weight="700">39.2</text><text x="24" y="164" font-size="13" fill="#121821" text-anchor="start" font-weight="700">칩 수명 4년</text><rect x="170" y="146" width="346.1" height="28" rx="4" fill="#b7791f"/><text x="526.0714285714284" y="166" font-size="15" fill="#121821" text-anchor="start" font-weight="700">32.3</text><text x="24" y="222" font-size="13" fill="#121821" text-anchor="start" font-weight="700">칩 수명 6년</text><rect x="170" y="204" width="272.1" height="28" rx="4" fill="#2e8b57"/><text x="452.1428571428571" y="224" font-size="15" fill="#121821" text-anchor="start" font-weight="700">25.4</text><rect x="668" y="84" width="276" height="84" rx="8" fill="#6250d6" fill-opacity="0.06" stroke="#6250d6" stroke-width="1.4"/><text x="684" y="116" font-size="13" fill="#6250d6" text-anchor="start" font-weight="400">칩 수명이 6년에서 4년으로 줄면</text><text x="684" y="138" font-size="13" fill="#6250d6" text-anchor="start" font-weight="700">매년 약 6.9억달러가 더 필요합니다.</text><text x="24" y="276" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">GPU·서버 80억달러(요구수익률 10%), 건물 20억달러(8%, 20년), 연간 현금 운영비 5억달러, 잔존가치 0을 가정했습니다.</text><text x="24" y="326" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">저희 예시이며 네이버·SKT 전망이 아닙니다. 세금·가동 초기 증가·교체비는 뺐습니다.</text></svg>