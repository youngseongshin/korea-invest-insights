<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="삼성전자 주가는 두 엔진이 움직입니다: 하나는 순이익을, 하나는 자본을 정합니다"><rect x="-20" y="-20" width="800" height="514" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">삼성전자 주가는 두 엔진이 움직입니다: 하나는 순이익을, 하나는 자본을 정합니다</text><text x="24.0" y="47.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">이익과 환원이 ROE, P/B, 시장 가치로 이어지는 길</text><rect x="24.0" y="66.0" width="350.0" height="130.0" fill="#eaf1fb" rx="8" stroke="#2a6fc9" stroke-width="1.5"/><text x="40.0" y="90.0" font-size="11.5" fill="#2a6fc9" text-anchor="start" font-weight="bold">엔진 1 · 사업</text><text x="40.0" y="114.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">사업이 얼마나 버는가</text><text x="40.0" y="140.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">정상화 영업이익: 117조원(2030년)</text><text x="40.0" y="160.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">움직이는 것: 메모리 가격, 공급 규율(λ)</text><text x="40.0" y="180.0" font-size="12" fill="#2a6fc9" text-anchor="start" font-weight="bold">결정하는 쪽: 시장</text><rect x="386.0" y="66.0" width="350.0" height="130.0" fill="#e6f5ef" rx="8" stroke="#159a6c" stroke-width="1.5"/><text x="402.0" y="90.0" font-size="11.5" fill="#159a6c" text-anchor="start" font-weight="bold">엔진 2 · 주주환원</text><text x="402.0" y="114.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">현금이 얼마나 회사를 떠나는가</text><text x="402.0" y="140.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">환원율: 잉여현금흐름의 33%, 50%, 100%</text><text x="402.0" y="160.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">움직이는 것: 이사회의 환원 정책</text><text x="402.0" y="180.0" font-size="12" fill="#159a6c" text-anchor="start" font-weight="bold">결정하는 쪽: 회사(첫 공개: 1월 말)</text><line x1="199.0" y1="196.0" x2="199.0" y2="228.0" stroke="#2a6fc9" stroke-width="2"/><polygon points="199.0,234.0 194.0,226.0 204.0,226.0" fill="#2a6fc9"/><line x1="561.0" y1="196.0" x2="561.0" y2="228.0" stroke="#159a6c" stroke-width="2"/><polygon points="561.0,234.0 556.0,226.0 566.0,226.0" fill="#159a6c"/><rect x="104.0" y="236.0" width="190.0" height="50.0" fill="#2a6fc9" rx="8"/><text x="199.0" y="267.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">순이익</text><text x="375.0" y="268.0" font-size="26" fill="#17212b" text-anchor="middle" font-weight="bold">÷</text><rect x="466.0" y="236.0" width="190.0" height="50.0" fill="#159a6c" rx="8"/><text x="561.0" y="267.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">자본</text><text x="668.0" y="268.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">= ROE</text><line x1="380.0" y1="292.0" x2="380.0" y2="320.0" stroke="#5b6774" stroke-width="2"/><polygon points="380.0,326.0 375.0,318.0 385.0,318.0" fill="#5b6774"/><rect x="110.0" y="326.0" width="540.0" height="58.0" fill="#f3f1fc" rx="8" stroke="#6250d6" stroke-width="1.2"/><text x="380.0" y="351.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">P/B ≈ ROE ÷ 요구수익률 10%</text><text x="380.0" y="372.0" font-size="12" fill="#5b6774" text-anchor="middle" font-weight="normal">ROE 7.7% → 0.77배    ·    ROE 11.1% → 1.11배   (성장률 0 가정)</text><line x1="380.0" y1="388.0" x2="380.0" y2="410.0" stroke="#5b6774" stroke-width="2"/><polygon points="380.0,416.0 375.0,408.0 385.0,408.0" fill="#5b6774"/><rect x="110.0" y="416.0" width="540.0" height="42.0" fill="#6250d6" rx="8"/><text x="380.0" y="443.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">시장 가치 = 자본 × P/B</text></svg>