<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="ROE를 올리는 길: 가장 확실한 길은 이사회가 쥐고 있습니다"><rect x="-20" y="-20" width="800" height="410" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">ROE를 올리는 길: 가장 확실한 길은 이사회가 쥐고 있습니다</text><text x="24.0" y="47.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">각 길을 적용한 2030년 ROE, 기본 경로에 모형이 시험한 한 걸음씩</text><text x="590.0" y="78.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal"></text><rect x="16.0" y="84.0" width="728.0" height="58.0" fill="#f6f8fa" rx="2"/><text x="24.0" y="110.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">현재 경로</text><text x="24.0" y="129.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">잉여현금흐름 50% 환원</text><rect x="262.0" y="96.0" width="115.5" height="30.0" fill="#9aa3ad" rx="3" fill-opacity="0.85"/><text x="274.0" y="117.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">7.7%</text><text x="24.0" y="172.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">① 환원</text><text x="24.0" y="191.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">잉여현금흐름 50% → 100%</text><rect x="262.0" y="158.0" width="166.5" height="30.0" fill="#159a6c" rx="3" fill-opacity="0.85"/><text x="274.0" y="179.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">11.1%</text><text x="560.0" y="172.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">이사회</text><text x="560.0" y="191.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">확실성: 높음</text><rect x="16.0" y="208.0" width="728.0" height="58.0" fill="#f6f8fa" rx="2"/><text x="24.0" y="234.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">② 가격 규율</text><text x="24.0" y="253.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">λ 0.5 → 1, 이익 117조 → 129조원</text><rect x="262.0" y="220.0" width="126.0" height="30.0" fill="#2a6fc9" rx="3" fill-opacity="0.85"/><text x="274.0" y="241.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">약 8.4%</text><text x="560.0" y="234.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">가격 사이클</text><text x="560.0" y="253.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">확실성: 낮음</text><text x="24.0" y="296.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">③ 650조원 재투자</text><text x="24.0" y="315.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">3% 대신 약 17%로</text><rect x="262.0" y="282.0" width="217.5" height="30.0" fill="#d9622b" rx="3" stroke="#d9622b" stroke-width="1.4" fill-opacity="0.2" stroke-dasharray="5 3"/><text x="274.0" y="303.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">이론상 14%대</text><text x="560.0" y="296.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">650조원 투자처 필요</text><text x="560.0" y="315.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">확실성: 가장 낮음</text><line x1="412.0" y1="82.0" x2="412.0" y2="332.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="412.0" y="76.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">요구수익률 10%</text><text x="24.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">②는 범위가 가장 넓습니다. 이익 수준 자체가 높아지면 이 한 걸음보다 ROE가 훨씬 더 오릅니다. ③는 예측이 아니라 상한입니다.</text></svg>