<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="About half of 2030 equity is cash that earns about 3%"><rect x="-20" y="-20" width="800" height="336" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">About half of 2030 equity is cash that earns about 3%</text><text x="24.0" y="47.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Base path at a 50% payout: equity of ₩1,357T at the end of 2030</text><rect x="30.0" y="92.0" width="364.7" height="58.0" fill="#2a6fc9" rx="6" fill-opacity="0.85"/><rect x="394.7" y="92.0" width="335.3" height="58.0" fill="#d9622b" rx="6" fill-opacity="0.9"/><text x="212.4" y="117.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Operating capital</text><text x="212.4" y="137.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">earns far more (model ROIC about 17%)</text><text x="562.4" y="117.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Retained cash ≈ ₩650T</text><text x="562.4" y="137.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">earns about 3% after tax</text><line x1="30.0" y1="84.0" x2="730.0" y2="84.0" stroke="#b9bec8" stroke-width="1"/><text x="380.0" y="78.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">2030: ₩1,357T</text><line x1="380.0" y1="158.0" x2="380.0" y2="192.0" stroke="#5b6774" stroke-width="2"/><polygon points="380.0,198.0 375.0,190.0 385.0,190.0" fill="#5b6774"/><rect x="100.0" y="200.0" width="560.0" height="46.0" fill="#fdf1ec" rx="8" stroke="#d9622b" stroke-width="1.2"/><text x="380.0" y="229.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">On total equity the ROE is 7.7%, below the 10% required return</text><text x="380.0" y="276.0" font-size="12" fill="#5b6774" text-anchor="middle" font-weight="normal">Every extra ₩1T of cash kept adds ₩1T to equity and only about ₩0.03T to profit.</text></svg>