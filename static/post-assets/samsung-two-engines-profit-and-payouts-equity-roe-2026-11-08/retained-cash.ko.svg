<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="2030년 자본의 절반 가까이는 3%만 버는 현금입니다"><rect x="-20" y="-20" width="800" height="336" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">2030년 자본의 절반 가까이는 3%만 버는 현금입니다</text><text x="24.0" y="47.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">기본 경로, 환원율 50%: 2030년 말 자본 1,357조원</text><rect x="30.0" y="92.0" width="364.7" height="58.0" fill="#2a6fc9" rx="6" fill-opacity="0.85"/><rect x="394.7" y="92.0" width="335.3" height="58.0" fill="#d9622b" rx="6" fill-opacity="0.9"/><text x="212.4" y="117.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">영업 자본</text><text x="212.4" y="137.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">훨씬 높은 수익(모형 ROIC 약 17%)</text><text x="562.4" y="117.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">유보현금 약 650조원</text><text x="562.4" y="137.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">세후 약 3%</text><line x1="30.0" y1="84.0" x2="730.0" y2="84.0" stroke="#b9bec8" stroke-width="1"/><text x="380.0" y="78.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">2030년: 1,357조원</text><line x1="380.0" y1="158.0" x2="380.0" y2="192.0" stroke="#5b6774" stroke-width="2"/><polygon points="380.0,198.0 375.0,190.0 385.0,190.0" fill="#5b6774"/><rect x="100.0" y="200.0" width="560.0" height="46.0" fill="#fdf1ec" rx="8" stroke="#d9622b" stroke-width="1.2"/><text x="380.0" y="229.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">자본 전체로 보면 ROE는 7.7%이고, 요구수익률 10%보다 낮습니다</text><text x="380.0" y="276.0" font-size="12" fill="#5b6774" text-anchor="middle" font-weight="normal">현금이 1조원 더 쌓이면 자본은 1조원 늘고 이익은 약 