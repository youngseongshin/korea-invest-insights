<rect x="16.0" y="208.0" width="728.0" height="58.0" fill="#f6f8fa" rx="2"/><text x="24.0" y="234.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">② Price discipline</text><text x="24.0" y="253.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">λ 0.5 → 1, profit ₩117T → ₩129T</text><rect x="262.0" y="220.0" width="126.0" height="30.0" fill="#2a6fc9" rx="3" fill-opacity="0.85"/><text x="274.0" y="241.0" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">~8.4%</text><text x="560.0" y="234.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">The price cycle</text><text x="560.0" y="253.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Certainty: low</text><text x="24.0" y="296.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">③ Reinvest ₩650T</text><text x="24.0" y="315.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">at about 17% instead of 3%</text><rect x="262.0" y="282.0" width="217.5" height="30.0" fill="#d9622b" rx="3" stroke="#d9622b" stroke-width="1.4" fill-opacity="0.2" stroke-dasharray="5 3"/><text x="274.0" y="303.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">14%+ on paper</text><text x="560.0" y="296.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Needs ₩650T of projects</text><text x="560.0" y="315.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Certainty: lowest</text><line x1="412.0" y1="82.0" x2="412.0" y2="332.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="412.0" y="76.0" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">10% required return</text><text x="24.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">② has the widest range: a higher profit plateau lifts ROE far more than this one step. ③ is a ceiling, not a forecast.</text></svg>