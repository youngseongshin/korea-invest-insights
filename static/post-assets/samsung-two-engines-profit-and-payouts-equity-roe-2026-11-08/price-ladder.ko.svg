oke-width="1"/><text x="606.7" y="210.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">280</text><line x1="720.0" y1="186.0" x2="720.0" y2="194.0" stroke="#b9bec8" stroke-width="1"/><text x="720.0" y="210.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">320</text><rect x="105.2" y="183.0" width="136.0" height="14.0" fill="#d9622b" rx="3" fill-opacity="0.85"/><line x1="173.2" y1="132.0" x2="173.2" y2="183.0" stroke="#d9622b" stroke-width="1.2"/><text x="173.2" y="98.0" font-size="12" fill="#d9622b" text-anchor="middle" font-weight="bold">중국 대형 은행 배수</text><text x="173.2" y="114.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">0.56배~0.82배</text><text x="173.2" y="130.0" font-size="11.5" fill="#5b6774" text-anchor="middle" font-weight="normal">10.3만~15.1만원(670~980조원)</text><line x1="348.0" y1="138.0" x2="348.0" y2="190.0" stroke="#6250d6" stroke-width="2"/><polygon points="348.0,191.0 341.0,204.0 355.0,204.0" fill="#6250d6"/><text x="348.0" y="98.0" font-size="12" fill="#6250d6" text-anchor="middle" font-weight="bold">11월 6일 종가</text><text x="348.0" y="114.0" font-size="14" fill="#17212b" text-anchor="middle" font-weight="bold">188,700원</text><text x="348.0" y="130.0" font-size="11.5" fill="#5b6774" text-anchor="middle" font-weight="normal">(1,230조원)</text><line x1="663.3" y1="120.0" x2="663.3" y2="190.0" stroke="#2a6fc9" stroke-width="1.2"/><circle cx="663.3" cy="190.0" r="7" fill="#2a6fc9"/><text x="663.3" y="98.0" font-size="12" fill="#2a6fc9" text-anchor="middle" font-weight="bold">버크셔 1.63배</text><text x="663.3" y="114.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="normal">30.0만원(1,960조원)</text><text x="24.0" y="244.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">자본 1,200조원은 2028년 범위 1,140조~1,380조원 안에 있습니다. 주당 값은 현재 주식 수 기준입니다.</text></svg>