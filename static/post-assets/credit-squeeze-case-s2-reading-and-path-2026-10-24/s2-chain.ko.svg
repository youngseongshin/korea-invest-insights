<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="S2가 메모리 회사에 닿는 경로. 1. 가장 약한 칸이 더 냅니다: 하이일드 283bp(1/2) → 340bp(10/22), 코어위브 2032년물 76~81센트; 2. 한계 용량이 줄어듭니다: 오라클 + 코어위브 ≈ 2027 지출 1,100억~1,350억달러, ≈ 2027 capex 증가분의 20~25%; 3. 조건부 임차가 부지별로 깨집니다: MS·엔스케일 러프턴 철회(10월), MS 개시 전 리스 3,291억달러; 4. 2026~27 이익이 아니라 2028 주문: 2026~27은 장기계약으로 상당 부분 고정, 위험은 2028 주문과 멀티플. 지금 S2를 막는 제동 장치: 투자등급 스프레드 89bp(약세선 100bp); BB 지수 수익률 6.85%(약세선 7.5%); 네비우스: 씨티 35억달러 한도(10월); MS는 현금으로 설비투자" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">S2가 메모리 회사에 닿는 경로</text><rect x="16" y="52" width="212" height="170" rx="8" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-width="1.4"/><text x="28" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">1. 가장 약한 칸이 더</text><text x="28" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">냅니다</text><text x="28" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">하이일드 283bp(1/2) →</text><text x="28" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">340bp(10/22)</text><text x="28" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">코어위브 2032년물</text><text x="28" y="183" font-size="12" fill="#465160" text-anchor="start" font-weight="400">76~81센트</text><line x1="230" y1="137" x2="246" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="248" y="52" width="212" height="170" rx="8" fill="#b7791f" fill-opacity="0.07" stroke="#b7791f" stroke-width="1.4"/><text x="260" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">2. 한계 용량이 줄어듭니다</text><text x="260" y="102" font-size="12" fill="#465160" text-anchor="start" font-weight="400">오라클 + 코어위브 ≈ 2027</text><text x="260" y="119" font-size="12" fill="#465160" text-anchor="start" font-weight="400">지출 1,100억~1,350억달러</text><text x="260" y="148" font-size="12" fill="#465160" text-anchor="start" font-weight="400">≈ 2027 capex 증가분의</text><text x="260" y="165" font-size="12" fill="#465160" text-anchor="start" font-weight="400">20~25%</text><line x1="462" y1="137" x2="478" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="480" y="52" width="212" height="170" rx="8" fill="#c2410c" fill-opacity="0.07" stroke="#c2410c" stroke-width="1.4"/><text x="492" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">3. 조건부 임차가 부지별로</text><text x="492" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">깨집니다</text><text x="492" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">MS·엔스케일 러프턴</text><text x="492" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">철회(10월)</text><text x="492" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">MS 개시 전 리스</text><text x="492" y="183" font-size="12" fill="#465160" text-anchor="start" font-weight="400">3,291억달러</text><line x1="694" y1="137" x2="710" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="712" y="52" width="212" height="170" rx="8" fill="#6250d6" fill-opacity="0.07" stroke="#6250d6" stroke-width="1.4"/><text x="724" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">4. 2026~27 이익이</text><text x="724" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">아니라 2028 주문</text><text x="724" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">2026~27은 장기계약으로 상당</text><text x="724" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">부분 고정</text><text x="724" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">위험은 2028 주문과 멀티플</text><rect x="16" y="240" width="928" height="106" rx="8" fill="#2e8b57" fill-opacity="0.05" stroke="#2e8b57" stroke-width="1.4"/><text x="32" y="266" font-size="13.5" fill="#2e8b57" text-anchor="start" font-weight="700">지금 S2를 막는 제동 장치</text><text x="32" y="294" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 투자등급 스프레드 89bp(약세선 100bp)</text><text x="482" y="294" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• BB 지수 수익률 6.85%(약세선 7.5%)</text><text x="32" y="320" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• 네비우스: 씨티 35억달러 한도(10월)</text><text x="482" y="320" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• MS는 현금으로 설비투자</text><text x="24" y="382" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">2단계는 예측이 아니라 민감도입니다. 이 사슬이 절반으로 줄면 2027 증가분의 약 10~12%입니다.</text></svg>