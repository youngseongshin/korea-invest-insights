<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="How S2 would reach memory makers. 1. The weakest rung pays more: HY spread 283bp (Jan 2) → 340bp (Oct 22), CoreWeave 2032 notes 76–81¢; 2. Marginal capacity shrinks: Oracle + CoreWeave ≈ $110–135bn of 2027 spend, ≈ 20–25% of the 2027 capex increase; 3. Conditional leases cut site by site: Microsoft–Nscale Loughton exit (Oct), Microsoft leases not yet started: $329bn; 4. 2028 memory orders, not 2026–27 profits: 2026–27 largely locked by long-term deals, Risk sits in 2028 orders and multiples. Brakes on S2 today: IG spread 89bp (bear line 100bp); BB index yield 6.85% (bear line 7.5%); Nebius: $3.5bn Citi facility (Oct); Microsoft funds capex from cash" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">How S2 would reach memory makers</text><rect x="16" y="52" width="212" height="170" rx="8" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-width="1.4"/><text x="28" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">1. The weakest rung pays</text><text x="28" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">more</text><text x="28" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">HY spread 283bp (Jan 2) →</text><text x="28" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">340bp (Oct 22)</text><text x="28" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">CoreWeave 2032 notes 76–81¢</text><line x1="230" y1="137" x2="246" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="248" y="52" width="212" height="170" rx="8" fill="#b7791f" fill-opacity="0.07" stroke="#b7791f" stroke-width="1.4"/><text x="260" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">2. Marginal capacity</text><text x="260" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">shrinks</text><text x="260" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Oracle + CoreWeave ≈</text><text x="260" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">$110–135bn of 2027 spend</text><text x="260" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">≈ 20–25% of the 2027 capex</text><text x="260" y="183" font-size="12" fill="#465160" text-anchor="start" font-weight="400">increase</text><line x1="462" y1="137" x2="478" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="480" y="52" width="212" height="170" rx="8" fill="#c2410c" fill-opacity="0.07" stroke="#c2410c" stroke-width="1.4"/><text x="492" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">3. Conditional leases cut</text><text x="492" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">site by site</text><text x="492" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Microsoft–Nscale Loughton exit</text><text x="492" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">(Oct)</text><text x="492" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Microsoft leases not yet</text><text x="492" y="183" font-size="12" fill="#465160" text-anchor="start" font-weight="400">started: $329bn</text><line x1="694" y1="137" x2="710" y2="137" stroke="#6f7a88" stroke-width="1.6" marker-end="url(#ah)"/><rect x="712" y="52" width="212" height="170" rx="8" fill="#6250d6" fill-opacity="0.07" stroke="#6250d6" stroke-width="1.4"/><text x="724" y="76" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">4. 2028 memory orders, not</text><text x="724" y="94" font-size="13.5" fill="#121821" text-anchor="start" font-weight="700">2026–27 profits</text><text x="724" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">2026–27 largely locked by</text><text x="724" y="137" font-size="12" fill="#465160" text-anchor="start" font-weight="400">long-term deals</text><text x="724" y="166" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Risk sits in 2028 orders and</text><text x="724" y="183" font-size="12" fill="#465160" text-anchor="start" font-weight="400">multiples</text><rect x="16" y="240" width="928" height="106" rx="8" fill="#2e8b57" fill-opacity="0.05" stroke="#2e8b57" stroke-width="1.4"/><text x="32" y="266" font-size="13.5" fill="#2e8b57" text-anchor="start" font-weight="700">Brakes on S2 today</text><text x="32" y="294" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• IG spread 89bp (bear line 100bp)</text><text x="482" y="294" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• BB index yield 6.85% (bear line 7.5%)</text><text x="32" y="320" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• Nebius: $3.5bn Citi facility (Oct)</text><text x="482" y="320" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">• Microsoft funds capex from cash</text><text x="24" y="382" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">Step 2 is a sensitivity, not a forecast: halving that chain equals about 10–12% of the 2027 increase.</text></svg>