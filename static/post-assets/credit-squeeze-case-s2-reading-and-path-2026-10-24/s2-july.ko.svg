<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="'7월 저점 재시험'은 코스피와 SK하이닉스에서 이미 진행 중입니다. 코스피 5,593.56 to 5,550.30; SK하이닉스 1,322,000원 to 1,263,000원; 삼성전자 207,000원 to 213,500원. 7월 저점이 지켜진 것은 매수자가 있었기 때문입니다. 기업 자사주가 9월까지 외국인 매도를 받았습니다. 그 매수자는 지금 없습니다. 삼성전자 프로그램은 10월 초, SK하이닉스는 10/21에 끝났습니다." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="330" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">'7월 저점 재시험'은 코스피와 SK하이닉스에서 이미 진행 중입니다</text><text x="300" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">7/30 종가</text><text x="470" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">10/23 종가</text><text x="640" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">거리</text><rect x="12" y="70" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="94" font-size="14" fill="#121821" text-anchor="start" font-weight="700">코스피</text><text x="300" y="94" font-size="13" fill="#465160" text-anchor="start" font-weight="400">5,593.56</text><text x="470" y="94" font-size="13" fill="#121821" text-anchor="start" font-weight="600">5,550.30</text><line x1="800" y1="76" x2="800" y2="102" stroke="#6f7a88"/><rect x="785" y="83" width="15" height="14" rx="3" fill="#c2410c"/><text x="640" y="94" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−0.8%</text><rect x="12" y="114" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="138" font-size="14" fill="#121821" text-anchor="start" font-weight="700">SK하이닉스</text><text x="300" y="138" font-size="13" fill="#465160" text-anchor="start" font-weight="400">1,322,000원</text><text x="470" y="138" font-size="13" fill="#121821" text-anchor="start" font-weight="600">1,263,000원</text><line x1="800" y1="120" x2="800" y2="146" stroke="#6f7a88"/><rect x="711" y="127" width="89" height="14" rx="3" fill="#c2410c"/><text x="640" y="138" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−4.5%</text><rect x="12" y="158" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="182" font-size="14" fill="#121821" text-anchor="start" font-weight="700">삼성전자</text><text x="300" y="182" font-size="13" fill="#465160" text-anchor="start" font-weight="400">207,000원</text><text x="470" y="182" font-size="13" fill="#121821" text-anchor="start" font-weight="600">213,500원</text><line x1="800" y1="164" x2="800" y2="190" stroke="#6f7a88"/><rect x="800" y="171" width="63" height="14" rx="3" fill="#2e8b57"/><text x="640" y="182" font-size="13" fill="#121821" text-anchor="start" font-weight="700">+3.1%</text><rect x="16" y="222" width="928" height="66" rx="8" fill="#b7791f" fill-opacity="0.08" stroke="#b7791f" stroke-width="1.4"/><text x="32" y="246" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">7월 저점이 지켜진 것은 매수자가 있었기 때문입니다. 기업 자사주가 9월까지 외국인 매도를 받았습니다.</text><text x="32" y="270" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">그 매수자는 지금 없습니다. 삼성전자 프로그램은 10월 초, SK하이닉스는 10/21에 끝났습니다.</text><text x="24" y="314" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">종가: 네이버 금융(KRX 확정 종가). S2의 질문은 여기서의 폭락이 아니라 반등 실패입니다.</text></svg>