<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="'Retest the July lows' is already here for KOSPI and SK hynix. KOSPI 5,593.56 to 5,550.30; SK hynix KRW 1,322,000 to KRW 1,263,000; Samsung Elec. KRW 207,000 to KRW 213,500. The July low held because a buyer showed up: corporate buybacks absorbed foreign selling into September. That buyer is gone for now: Samsung's program ended early in October and SK hynix's on Oct 21." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="330" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">'Retest the July lows' is already here for KOSPI and SK hynix</text><text x="300" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">July 30 close</text><text x="470" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">Oct 23 close</text><text x="640" y="64" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="600">Distance</text><rect x="12" y="70" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="94" font-size="14" fill="#121821" text-anchor="start" font-weight="700">KOSPI</text><text x="300" y="94" font-size="13" fill="#465160" text-anchor="start" font-weight="400">5,593.56</text><text x="470" y="94" font-size="13" fill="#121821" text-anchor="start" font-weight="600">5,550.30</text><line x1="800" y1="76" x2="800" y2="102" stroke="#6f7a88"/><rect x="785" y="83" width="15" height="14" rx="3" fill="#c2410c"/><text x="640" y="94" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−0.8%</text><rect x="12" y="114" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="138" font-size="14" fill="#121821" text-anchor="start" font-weight="700">SK hynix</text><text x="300" y="138" font-size="13" fill="#465160" text-anchor="start" font-weight="400">KRW 1,322,000</text><text x="470" y="138" font-size="13" fill="#121821" text-anchor="start" font-weight="600">KRW 1,263,000</text><line x1="800" y1="120" x2="800" y2="146" stroke="#6f7a88"/><rect x="711" y="127" width="89" height="14" rx="3" fill="#c2410c"/><text x="640" y="138" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−4.5%</text><rect x="12" y="158" width="936" height="38" rx="6" fill="#f6f8fa"/><text x="28" y="182" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Samsung Elec.</text><text x="300" y="182" font-size="13" fill="#465160" text-anchor="start" font-weight="400">KRW 207,000</text><text x="470" y="182" font-size="13" fill="#121821" text-anchor="start" font-weight="600">KRW 213,500</text><line x1="800" y1="164" x2="800" y2="190" stroke="#6f7a88"/><rect x="800" y="171" width="63" height="14" rx="3" fill="#2e8b57"/><text x="640" y="182" font-size="13" fill="#121821" text-anchor="start" font-weight="700">+3.1%</text><rect x="16" y="222" width="928" height="66" rx="8" fill="#b7791f" fill-opacity="0.08" stroke="#b7791f" stroke-width="1.4"/><text x="32" y="246" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">The July low held because a buyer showed up: corporate buybacks absorbed foreign selling into September.</text><text x="32" y="270" font-size="12.5" fill="#121821" text-anchor="start" font-weight="600">That buyer is gone for now: Samsung's program ended early in October and SK hynix's on Oct 21.</text><text x="24" y="314" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="400">Closes: Naver Finance (KRX final prints). Under S2 the question is not a crash from here but a failed bounce.</text></svg>