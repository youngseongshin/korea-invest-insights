<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514" role="img" aria-labelledby="t d"><title id="t">From delegated agents to memory earnings</title><desc id="d">Six linked steps from delegated agents to always-on compute, cheaper compute, accumulating context, memory with logic, and longer-lasting earnings.</desc><style>text{font:17px Arial,Inter,sans-serif;fill:#22272e}.title{font-size:26px;font-weight:bold}.sub{fill:#59625c;font-size:16px}.b{font-weight:bold}.s{font-size:15px;fill:#59625c}.w{fill:#fffefa;font-weight:bold}.n{font-size:15px}</style><rect width="720" height="514" rx="10" fill="#fffefa"/><text x="26" y="42" class="title">From delegated agents to memory earnings</text><text x="26" y="72" class="sub">Each arrow is a link to verify, not a fact</text><rect x="40" y="96" width="640" height="50" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="121" r="14" fill="#2f7d6b"/><text x="68" y="127" text-anchor="middle" class="w">1</text><text x="96" y="118" class="b">Delegated agents</text><text x="96" y="138" class="s">Users hand over goals, not prompts</text><path d="M360 146v12m-7-6 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="40" y="160" width="640" height="50" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="185" r="14" fill="#2f7d6b"/><text x="68" y="191" text-anchor="middle" class="w">2</text><text x="96" y="182" class="b">Always-on, goal-driven compute</text><text x="96" y="202" class="s">Load = users x goals x time alive</text><path d="M360 210v12m-7-6 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="40" y="224" width="640" height="50" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="249" r="14" fill="#2f7d6b"/><text x="68" y="255" text-anchor="middle" class="w">3</text><text x="96" y="246" class="b">Compute gets cheaper per task</text><text x="96" y="266" class="s">Batch lanes, small models, replayed code</text><path d="M360 274v12m-7-6 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="40" y="288" width="640" height="50" rx="7" fill="#e8efeb" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="313" r="14" fill="#2f7d6b"/><text x="68" y="319" text-anchor="middle" class="w">4</text><text x="96" y="310" class="b">Context and knowledge accumulate</text><text x="96" y="330" class="s">KV cache, logs, memories, skills</text><path d="M360 338v12m-7-6 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="40" y="352" width="640" height="50" rx="7" fill="#e8efeb" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="377" r="14" fill="#2f7d6b"/><text x="68" y="383" text-anchor="middle" class="w">5</text><text x="96" y="374" class="b">Memory and storage absorb logic</text><text x="96" y="394" class="s">Base die, controllers, tiering</text><path d="M360 402v12m-7-6 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="40" y="416" width="640" height="50" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="68" cy="441" r="14" fill="#2f7d6b"/><text x="68" y="447" text-anchor="middle" class="w">6</text><text x="96" y="438" class="b">Earnings last longer</text><text x="96" y="458" class="s">Switching cost, deposits, multi-year contracts</text><text x="26" y="492" class="s">Weakest link: 5 to 6. Demand can grow while the value goes to the logic designer.</text></svg>