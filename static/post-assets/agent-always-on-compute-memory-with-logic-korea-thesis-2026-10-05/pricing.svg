<svg xmlns="http://www.w3.org/2000/svg" width="720" height="394" viewBox="0 0 720 394" role="img" aria-labelledby="t d"><title id="t">One model, priced by urgency and memory</title><desc id="d">Bar chart of Anthropic Opus 5.5 input price multiples: cache read 0.05x, batch 0.5x, standard 1x, fast mode 2x.</desc><style>text{font:17px Arial,Inter,sans-serif;fill:#22272e}.title{font-size:26px;font-weight:bold}.sub{fill:#59625c;font-size:16px}.b{font-weight:bold}.s{font-size:15px;fill:#59625c}.w{fill:#fffefa;font-weight:bold}.n{font-size:15px}</style><rect width="720" height="394" rx="10" fill="#fffefa"/><text x="26" y="42" class="title">One model, priced by urgency and memory</text><text x="26" y="72" class="sub">Anthropic Opus 5.5 input price as a multiple of standard | list price, 5 Oct 2026</text><text x="176" y="129" text-anchor="end" class="b">Cache read</text><rect x="190" y="104" width="11" height="38" rx="5" fill="#2f7d6b"/><text x="211" y="129" class="b">0.05x</text><text x="176" y="187" text-anchor="end" class="b">Batch</text><rect x="190" y="162" width="110" height="38" rx="5" fill="#2f7d6b"/><text x="310" y="187" class="b">0.5x</text><text x="176" y="245" text-anchor="end" class="b">Standard</text><rect x="190" y="220" width="220" height="38" rx="5" fill="#2f7d6b"/><text x="420" y="245" class="b">1x</text><text x="176" y="303" text-anchor="end" class="b">Fast mode</text><rect x="190" y="278" width="440" height="38" rx="5" fill="#2563eb"/><text x="640" y="303" class="b">2x</text><line x1="190" y1="96" x2="190" y2="324" stroke="#59625c" stroke-width="1"/><text x="26" y="352" class="s">Standard input is $4 per million tokens. Recalling stored context costs one twentieth</text><text x="26" y="374" class="s">of computing it again; urgency costs double.</text></svg>