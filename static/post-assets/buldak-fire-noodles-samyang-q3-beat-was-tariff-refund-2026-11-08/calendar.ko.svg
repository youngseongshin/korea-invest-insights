<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="510" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">다음 확인 일정</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">날짜 순서이며 간격은 실제 기간과 다릅니다</text><line x1="150.0" y1="84.0" x2="150.0" y2="420.0" stroke="#c9d0d8" stroke-width="2"/><text x="132.0" y="88.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 9일(월)</text><circle cx="150.0" cy="84.0" r="7" fill="#d9622b" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="88.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">KRX 정규장 반응. 시간외 -3.4%와 비교</text><text x="132.0" y="136.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 9~13일</text><circle cx="150.0" cy="132.0" r="7" fill="#2a6fc9" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="136.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">증권사 실적 리뷰: 목표가, 4Q26·2027 추정, 환급금 금액과 계정</text><text x="132.0" y="184.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 9~25일</text><circle cx="150.0" cy="180.0" r="7" fill="#2a6fc9" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="184.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">미국·국내·런던 투자자 설명회: 가격 인상 시점, 가흥 가동 계획</text><text x="132.0" y="232.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 16일 전후</text><circle cx="150.0" cy="228.0" r="7" fill="#159a6c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="232.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">3Q 분기보고서: 환급금 계정, 외화 손익, 운반비·광고비, 가동률</text><text x="132.0" y="280.0" font-size="12.5" fill="#1721