<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="480" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">4분기에는 소스 한 봉지가 빠집니다</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">분기 영업이익, 억원. 4Q26은 저희의 추정 범위입니다.</text><line x1="60.0" y1="350.0" x2="740.0" y2="350.0" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="354.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0</text><line x1="60.0" y1="288.6" x2="740.0" y2="288.6" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="292.6" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">500</text><line x1="60.0" y1="227.3" x2="740.0" y2="227.3" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="231.3" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">1,000</text><line x1="60.0" y1="165.9" x2="740.0" y2="165.9" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="169.9" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">1,500</text><line x1="60.0" y1="104.5" x2="740.0" y2="104.5" stroke="#e3e7ec" stroke-width="1"/><text x="52.0" y="108.5" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2,000</text><rect x="104.0" y="189.3" width="92.0" height="160.7" fill="#2a6fc9" fill-opacity="0.92" rx="4"/><text x="150.0" y="182.3" font-size="12.5" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">1,3