ght="bold">4Q26E</text><text x="430.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal">공시 1,962</text><text x="24.0" y="422.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2Q26 영업이익은 환급금을 뺀 3Q26과 같습니다(1,762). 4Q26 범위와 중심은 저희의 주관적 추정입니다.</text></svg>