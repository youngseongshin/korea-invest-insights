<text x="24.0" y="484.0" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start">출처: 알파벳 8-K(3Q26), 랩 매출·Epoch·공실률·계약가는 공개 보도와 KII 집계(일부 2차 전재)</text>
