<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="14">
<rect x="0" y="0" width="800" height="540" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="21" font-weight="700" fill="#17212b" text-anchor="start">위험의 주소: 압착은 금융 경로를 타고 2028년 주문에 닿습니다</text>
<text x="24.0" y="58.0" font-size="13.5" font-weight="400" fill="#5b6670" text-anchor="start">2027년 출하는 장기계약·선수금·전력 상한으로 잠겨 있습니다</text>
<rect x="24.0" y="84.0" width="170.0" height="116.0" rx="8" fill="#f6dcd9" stroke="#b8322a" stroke-width="1.5" opacity="1"/>
<text x="109.0" y="114.0" font-size="15" font-weight="700" fill="#b8322a" text-anchor="middle">토큰 단가</text>
<text x="109.0" y="144.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">연 −45~55%</text>
<text x="109.0" y="164.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">저가 티어로 물량 확보</text>
<rect x="220.0" y="84.0" width="170.0" height="116.0" rx="8" fill="#f7ead2" stroke="#b8730a" stroke-width="1.5" opacity="1"/>
<text x="305.0" y="114.0" font-size="15" font-weight="700" fill="#b8730a" text-anchor="middle">랩의 마진</text>
<text x="305.0" y="144.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">연산을 빌려 씀</text>
<text x="305.0" y="164.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">임대료는 버팀</text>
<rect x="416.0" y="84.0" width="170.0" height="116.0" rx="8" fill="#f7ead2" stroke="#b8730a" stroke-width="1.5" opacity="1"/>
<text x="501.0" y="114.0" font-size="15" font-weight="700" fill="#b8730a" text-anchor="middle">랩에 기댄 잔고</text>
<text x="501.0" y="144.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">오라클 선수금</text>
<text x="501.0" y="164.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">MS·오라클 OpenAI 몫</text>
<text x="501.0" y="184.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">네오클라우드</text>
<rect x="612.0" y="84.0" width="164.0" height="116.0" rx="8" fill="#dde7fb" stroke="#2f62d6" stroke-width="1.5" opacity="1"/>
<text x="694.0" y="114.0" font-size="15" font-weight="700" fill="#2f62d6" text-anchor="middle">하이퍼스케일러</text>
<text x="694.0" y="144.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">알파벳 DC 보증 480억$</text>
<text x="694.0" y="164.0" font-size="12.5" font-weight="400" fill="#17212b" text-anchor="middle">메타 잔존가치 415억$</text>
<line x1="196.0" y1="142.0" x2="218.0" y2="142.0" stroke="#17212b" stroke-width="2"/>
<polygon points="218.0,142.0 209.9,145.9 209.9,138.1" fill="#17212b"/>
<line x1="392.0" y1="142.0" x2="414.0" y2="142.0" stroke="#17212b" stroke-width="2"/>
<polygon points="414.0,142.0 405.9,145.9 405.9,138.1" fill="#17212b"/>
<line x1="588.0" y1="142.0" x2="610.0" y2="142.0" stroke="#17212b" stroke-width="2"/>
<polygon points="610.0,142.0 601.9,145.9 601.9,138.1" fill="#17212b"/>
<text x="501.0" y="220.0" font-size="13" font-weight="700" fill="#b8730a" text-anchor="middle">네오클라우드 부분 차질 35%</text>
<text x="694.0" y="220.0" font-size="13" font-weight="700" fill="#2f62d6" text-anchor="middle">조달 차질 15%</text>
<rect x="24.0" y="252.0" width="360.0" height="150.0" rx="8" fill="#eef1f4" stroke="#6b7a88" stroke-width="1.5" opacity="1"/>
<text x="44.0" y="280.0" font-size="17" font-weight="700" fill="#17212b" text-anchor="start">2027년 출하</text>
<text x="44.0" y="304.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">사는 쪽은 하이퍼스케일러</text>
<text x="44.0" y="326.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">LTA·선수금·전력 상한으로 잠김</text>
<text x="44.0" y="360.0" font-size="15" font-weight="700" fill="#6b7a88" text-anchor="start">금융 경로가 깎을 확률 &lt;15%</text>
<text x="44.0" y="384.0" font-size="15" font-weight="700" fill="#6b7a88" text-anchor="start">수요 경로로 이익이 깨질 확률 ≤10%</text>
<rect x="416.0" y="252.0" width="360.0" height="150.0" rx="8" fill="#f6dcd9" stroke="#b8322a" stroke-width="1.5" opacity="1"/>
<text x="436.0" y="280.0" font-size="17" font-weight="700" fill="#b8322a" text-anchor="start">2028년 주문</text>
<text x="436.0" y="304.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">압착이 실제로 닿는 자리</text>
<text x="436.0" y="326.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">2027년 안에 보이는 곳: 랩 마진,</text>
<text x="436.0" y="346.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">오라클·네오클라우드 스프레드</text>
<text x="436.0" y="384.0" font-size="15" font-weight="700" fill="#b8322a" text-anchor="start">메모리 실적에는 2027년에 안 보임</text>
<line x1="694.0" y1="228.0" x2="694.0" y2="250.0" stroke="#b8322a" stroke-width="2.5"/>
<polygon points="694.0,250.0 690.1,241.9 697.9,241.9" fill="#b8322a"/>
<line x1="440.0" y1="228.0" x2="330.0" y2="250.0" stroke="#6b7a88" stroke-width="1.5"/>
<polygon points="330.0,250.0 337.2,244.6 338.7,252.2" fill="#6b7a88"/>
<text x="360.0" y="238.0" font-size="12" font-weight="400" fill="#6b7a88" text-anchor="end" font-style="italic">약함</text>
<rect x="24.0" y="420.0" width="752.0" height="66.0" rx="6" fill="#fff8ec" stroke="#b8730a" stroke-width="1" opacity="1"/>
<text x="44.0" y="446.0" font-size="13.5" font-weight="700" fill="#17212b" text-anchor="start">금리는 2차 변수입니다. +100bp는 하이퍼스케일러 영업현금의 0.28%입니다.</text>
<text x="44.0" y="470.0" font-size="13.5" font-weight="400" fill="#17212b" text-anchor="start">문제는 금리 수준보다 조달 물량입니다. 2027년 필요 조달은 약 2,000억달러입니다.</text>
<text x="24.0" y="524.0" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start">확률은 KII 주관 추정(2026-11-01). 보증 금액은 회사 공시 기준, KII 정리.</text>
</svg>
