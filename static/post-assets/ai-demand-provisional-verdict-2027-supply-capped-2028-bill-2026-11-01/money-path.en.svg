<text x="360.0" y="238.0" font-size="12" font-weight="400" fill="#6b7a88" text-anchor="end" font-style="italic">weak</text>
<rect x="24.0" y="420.0" width="752.0" height="66.0" rx="6" fill="#fff8ec" stroke="#b8730a" stroke-width="1" opacity="1"/>
<text x="44.0" y="446.0" font-size="13.5" font-weight="700" fill="#17212b" text-anchor="start">Rates are second-order. +100bp equals 0.28% of hyperscaler operating cash flow.</text>
<text x="44.0" y="470.0" font-size="13.5" font-weight="400" fill="#17212b" text-anchor="start">The issue is funding volume, not the rate level. 2027 funding need: about $200bn.</text>
<text x="24.0" y="524.0" font-size="12" font-weight="400" fill="#5b6670" text-anchor="start">Probabilities are KII subjective estimates (Nov 1, 2026). Guarantee amounts per company filings, KII summary.</text>
