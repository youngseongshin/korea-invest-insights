<text x="436.0" y="346.0" font-size="13" font-weight="400" fill="#17212b" text-anchor="start">Oracle and neocloud spreads</text>
<text x="436.0" y="384.0" font-size="15" font-weight="700" fill="#b8322a" text-anchor="start">Not in 2027 memory earnings</text>
