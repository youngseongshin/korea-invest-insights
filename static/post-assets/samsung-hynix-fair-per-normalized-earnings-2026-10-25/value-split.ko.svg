<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="적정 PER의 구성. 삼성전자 합계 5.64배 중 2027~28 현금 1.14배, 정상화 이후 가치 4.51배(80%). SK하이닉스 합계 6.54배 중 현금 1.21배, 정상화 이후 가치 5.33배(82%)." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="280" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">적정 PER의 약 80%는 2028년 말 이후 정상화 이익의 가치에서 나옵니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">2027년 EPS 대비 현재가치(배)</text><text x="176" y="108" font-size="13" fill="#465160" text-anchor="end" font-weight="600">삼성전자</text><rect x="190" y="84" width="113.6" height="38" rx="3" fill="#2e8b57"/><text x="246.8" y="108" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1.14</text><rect x="303.6" y="84" width="450.6" height="38" rx="3" fill="#2a78d6"/><text x="528.9000000000001" y="108" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4.51  (말기 가치 80%)</text><text x="764.2" y="108" font-size="13" fill="#121821" text-anchor="start" font-weight="700">합계 5.64배</text><text x="176" y="178" font-size="13" fill="#465160" text-anchor="end" font-weight="600">SK하이닉스</text><rect x="190" y="154" width="120.5" height="38" rx="3" fill="#2e8b57"/><text x="250.25" y="178" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1.21</text><rect x="310.5" y="154" width="533.1" height="38" rx="3" fill="#2a78d6"/><text x="577.05" y="178" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5.33  (말기 가치 82%)</text><text x="853.6" y="178" font-size="13" fill="#121821" text-anchor="start" font-weight="700">합계 6.54배</text><rect x="24" y="224" width="16" height="16" rx="3" fill="#2e8b57"/><text x="46" y="236" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">202