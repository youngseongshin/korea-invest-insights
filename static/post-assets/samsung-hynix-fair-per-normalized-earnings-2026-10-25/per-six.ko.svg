<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="2027년 부근 이익 기준 참고 PER. 삼성전자 3.16배, SK하이닉스 2.81배, Micron 약 4.70배, NVIDIA 약 13.73배, TSMC 약 17.89배, Intel 약 41.17배(의미 제한)." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="372" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">한국 메모리 두 회사의 PER은 Micron의 약 60~67% 수준입니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">2027년 부근 이익 기준 참고 PER(배). 가격은 2026-10-23 정규장 종가</text><text x="218" y="103" font-size="13" fill="#465160" text-anchor="end" font-weight="600">삼성전자</text><rect x="230" y="88" width="39.3" height="24" rx="3" fill="#2a78d6"/><text x="277.32444444444445" y="105" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3.16</text><text x="321.32444444444445" y="105" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">2027년 EPS</text><text x="218" y="143" font-size="13" fill="#465160" text-anchor="end" font-weight="600">SK하이닉스</text><rect x="230" y="128" width="35.0" height="24" rx="3" fill="#2a78d6"/><text x="272.9688888888889" y="145" font-size="13" fill="#121821" text-anchor="start" font-weight="700">2.81</text><text x="316.9688888888889" y="145" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">2027년 EPS</text><text x="218" y="183" font-size="13" fill="#465160" text-anchor="end" font-weight="600">Micron</text><rect x="230" y="168" width="58.5" height="24" rx="3" fill="#6f7a88"/><text x="296.4888888888889" y="185" font-size="13" fill="#121821" text-anchor="start" font-weight="700">4.70</text><text x="340.4888888888889" y="185" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">달력연도 근사</text><text x="218" y="223" font-size="13" fill="#465160" text-anchor="end" font-w