<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="현재 PER과 적정 범위. 삼성전자 현재 3.16배, 적정 5~7배(중앙값 5.64배), 약세 2.21배, 강세 10.22배. SK하이닉스 현재 2.81배, 적정 6~8배(중앙값 6.54배), 약세 1.84배, 강세 11.08배." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="330" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">현재 PER은 적정 범위 아래에 있지만, 약세 스트레스는 그보다 더 아래입니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">2027년 예상 EPS에 적용하는 PER(배)</text><line x1="160.0" y1="78" x2="160.0" y2="226" stroke="#e3e7ec"/><text x="160.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">0배</text><line x1="284.0" y1="78" x2="284.0" y2="226" stroke="#e3e7ec"/><text x="284.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">2배</text><line x1="408.0" y1="78" x2="408.0" y2="226" stroke="#e3e7ec"/><text x="408.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">4배</text><line x1="532.0" y1="78" x2="532.0" y2="226" stroke="#e3e7ec"/><text x="532.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">6배</text><line x1="656.0" y1="78" x2="656.0" y2="226" stroke="#e3e7ec"/><text x="656.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">8배</text><line x1="780.0" y1="78" x2="780.0" y2="226" stroke="#e3e7ec"/><text x="780.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">10배</text><line x1="904.0" y1="78" x2="904.0" y2="226" stroke="#e3e7ec"/><text x="904.0" y="244" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">12배</text><text x="146" y="124" font-size="13" fill="#465160" text-anchor="end" font-weight="600">삼성전자</text><rect x="470.0" y="108" width="124.0" height="24" rx="4" fill="#2a78d6" fill-opacity="0.28" stroke="#2a78d6" stroke-width="1.4"/><text x="532.0" y="124" font-size="12" fill="#121821" text-anchor="middle" font-weight="700">5~7배</text><line x1="509.7" y1="102" x2="509.7" y2="138" stroke="#2a78d6" stroke-width="2.6"/><text x="509.68" y="96" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="700">중앙값 5.64</text><circle cx="355.9" cy="120" r="7" fill="#121821"/><text x="355.92" y="150" font-size="11" fill="#121821" text-anchor="middle" font-weight="700">현재 3.16</text><path d="M297.0,113 L304.0,120 L297.0,127 L290.0,120 Z" fill="#ffffff" stroke="#6250d6" stroke-width="2"/><text x="297.02" y="106" font-size="11" fill="#6250d6" text-anchor="middle" font-weight="700">약세 2.21</text><path d="M793.6,113 L800.6,120 L793.6,127 L786.6,120 Z" fill="#ffffff" stroke="#6250d6" stroke-width="2"/><text x="793.64" y="106" font-size="11" fill="#6250d6" text-anchor="middle" font-weight="700">강세 10.22</text><text x="146" y="200" font-size="13" fill="#465160" text-anchor="end" font-weight="600">SK하이닉스</text><rect x="532.0" y="184" width="124.0" height="24" rx="4" fill="#2a78d6" fill-opacity="0.28" stroke="#2a78d6" stroke-width="1.4"/><text x="594.0" y="200" font-size="12" fill="#121821" text-anchor="middle" font-weight="700">6~8배</text><line x1="565.5" y1="178" x2="565.5" y2="214" stroke="#2a78d6" stroke-width="2.6"/><text x="565.48" y="172" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="700">중앙값 6.54</text><circle cx="334.2" cy="196" r="7" fill="#121821"/><text x="334.22" y="226" font-size="11" fill="#121821" text-anchor="middle" font-weight="700">현재 2.81</text><path d="M274.1,189 L281.1,196 L274.1,203 L267.1,196 Z" fill="#ffffff" stroke="#6250d6" stroke-width="2"/><text x="274.08" y="182" font-size="11" fill="#6250d6" text-anchor="middle" font-weight="700">약세 1.84</text><path d="M847.0,189 L854.0,196 L847.0,203 L840.0,196 Z" fill="#ffffff" stroke="#6250d6" stroke-width="2"/><text x="846.96" y="182" font-