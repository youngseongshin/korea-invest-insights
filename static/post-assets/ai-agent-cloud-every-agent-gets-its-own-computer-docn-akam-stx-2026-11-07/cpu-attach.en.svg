<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="306" fill="#ffffff"/><text x="24" y="26" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Server CPUs needed per 1 million AI chips</text><text x="24" y="44" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Ratio of server CPUs to AI accelerators, before and in the agent era</text><line x1="270" y1="64" x2="270" y2="170" stroke="#17212b"/><text x="260" y="98" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Before: 1 CPU per 8 AI chips</text><rect x="270" y="82" width="100" height="26" fill="#9aa7b5"/><text x="378" y="100" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">125,000</text><text x="260" y="148" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Agent era: 1 CPU per 2 AI chips</text><rect x="270" y="132" width="400" height="26" fill="#2f5fd0"/><text x="678" y="150" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">500,000</text><text x="270" y="192" font-size="13" fill="#b26a00" text-anchor="start" font-weight="bold">+375,000 CPU sockets, about 188,000 two-socket servers</text><line x1="24" y1="210" x2="736" y2="210" stroke="#d5dbe3"/><text x="24" y="232" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Ratios: TrendForce (Apr 14, 2026): today about 1:4 to 1:8, expected 1:1 to 1:2. We use the ends with the fewest CPUs.</text><text x="24" y="248" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Arithmetic ours, assuming 2 CPU sockets per server.</text></svg>