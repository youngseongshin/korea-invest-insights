<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="536" fill="#ffffff"/><text x="24" y="26" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">많이 빠졌다고 싼 것은 아닙니다</text><text x="24" y="44" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">12개월 고점에서 11월 6일 종가까지의 하락률과 간단한 가치 점검</text><text x="24" y="70" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">기업</text><text x="150" y="70" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">12개월 고점 대비 하락</text><text x="520" y="70" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">가치 점검</text><text x="24" y="100" font-size="12" fill="#1b7f4b" text-anchor="start" font-weight="bold">먼저 살펴볼 곳(저희 순서)</text><rect x="16" y="108" width="728" height="144" rx="6" fill="#eef7f1" stroke="#bfe0cc"/><text x="24" y="132" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">디지털오션</text><rect x="150" y="118" width="300" height="20" fill="#b3261e"/><text x="456" y="133" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−60.0%</text><text x="520" y="133" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2027 매출의 4.4배(저희 추정)</text><text x="24" y="166" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">씨게이트</text><rect x="150" y="152" width="290" height="20" fill="#b3261e"/><text x="446" y="167" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−57.9%</text><text x="520" y="167" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">연율 이익 가이던스의 12.5배</text><text x="24" y="200" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">아카마이</text><rect x="150" y="186" width="242" height="20" fill="#b3261e"/><text x="398" y="201" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−48.4%</text><text x="520" y="201" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2026 이익 가이던스의 12.6배</text><text x="24" y="234" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">마이크론</text><rect x="150" y="220" width="216" height="20" fill="#b3261e"/><text x="372" y="235" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−43.1%</text><text x="520" y="235" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">연율 이익 가이던스의 4.5배</text><text x="24" y="278" font-size="12" fill="#b26a00" text-anchor="start" font-weight="bold">같이 빠졌지만 가격이나 다른 위험이 문제인 곳</text><rect x="16" y="286" width="728" height="144" rx="6" fill="#fdf4e3" stroke="#ecd29b"/><text x="24" y="310" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Arm</text><rect x="150" y="296" width="302" height="20" fill="#b3261e"/><text x="458" y="311" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−60.3%</text><text x="520" y="311" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">연율 이익 가이던스의 84배</text><text x="24" y="344" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">인텔</text><rect x="150" y="330" width="300" height="20" fill="#b3261e"/><text x="456" y="345" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−60.1%</text><text x="520" y="345" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">연율 이익 가이던스의 56배</text><text x="24" y="378" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">AMD</text><rect x="150" y="364" width="154" height="20" fill="#b3261e"/><text x="310" y="379" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−30.9%</text><text x="520" y="379" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">약 42배(저희 추정)</text><text x="24" y="412" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">클라우드플레어</text><rect x="150" y="398" width="128" height="20" fill="#b3261e"/><text x="284" y="413" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">−25.5%</text><text x="520" y="413" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">연율 매출의 28배(EV)</text><line x1="24" y1="446" x2="736" y2="446" stroke="#d5dbe3"/><text x="24" y="466" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">종가: 미국 정규장 2026년 11월 6일. 연율 = 회사의 최근 분기 가이던스 x 4이며 컨센서스가 아닙니다.</text><text x="24" y="482" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">디지털오션은 시가총액 기준입니다. AMD는 저희 추정, Arm은 2차 출처, 클라우드플레어는 기업가치(EV) 기준입니다.</text></svg>