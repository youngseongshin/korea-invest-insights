<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="306" fill="#ffffff"/><text x="24" y="26" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">AI 칩 100만 개당 필요한 서버 CPU</text><text x="24" y="44" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">서버 CPU 대 AI 가속기 비율, 이전과 에이전트 시대</text><line x1="270" y1="64" x2="270" y2="170" stroke="#17212b"/><text x="260" y="98" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">이전: AI 칩 8개당 CPU 1개</text><rect x="270" y="82" width="100" height="26" fill="#9aa7b5"/><text x="378" y="100" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">125,000</text><text x="260" y="148" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">에이전트 시대: AI 칩 2개당 CPU 1개</text><rect x="270" y="132" width="400" height="26" fill="#2f5fd0"/><text x="678" y="150" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">500,000</text><text x="270" y="192" font-size="13" fill="#b26a00" text-anchor="start" font-weight="bold">CPU 소켓 +37.5만 개, 2소켓 서버 약 18.8만 대</text><line x1="24" y1="210" x2="736" y2="210" stroke="#d5dbe3"/><text x="24" y="232" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">비율: 트렌드포스(2026년 4월 14일). 현재 약 1:4~1:8, 전망 1:1~1:2이며 CPU가 가장 적은 끝값을 썼습니다.</text><text x="24" y="248" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">계산은 저희 몫이며 서버당 CPU 2개를 가정했습니다.</text></svg>