<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="362" fill="#ffffff"/><text x="24" y="26" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">From one shared app to one sealed computer per job</text><text x="24" y="44" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">How the unit of cloud computing changes with AI agents</text><rect x="24" y="60" width="340" height="246" rx="8" fill="#f4f6f9" stroke="#d5dbe3"/><text x="40" y="84" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Traditional cloud</text><circle cx="58" cy="118" r="6" fill="#9aa7b5"/><circle cx="80" cy="118" r="6" fill="#9aa7b5"/><circle cx="102" cy="118" r="6" fill="#9aa7b5"/><circle cx="58" cy="140" r="6" fill="#9aa7b5"/><circle cx="80" cy="140" r="6" fill="#9aa7b5"/><circle cx="102" cy="140" r="6" fill="#9aa7b5"/><circle cx="58" cy="162" r="6" fill="#9aa7b5"/><circle cx="80" cy="162" r="6" fill="#9aa7b5"/><circle cx="102" cy="162" r="6" fill="#9aa7b5"/><circle cx="58" cy="184" r="6" fill="#9aa7b5"/><circle cx="80" cy="184" r="6" fill="#9aa7b5"/><circle cx="102" cy="184" r="6" fill="#9aa7b5"/><line x1="132" y1="140" x2="176" y2="140" stroke="#5b6774" stroke-width="2"/><polygon points="176,134 188,140 176,146" fill="#5b6774"/><rect x="192" y="104" width="148" height="72" rx="8" fill="#2f5fd0"/><text x="266" y="138" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">One app</text><text x="266" y="158" font-size="11" fill="#dfe8fb" text-anchor="middle" font-weight="normal">millions of users share it</text><text x="40" y="218" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">One program serves millions of people at once</text><line x1="40" y1="236" x2="348" y2="236" stroke="#d5dbe3"/><text x="40" y="262" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Code: written and reviewed by developers</text><text x="40" y="284" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Scarce: server utilization</text><rect x="396" y="60" width="340" height="246" rx="8" fill="#f4f6f9" stroke="#d5dbe3"/><text x="412" y="84" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Agent cloud</text><rect x="412" y="98" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="485" y="119" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 1 · own computer</text><rect x="568" y="98" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="641" y="119" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 2 · own computer</text><rect x="412" y="138" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="485" y="159" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 3 · own computer</text><rect x="568" y="138" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="641" y="159" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 4 · own computer</text><rect x="412" y="178" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="485" y="199" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 5 · own computer</text><rect x="568" y="178" width="146" height="32" rx="6" fill="#eef7f1" stroke="#7fc29b" stroke-width="1.5"/><text x="641" y="199" font-size="12" fill="#1b7f4b" text-anchor="middle" font-weight="bold">Job 6 · own computer</text><text x="412" y="232" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Each job gets a sealed computer, for seconds to days</text><line x1="412" y1="244" x2="720" y2="244" stroke="#d5dbe3"/><text x="412" y="266" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Code: written by a model seconds ago</text><text x="412" y="288" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Scarce: isolation, memory, start-up time</text></svg>