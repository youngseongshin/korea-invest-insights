<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="CoreWeave: 전망 영업이익이 전망 이자비용보다 훨씬 작습니다. 3분기 회사 전망, 백만달러: 조정 영업이익 200 to 260, 이자비용 860 to 940, 중앙값 차이: 약 −670. 2026년 상반기, 백만달러: 영업현금흐름 3,663, 설비·소프트웨어 취득 14,117, 영업현금흐름에서 취득을 뺀 값: −10,454." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">CoreWeave: 전망 영업이익이 전망 이자비용보다 훨씬 작습니다</text><rect x="16" y="52" width="456" height="290" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="78" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3분기 회사 전망, 백만달러</text><text x="32" y="108" font-size="12" fill="#465160" text-anchor="start" font-weight="400">조정 영업이익</text><rect x="32" y="116" width="81.2" height="26" rx="3" fill="#2e8b57" fill-opacity="0.35"/><rect x="32" y="116" width="62.5" height="26" rx="3" fill="#2e8b57"/><text x="121.25" y="135" font-size="13" fill="#121821" text-anchor="start" font-weight="700">200~260</text><text x="32" y="184" font-size="12" fill="#465160" text-anchor="start" font-weight="400">이자비용</text><rect x="32" y="192" width="293.8" height="26" rx="3" fill="#c2410c" fill-opacity="0.35"/><rect x="32" y="192" width="268.8" height="26" rx="3" fill="#c2410c"/><text x="333.75" y="211" font-size="13" fill="#121821" text-anchor="start" font-weight="700">860~940</text><text x="32" y="288" font-size="15" fill="#c2410c" text-anchor="start" font-weight="700">중앙값 차이: 약 −670</text><rect x="488" y="52" width="456" height="290" rx="8" fill="#eb6834" fill-opacity="0.03" stroke="#eb6834" stroke-width="1.4"/><text x="504" y="78" font-size="13" fill="#121821" text-anchor="start" font-weight="700">2026년 상반기, 백만달러</text><text x="504" y="108" font-size="12" fill="#465160" text-anchor="start" font-weight="400">영업현금흐름</text><rect x="504" y="116" width="73.3" height="26" rx="3" fill="#2e8b57"/><text x="585.26" y="135" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3,663</text><text x="504" y="184" font-size="12" fill="#465160" text-anchor="start" font-weight="400">설비·소프트웨어 취득</text><rect x="504" y="192" width="282.3" height="26" rx="3" fill="#c2410c"/><text x="794.34" y="211" font-size="13" fill="#121821" text-anchor="start" font-weight="700">14,117</text><text x="504" y="288" font-size="15" fill="#c2410c" text-anchor="start" font-weight="700">영업현금흐름에서 취득을 뺀 값: −10,454</text><text x="24" y="374" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">회사 전망과 10-Q 수치입니다. 서로 다른 두 지표를 비교해 규모를 보인 것이며 순이익 예측이 아닙니다. 3분기 설비투자 전망은</text><text x="24" y="389" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">115억~135억달러입니다.</text></svg>