<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="두 회사 모두 높은 기대치에서 출발합니다. 직전 공시 분기 매출과 공개 집계가 예상하는 다음 분기 매출, 백만달러. IREN: 총매출: 직전 공시 분기(6월 분기) 137.2, 예상, 9월 분기 221 to 230. Nebius: 그룹 매출: 직전 공시 분기(6월 분기) 582.3, 예상, 9월 분기 905.7." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="390" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">두 회사 모두 높은 기대치에서 출발합니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">직전 공시 분기 매출과 공개 집계가 예상하는 다음 분기 매출, 백만달러</text><rect x="16" y="76" width="456" height="250" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="102" font-size="13" fill="#121821" text-anchor="start" font-weight="700">IREN: 총매출</text><text x="32" y="134" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">직전 공시 분기(6월 분기)</text><rect x="32" y="142" width="171.5" height="26" rx="3" fill="#6f7a88"/><text x="211.5" y="161" font-size="13" fill="#121821" text-anchor="start" font-weight="700">137.2</text><text x="32" y="204" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">예상, 9월 분기</text><rect x="32" y="212" width="288.1" height="26" rx="3" fill="#2a78d6"/><line x1="308.6" y1="212" x2="308.6" y2="238" stroke="#ffffff" stroke-width="2"/><text x="328.125" y="231" font-size="13" fill="#121821" text-anchor="start" font-weight="700">221~230</text><text x="32" y="276" font-size="12" fill="#465160" text-anchor="start" font-weight="400">+61~68%. 채굴과 8월 인수한 Mirantis</text><text x="32" y="292" font-size="12" fill="#465160" text-anchor="start" font-weight="400">효과가 섞입니다.</text><rect x="488" y="76" width="456" height="250" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="504" y="102" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Nebius: 그룹 매출</text><text x="504" y="134" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">직전 공시 분기(6월 분기)</text><rect x="504" y="142" width="185.8" height="26" rx="3" fill="#6f7a88"/><text x="697.8404255319149" y="161" font-size="13" fill="#121821" text-anchor="start" font-weight="700">582.3</text><text x="504" y="204" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">예상, 9월 분기</text><rect x="504" y="212" width="289.1" height="26" rx="3" fill="#2a78d6"/><text x="801.0531914893618" y="231" font-size="13" fill="#121821" text-anchor="start" font-weight="700">905.7</text><text x="504" y="276" font-size="12" fill="#465160" text-anchor="start" font-weight="400">한 분기에 +55.5%, 공개 집계 기준입니다.</text><text x="24" y="364" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">예상치는 공개 집계(Moomoo의 S&amp;P 추정, IREN 높은 값은 Investing.com)이며 회사 전망이 아닙니다. IREN은 한국시간</text><text x="24" y="379" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">11월 6일 07시에 발표하고, Nebius는 날짜를 확정하지 않았습니다.</text></svg>