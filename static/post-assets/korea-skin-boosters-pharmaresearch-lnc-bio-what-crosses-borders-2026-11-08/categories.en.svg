<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 461" width="760" height="461" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="Each material takes its own legal route in Korea. What each skin-booster material does, how Korea regulates it, and where it stands abroad."><rect x="-20" y="-20" width="800" height="501" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Each material takes its own legal route in Korea</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">What each skin-booster material does, how Korea regulates it, and where it stands abroad</text><rect x="20.0" y="72.0" width="720.0" height="26.0" fill="#f3f5f8" rx="4"/><text x="30.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Material</text><text x="182.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">What it does</text><text x="322.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Route in Korea</text><text x="458.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Korean examples</text><text x="606.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Abroad</text><rect x="20.0" y="102.0" width="5.0" height="70.0" fill="#6250d6" rx="2"/><text x="34.0" y="120.0" font-size="12" fill="#6250d6" text-anchor="start" font-weight="bold">PN (polynucleotide)</text><text x="182.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Long DNA fragments</text><text x="182.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">from salmon; a repair</text><text x="182.0" y="150.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">signal to skin cells</text><text x="322.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Class 4 medical</text><text x="322.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">device (tissue-repair</text><text x="322.0" y="150.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">biomaterial)</text><text x="458.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Rejuran</text><text x="458.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(PharmaResearch),</text><text x="458.0" y="150.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Vitaran (BR Pharm)</text><text x="606.0" y="120.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">EU: class III device.</text><text x="606.0" y="135.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">US: no approved PN</text><text x="606.0" y="150.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">injectable. China:</text><text x="606.0" y="165.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">Rejuran class II only</text><line x1="20.0" y1="174.0" x2="740.0" y2="174.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="176.0" width="5.0" height="55.0" fill="#2a6fc9" rx="2"/><text x="34.0" y="194.0" font-size="12" fill="#2a6fc9" text-anchor="start" font-weight="bold">PLLA / PDLLA</text><text x="182.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Dissolving particles</text><text x="182.0" y="209.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">that prompt new</text><text x="182.0" y="224.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">collagen</text><text x="322.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Class 4 medical</text><text x="322.0" y="209.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">device</text><text x="458.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Juvelook (Vaim)</text><text x="606.0" y="194.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">Juvelook won China</text><text x="606.0" y="209.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">class III in July 2026</text><line x1="20.0" y1="233.0" x2="740.0" y2="233.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="235.0" width="5.0" height="55.0" fill="#138a9e" rx="2"/><text x="34.0" y="253.0" font-size="12" fill="#138a9e" text-anchor="start" font-weight="bold">Hyaluronic acid blends</text><text x="182.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Holds water;</text><text x="182.0" y="268.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">hydration</text><text x="322.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Class 4 medical</text><text x="322.0" y="268.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">device</text><text x="458.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Byryzn (Hugel),</text><text x="458.0" y="268.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Inhilo Plus</text><text x="458.0" y="283.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(Dongkook licence)</text><text x="606.0" y="253.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">Crowded, with</text><text x="606.0" y="268.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">many global brands</text><line x1="20.0" y1="292.0" x2="740.0" y2="292.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="294.0" width="5.0" height="70.0" fill="#d9622b" rx="2"/><text x="34.0" y="312.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">Human-tissue ECM</text><text x="182.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Collagen scaffold</text><text x="182.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">from donated skin,</text><text x="182.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">cells removed</text><text x="322.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Human tissue law;</text><text x="322.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">no product-level</text><text x="322.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">approval (~100 items)</text><text x="458.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Re2O (L&amp;C Bio),</text><text x="458.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">CellREDM (Hans</text><text x="458.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Biomed / Hugel)</text><text x="606.0" y="312.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">US: tissue route</text><text x="606.0" y="327.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">(partner's view).</text><text x="606.0" y="342.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">China: device version</text><text x="606.0" y="357.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">needed, 3+ years</text><line x1="20.0" y1="366.0" x2="740.0" y2="366.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="368.0" width="5.0" height="55.0" fill="#9aa3ad" rx="2"/><text x="34.0" y="386.0" font-size="12" fill="#9aa3ad" text-anchor="start" font-weight="bold">Exosomes</text><text x="182.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Cell-derived</text><text x="182.0" y="401.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">vesicles; signaling</text><text x="322.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">No injectable</text><text x="322.0" y="401.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">approval; sold</text><text x="322.0" y="416.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">as cosmetics</text><text x="458.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Topical only</text><text x="606.0" y="386.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">Not an approved</text><text x="606.0" y="401.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">injectable here</text><line x1="20.0" y1="425.0" x2="740.0" y2="425.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="447.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">Sources: MFDS and company releases as reported in the Korean press; National Assembly audit, October 13, 2026. PDRN, a shorter DNA fragment, is regulated as a drug.</text></svg>