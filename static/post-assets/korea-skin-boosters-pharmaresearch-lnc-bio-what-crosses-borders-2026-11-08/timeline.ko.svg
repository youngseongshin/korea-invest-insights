<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="한국 시장의 이동: 허가 주사제 하나에서 관광객으로, 다시 붐비는 시장으로. 주요 사건, 2014년~2026년 11월. 2014: 리쥬란(PN) 의료기기로 출시; 2017: 리쥬란 유럽 CE 인증; 2023: 경쟁 PN 기기 출시(비타란); 2024 말: 리쥬란 유럽 MDR 인증; 2025.2: 엘앤씨바이오 리투오(인체조직 ECM) 출시; 2025.9: 한스바이오메드 셀르디엠 출시(ECM 경쟁); 2025.12.31: 외국인 미용시술 부가세 환급 종료; 2026.3: 리쥬란 화장품 미국 세포라 입점; 2026.7: 쥬베룩(PDLLA) 중국 3등급 허가, 휴젤 셀르디엠 판매; 2026.10: 국감: 품목허가 없는 ECM 약 100종, 리투오 미국 계약; 2026.11.4: 자이쥬란(PN+히알루론산) 출시"><rect x="-20" y="-20" width="800" height="492" fill="#ffffff"/><text x="24.0" y="30.0" font-size="14.5" fill="#17212b" text-anchor="start" font-weight="bold">한국 시장의 이동: 허가 주사제 하나에서 관광객으로, 다시 붐비는 시장으로</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">주요 사건, 2014년~2026년 11월</text><rect x="24.0" y="76.0" width="232.0" height="40.0" fill="#6250d6" rx="6" fill-opacity="0.1"/><text x="34.0" y="92.0" font-size="11" fill="#6250d6" text-anchor="start" font-weight="bold">2014~2022</text><text x="34.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">허가 PN 주사제 하나</text><rect x="264.0" y="76.0" width="232.0" height="40.0" fill="#2a6fc9" rx="6" fill-opacity="0.1"/><text x="274.0" y="92.0" font-size="11" fill="#2a6fc9" text-anchor="start" font-weight="bold">2023~2025</text><text x="274.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">경쟁사·관광객·수출</text><rect x="504.0" y="76.0" width="232.0" height="40.0" fill="#d9622b" rx="6" fill-opacity="0.1"/><text x="514.0" y="92.0" font-size="11" fill="#d9622b" text-anchor="start" font-weight="bold">2025~2026</text><text x="514.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">새 소재, 규제가 따라옴</text><line x1="132.0" y1="136.0" x2="132.0" y2="414.0" stroke="#e3e7ec" stroke-width="2"/><circle cx="132.0" cy="142.0" r="5" fill="#6250d6"/><text x="118.0" y="146.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2014</text><text x="148.0" y="146.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란(PN) 의료기기로 출시</text><circle cx="132.0" cy="168.0" r="5" fill="#6250d6"/><text x="118.0" y="172.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2017</text><text x="148.0" y="172.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 유럽 CE 인증</text><circle cx="132.0" cy="194.0" r="5" fill="#9aa3ad"/><text x="118.0" y="198.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2023</text><text x="148.0" y="198.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">경쟁 PN 기기 출시(비타란)</text><circle cx="132.0" cy="220.0" r="5" fill="#6250d6"/><text x="118.0" y="224.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2024 말</text><text x="148.0" y="224.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 유럽 MDR 인증</text><circle cx="132.0" cy="246.0" r="5" fill="#d9622b"/><text x="118.0" y="250.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2025.2</text><text x="148.0" y="250.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">엘앤씨바이오 리투오(인체조직 ECM) 출시</text><circle cx="132.0" cy="272.0" r="5" fill="#9aa3ad"/><text x="118.0" y="276.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2025.9</text><text x="148.0" y="276.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">한스바이오메드 셀르디엠 출시(ECM 경쟁)</text><circle cx="132.0" cy="298.0" r="5" fill="#c0392b"/><text x="118.0" y="302.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2025.12.31</text><text x="148.0" y="302.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">외국인 미용시술 부가세 환급 종료</text><circle cx="132.0" cy="324.0" r="5" fill="#6250d6"/><text x="118.0" y="328.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2026.3</text><text x="148.0" y="328.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 화장품 미국 세포라 입점</text><circle cx="132.0" cy="350.0" r="5" fill="#9aa3ad"/><text x="118.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2026.7</text><text x="148.0" y="354.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">쥬베룩(PDLLA) 중국 3등급 허가, 휴젤 셀르디엠 판매</text><circle cx="132.0" cy="376.0" r="5" fill="#d9622b"/><text x="118.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2026.10</text><text x="148.0" y="380.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">국감: 품목허가 없는 ECM 약 100종, 리투오 미국 계약</text><circle cx="132.0" cy="402.0" r="5" fill="#6250d6"/><text x="118.0" y="406.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2026.11.4</text><text x="148.0" y="406.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">자이쥬란(PN+히알루론산) 출시</text><text x="24.0" y="440.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">자료: DART 공시, 언론이 전한 회사 발표와 2026년 10월 13일 국정감사.</text></svg>