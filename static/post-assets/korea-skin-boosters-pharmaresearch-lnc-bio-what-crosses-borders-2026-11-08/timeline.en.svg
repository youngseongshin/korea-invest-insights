<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="How the Korean market moved: one approved injectable, then tourists, then a crowded field. Selected events, 2014 to November 2026. 2014: Rejuran (PN) launches as a medical device; 2017: Rejuran gets a CE mark in Europe; 2023: Rival PN devices arrive (Vitaran); Late 2024: Rejuran gets EU MDR certification; Feb 2025: L&amp;C Bio launches Re2O, human-tissue ECM; Sep 2025: Hans Biomed launches CellREDM, an ECM rival; Dec 31, 2025: Tourist VAT refund on cosmetic procedures ends; Mar 2026: Rejuran cosmetics enter Sephora in the U.S.; Jul 2026: Juvelook (PDLLA) wins China class III; Hugel sells CellREDM; Oct 2026: Assembly audit: ~100 unapproved ECM items; L&amp;C Bio U.S. deal; Nov 4, 2026: Xyjuran (PN + hyaluronic acid) launches"><rect x="-20" y="-20" width="800" height="492" fill="#ffffff"/><text x="24.0" y="30.0" font-size="14.5" fill="#17212b" text-anchor="start" font-weight="bold">How the Korean market moved: one approved injectable, then tourists, then a crowded field</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Selected events, 2014 to November 2026</text><rect x="24.0" y="76.0" width="232.0" height="40.0" fill="#6250d6" rx="6" fill-opacity="0.1"/><text x="34.0" y="92.0" font-size="11" fill="#6250d6" text-anchor="start" font-weight="bold">2014–2022</text><text x="34.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">One approved PN injectable</text><rect x="264.0" y="76.0" width="232.0" height="40.0" fill="#2a6fc9" rx="6" fill-opacity="0.1"/><text x="274.0" y="92.0" font-size="11" fill="#2a6fc9" text-anchor="start" font-weight="bold">2023–2025</text><text x="274.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rivals, tourists, exports</text><rect x="504.0" y="76.0" width="232.0" height="40.0" fill="#d9622b" rx="6" fill-opacity="0.1"/><text x="514.0" y="92.0" font-size="11" fill="#d9622b" text-anchor="start" font-weight="bold">2025–2026</text><text x="514.0" y="108.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">New materials; rules catch up</text><line x1="132.0" y1="136.0" x2="132.0" y2="414.0" stroke="#e3e7ec" stroke-width="2"/><circle cx="132.0" cy="142.0" r="5" fill="#6250d6"/><text x="118.0" y="146.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2014</text><text x="148.0" y="146.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rejuran (PN) launches as a medical device</text><circle cx="132.0" cy="168.0" r="5" fill="#6250d6"/><text x="118.0" y="172.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2017</text><text x="148.0" y="172.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rejuran gets a CE mark in Europe</text><circle cx="132.0" cy="194.0" r="5" fill="#9aa3ad"/><text x="118.0" y="198.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">2023</text><text x="148.0" y="198.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rival PN devices arrive (Vitaran)</text><circle cx="132.0" cy="220.0" r="5" fill="#6250d6"/><text x="118.0" y="224.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Late 2024</text><text x="148.0" y="224.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rejuran gets EU MDR certification</text><circle cx="132.0" cy="246.0" r="5" fill="#d9622b"/><text x="118.0" y="250.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Feb 2025</text><text x="148.0" y="250.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">L&amp;C Bio launches Re2O, human-tissue ECM</text><circle cx="132.0" cy="272.0" r="5" fill="#9aa3ad"/><text x="118.0" y="276.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Sep 2025</text><text x="148.0" y="276.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Hans Biomed launches CellREDM, an ECM rival</text><circle cx="132.0" cy="298.0" r="5" fill="#c0392b"/><text x="118.0" y="302.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Dec 31, 2025</text><text x="148.0" y="302.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Tourist VAT refund on cosmetic procedures ends</text><circle cx="132.0" cy="324.0" r="5" fill="#6250d6"/><text x="118.0" y="328.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Mar 2026</text><text x="148.0" y="328.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Rejuran cosmetics enter Sephora in the U.S.</text><circle cx="132.0" cy="350.0" r="5" fill="#9aa3ad"/><text x="118.0" y="354.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Jul 2026</text><text x="148.0" y="354.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Juvelook (PDLLA) wins China class III; Hugel sells CellREDM</text><circle cx="132.0" cy="376.0" r="5" fill="#d9622b"/><text x="118.0" y="380.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Oct 2026</text><text x="148.0" y="380.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Assembly audit: ~100 unapproved ECM items; L&amp;C Bio U.S. deal</text><circle cx="132.0" cy="402.0" r="5" fill="#6250d6"/><text x="118.0" y="406.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="bold">Nov 4, 2026</text><text x="148.0" y="406.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Xyjuran (PN + hyaluronic acid) launches</text><text x="24.0" y="440.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">Sources: DART filings; company releases and the October 13, 2026 audit as reported.</text></svg>