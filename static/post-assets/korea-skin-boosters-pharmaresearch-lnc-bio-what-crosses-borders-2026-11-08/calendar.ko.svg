<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="다음에 확인할 것. 11/12: 엘앤씨바이오 무상 신주 3,044만 주 상장, 주식 수 6,111만 주로 두 배; 11/14까지: 3분기 보고서: 파마리서치 영업외 손실 185억원의 원인, 엘앤씨바이오 3분기 실적; 10~12월: 엘앤씨바이오 3·4공장 가동 예정(미확인), 리투오 성장의 상한은 생산능력; 2026년 말까지: 식약처 인체조직 미용 제품 정책연구, 엘앤씨바이오 중국법인 영업권 평가; 2027년: 리투오 미국 공급 시작(최소 720만 달러), 부가세 환급 재도입 법안 국회 계류; 2028년경: 리쥬란 중국 3등급 허가(증권가 전망), 파마리서치 증설"><rect x="-20" y="-20" width="800" height="424" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">다음에 확인할 것</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">위 숫자를 바꿀 수 있는 날짜별 사건</text><rect x="24.0" y="78.0" width="712.0" height="38.0" fill="#d9622b" rx="6" fill-opacity="0.07"/><rect x="24.0" y="78.0" width="4.0" height="38.0" fill="#d9622b" rx="2"/><text x="38.0" y="102.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">11/12</text><text x="150.0" y="102.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">엘앤씨바이오 무상 신주 3,044만 주 상장, 주식 수 6,111만 주로 두 배</text><rect x="24.0" y="124.0" width="712.0" height="38.0" fill="#17212b" rx="6" fill-opacity="0.07"/><rect x="24.0" y="124.0" width="4.0" height="38.0" fill="#17212b" rx="2"/><text x="38.0" y="148.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">11/14까지</text><text x="150.0" y="148.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">3분기 보고서: 파마리서치 영업외 손실 185억원의 원인, 엘앤씨바이오 3분기 실적</text><rect x="24.0" y="170.0" width="712.0" height="38.0" fill="#d9622b" rx="6" fill-opacity="0.07"/><rect x="24.0" y="170.0" width="4.0" height="38.0" fill="#d9622b" rx="2"/><text x="38.0" y="194.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">10~12월</text><text x="150.0" y="194.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">엘앤씨바이오 3·4공장 가동 예정(미확인), 리투오 성장의 상한은 생산능력</text><rect x="24.0" y="216.0" width="712.0" height="38.0" fill="#c0392b" rx="6" fill-opacity="0.07"/><rect x="24.0" y="216.0" width="4.0" height="38.0" fill="#c0392b" rx="2"/><text x="38.0" y="240.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">2026년 말까지</text><text x="150.0" y="240.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">식약처 인체조직 미용 제품 정책연구, 엘앤씨바이오 중국법인 영업권 평가</text><rect x="24.0" y="262.0" width="712.0" height="38.0" fill="#d9622b" rx="6" fill-opacity="0.07"/><rect x="24.0" y="262.0" width="4.0" height="38.0" fill="#d9622b" rx="2"/><text x="38.0" y="286.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">2027년</text><text x="150.0" y="286.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리투오 미국 공급 시작(최소 720만 달러), 부가세 환급 재도입 법안 국회 계류</text><rect x="24.0" y="308.0" width="712.0" height="38.0" fill="#6250d6" rx="6" fill-opacity="0.07"/><rect x="24.0" y="308.0" width="4.0" height="38.0" fill="#6250d6" rx="2"/><text x="38.0" y="332.0" font-size="12" fill="#6250d6" text-anchor="start" font-weight="bold">2028년경</text><text x="150.0" y="332.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 중국 3등급 허가(증권가 전망), 파마리서치 증설</text><text x="24.0" y="370.0" font-size="10.2" fill="#5b6774" text-anchor="start" font-weight="normal">엘앤씨바이오 증권신고서는 2026년 말 쿤산 법인 영업권의 추가 손상 가능성이 높다고 적었습니다. 손상은 비현금입니다.</text></svg>