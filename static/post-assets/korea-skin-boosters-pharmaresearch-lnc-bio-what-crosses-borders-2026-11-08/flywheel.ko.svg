<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="한국이 앞선 이유: 규제기관에서 매장 진열대까지 이어지는 순환. 각 단계가 다음 단계를 키웁니다. 지금 성장이 어디로 옮겨 가는지도 이 순환으로 보입니다."><rect x="-20" y="-20" width="800" height="516" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">한국이 앞선 이유: 규제기관에서 매장 진열대까지 이어지는 순환</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">각 단계가 다음 단계를 키웁니다. 지금 성장이 어디로 옮겨 가는지도 이 순환으로 보입니다</text><line x1="485.6" y1="160.0" x2="510.9" y2="171.5" stroke="#9aa3ad" stroke-width="2"/><polygon points="516.4,174.0 509.4,165.3 505.2,174.4" fill="#9aa3ad"/><line x1="596.0" y1="270.0" x2="558.8" y2="338.7" stroke="#9aa3ad" stroke-width="2"/><polygon points="556.0,344.0 565.1,337.6 556.3,332.8" fill="#9aa3ad"/><line x1="424.0" y1="392.0" x2="342.0" y2="392.0" stroke="#9aa3ad" stroke-width="2"/><polygon points="336.0,392.0 346.0,397.0 346.0,387.0" fill="#9aa3ad"/><line x1="204.0" y1="344.0" x2="166.8" y2="275.3" stroke="#9aa3ad" stroke-width="2"/><polygon points="164.0,270.0 164.3,281.2 173.1,276.4" fill="#9aa3ad"/><line x1="243.6" y1="174.0" x2="268.9" y2="162.5" stroke="#9aa3ad" stroke-width="2"/><polygon points="274.4,160.0 263.2,159.6 267.4,168.7" fill="#9aa3ad"/><rect x="282.0" y="72.0" width="196.0" height="80.0" fill="#ffffff" rx="8" stroke="#6250d6" stroke-width="1.6"/><rect x="282.0" y="72.0" width="196.0" height="22.0" fill="#6250d6" rx="8" fill-opacity="0.12"/><text x="292.0" y="88.0" font-size="12" fill="#6250d6" text-anchor="start" font-weight="bold">1  허가</text><text x="292.0" y="110.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">PN은 의료기기로 진입,</text><text x="292.0" y="124.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">인체조직 제품은</text><text x="292.0" y="138.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">품목허가가 필요 없음</text><rect x="524.0" y="182.0" width="196.0" height="80.0" fill="#ffffff" rx="8" stroke="#2a6fc9" stroke-width="1.6"/><rect x="524.0" y="182.0" width="196.0" height="22.0" fill="#2a6fc9" rx="8" fill-opacity="0.12"/><text x="534.0" y="198.0" font-size="12" fill="#2a6fc9" text-anchor="start" font-weight="bold">2  병원 물량</text><text x="534.0" y="220.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">촘촘하고 경쟁적인 병원,</text><text x="534.0" y="234.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 1회 시술</text><text x="534.0" y="248.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">약 18만원부터(표시가)</text><rect x="432.0" y="352.0" width="196.0" height="80.0" fill="#ffffff" rx="8" stroke="#d9622b" stroke-width="1.6"/><rect x="432.0" y="352.0" width="196.0" height="22.0" fill="#d9622b" rx="8" fill-opacity="0.12"/><text x="442.0" y="368.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">3  외국인 환자</text><text x="442.0" y="390.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">2025년 외국인</text><text x="442.0" y="404.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">피부과 환자</text><text x="442.0" y="418.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">131만 명</text><rect x="132.0" y="352.0" width="196.0" height="80.0" fill="#ffffff" rx="8" stroke="#138a9e" stroke-width="1.6"/><rect x="132.0" y="352.0" width="196.0" height="22.0" fill="#138a9e" rx="8" fill-opacity="0.12"/><text x="142.0" y="368.0" font-size="12" fill="#138a9e" text-anchor="start" font-weight="bold">4  유통</text><text x="142.0" y="390.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">올리브영·세포라가</text><text x="142.0" y="404.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">성분을 화장품으로</text><text x="142.0" y="418.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">바꿉니다</text><rect x="40.0" y="182.0" width="196.0" height="80.0" fill="#ffffff" rx="8" stroke="#159a6c" stroke-width="1.6"/><rect x="40.0" y="182.0" width="196.0" height="22.0" fill="#159a6c" rx="8" fill-opacity="0.12"/><text x="50.0" y="198.0" font-size="12" fill="#159a6c" text-anchor="start" font-weight="bold">5  수출</text><text x="50.0" y="220.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란 허가국</text><text x="50.0" y="234.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">52개국</text><text x="50.0" y="248.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(회사 집계)</text><text x="380.0" y="264.0" font-size="12.5" fill="#5b6774" text-anchor="middle" font-weight="bold">브랜드가 환자와</text><text x="380.0" y="282.0" font-size="12.5" fill="#5b6774" text-anchor="middle" font-weight="bold">함께 고국으로 갑니다</text><text x="24.0" y="464.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">자료: 보건복지부(2026년 4월 24일), 언론이 전한 회사 발표. 병원 표시 가격은 병원마다 차이가 큽니다.</text></svg>