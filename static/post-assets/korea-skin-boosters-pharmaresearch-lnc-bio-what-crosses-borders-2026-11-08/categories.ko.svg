<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="소재마다 한국의 법적 경로가 다릅니다. 스킨부스터 소재별 작용, 한국의 규제 경로, 해외 위치."><rect x="-20" y="-20" width="800" height="486" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">소재마다 한국의 법적 경로가 다릅니다</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">스킨부스터 소재별 작용, 한국의 규제 경로, 해외 위치</text><rect x="20.0" y="72.0" width="720.0" height="26.0" fill="#f3f5f8" rx="4"/><text x="30.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">소재</text><text x="182.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">작용</text><text x="322.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">한국 경로</text><text x="458.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">국내 제품 예</text><text x="606.0" y="89.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">해외</text><rect x="20.0" y="102.0" width="5.0" height="70.0" fill="#6250d6" rx="2"/><text x="34.0" y="120.0" font-size="12" fill="#6250d6" text-anchor="start" font-weight="bold">PN(폴리뉴클레오티드)</text><text x="182.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">연어 DNA의 긴</text><text x="182.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">조각, 피부 세포에</text><text x="182.0" y="150.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">회복 신호</text><text x="322.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">4등급 의료기기</text><text x="322.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(조직수복용</text><text x="322.0" y="150.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">생체재료)</text><text x="458.0" y="120.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">리쥬란(파마리서치),</text><text x="458.0" y="135.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">비타란(비알팜)</text><text x="606.0" y="120.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">유럽: 3등급 기기.</text><text x="606.0" y="135.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">미국: 허가된 PN</text><text x="606.0" y="150.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">주사제 없음. 중국:</text><text x="606.0" y="165.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">리쥬란 2등급만</text><line x1="20.0" y1="174.0" x2="740.0" y2="174.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="176.0" width="5.0" height="55.0" fill="#2a6fc9" rx="2"/><text x="34.0" y="194.0" font-size="12" fill="#2a6fc9" text-anchor="start" font-weight="bold">PLLA / PDLLA</text><text x="182.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">녹으면서 콜라겐</text><text x="182.0" y="209.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">생성을 유도하는</text><text x="182.0" y="224.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">입자</text><text x="322.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">4등급 의료기기</text><text x="458.0" y="194.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">쥬베룩(바임)</text><text x="606.0" y="194.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">쥬베룩, 2026년 7월</text><text x="606.0" y="209.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">중국 3등급 허가</text><line x1="20.0" y1="233.0" x2="740.0" y2="233.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="235.0" width="5.0" height="55.0" fill="#138a9e" rx="2"/><text x="34.0" y="253.0" font-size="12" fill="#138a9e" text-anchor="start" font-weight="bold">히알루론산 복합</text><text x="182.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">수분을 붙잡아</text><text x="182.0" y="268.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">보습</text><text x="322.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">4등급 의료기기</text><text x="458.0" y="253.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">바이리즌(휴젤),</text><text x="458.0" y="268.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">인힐로 플러스</text><text x="458.0" y="283.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(동국제약 판권)</text><text x="606.0" y="253.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">세계 브랜드가</text><text x="606.0" y="268.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">많은 시장</text><line x1="20.0" y1="292.0" x2="740.0" y2="292.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="294.0" width="5.0" height="70.0" fill="#d9622b" rx="2"/><text x="34.0" y="312.0" font-size="12" fill="#d9622b" text-anchor="start" font-weight="bold">인체조직 ECM</text><text x="182.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">기증 피부에서</text><text x="182.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">세포를 없앤</text><text x="182.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">콜라겐 지지체</text><text x="322.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">인체조직법,</text><text x="322.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">품목허가 없음</text><text x="322.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">(약 100종)</text><text x="458.0" y="312.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">리투오(엘앤씨바이오),</text><text x="458.0" y="327.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">셀르디엠(한스바이오</text><text x="458.0" y="342.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">메드·휴젤)</text><text x="606.0" y="312.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">미국: 조직 경로</text><text x="606.0" y="327.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">(파트너 판단).</text><text x="606.0" y="342.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">중국: 기기 버전</text><text x="606.0" y="357.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">필요, 3년 이상</text><line x1="20.0" y1="366.0" x2="740.0" y2="366.0" stroke="#e3e7ec" stroke-width="1"/><rect x="20.0" y="368.0" width="5.0" height="40.0" fill="#9aa3ad" rx="2"/><text x="34.0" y="386.0" font-size="12" fill="#9aa3ad" text-anchor="start" font-weight="bold">엑소좀</text><text x="182.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">세포 유래 소포,</text><text x="182.0" y="401.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">신호 전달</text><text x="322.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">주사 허가 없음,</text><text x="322.0" y="401.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">화장품으로 유통</text><text x="458.0" y="386.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">바르는 제품</text><text x="606.0" y="386.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">허가된 주사제</text><text x="606.0" y="401.0" font-size="11.2" fill="#5b6774" text-anchor="start" font-weight="normal">아님</text><line x1="20.0" y1="410.0" x2="740.0" y2="410.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="432.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">자료: 언론이 전한 식약처·회사 발표, 2026년 10월 13일 국정감사. 짧은 DNA 조각인 PDRN은 의약품으로 관리됩니다.</text></svg>