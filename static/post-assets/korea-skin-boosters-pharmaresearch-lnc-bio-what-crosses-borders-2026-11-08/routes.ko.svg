<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="국경을 넘는 순서: 화장품이 먼저, PN 주사제가 다음, 인체조직이 마지막. 2026년 11월 지역별 상태. 초록: 판매 중. 노랑: 일부·초기. 빨강: 불가·미착수."><rect x="-20" y="-20" width="800" height="420" fill="#ffffff"/><text x="24.0" y="30.0" font-size="14.5" fill="#17212b" text-anchor="start" font-weight="bold">국경을 넘는 순서: 화장품이 먼저, PN 주사제가 다음, 인체조직이 마지막</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">2026년 11월 지역별 상태. 초록: 판매 중. 노랑: 일부·초기. 빨강: 불가·미착수</text><rect x="20.0" y="70.0" width="720.0" height="26.0" fill="#f3f5f8" rx="4"/><text x="26.0" y="87.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">지역</text><text x="132.0" y="87.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">리쥬란 주사제(PN 의료기기)</text><text x="342.0" y="87.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">리쥬란 화장품</text><text x="534.0" y="87.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">리투오(인체조직 ECM)</text><text x="26.0" y="120.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">한국</text><rect x="130.0" y="104.0" width="202.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="130.0" y="104.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="140.0" y="121.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2014년부터 4등급 기기,</text><text x="140.0" y="135.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">3Q26 의료기기 내수 정체</text><rect x="340.0" y="104.0" width="184.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="340.0" y="104.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="350.0" y="121.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">올리브영·쿠팡,</text><text x="350.0" y="135.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">3Q26 +50%</text><rect x="532.0" y="104.0" width="204.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="532.0" y="104.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="542.0" y="121.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">인체조직 이식재, 품목허가 없음,</text><text x="542.0" y="135.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">완판, 규제 재검토 중</text><text x="26.0" y="170.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">아시아·중동·</text><text x="26.0" y="184.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">중남미</text><rect x="130.0" y="154.0" width="202.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="130.0" y="154.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="140.0" y="171.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">52개국 허가(회사 집계),</text><text x="140.0" y="185.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2026년 사우디</text><rect x="340.0" y="154.0" width="184.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="340.0" y="154.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="350.0" y="171.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">말레이시아·필리핀,</text><text x="350.0" y="185.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2Q26 수출의 약 45%</text><rect x="532.0" y="154.0" width="204.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="532.0" y="154.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="542.0" y="171.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">리투오 수출 보고 없음,</text><text x="542.0" y="185.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">수출은 매출의 7%</text><text x="26.0" y="220.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">유럽</text><rect x="130.0" y="204.0" width="202.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="130.0" y="204.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="140.0" y="221.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2017 CE, 2024 말 MDR, 프랑스,</text><text x="140.0" y="235.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">3Q 수출 59억 → 120억원*</text><rect x="340.0" y="204.0" width="184.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="340.0" y="204.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="350.0" y="221.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2Q26 화장품</text><text x="350.0" y="235.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">수출의 약 16%</text><rect x="532.0" y="204.0" width="204.0" height="42.0" fill="#c0392b" rx="5" fill-opacity="0.1"/><rect x="532.0" y="204.0" width="4.0" height="42.0" fill="#c0392b" rx="2"/><text x="542.0" y="221.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">보고 없음</text><text x="26.0" y="270.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">중국</text><rect x="130.0" y="254.0" width="202.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="130.0" y="254.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="140.0" y="271.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2등급(도포용)만,</text><text x="140.0" y="285.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">3등급 진행, 2028년 전망</text><rect x="340.0" y="254.0" width="184.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="340.0" y="254.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="350.0" y="271.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">파트너 경유,</text><text x="350.0" y="285.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">합작 협의</text><rect x="532.0" y="254.0" width="204.0" height="42.0" fill="#c0392b" rx="5" fill-opacity="0.1"/><rect x="532.0" y="254.0" width="4.0" height="42.0" fill="#c0392b" rx="2"/><text x="542.0" y="271.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">의료기기 버전 필요,</text><text x="542.0" y="285.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">현지 생산 2029년 이후</text><text x="26.0" y="320.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">미국</text><rect x="130.0" y="304.0" width="202.0" height="42.0" fill="#c0392b" rx="5" fill-opacity="0.1"/><rect x="130.0" y="304.0" width="4.0" height="42.0" fill="#c0392b" rx="2"/><text x="140.0" y="321.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">허가된 PN 주사제 없음</text><rect x="340.0" y="304.0" width="184.0" height="42.0" fill="#159a6c" rx="5" fill-opacity="0.1"/><rect x="340.0" y="304.0" width="4.0" height="42.0" fill="#159a6c" rx="2"/><text x="350.0" y="321.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">아마존·세포라(약 380개 매장),</text><text x="350.0" y="335.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">CG USA 공장 인수 계약</text><rect x="532.0" y="304.0" width="204.0" height="42.0" fill="#c98a00" rx="5" fill-opacity="0.1"/><rect x="532.0" y="304.0" width="4.0" height="42.0" fill="#c98a00" rx="2"/><text x="542.0" y="321.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">조직 경로(파트너 판단),</text><text x="542.0" y="335.0" font-size="10.6" fill="#17212b" text-anchor="start" font-weight="normal">2031년까지 최소 6천만 달러</text><text x="24.0" y="368.0" font-size="9.6" fill="#5b6774" text-anchor="start" font-weight="normal">자료: DART 공시, 언론이 전한 회사 발표·증권가 언급(비즈워치, 블로터, 메디파나, 한국경제, 뉴스핌). * 유럽·오세아니아 합계.</text></svg>