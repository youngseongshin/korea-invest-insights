eight="400">US neocloud</text><rect x="174" y="404" width="12" height="12" rx="2" fill="#2a78d6"/><text x="192" y="414" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Korean stock</text><rect x="324" y="404" width="12" height="12" rx="2" fill="#6f7a88"/><text x="342" y="414" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Index</text><rect x="628" y="74" width="316" height="200" rx="8" fill="#6250d6" fill-opacity="0.05" stroke="#6250d6" stroke-width="1.4"/><text x="644" y="102" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Next Korean session after the US</text><text x="644" y="120" font-size="12" fill="#465160" text-anchor="start" font-weight="400">basket (CoreWeave and Nebius) rose,</text><text x="644" y="138" font-size="12" fill="#121821" text-anchor="start" font-weight="700">last month (8 times):</text><text x="644" y="188" font-size="34" fill="#2a78d6" text-anchor="start" font-weight="700">4 / 8</text><text x="644" y="208" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Naver rose</text><text x="790" y="188" font-size="34" fill="#2a78d6" text-anchor="start" font-weight="700">3 / 8</text><text x="790" y="208" font-size="12" fill="#465160" text-anchor="start" font-weight="400">SKT rose</text><text x="24" y="444" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Naver Finance and Nasdaq daily closes, price only (no dividends or currency); other data providers differ by a few tenths of a point. The next-session</text><text x="24" y="459" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">counts use KIS and Yahoo closes. Basket: equal-weight average of CoreWeave and Nebius. Eight observations are too few to estimate a probability.</text></svg>