<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="US neoclouds fell far more than Naver and SKT. Price change from Sep 30 to Oct 23 close, local currency: IREN −39.1%, CoreWeave −37.7%, Nebius −32.7%, KOSPI −18.8%, SK Telecom −13.4%, Kakao −11.3%, Naver −10.8%, KT −10.5%, QQQ −4.8%, LG Uplus −2.5%. Next Korean session after the US basket (CoreWeave and Nebius) rose, last month (8 times): Naver rose 4 of 8, SKT rose 3 of 8." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0" y="0" width="960" height="470" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">US neoclouds fell far more than Naver and SKT</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Price change from Sep 30 to Oct 23 close, local currency</text><text x="194" y="89" font-size="13" fill="#465160" text-anchor="end" font-weight="600">IREN</text><rect x="288" y="74" width="195.4" height="22" rx="3" fill="#c2410c"/><text x="491.3889432485323" y="90" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−39.1%</text><text x="194" y="122" font-size="13" fill="#465160" text-anchor="end" font-weight="600">CoreWeave</text><rect x="288" y="107" width="188.7" height="22" rx="3" fill="#c2410c"/><text x="484.73393021120296" y="123" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−37.7%</text><text x="194" y="155" font-size="13" fill="#465160" text-anchor="end" font-weight="600">Nebius</text><rect x="288" y="140" width="163.5" height="22" rx="3" fill="#c2410c"/><text x="459.5153467865016" y="156" font-size="13" fill="#121821" text-anchor="start" font-weight="700">−32.7%</text><text x="194" y="188" font-size="13" fill="#465160" text-anchor="end" font-weight="600">KOSPI</text><rect x="288" y="173" width="94.2" height="22" rx="3" fill="#6f7a88"/><text x="390.160022462577" y="189" font-size