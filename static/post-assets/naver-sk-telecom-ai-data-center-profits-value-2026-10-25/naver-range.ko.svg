<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="네이버 AI 데이터센터는 2028년 전에는 이익을 거의 더하지 못합니다. 신규 AI 데이터센터 영업이익, 십억원, 저희 시나리오 셋. 2027: 비관 −4.9, 기준 32.4, 낙관 172.2, 기준 시나리오, 네이버 전체 영업이익 중 비중 1.3%. 2028: 비관 15.4, 기준 314.0, 낙관 872.6, 기준 시나리오, 네이버 전체 영업이익 중 비중 10.7%. 2029: 비관 78.3, 기준 557.7, 낙관 1,120.9, 기준 시나리오, 네이버 전체 영업이익 중 비중 16.3%." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">네이버 AI 데이터센터는 2028년 전에는 이익을 거의 더하지 못합니다</text><text x="24" y="54" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">신규 AI 데이터센터 영업이익, 십억원, 저희 시나리오 셋</text><rect x="16" y="74" width="928" height="92" rx="6" fill="#6f7a88" fill-opacity="0.03" stroke="#6f7a88" stroke-width="1.4"/><text x="32" y="122" font-size="18" fill="#121821" text-anchor="start" font-weight="700">2027</text><text x="142" y="96" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">비관</text><rect x="150" y="82" width="3.0" height="18" rx="3" fill="#c2410c" fill-opacity="0.45"/><text x="161" y="96" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">−4.9</text><text x="142" y="122" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">기준</text><rect x="150" y="108" width="15.0" height="18" rx="3" fill="#2a78d6" fill-opacity="1"/><text x="173.02943800178411" y="122" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">32.4</text><text x="142" y="148" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">낙관</text><rect x="150" y="134" width="79.9" height="18" rx="3" fill="#2e8b57" fill-opacity="1"/><text x="237.878679750223" y="148" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">172</text><text x="720" y="96" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">기준 시나리오, 네이버 전체</text><text x="720" y="110" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">영업이익 중 비중</text><text x="720" y="144" font-size="26" fill="#2a78d6" text-anchor="start" font-weight="700">1.3%</text><rect x="16" y="174" width="928" height="92" rx="6" fill="#6f7a88" fill-opacity="0.03" stroke="#6f7a88" stroke-width="1.4"/><text x="32" y="222" font-size="18" fill="#121821" text-anchor="start" font-weight="700">2028</text><text x="142" y="196" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">비관</text><rect x="150" y="182" width="7.1" height="18" rx="3" fill="#c2410c" fill-opacity="1"/><text x="165.14362176628012" y="196" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">15.4</text><text x="142" y="222" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">기준</text><rect x="150" y="208" width="145.7" height="18" rx="3" fill="#2a78d6" fill-opacity="1"/><text x="303.6556645851918" y="222" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">314</text><text x="142" y="248" font-size="11.5" fill="#465160" text-anchor="end" font-weight="400">낙관</text><rect x="150" y="234" width="404.8" height="18" rx="3" fill="#2e8b57" fill-opacity="1"/><text x="562.7743086529883" y="248" font-size="12.5" fill="#121821" text-anchor="start" font-weight="400">873</text><text x="720" y="196" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">기준 시나리오, 네이버 전체</text><text x="720" y="210" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">영업이익 중 비중</text><text x="720" y="244" font-size="26" fill="#2a78d6" text-anchor="start" font-weight="700">10.7%</text><rect x="16" y="274" width="928" height="92" rx="6" fill="#6f7a88" fill-opacity="0.03" stroke="#6f7a88" stroke-width="1.4"/><text x="32" y="322" font-size="18" fill="#121821" text-anchor="start" font-weight="700">2029</text><text x="142" y="296" font-size="11.5" fill="#465160" text-anchor="end" font-