<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="저희 기준 모형에서 가치가 놓인 곳. 네이버: 신규 AI 데이터센터는 약 10분의 1: 기존사업 90%, 신규 AI 데이터센터 10%. AI 데이터센터 부분 중: 2027~2029년 이익·현금 18%, 2029년 이후 가치 82%. SK텔레콤: 부분별 기준 가치 비중: 통신 등 기존사업 68.9%, SK호라이즌 51% 지분 14.2%, 호라이즌 구주 매각 현금 7.1%, 앤트로픽 지분, 장부가의 65% 11.7%, GPU 서비스, 투자 차감 후 −1.3%, SK하이퍼, 지출 차감 후 −0.5%" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">저희 기준 모형에서 가치가 놓인 곳</text><rect x="16" y="48" width="440" height="330" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="74" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">네이버: 신규 AI 데이터센터는 약 10분의 1</text><rect x="32.0" y="96" width="367.2" height="44" fill="#2a78d6"/><text x="40" y="124" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">90%</text><rect x="399.2" y="96" width="40.8" height="44" fill="#2e8b57"/><text x="404.2" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700">10%</text><rect x="32" y="154" width="11" height="11" rx="2" fill="#2a78d6"/><text x="50" y="164" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">기존사업</text><rect x="32" y="172" width="11" height="11" rx="2" fill="#2e8b57"/><text x="50" y="182" font-size="11.5" fill="#465160" text-anchor="start" font-weight="600">신규 AI 데이터센터</text><text x="32" y="214" font-size="12" fill="#465160" text-anchor="start" font-weight="600">AI 데이터센터 부분 중:</text><rect x="32.0" y="226" width="73.4" height="44" fill="#b7791f"/><text x="40" y="254" font-size="17" fill="#ffffff" text-anchor="start" font-weight="700">18%</text><rect x="105.4" y="226" width="334.6" height="44" fill="#c2410c"/><text x="113.44" y="254" font-size="17" fill="#ffffff" text-anchor="start" 