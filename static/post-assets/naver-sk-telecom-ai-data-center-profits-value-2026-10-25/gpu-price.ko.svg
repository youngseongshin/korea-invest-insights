<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="GPU 임대 단가는 올랐지만, 운영사는 수수료를 낸 뒤 남는 몫만 가집니다. GPU 가격 지수, 최근 한 달 변화(10월 24일): H200 +20.2%, B200 +19.5%, A100 +5.9%, H100 +3.4%, RTX PRO 6000 +0.0%. 네이버 AI 데이터센터 영업이익, 십억원: 2028년: 기존 단가 경로(MW·년당 2,000만→1,800만달러) 314, 높은 단가 경로(2,500만→2,300만달러), 같은 마진 413, 높은 단가, 올린 몫의 30%를 운영사가 확보 562; 2029년: 기존 단가 경로(MW·년당 2,000만→1,800만달러) 558, 높은 단가 경로(2,500만→2,300만달러), 같은 마진 713, 높은 단가, 올린 몫의 30%를 운영사가 확보 868" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="500" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">GPU 임대 단가는 올랐지만, 운영사는 수수료를 낸 뒤 남는 몫만 가집니다</text><rect x="16" y="48" width="400" height="340" rx="8" fill="#2a78d6" fill-opacity="0.03" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="74" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">GPU 가격 지수, 최근 한 달 변화(10월 24일)</text><text x="32" y="111" font-size="13" fill="#465160" text-anchor="start" font-weight="600">H200</text><rect x="150" y="96" width="190.0" height="22" rx="3" fill="#2a78d6"/><text x="348.0" y="112" font-size="13" fill="#121821" text-anchor="start" font-weight="700">+20.2%</text><text x="32" y="165" font-size="13" fill="#465160" text-anchor="start" font-weight="600">B200</text><rect x="150" y="150" width="183.4" height="22" rx="3" fill="#2a78d6"/><text x="341.41584158415844" y="166" font-size="13" fill="#121821" text-anchor="start" font-weight="700">+19.5%</text><text x="32" y="219" font-size="13" fill="#465160" text-anchor="start" font-weight="600">A100</text><rect x="150" y="204" width="55.5" height="22" rx="3" fill="#6f7a88"/><text x="213.4950495049505" y="220" font-size="13" fill="#121821" text-anchor="start" font-weight="700">+5.9%</text><text x="32" y="273" font-size="13" fill="#465160" text-anchor="start" font-weight="600">H100</text