<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 421" width="760" height="421" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="461" fill="#ffffff"/><text x="24" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">The market's question moved four times</text><text x="24" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Profit evidence got stronger in every phase. The question moved away from it.</text><line x1="48" y1="88" x2="48" y2="350" stroke="#d5dbe3" stroke-width="3"/><circle cx="48" cy="90" r="13" fill="#2f5fd0"/><text x="48" y="95.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="76" y="82.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">Sep 18 - Oct 6</text><text x="76" y="100.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Can AI infrastructure keep its pricing power at high rates?</text><text x="76" y="120.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Fed hiked Sep 16. S&amp;P 500 record close Oct 6 (7,818.93). SOX 11,921.7 to 13,217.8.</text><circle cx="48" cy="168" r="13" fill="#b26a00"/><text x="48" y="173.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="76" y="160.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">Oct 7 - Oct 16</text><text x="76" y="178.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">How long do record profits last, and what does the capital cost?</text><text x="76" y="198.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Samsung Q3 KRW 107.4tn, KOSPI -2.62% that day. Oct 6 to 15: Samsung -22.8%, SK hynix -28.8%.</text><circle cx="48" cy="246" r="13" fill="#b3261e"/><text x="48" y="251.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="76" y="238.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">Oct 17 - Oct 31</text><text x="76" y="256.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Demand is real. Who pays for it?</text><text x="76" y="276.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Q3 calls: all four hyperscalers raised 2027 capex. Five firms' Q3 free cash flow -$31.8bn. HY 344bp (Oct 30).</text><circle cx="48" cy="324" r="13" fill="#b3261e"/><text x="48" y="329.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="76" y="316.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">Nov 1 - Nov 7</text><text x="76" y="334.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">Will politics keep allowing it?</text><text x="76" y="354.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Democrats won both chambers Nov 3. Nov 5: SOX -12.25%, S&amp;P 500 -4.36%, Micron -17.46%. VIX 28.18.</text><text x="24" y="386.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Phase 1 to 4 questions: pricing power, profit shelf life, who pays, political permission. Source: our market panel and</text>
<text x="24" y="400.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">research notes.</text></svg>