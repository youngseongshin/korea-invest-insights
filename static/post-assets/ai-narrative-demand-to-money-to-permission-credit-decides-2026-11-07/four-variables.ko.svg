<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="548" fill="#ffffff"/><text x="24" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">변수 넷, 결정하는 것은 하나입니다</text><text x="24" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">정성 배치이고 점수가 아닙니다. 왼쪽은 가격에 약세, 오른쪽은 강세입니다.</text><text x="28" y="80.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V1  2027 이익 인도</text><rect x="28" y="98" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="98" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="95" x2="380.0" y2="109" stroke="#5b6774"/><circle cx="577" cy="102" r="9" fill="#1b7f4b" stroke="#ffffff" stroke-width="2"/><text x="28" y="134.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">계약가·장기계약·capex·수출이 같은 방향입니다. 하향 1차 증거가 없습니다.</text><text x="28" y="149.8" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">판정: 12월 말 1Q27 범용 계약가 전망, FY27 EPS 수정</text><rect x="18" y="164" width="724" height="100" rx="8" fill="#fff6e8" stroke="#b26a00" stroke-width="2"/><text x="28" y="184.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V2  조달 비용·신용</text><rect x="667" y="170" width="63" height="18" rx="9" fill="#b26a00"/><text x="698.35" y="183.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">결정 변수</text><rect x="28" y="202" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="202" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="199" x2="380.0" y2="213" stroke="#5b6774"/><circle cx="281" cy="206" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><text x="28" y="238.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">HY 9/21 이후 +82bp. 연준은 아직 인상 쪽이고 하이퍼스케일러 다수가 현금을 태웁니다.</text><text x="28" y="253.8" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">판정: HY 350bp 선, 11월 발행 창, 오라클·코어위브</text><text x="28" y="288.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V3  정책 허가(2028 GW)</text><rect x="28" y="306" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="306" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="303" x2="380.0" y2="317" stroke="#5b6774"/><circle cx="239" cy="310" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><text x="28" y="342.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">주 단위 제동이 제도화됐고 연방 입법은 거부권으로 막혀 있습니다.</text><text x="28" y="357.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">판정: 2027-01-03 의회 개원, 텍사스 정지 기간</text><text x="28" y="392.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V4  포지셔닝</text><rect x="28" y="410" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="410" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="407" x2="380.0" y2="421" stroke="#5b6774"/><circle cx="239" cy="414" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><circle cx="549" cy="414" r="9" fill="#1b7f4b" stroke="#ffffff" stroke-width="2"/><text x="239.2" y="400.0" font-size="10" fill="#b3261e" text-anchor="middle" font-weight="normal">1~2주</text><text x="548.96" y="400.0" font-size="10" fill="#1b7f4b" text-anchor="middle" font-weight="normal">1~3개월</text><text x="28" y="446.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">CTA 중기선 이탈(S&amp;P 7,544)과 숏 과밀(반등 연료)이 맞섭니다.</text><text x="28" y="461.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">판정: S&amp;P 7,040 장기선, 숏 커버</text><text x="24" y="486.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">V2가 결정하는 이유: 정치 제약과 랩 수익성 모두 2028 주문으로 가는 통로가 조달입니다.</text></svg>