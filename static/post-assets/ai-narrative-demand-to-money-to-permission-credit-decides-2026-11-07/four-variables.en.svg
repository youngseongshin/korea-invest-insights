<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="548" fill="#ffffff"/><text x="24" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">Four variables, one that decides</text><text x="24" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Qualitative placement, not a score. Left: bearish for prices. Right: bullish.</text><text x="28" y="80.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V1  2027 profit delivery</text><rect x="28" y="98" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="98" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="95" x2="380.0" y2="109" stroke="#5b6774"/><circle cx="577" cy="102" r="9" fill="#1b7f4b" stroke="#ffffff" stroke-width="2"/><text x="28" y="134.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Contract prices, long-term deals, capex and exports point the same way. No primary evidence of a cut.</text><text x="28" y="149.8" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Decided: late-Dec 1Q27 contract-price outlook, FY27 EPS revisions</text><rect x="18" y="164" width="724" height="100" rx="8" fill="#fff6e8" stroke="#b26a00" stroke-width="2"/><text x="28" y="184.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V2  Funding cost and credit</text><rect x="666" y="170" width="64" height="18" rx="9" fill="#b26a00"/><text x="698.13" y="183.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">DECIDES</text><rect x="28" y="202" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="202" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="199" x2="380.0" y2="213" stroke="#5b6774"/><circle cx="281" cy="206" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><text x="28" y="238.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">HY +82bp since Sep 21. Fed still leans to hiking. Several of five hyperscalers burn cash.</text><text x="28" y="253.8" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Decided: HY 350bp line, November issuance window, Oracle and CoreWeave</text><text x="28" y="288.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V3  Political permission (2028 GW)</text><rect x="28" y="306" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="306" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="303" x2="380.0" y2="317" stroke="#5b6774"/><circle cx="239" cy="310" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><text x="28" y="342.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">State-level brakes are now formal. Federal legislation is blocked by veto.</text><text x="28" y="357.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Decided: Jan 3, 2027 new Congress, Texas halt period</text><text x="28" y="392.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">V4  Positioning</text><rect x="28" y="410" width="352.0" height="8" rx="4" fill="#f3d3d0"/><rect x="380.0" y="410" width="352.0" height="8" rx="4" fill="#cfe6d8"/><line x1="380.0" y1="407" x2="380.0" y2="421" stroke="#5b6774"/><circle cx="239" cy="414" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><circle cx="549" cy="414" r="9" fill="#1b7f4b" stroke="#ffffff" stroke-width="2"/><text x="239.2" y="400.0" font-size="10" fill="#b3261e" text-anchor="middle" font-weight="normal">1-2 wks</text><text x="548.96" y="400.0" font-size="10" fill="#1b7f4b" text-anchor="middle" font-weight="normal">1-3 mo</text><text x="28" y="446.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">CTA mid-term trend line broken (S&amp;P 7,544) versus crowded shorts as rebound fuel.</text><text x="28" y="461.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Decided: S&amp;P 7,040 long-term line, short covering</text><text x="24" y="486.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Why V2 decides: political limits and lab profitability both reach 2028 orders through financing.</text></svg>