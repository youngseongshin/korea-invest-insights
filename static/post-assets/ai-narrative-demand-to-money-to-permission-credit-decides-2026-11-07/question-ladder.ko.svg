<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="446" fill="#ffffff"/><text x="24" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">시장의 질문은 네 번 옮겨 갔습니다</text><text x="24" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">이익 증거는 국면마다 강해졌고, 질문은 그 증거에서 멀어졌습니다.</text><line x1="48" y1="88" x2="48" y2="350" stroke="#d5dbe3" stroke-width="3"/><circle cx="48" cy="90" r="13" fill="#2f5fd0"/><text x="48" y="95.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="76" y="82.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">9/18 ~ 10/6</text><text x="76" y="100.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">고금리에서도 AI 인프라가 가격결정력을 지키는가</text><text x="76" y="120.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">연준 9/16 인상. S&amp;P500 10/6 사상 최고 종가(7,818.93). SOX 11,921.7에서 13,217.8.</text><circle cx="48" cy="168" r="13" fill="#b26a00"/><text x="48" y="173.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="76" y="160.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">10/7 ~ 10/16</text><text x="76" y="178.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">사상 최대 이익은 얼마나 가고, 자본은 얼마나 비싼가</text><text x="76" y="198.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">삼성 3분기 107.4조원, 같은 날 코스피 -2.62%. 10/6에서 10/15까지 삼성 -22.8%, 하이닉스 -28.8%.</text><circle cx="48" cy="246" r="13" fill="#b3261e"/><text x="48" y="251.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="76" y="238.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">10/17 ~ 10/31</text><text x="76" y="256.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">수요는 맞다. 그런데 누가 돈을 대나</text><text x="76" y="276.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">3분기 콜에서 하이퍼스케일러 4사 모두 2027 capex 상향. 5사 3분기 잉여현금흐름 -318억달러. HY 344bp(10/30).</text><circle cx="48" cy="324" r="13" fill="#b3261e"/><text x="48" y="329.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="76" y="316.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">11/1 ~ 11/7</text><text x="76" y="334.0" font-size="14" fill="#17212b" text-anchor="start" font-weight="bold">정치가 계속 허가하나</text><text x="76" y="354.9" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">11/3 민주당 양원 승리. 11/5 SOX -12.25%, S&amp;P500 -4.36%, 마이크론 -17.46%. VIX 28.18.</text><text x="24" y="386.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">국면별 질문: 가격결정력, 이익의 수명, 조달 주체, 정치적 허가. 출처: 자체 시장 패널과 리서치 노트.</text></svg>