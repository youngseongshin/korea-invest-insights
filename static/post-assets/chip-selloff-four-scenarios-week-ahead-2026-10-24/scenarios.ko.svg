<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" width="960" height="458" role="img" aria-label="11월 중순까지의 네 시나리오(주관 확률, 10/24): S1 반등, 매파적 동결 50%, 관문: capex 유지 + 회사채 창 소화(HY 330bp 이하), 과매도 반등, 금리가 상단을 막음; S2 신용 경색 15%, 관문: HY 350bp+, 오라클 CDS 300bp+, 코어위브 75센트 하회, 반등 실패, 7월 저점 재시험; S3 수요 둔화 15%, 관문: 하이퍼스케일러 1곳 이상 2027 capex 감속, 2차 하락, SK하이닉스 낙폭 최대; S4 매크로 충격 20%, 관문: 깜짝 인상, 근원 물가 상회, 브렌트 110달러+, 전면 하락, 미국 10년 5.3%+" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="960" height="458" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">11월 중순까지의 네 시나리오(주관 확률, 10/24)</text><rect x="16" y="56" width="928" height="80" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="82" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S1 반등, 매파적 동결</text><rect x="32" y="96" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="96" width="110" height="12" rx="6" fill="#2a78d6"/><text x="262" y="107" font-size="15" fill="#121821" text-anchor="start" font-weight="700">50%</text><text x="330" y="82" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">관문: capex 유지 + 회사채 창 소화(HY 330bp 이하)</text><text x="330" y="104" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ 과매도 반등, 금리가 상단을 막음</text><text x="330" y="124" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">신규 발행 프리미엄이 커지면 실패</text><rect x="16" y="148" width="928" height="80" rx="8" fill="#eb6834" fill-opacity="0.06" stroke="#eb6834" stroke-width="1.4"/><text x="32" y="174" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S2 신용 경색</text><rect x="32" y="188" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="188" width="33" height="12" rx="6" fill="#eb6834"/><text x="262" y="199" font-size="15" fill="#121821" text-anchor="start" font-weight="700">15%</text><text x="330" y="174" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">관문: HY 350bp+, 오라클 CDS 300bp+, 코어위브 75센트 하회</text><text x="330" y="196" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ 반등 실패, 7월 저점 재시험</text><text x="330" y="216" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">확인: 10/30~11/7 발행 창</text><rect x="16" y="240" width="928" height="80" rx="8" fill="#6f7a88" fill-opacity="0.06" stroke="#6f7a88" stroke-width="1.4"/><text x="32" y="266" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S3 수요 둔화</text><rect x="32" y="280" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="280" width="33" height="12" rx="6" fill="#6f7a88"/><text x="262" y="291" font-size="15" fill="#121821" text-anchor="start" font-weight="700">15%</text><text x="330" y="266" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">관문: 하이퍼스케일러 1곳 이상 2027 capex 감속</text><text x="330" y="288" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ 2차 하락, SK하이닉스 낙폭 최대</text><text x="330" y="308" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">확인: 알파벳·MS·아마존 문구</text><rect x="16" y="332" width="928" height="80" rx="8" fill="#6250d6" fill-opacity="0.06" stroke="#6250d6" stroke-width="1.4"/><text x="32" y="358" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S4 매크로 충격</text><rect x="32" y="372" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="372" width="44" height="12" rx="6" fill="#6250d6"/><text x="262" y="383" font-size="15" fill="#121821" text-anchor="start" font-weight="700">20%</text><text x="330" y="358" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">관문: 깜짝 인상, 근원 물가 상회, 브렌트 110달러+</text><text x="330" y="380" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ 전면 하락, 미국 10년 5.3%+</text><text x="330" y="400" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">10/24 15→20%(브렌트 규칙)</text><text x="24" y="446" font-size="12" fill="#465160" text-anchor="start" font-weight="400">약세 확정에는 셋 중 하나가 필요합니다: 다음 해 메모리 컨센서스 연간 하향, HY 350bp+, 빅테크 1곳 capex 감속.</text></svg>