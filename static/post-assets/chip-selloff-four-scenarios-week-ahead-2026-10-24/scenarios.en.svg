<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" width="960" height="458" role="img" aria-label="Four scenarios to mid-November (subjective probabilities, Oct 24): S1 Rebound, hawkish hold 50%, Gate: capex kept + bond window absorbed (HY ≤330bp), Oversold rebound; rates cap the upside; S2 Credit squeeze 15%, Gate: HY 350bp+, Oracle CDS 300bp+, CoreWeave &lt;75¢, Rebound fails; July lows retested; S3 Demand slowdown 15%, Gate: 1+ hyperscaler slows 2027 capex, Second leg down; SK hynix falls most; S4 Macro shock 20%, Gate: surprise hike, hot core, Brent $110+, Broad selloff; 10-year 5.3%+" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0" y="0" width="960" height="458" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Four scenarios to mid-November (subjective probabilities, Oct 24)</text><rect x="16" y="56" width="928" height="80" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.4"/><text x="32" y="82" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S1 Rebound, hawkish hold</text><rect x="32" y="96" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="96" width="110" height="12" rx="6" fill="#2a78d6"/><text x="262" y="107" font-size="15" fill="#121821" text-anchor="start" font-weight="700">50%</text><text x="330" y="82" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Gate: capex kept + bond window absorbed (HY ≤330bp)</text><text x="330" y="104" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ Oversold rebound; rates cap the upside</text><text x="330" y="124" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Fails if new-issue concessions widen</text><rect x="16" y="148" width="928" height="80" rx="8" fill="#eb6834" fill-opacity="0.06" stroke="#eb6834" stroke-width="1.4"/><text x="32" y="174" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S2 Credit squeeze</text><rect x="32" y="188" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="188" width="33" height="12" rx="6" fill="#eb6834"/><text x="262" y="199" font-size="15" fill="#121821" text-anchor="start" font-weight="700">15%</text><text x="330" y="174" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Gate: HY 350bp+, Oracle CDS 300bp+, CoreWeave &lt;75¢</text><text x="330" y="196" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ Rebound fails; July lows retested</text><text x="330" y="216" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Watch: issuance window Oct 30–Nov 7</text><rect x="16" y="240" width="928" height="80" rx="8" fill="#6f7a88" fill-opacity="0.06" stroke="#6f7a88" stroke-width="1.4"/><text x="32" y="266" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S3 Demand slowdown</text><rect x="32" y="280" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="280" width="33" height="12" rx="6" fill="#6f7a88"/><text x="262" y="291" font-size="15" fill="#121821" text-anchor="start" font-weight="700">15%</text><text x="330" y="266" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Gate: 1+ hyperscaler slows 2027 capex</text><text x="330" y="288" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ Second leg down; SK hynix falls most</text><text x="330" y="308" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Watch: Alphabet, Microsoft, Amazon wording</text><rect x="16" y="332" width="928" height="80" rx="8" fill="#6250d6" fill-opacity="0.06" stroke="#6250d6" stroke-width="1.4"/><text x="32" y="358" font-size="15" fill="#121821" text-anchor="start" font-weight="700">S4 Macro shock</text><rect x="32" y="372" width="220" height="12" rx="6" fill="#e4e8ed"/><rect x="32" y="372" width="44" height="12" rx="6" fill="#6250d6"/><text x="262" y="383" font-size="15" fill="#121821" text-anchor="start" font-weight="700">20%</text><text x="330" y="358" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Gate: surprise hike, hot core, Brent $110+</text><text x="330" y="380" font-size="13" fill="#121821" text-anchor="start" font-weight="600">→ Broad selloff; 10-year 5.3%+</text><text x="330" y="400" font-size="12" fill="#6f7a88" text-anchor="start" font-weight="400">Moved 15→20% on Oct 24 (Brent rule)</text><text x="24" y="446" font-size="12" fill="#465160" text-anchor="start" font-weight="400">Bear confirmation needs one of three: an annual cut to next-year memory consensus, HY 350bp+, or one Big Tech capex slowdown.</text></svg>