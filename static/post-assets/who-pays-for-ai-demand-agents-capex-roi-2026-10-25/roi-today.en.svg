<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Does AI pay for itself today? It depends on who you ask. Compute owners: Yes, New contracts, per MW a year $20–25m Breakeven per MW a year $9.5–12.9m → 1.6–2.6x; Big Tech as a whole: Yes, but falling, Return on invested capital 27.8% → 20.1% Hurdle we use 12%: still above it; End customers alone: Not yet, Yearly cost of installed AI kit about $359bn What paid AI covers $207–290bn = 58–81%. The gap of about $70–150bn a year is filled by Big Tech's other businesses and by capital markets." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Does AI pay for itself today? It depends on who you ask</text><rect x="16" y="50" width="300" height="236" rx="8" fill="#2e8b57" fill-opacity="0.06" stroke="#2e8b57" stroke-width="1.4"/><text x="34" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Compute owners</text><rect x="34" y="92" width="90" height="28" rx="14" fill="#2e8b57"/><text x="46" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">Yes</text><text x="34" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">New contracts, per MW a year</text><text x="34" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">$20–25m</text><text x="34" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Breakeven per MW a year</text><text x="34" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">$9.5–12.9m → 1.6–2.6x</text><rect x="332" y="50" width="300" height="236" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.4"/><text x="350" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Big Tech as a whole</text><rect x="350" y="92" width="168" height="28" rx="14" fill="#2a78d6"/><text x="362" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">Yes, but falling</text><text x="350" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Return on invested capital</text><text x="350" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">27.8% → 20.1%</text><text x="350" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Hurdle we use</text><text x="350" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">12%: still above it</text><rect x="648" y="50" width="300" height="236" rx="8" fill="#eb6834" fill-opacity="0.06" stroke="#eb6834" stroke-width="1.4"/><text x="666" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">End customers alone</text><rect x="666" y="92" width="90" height="28" rx="14" fill="#eb6834"/><text x="678" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">Not yet</text><text x="666" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Yearly cost of installed AI kit</text><text x="666" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">about $359bn</text><text x="666" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">What paid AI covers</text><text x="666" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">$207–290bn = 58–81%</text><text x="24" y="314" font-size="13" fill="#121821" text-anchor="start" font-weight="600">The gap of about $70–150bn a year is filled by Big Tech's other businesses and by capital markets.</text><text x="24" y="362" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Breakeven and coverage use our model: chips 5-year life, buildings 20 years, 12% required return. ROIC read from an Apollo chart (secondary).</text></svg>