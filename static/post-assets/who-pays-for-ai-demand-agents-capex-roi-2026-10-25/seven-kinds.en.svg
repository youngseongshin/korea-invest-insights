<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Seven kinds of paid AI demand, from strongest to weakest. Enterprise: Company IT and work budgets, Microsoft AI $37bn a year; Copilot 30M seats, Microsoft AI +123%, High; Agents: Mostly companies, Agents in 1 of 3 GitHub pull requests, Salesforce agent work +97% QoQ, High: the volume lever; API: Developers and companies, Google: 22bn tokens a minute, Tokens +37% QoQ, price falling, Mid-high: frontier only; Advertising: Advertisers, Meta ads $63.1bn in Q3, +26% YoY, High, but existing budgets; Consumers: Individuals, About $40bn a year worldwide, 3.3x in a year, Wide but shallow; Subscriptions: Individuals and teams, Flat plans, $8–200 a month, Slowing, A ticket, not a lever; Commerce fees: Merchants, Near zero; first 4% fee pulled back, Not disclosed, Unproven" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="470" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Seven kinds of paid AI demand, from strongest to weakest</text><text x="168" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">Who pays</text><text x="340" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">How big today</text><text x="610" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">Growth</text><text x="790" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">Quality</text><rect x="16" y="80" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="80" width="5" height="44" rx="2" fill="#2e8b57"/><text x="32" y="107" font-size="14" fill="#121821" text-anchor="start" font-weight="700">Enterprise<