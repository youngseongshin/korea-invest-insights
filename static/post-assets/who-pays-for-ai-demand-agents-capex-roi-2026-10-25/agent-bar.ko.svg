<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="에이전트가 키우는 사용량은 충분히 빠를까: 2027년 시나리오 대 기준선. 약세(30%): 1.8~2.2배, 상위 사용자 포화, 가격 전쟁, 신뢰·검수 병목; 기준(50%): 2.5~3.0배, 대기업 플랫폼 경유 확산, 소기업·소비자는 정체; 강세(20%): 3.5~4.0배, 대기업 사무 업무, 사용량 과금, 폰·PC 기본 탑재 에이전트. 단가가 연 40~54% 내릴 때 지출 연 +41%에 필요한 범위: 2.4–3.1x. 구글 API 토큰, 2분기 속도: 3.6x" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="330" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">에이전트가 키우는 사용량은 충분히 빠를까: 2027년 시나리오 대 기준선</text><rect x="375.0" y="62" width="175.0" height="196" fill="#6250d6" fill-opacity="0.10"/><text x="462.5" y="58" font-size="11.5" fill="#6250d6" text-anchor="middle" font-weight="700">단가가 연 40~54% 내릴 때 지출 연 +41%에 필요한 범위</text><line x1="150.0" y1="66" x2="150.0" y2="258" stroke="#e4e8ed"/><text x="150.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">1.5배</text><line x1="275.0" y1="66" x2="275.0" y2="258" stroke="#e4e8ed"/><text x="275.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">2배</text><line x1="400.0" y1="66" x2="400.0" y2="258" stroke="#e4e8ed"/><text x="400.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">2.5배</text><line x1="525.0" y1="66" x2="525.0" y2="258" stroke="#e4e8ed"/><text x="525.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">3배</text><line x1="650.0" y1="66" x2="650.0" y2="258" stroke="#e4e8ed"/><text x="650.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">3.5배</text><line x1="775.0" y1="66" x2="775.0" y2="258" stroke="#e4e8ed"/><text x="775.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">4배</text><line x1="900.0" y1="66" x2="900.0" y2="258" stroke="#e4e8ed"/><text x="900.0" y="276" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">4.5배</text><text x="900" y="294" font-size="11" fill="#6f7a88" text-anchor="end" font-weight="400">토큰 사용량, 2027년 4분기 ÷ 2026년 4분기(배)</text><text x="24" y="96" font-size="13" fill="#121821" text-anchor="start" font-weight="700">약세(30%)</text><rect x="225.0" y="82" width="100.0" height="20" rx="4" fill="#c2410c"/><text x="333.00000000000006" y="97" font-size="13" fill="#121821" text-anchor="start" font-weight="700">1.8~2.2배</text><text x="150" y="120" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">상위 사용자 포화, 가격 전쟁, 신뢰·검수 병목</text><text x="24" y="156" font-size="13" fill="#121821" text-anchor="start" font-weight="700">기준(50%)</text><rect x="400.0" y="142" width="125.0" height="20" rx="4" fill="#2a78d6"/><text x="533.0" y="157" font-size="13" fill="#121821" text-anchor="start" font-weight="700">2.5~3.0배</text><text x="150" y="180" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">대기업 플랫폼 경유 확산, 소기업·소비자는 정체</text><text x="24" y="216" font-size="13" fill="#121821" text-anchor="start" font-weight="700">강세(20%)</text><rect x="650.0" y="202" width="125.0" height="20" rx="4" fill="#2e8b57"/><text x="783.0" y="217" font-size="13" fill="#121821" text-anchor="start" font-weight="700">3.5~4.0배</text><text x="150" y="240" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">대기업 사무 업무, 사용량 과금, 폰·PC 기본 탑재 에이전트</text><line x1="675.0" y1="66" x2="675.0" y2="258" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="4 3"/><text x="681.0" y="76" font-size="11" fill="#2e8b57" text-anchor="start" font-weight="700">구글 API 토큰, 2분기 속도</text><text x="24" y="316" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">시나리오 확률은 2026년 10월 18일 기준 저희 주관 추정입니다. 필요 범위는 저희 ROI 모형입니다. 특정 회사 전망이 아닙니다.</text></svg>