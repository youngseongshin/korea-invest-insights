<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="AI 사용량은 폭증하고, AI 지출은 단가에 묶였습니다. Ramp 미국 기업 AI 지출, 8/2 → 10/11: 토큰 단가 −42%; 토큰 사용량 +65%; 지출 금액 +1.5%. 구글 API 분당 토큰: 2026년 1분기 160억; 2026년 2분기 220억, 한 분기에 +37.5%, 이 속도면 1년에 약 3.6배" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="340" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">AI 사용량은 폭증하고, AI 지출은 단가에 묶였습니다</text><rect x="16" y="50" width="560" height="250" rx="8" fill="#2a78d6" fill-opacity="0.04" stroke="#2a78d6" stroke-width="1.4"/><rect x="588" y="50" width="356" height="250" rx="8" fill="#2e8b57" fill-opacity="0.04" stroke="#2e8b57" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Ramp 미국 기업 AI 지출, 8/2 → 10/11</text><text x="32" y="119" font-size="13" fill="#465160" text-anchor="start" font-weight="600">토큰 단가</text><rect x="204.0" y="104" width="126.0" height="22" rx="3" fill="#c2410c"/><text x="196.0" y="120" font-size="14" fill="#121821" text-anchor="end" font-weight="700">−42%</text><text x="32" y="181" font-size="13" fill="#465160" text-anchor="start" font-weight="600">토큰 사용량</text><rect x="330.0" y="166" width="195.0" height="22" rx="3" fill="#2a78d6"/><text x="533.0" y="182" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+65%</text><text x="32" y="243" font-size="13" fill="#465160" text-anchor="start" font-weight="600">지출 금액</text><rect x="330.0" y="228" width="4.5" height="22" rx="3" fill="#6f7a88"/><text x="342.5" y="244" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+1.5%</text><line x1="330" y1="92" x2="330" y2="290" stroke="#6f7a88" stroke-width="1"/><text x="604" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">구글 API 분당 토큰</text><rect x="660" y="196.4" width="64" height="75.6" rx="3" fill="#6f7a88"/><text x="692" y="188.36363636363637" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">160억</text><text x="692" y="290" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">2026년 1분기</text><rect x="790" y="168.0" width="64" height="104.0" rx="3" fill="#2e8b57"/><text x="822" y="160.0" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">220억</text><text x="822" y="290" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">2026년 2분기</text><text x="604" y="100" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="700">한 분기에 +37.5%</text><text x="604" y="118" font-size="12" fill="#465160" text-anchor="start" font-weight="400">이 속도면 1년에 약 3.6배</text><text x="24" y="324" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Ramp AI Index(미국 기업 자기선택 표본), 알파벳 2026년 2분기 실적. 토큰은 AI 모델이 읽고 쓰는 단위입니다.</text></svg>