<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="위임형 에이전트: 단가 하락을 이겨야 하는 성장 엔진. 일 사용자당 토큰: 채팅 1배, 위임형 에이전트 약 40배. 에이전트는 페이지를 읽고 도구를 부르며 몇 시간씩 돕니다. 입력의 78%가 캐시라 연산은 약 6배로 늘어납니다. 자라는 곳: OpenRouter 주간 토큰 5월→9월 약 5배; 세일즈포스 에이전트 작업 단위 +97%(QoQ); ServiceNow 에이전트 배포 9개월에 9배; MS 연 1조 토큰 고객 수 전년 대비 4배; 에이전트가 관여한 깃허브 PR 3건 중 1건. 막힌 곳: 에이전트를 확대하는 대기업 27% → 40%; 소기업 약 22%에서 정체; 상위 1% 기업 직원당 지출 7월 고점 대비 −3.1%; 엔지니어 1명이 감독하는 세션 3~5개; 무료 소비자 에이전트 미국 다운로드 대 일 사용자 1,000만 대 250만" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">위임형 에이전트: 단가 하락을 이겨야 하는 성장 엔진</text><rect x="16" y="50" width="268" height="310" rx="8" fill="#6250d6" fill-opacity="0.05" stroke="#6250d6" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">일 사용자당 토큰</text><rect x="52" y="232.8" width="64" height="3.2" rx="3" fill="#6f7a88"/><text x="84" y="224.75" font-size="15" fill="#121821" text-anchor="middle" font-weight="700">1배</text><text x="84" y="254" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">채팅</text><rect x="164" y="106.0" width="64" height="130.0" rx="3" fill="#6250d6"/><text x="196" y="98.0" font-size="15" fill="#121821" text-anchor="middle" font-weight="700">약 40배</text><text x="196" y="254" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">위임형 에이전트</text><text x="32" y="284" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">에이전트는 페이지를 읽고 도구를</text><text x="32" y="301" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">부르며 몇 시간씩 돕니다. 입력의 78%가</text><text x="32" y="318" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">캐시라 연산은 약 6배로 늘어납니다.</text><rect x="296" y="50" width="316" height="310" rx="8" fill="#2e8b57" fill-opacity="0.05" stroke="#2e8b57" stroke-width="1.4"/><text x="312" y="76" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="700">자라는 곳</text><text x="312" y="104" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">OpenRouter 주간 토큰</text><text x="312" y="124" font-size="14" fill="#121821" text-anchor="start" font-weight="700">5월→9월 약 5배</text><text x="312" y="156" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">세일즈포스 에이전트 작업 단위</text><text x="312" y="176" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+97%(QoQ)</text><text x="312" y="208" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">ServiceNow 에이전트 배포</text><text x="312" y="228" font-size="14" fill="#121821" text-anchor="start" font-weight="700">9개월에 9배</text><text x="312" y="260" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">MS 연 1조 토큰 고객 수</text><text x="312" y="280" font-size="14" fill="#121821" text-anchor="start" font-weight="700">전년 대비 4배</text><text x="312" y="312" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">에이전트가 관여한 깃허브 PR</text><text x="312" y="332" font-size="14" fill="#121821" text-anchor="start" font-weight="700">3건 중 1건</text><rect x="624" y="50" width="320" height="310" rx="8" fill="#eb6834" fill-opacity="0.05" stroke="#eb6834" stroke-width="1.4"/><text x="640" y="76" font-size="13" fill="#c2410c" text-anchor="start" font-weight="700">막힌 곳</text><text x="640" y="104" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">에이전트를 확대하는 대기업</text><text x="640" y="124" font-size="14" fill="#121821" text-anchor="start" font-weight="700">27% → 40%</text><text x="640" y="156" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">소기업</text><text x="640" y="176" font-size="14" fill="#121821" text-anchor="start" font-weight="700">약 22%에서 정체</text><text x="640" y="208" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">상위 1% 기업 직원당 지출</text><text x="640" y="228" font-size="14" fill="#121821" text-anchor="start" font-weight="700">7월 고점 대비 −3.1%</text><text x="640" y="260" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">엔지니어 1명이 감독하는 세션</text><text x="640" y="280" font-size="14" fill="#121821" text-anchor="start" font-weight="700">3~5개</text><text x="640" y="312" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">무료 소비자 에이전트 미국 다운로드 대 일 사용자</text><text x="640" y="332" font-size="14" fill="#121821" text-anchor="start" font-weight="700">1,000만 대 250만</text><text x="24" y="384" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">토큰 배수와 연산 배수는 저희 추정입니다. 나머지는 회사 발표와 설문이며 일부는 2차 자료입니다.</text></svg>