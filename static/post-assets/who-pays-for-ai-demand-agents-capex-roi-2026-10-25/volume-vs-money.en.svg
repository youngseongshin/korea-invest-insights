<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="AI usage is booming. AI spending is tied to price.. US business AI spend on Ramp, Aug 2 → Oct 11: Price per token −42%; Tokens used +65%; Money spent +1.5%. Google API tokens per minute: Q1 2026 16bn; Q2 2026 22bn, +37.5% in one quarter, ≈ 3.6x a year if it keeps up" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="340" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">AI usage is booming. AI spending is tied to price.</text><rect x="16" y="50" width="560" height="250" rx="8" fill="#2a78d6" fill-opacity="0.04" stroke="#2a78d6" stroke-width="1.4"/><rect x="588" y="50" width="356" height="250" rx="8" fill="#2e8b57" fill-opacity="0.04" stroke="#2e8b57" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">US business AI spend on Ramp, Aug 2 → Oct 11</text><text x="32" y="119" font-size="13" fill="#465160" text-anchor="start" font-weight="600">Price per token</text><rect x="204.0" y="104" width="126.0" height="22" rx="3" fill="#c2410c"/><text x="196.0" y="120" font-size="14" fill="#121821" text-anchor="end" font-weight="700">−42%</text><text x="32" y="181" font-size="13" fill="#465160" text-anchor="start" font-weight="600">Tokens used</text><rect x="330.0" y="166" width="195.0" height="22" rx="3" fill="#2a78d6"/><text x="533.0" y="182" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+65%</text><text x="32" y="243" font-size="13" fill="#465160" text-anchor="start" font-weight="600">Money spent</text><rect x="330.0" y="228" width="4.5" height="22" rx="3" fill="#6f7a88"/><text x="342.5" y="244" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+1.5%</text><line x1="330" y1="92" x2="330" y2="290" stroke="#6f7a88" stroke-width="1"/><text x="604" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Google API tokens per minute</text><rect x="660" y="196.4" width="64" height="75.6" rx="3" fill="#6f7a88"/><text x="692" y="188.36363636363637" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">16bn</text><text x="692" y="290" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">Q1 2026</text><rect x="790" y="168.0" width="64" height="104.0" rx="3" fill="#2e8b57"/><text x="822" y="160.0" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">22bn</text><text x="822" y="290" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">Q2 2026</text><text x="604" y="100" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="700">+37.5% in one quarter</text><text x="604" y="118" font-size="12" fill="#465160" text-anchor="start" font-weight="400">≈ 3.6x a year if it keeps up</text><text x="24" y="324" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Ramp AI Index (self-selected sample of US businesses). Alphabet Q2 2026 results. Tokens are the units AI models read and write.</text></svg>