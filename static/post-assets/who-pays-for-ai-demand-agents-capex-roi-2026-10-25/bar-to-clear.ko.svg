<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="넘어야 할 막대: AI 매출은 2030년까지 연 약 41%씩 커져야 합니다. 2026년 말 4,140억달러 (추정); 2027년 말 5,654억~6,614억 (저희 경로); 2030 손익분기 1.63조달러 (필요). 2027년 한 해 투자분만 연 약 3,970억달러 회수가 필요합니다. 지금 AI 매출 거의 전부입니다. 토큰 단가가 연 40~54% 내리면 사용량은 해마다 2.4~3.1배 늘어야 합니다. 구글 API 토큰: 연 약 3.6배 속도 에이전트는 사용자당 토큰이 채팅의 약 40배(추정)" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">넘어야 할 막대: AI 매출은 2030년까지 연 약 41%씩 커져야 합니다</text><rect x="70" y="236.4" width="90" height="53.6" rx="3" fill="#6f7a88"/><text x="115" y="210.42352941176472" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">4,140억달러</text><text x="115" y="227.42352941176472" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">추정</text><text x="115" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">2026년 말</text><rect x="240" y="204.5" width="90" height="12.4" rx="3" fill="#2a78d6" fill-opacity="0.35"/><rect x="240" y="216.9" width="90" height="73.1" fill="#2a78d6"/><text x="285" y="178.45882352941175" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">5,654억~6,614억</text><text x="285" y="195.45882352941175" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">저희 경로</text><text x="285" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">2027년 말</text><rect x="410" y="79.1" width="90" height="210.9" rx="3" fill="none" stroke="#6250d6" stroke-width="2" stroke-dasharray="6 4"/><text x="455" y="53.05882352941174" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">1.63조달러</text><text x="455" y="70.05882352941174" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">필요</text><text x="455" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">2030 손익분기</text><line x1="50" y1="290" x2="580" y2="290" stroke="#6f7a88"/><path d="M175,196 Q 420,60 505,83" fill="none" stroke="#6250d6" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="330" y="76" font-size="13" fill="#6250d6" text-anchor="middle" font-weight="700">연 약 +41%</text><rect x="608" y="70" width="336" height="178" rx="8" fill="#2e8b57" fill-opacity="0.06" stroke="#2e8b57" stroke-width="1.4"/><text x="624" y="98" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">토큰 단가가 연 40~54% 내리면</text><text x="624" y="128" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">사용량은 해마다 2.4~3.1배 늘어야 합니다.</text><text x="624" y="158" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">구글 API 토큰: 연 약 3.6배 속도</text><text x="624" y="196" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">에이전트는 사용자당 토큰이</text><text x="624" y="226" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">채팅의 약 40배(추정)</text><text x="24" y="340" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">2027년 한 해 투자분만 연 약 3,970억달러 회수가 필요합니다. 지금 AI 매출 거의 전부입니다.</text><text x="24" y="386" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">AI 연환산 매출(ARR) 출발점은 외부 추정(Tech Fund)입니다. 경로와 손익분기는 저희 모형이며 특정 회사 전망이 아닙니다.</text></svg>