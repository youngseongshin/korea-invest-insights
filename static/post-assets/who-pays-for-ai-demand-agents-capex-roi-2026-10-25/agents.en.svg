<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Delegated agents: the engine that has to beat falling prices. Tokens per daily user: Chat 1x, Delegated agent ~40x. Agents read pages, call tools and run for hours. 78% of their input is cached, so compute rises ~6x. Where it is growing: OpenRouter weekly tokens ~5x, May → Sep; Salesforce agentic work units +97% QoQ; ServiceNow agentic deployments 9x in 9 months; Microsoft 1tn-token customers 4x YoY; GitHub pull requests with an agent 1 in 3. Where it is stuck: Large firms scaling agents 27% → 40%; Small firms about 22%, flat; Top-1% spenders per employee −3.1% from July; Agent sessions one engineer can watch 3–5; Free consumer agent: US downloads vs daily users 10M vs 2.5M" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">Delegated agents: the engine that has to beat falling prices</text><rect x="16" y="50" width="268" height="310" rx="8" fill="#6250d6" fill-opacity="0.05" stroke="#6250d6" stroke-width="1.4"/><text x="32" y="76" font-size="13" fill="#121821" text-anchor="start" font-weight="700">Tokens per daily user</text><rect x="52" y="232.8" width="64" height="3.2" rx="3" fill="#6f7a88"/><text x="84" y="224.75" font-size="15" fill="#121821" text-anchor="middle" font-weight="700">1x</text><text x="84" y="254" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">Chat</text><rect x="164" y="106.0" width="64" height="130.0" rx="3" fill="#6250d6"/><text x="196" y="98.0" font-size="15" fill="#121821" text-anchor="middle" font-weight="700">~40x</text><text x="196" y="254" font-size="11.5" fill="#465160" text-anchor="middle" font-weight="400">Delegated agent</text><text x="32" y="284" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Agents read pages, call tools and</text><text x="32" y="301" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">run for hours. 78% of their input</text><text x="32" y="318" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">is cached, so compute rises ~6x.</text><rect x="296" y="50" width="316" height="310" rx="8" fill="#2e8b57" fill-opacity="0.05" stroke="#2e8b57" stroke-width="1.4"/><text x="312" y="76" font-size="13" fill="#2e8b57" text-anchor="start" font-weight="700">Where it is growing</text><text x="312" y="104" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">OpenRouter weekly tokens</text><text x="312" y="124" font-size="14" fill="#121821" text-anchor="start" font-weight="700">~5x, May → Sep</text><text x="312" y="156" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Salesforce agentic work units</text><text x="312" y="176" font-size="14" fill="#121821" text-anchor="start" font-weight="700">+97% QoQ</text><text x="312" y="208" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">ServiceNow agentic deployments</text><text x="312" y="228" font-size="14" fill="#121821" text-anchor="start" font-weight="700">9x in 9 months</text><text x="312" y="260" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Microsoft 1tn-token customers</text><text x="312" y="280" font-size="14" fill="#121821" text-anchor="start" font-weight="700">4x YoY</text><text x="312" y="312" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">GitHub pull requests with an agent</text><text x="312" y="332" font-size="14" fill="#121821" text-anchor="start" font-weight="700">1 in 3</text><rect x="624" y="50" width="320" height="310" rx="8" fill="#eb6834" fill-opacity="0.05" stroke="#eb6834" stroke-width="1.4"/><text x="640" y="76" font-size="13" fill="#c2410c" text-anchor="start" font-weight="700">Where it is stuck</text><text x="640" y="104" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Large firms scaling agents</text><text x="640" y="124" font-size="14" fill="#121821" text-anchor="start" font-weight="700">27% → 40%</text><text x="640" y="156" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Small firms</text><text x="640" y="176" font-size="14" fill="#121821" text-anchor="start" font-weight="700">about 22%, flat</text><text x="640" y="208" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Top-1% spenders per employee</text><text x="640" y="228" font-size="14" fill="#121821" text-anchor="start" font-weight="700">−3.1% from July</text><text x="640" y="260" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Agent sessions one engineer can watch</text><text x="640" y="280" font-size="14" fill="#121821" text-anchor="start" font-weight="700">3–5</text><text x="640" y="312" font-size="11.5" fill="#465160" text-anchor="start" font-weight="400">Free consumer agent: US downloads vs daily users</text><text x="640" y="332" font-size="14" fill="#121821" text-anchor="start" font-weight="700">10M vs 2.5M</text><text x="24" y="384" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">Token multiple and compute multiple are our estimates. Other figures: company reports and surveys; some secondary.</text></svg>