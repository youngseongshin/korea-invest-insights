<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="AI는 지금 제값을 하나: 누구에게 묻느냐에 따라 다릅니다. 연산 소유자: 그렇다, 새 계약, MW당 연 2,000만~2,500만달러 손익분기, MW당 연 950만~1,290만 → 1.6~2.6배; 빅테크 회사 전체: 그렇다, 하락 중, 투하자본이익률(ROIC) 27.8% → 20.1% 저희가 쓰는 허들 12%: 아직 위; 최종 고객 지불만: 아직 아니다, 깔린 AI 설비의 연간 비용 약 3,590억달러 유료 AI가 덮는 몫 2,070억~2,900억(58~81%). 연 약 700억~1,500억달러의 부족분은 빅테크의 기존 사업 현금과 자본시장이 메웁니다." style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">AI는 지금 제값을 하나: 누구에게 묻느냐에 따라 다릅니다</text><rect x="16" y="50" width="300" height="236" rx="8" fill="#2e8b57" fill-opacity="0.06" stroke="#2e8b57" stroke-width="1.4"/><text x="34" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">연산 소유자</text><rect x="34" y="92" width="90" height="28" rx="14" fill="#2e8b57"/><text x="46" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">그렇다</text><text x="34" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">새 계약, MW당 연</text><text x="34" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">2,000만~2,500만달러</text><text x="34" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">손익분기, MW당 연</text><text x="34" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">950만~1,290만 → 1.6~2.6배</text><rect x="332" y="50" width="300" height="236" rx="8" fill="#2a78d6" fill-opacity="0.06" stroke="#2a78d6" stroke-width="1.4"/><text x="350" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">빅테크 회사 전체</text><rect x="350" y="92" width="150" height="28" rx="14" fill="#2a78d6"/><text x="362" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">그렇다, 하락 중</text><text x="350" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">투하자본이익률(ROIC)</text><text x="350" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">27.8% → 20.1%</text><text x="350" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">저희가 쓰는 허들</text><text x="350" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">12%: 아직 위</text><rect x="648" y="50" width="300" height="236" rx="8" fill="#eb6834" fill-opacity="0.06" stroke="#eb6834" stroke-width="1.4"/><text x="666" y="80" font-size="14" fill="#121821" text-anchor="start" font-weight="700">최종 고객 지불만</text><rect x="666" y="92" width="108" height="28" rx="14" fill="#eb6834"/><text x="678" y="111" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="700">아직 아니다</text><text x="666" y="150" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">깔린 AI 설비의 연간 비용</text><text x="666" y="182" font-size="15" fill="#121821" text-anchor="start" font-weight="700">약 3,590억달러</text><text x="666" y="214" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">유료 AI가 덮는 몫</text><text x="666" y="246" font-size="15" fill="#121821" text-anchor="start" font-weight="700">2,070억~2,900억(58~81%)</text><text x="24" y="314" font-size="13" fill="#121821" text-anchor="start" font-weight="600">연 약 700억~1,500억달러의 부족분은 빅테크의 기존 사업 현금과 자본시장이 메웁니다.</text><text x="24" y="362" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">손익분기와 비율은 저희 모형(칩 5년, 건물 20년, 요구수익률 12%)입니다. ROIC는 아폴로 차트 판독(2차)입니다.</text></svg>