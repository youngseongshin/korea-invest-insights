<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="AI 유료 수요의 일곱 종류, 강한 순서대로. 기업: 기업 IT·업무 예산, MS AI 연 370억달러, 코파일럿 3,000만 좌석, MS AI +123%, 상; 에이전트: 주로 기업, 깃허브 PR 3건 중 1건에 에이전트 관여, 세일즈포스 에이전트 작업 +97%(QoQ), 상: 물량 레버; API: 개발자·기업, 구글 분당 220억 토큰, 토큰 +37%(QoQ), 단가 하락, 중상: 프런티어만; 광고: 광고주, 메타 3분기 광고 631억달러, +26%(YoY), 상, 기존 예산 이동; 개인: 소비자, 세계 연 약 400억달러, 1년에 3.3배, 넓고 얕음; 구독: 개인·팀, 월 8~200달러 정액, 둔화, 입장권이지 레버 아님; 수수료: 가맹점, 거의 0, 첫 4% 수수료 철회, 공시 없음, 미검증" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="470" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">AI 유료 수요의 일곱 종류, 강한 순서대로</text><text x="168" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">누가 내나</text><text x="340" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">지금 크기</text><text x="610" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">성장</text><text x="790" y="66" font-size="11.5" fill="#6f7a88" text-anchor="start" font-weight="700">질</text><rect x="16" y="80" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="80" width="5" height="44" rx="2" fill="#2e8b57"/><text x="32" y="107" font-size="14" fill="#121821" text-anchor="start" font-weight="700">기업</text><text x="168" y="107" font-size="12" fill="#465160" text-anchor="start" font-weight="400">기업 IT·업무 예산</text><text x="340" y="107" font-size="12" fill="#121821" text-anchor="start" font-weight="600">MS AI 연 370억달러, 코파일럿 3,000만 좌석</text><text x="610" y="107" font-size="12" fill="#465160" text-anchor="start" font-weight="400">MS AI +123%</text><text x="790" y="107" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="700">상</text><rect x="16" y="130" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="130" width="5" height="44" rx="2" fill="#2e8b57"/><text x="32" y="157" font-size="14" fill="#121821" text-anchor="start" font-weight="700">에이전트</text><text x="168" y="157" font-size="12" fill="#465160" text-anchor="start" font-weight="400">주로 기업</text><text x="340" y="157" font-size="12" fill="#121821" text-anchor="start" font-weight="600">깃허브 PR 3건 중 1건에 에이전트 관여</text><text x="610" y="157" font-size="12" fill="#465160" text-anchor="start" font-weight="400">세일즈포스 에이전트 작업 +97%(QoQ)</text><text x="790" y="157" font-size="12" fill="#2e8b57" text-anchor="start" font-weight="700">상: 물량 레버</text><rect x="16" y="180" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="180" width="5" height="44" rx="2" fill="#2a78d6"/><text x="32" y="207" font-size="14" fill="#121821" text-anchor="start" font-weight="700">API</text><text x="168" y="207" font-size="12" fill="#465160" text-anchor="start" font-weight="400">개발자·기업</text><text x="340" y="207" font-size="12" fill="#121821" text-anchor="start" font-weight="600">구글 분당 220억 토큰</text><text x="610" y="207" font-size="12" fill="#465160" text-anchor="start" font-weight="400">토큰 +37%(QoQ), 단가 하락</text><text x="790" y="207" font-size="12" fill="#2a78d6" text-anchor="start" font-weight="700">중상: 프런티어만</text><rect x="16" y="230" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="230" width="5" height="44" rx="2" fill="#2a78d6"/><text x="32" y="257" font-size="14" fill="#121821" text-anchor="start" font-weight="700">광고</text><text x="168" y="257" font-size="12" fill="#465160" text-anchor="start" font-weight="400">광고주</text><text x="340" y="257" font-size="12" fill="#121821" text-anchor="start" font-weight="600">메타 3분기 광고 631억달러</text><text x="610" y="257" font-size="12" fill="#465160" text-anchor="start" font-weight="400">+26%(YoY)</text><text x="790" y="257" font-size="12" fill="#2a78d6" text-anchor="start" font-weight="700">상, 기존 예산 이동</text><rect x="16" y="280" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="280" width="5" height="44" rx="2" fill="#b7791f"/><text x="32" y="307" font-size="14" fill="#121821" text-anchor="start" font-weight="700">개인</text><text x="168" y="307" font-size="12" fill="#465160" text-anchor="start" font-weight="400">소비자</text><text x="340" y="307" font-size="12" fill="#121821" text-anchor="start" font-weight="600">세계 연 약 400억달러</text><text x="610" y="307" font-size="12" fill="#465160" text-anchor="start" font-weight="400">1년에 3.3배</text><text x="790" y="307" font-size="12" fill="#b7791f" text-anchor="start" font-weight="700">넓고 얕음</text><rect x="16" y="330" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="330" width="5" height="44" rx="2" fill="#b7791f"/><text x="32" y="357" font-size="14" fill="#121821" text-anchor="start" font-weight="700">구독</text><text x="168" y="357" font-size="12" fill="#465160" text-anchor="start" font-weight="400">개인·팀</text><text x="340" y="357" font-size="12" fill="#121821" text-anchor="start" font-weight="600">월 8~200달러 정액</text><text x="610" y="357" font-size="12" fill="#465160" text-anchor="start" font-weight="400">둔화</text><text x="790" y="357" font-size="12" fill="#b7791f" text-anchor="start" font-weight="700">입장권이지 레버 아님</text><rect x="16" y="380" width="928" height="44" rx="6" fill="#f6f8fa"/><rect x="16" y="380" width="5" height="44" rx="2" fill="#6f7a88"/><text x="32" y="407" font-size="14" fill="#121821" text-anchor="start" font-weight="700">수수료</text><text x="168" y="407" font-size="12" fill="#465160" text-anchor="start" font-weight="400">가맹점</text><text x="340" y="407" font-size="12" fill="#121821" text-anchor="start" font-weight="600">거의 0, 첫 4% 수수료 철회</text><text x="610" y="407" font-size="12" fill="#465160" text-anchor="start" font-weight="400">공시 없음</text><text x="790" y="407" font-size="12" fill="#465160" text-anchor="start" font-weight="700">미검증</text><text x="24" y="454" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">크기는 기준(연환산·인식 매출·설문)이 다르고 서로 겹치므로 더하지 않습니다. 질은 저희 판단입니다.</text></svg>