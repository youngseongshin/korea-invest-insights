<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="The bar to clear: AI revenue must grow about 41% a year to 2030. End-2026 $414bn (estimate); End-2027 $565–661bn (our path); 2030 breakeven $1.63tn (needed). One year of 2027 spending needs about $397bn a year back, almost all of today's AI revenue. If token prices fall 40–54% a year, usage must grow 2.4–3.1x a year. Google API tokens: about 3.6x pace. Agents use about 40x the tokens of chat per daily user (estimate)." style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a88"/></marker></defs><rect x="0" y="0" width="960" height="400" fill="#ffffff"/><text x="24" y="32" font-size="16" fill="#121821" text-anchor="start" font-weight="700">The bar to clear: AI revenue must grow about 41% a year to 2030</text><rect x="70" y="236.4" width="90" height="53.6" rx="3" fill="#6f7a88"/><text x="115" y="210.42352941176472" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">$414bn</text><text x="115" y="227.42352941176472" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">estimate</text><text x="115" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">End-2026</text><rect x="240" y="204.5" width="90" height="12.4" rx="3" fill="#2a78d6" fill-opacity="0.35"/><rect x="240" y="216.9" width="90" height="73.1" fill="#2a78d6"/><text x="285" y="178.45882352941175" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">$565–661bn</text><text x="285" y="195.45882352941175" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">our path</text><text x="285" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">End-2027</text><rect x="410" y="79.1" width="90" height="210.9" rx="3" fill="none" stroke="#6250d6" stroke-width="2" stroke-dasharray="6 4"/><text x="455" y="53.05882352941174" font-size="14" fill="#121821" text-anchor="middle" font-weight="700">$1.63tn</text><text x="455" y="70.05882352941174" font-size="11" fill="#6f7a88" text-anchor="middle" font-weight="400">needed</text><text x="455" y="308" font-size="12" fill="#465160" text-anchor="middle" font-weight="600">2030 breakeven</text><line x1="50" y1="290" x2="580" y2="290" stroke="#6f7a88"/><path d="M175,196 Q 420,60 505,83" fill="none" stroke="#6250d6" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="4 3"/><text x="330" y="76" font-size="13" fill="#6250d6" text-anchor="middle" font-weight="700">≈ +41% / yr</text><rect x="608" y="70" width="336" height="178" rx="8" fill="#2e8b57" fill-opacity="0.06" stroke="#2e8b57" stroke-width="1.4"/><text x="624" y="98" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">If token prices fall 40–54% a year,</text><text x="624" y="128" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">usage must grow 2.4–3.1x a year.</text><text x="624" y="158" font-size="12.5" fill="#121821" text-anchor="start" font-weight="700">Google API tokens: about 3.6x pace.</text><text x="624" y="196" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">Agents use about 40x the tokens</text><text x="624" y="226" font-size="12.5" fill="#465160" text-anchor="start" font-weight="400">of chat per daily user (estimate).</text><text x="24" y="340" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">One year of 2027 spending needs about $397bn a year back, almost all of today's AI revenue.</text><text x="24" y="386" font-size="11" fill="#6f7a88" text-anchor="start" font-weight="400">AI revenue run-rate (ARR) start point is a third-party estimate (Tech Fund). Path and breakeven are our model; not forecasts of any company.</text></svg>