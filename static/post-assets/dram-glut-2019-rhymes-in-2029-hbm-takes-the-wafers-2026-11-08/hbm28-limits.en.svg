"11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">+100%</text><rect x="250.0" y="70.0" width="92.0" height="220.0" fill="#fbe3e0" rx="0" fill-opacity="0.7"/><line x1="342.0" y1="70.0" x2="342.0" y2="290.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="338.0" y="254.0" font-size="11" fill="#c0392b" text-anchor="end" font-weight="bold">Below +20%,</text><text x="338.0" y="268.0" font-size="11" fill="#c0392b" text-anchor="end" font-weight="normal">the glut moves</text><text x="338.0" y="282.0" font-size="11" fill="#c0392b" text-anchor="end" font-weight="normal">into 2028</text><text x="238.0" y="108.0" font-size="13" fill="#17212b" text-anchor="end" font-weight="bold">Demand ceiling</text><text x="238.0" y="124.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">advanced packaging × GB per stack</text><line x1="346.6" y1="114.0" x2="673.2" y2="114.0" stroke="#9aa3ad" stroke-width="6" stroke-linecap="round"/><text x="350.6" y="102.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">+21%</text><text x="673.2" y="102.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">+92%</text><circle cx="493.8" cy="114.0" r="8.0" fill="#9aa3ad" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><text x="493.8" y="136.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+53%</text><text x="238.0" y="170.0" font-size="13" fill="#17212b" text-anchor="end" font-weight="bold">Supply</text><text x="238.0" y="186.0" font-size="10.5" fill="#5b6774" text-anchor="end" font-weight="normal">HBM wafer allocation × bits per wafer</text><line x1="282.2" y1="176.0" x2="493.8" y2="176.0" stroke="#d9822b" stroke-width="6" stroke-linecap="round"/><text x="286.2" y="164.0" font-