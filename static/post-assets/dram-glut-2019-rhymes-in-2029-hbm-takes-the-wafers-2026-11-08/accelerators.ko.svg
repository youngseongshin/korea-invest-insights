<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="hbm per accelerator"><rect x="-20" y="-20" width="800" height="390" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">HBM 비트 = 가속기 대수 × 가속기 한 대의 탑재량</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">가속기 한 대에 들어가는 HBM, GB</text><text x="208.0" y="94.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">AMD MI455X (2026)</text><rect x="220.0" y="80.0" width="367.2" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="595.2" y="96.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">432</text><text x="631.2" y="96.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 12단 × 12</text><text x="208.0" y="130.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">엔비디아 루빈 (2026)</text><rect x="220.0" y="116.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="132.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="132.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 12단 × 8</text><text x="208.0" y="166.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">구글 TPU v8i</text><rect x="220.0" y="152.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="168.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="168.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM3E</text><text x="208.0" y="202.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">MS 마이아 300 (2027)</text><rect x="220.0" y="188.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="204.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="204.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 × 8</text><text x="208.0" y="238.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">구글 TPU v8t</text><rect x="220.0" y="224.0" width="183.6" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="411.6" y="240.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">216</text><text x="447.6" y="240.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM3E</text><rect x="24.0" y="262.0" width="712.0" height="58.0" fill="#eef0f3" rx="6" fill-opacity="1.0"/><text x="40.0" y="284.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">엔비디아 루빈 울트라(2027): 12단 HBM4E가 원 계획, 3분기부터 8단 구성도 평가 중(최종 미정)</text><text x="40.0" y="304.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">8단으로 줄이면 같은 HBM 비트로 GPU를 더 만들 수 있습니다. 가속기 대수가 따라 늘지 않으면 HBM 비트가 줄어듭니다</text><text x="24.0" y="336.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">자료: 엔비디아·AMD·MS 발표, 구글 발표 보도, TrendForce 8/4·10/27(2차)</text></svg>