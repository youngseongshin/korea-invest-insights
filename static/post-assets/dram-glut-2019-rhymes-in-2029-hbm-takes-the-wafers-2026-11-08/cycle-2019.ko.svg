<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="2019년 사이클"><rect x="-20" y="-20" width="800" height="440" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">2019년: 공장을 거의 늘리지 않고도 비트가 늘었고, 수요가 꺾이자 가격이 30% 내렸습니다</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">업계 D램 비트 증가(당시 전망), 마이크론 D램 평균판매가격 변화, 마이크론 재고일수(회계연도 말)</text><text x="24.0" y="84.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">업계 비트 증가율, %</text><line x1="24.0" y1="300.0" x2="236.0" y2="300.0" stroke="#b9bec8" stroke-width="1"/><rect x="34.0" y="165.6" width="50.0" height="134.4" fill="#2a6fc9" rx="3" fill-opacity="0.85"/><text x="59.0" y="158.6" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">20% 남짓</text><text x="59.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">2018 공급</text><rect x="102.0" y="172.0" width="50.0" height="128.0" fill="#9aa3ad" rx="3" fill-opacity="0.85"/><text x="127.0" y="165.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">약 20%</text><text x="127.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">2018 수요</text><rect x="170.0" y="204.0" width="50.0" height="96.0" fill="#9aa3ad" rx="3" fill-opacity="0.85"/><text x="195.0" y="197.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">10%대 중반</text><text x="195.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">2019 수요</text><text x="130.0" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">공급과 수요 격차 약 5%p</text><text x="286.0" y="84.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">마이크론 D램 ASP, 전년 대비</text><line x1="286.0" y1="200.0" x2="486.0" y2="200.0" stroke="#b9bec8" stroke-width="1"/><rect x="316.0" y="110.0" width="56.0" height="90.0" fill="#2a6fc9" rx="3" fill-opacity="0.85"/><text x="344.0" y="103.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">약 +35%</text><text x="344.0" y="217.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">FY2018</text><rect x="406.0" y="200.0" width="56.0" height="77.1" fill="#c0392b" rx="3" fill-opacity="0.85"/><text x="434.0" y="294.1" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">약 −30%</text><text x="434.0" y="192.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">FY2019</text><text x="530.0" y="84.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">마이크론 재고일수, 일</text><line x1="530.0" y1="300.0" x2="736.0" y2="300.0" stroke="#b9bec8" stroke-width="1"/><rect x="540.0" y="197.6" width="48.0" height="102.4" fill="#9aa3ad" rx="3" fill-opacity="0.85"/><text x="564.0" y="190.6" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">96</text><text x="564.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">FY2017</text><rect x="606.0" y="188.0" width="48.0" height="112.0" fill="#9aa3ad" rx="3" fill-opacity="0.85"/><text x="630.0" y="181.0" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">105</text><text x="630.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">FY2018</text><rect x="672.0" y="143.2" width="48.0" height="156.8" fill="#c0392b" rx="3" fill-opacity="0.85"/><text x="696.0" y="136.2" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">147</text><text x="696.0" y="317.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">FY2019</text><text x="633.0" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">재고 +42%, 매출원가 +2%(FY2019)</text><text x="24.0" y="386.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">자료: 마이크론 10-K·SEC XBRL(재고 ÷ 연간 매출원가 × 365), 업계 비트는 마이크론 콜 사본(2차, 당시 전망)</text></svg>