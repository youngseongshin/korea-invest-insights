<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="hbm per accelerator"><rect x="-20" y="-20" width="800" height="390" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">HBM bits = number of accelerators × HBM per accelerator</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">HBM per accelerator, GB</text><text x="208.0" y="94.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">AMD MI455X (2026)</text><rect x="220.0" y="80.0" width="367.2" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="595.2" y="96.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">432</text><text x="631.2" y="96.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 12-high × 12</text><text x="208.0" y="130.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">NVIDIA Rubin (2026)</text><rect x="220.0" y="116.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="132.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="132.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 12-high × 8</text><text x="208.0" y="166.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Google TPU v8i</text><rect x="220.0" y="152.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="168.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="168.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM3E</text><text x="208.0" y="202.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Microsoft Maia 300 (2027)</text><rect x="220.0" y="188.0" width="244.8" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="472.8" y="204.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">288</text><text x="508.8" y="204.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4 × 8</text><text x="208.0" y="238.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="normal">Google TPU v8t</text><rect x="220.0" y="224.0" width="183.6" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.8"/><text x="411.6" y="240.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">216</text><text x="447.6" y="240.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">HBM3E</text><rect x="24.0" y="262.0" width="712.0" height="58.0" fill="#eef0f3" rx="6" fill-opacity="1.0"/><text x="40.0" y="284.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">NVIDIA Rubin Ultra (2027): 12-high HBM4E was the plan; 8-high options under review since 3Q (not final)</text><text x="40.0" y="304.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">8-high lets the same HBM bits serve more GPUs. If accelerator counts do not rise with it, HBM bits fall</text><text x="24.0" y="336.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Source: NVIDIA, AMD and Microsoft disclosures; Google announcement coverage; TrendForce Aug 4 and Oct 27 (secondary)</text></svg>