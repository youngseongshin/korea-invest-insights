<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="signposts"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">What to check, in order: from Micron in December to 2028 HBM contracts in 2H27</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">The question each event answers and how to read it</text><circle cx="60.0" cy="94.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="104.0" x2="60.0" y2="146.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="90.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">Mid-Dec</text><text x="80.0" y="108.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Micron FQ1 FY27 (date not set)</text><text x="310.0" y="100.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2028 bit outlook (HBM, conventional), contracts, tool move-in</text><circle cx="60.0" cy="156.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="166.0" x2="60.0" y2="208.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="152.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">Mid-Jan</text><text x="80.0" y="170.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">TSMC 4Q26</text><text x="310.0" y="162.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Is CoWoS ~200k/month at end-2027? (230k+ up, 170k− down)</text><circle cx="60.0" cy="218.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="228.0" x2="60.0" y2="270.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="214.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">Late Jan</text><text x="80.0" y="232.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">SK hynix and Samsung 4Q26</text><text x="310.0" y="224.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2028 HBM capacity ~+30%? (+40%+ more wafers, +20%− fewer)</text><circle cx="60.0" cy="280.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="290.0" x2="60.0" y2="332.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="276.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">1H27</text><text x="80.0" y="294.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Rubin Ultra HBM configuration</text><text x="310.0" y="286.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">12-high HBM4E confirmed, or mostly 8-high?</text><circle cx="60.0" cy="342.0" r="8.0" fill="#d9822b" fill-opacity="1.0"/><text x="80.0" y="338.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">2H27</text><text x="80.0" y="356.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">2028 HBM contracts</text><text x="310.0" y="348.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Bits under +20% plus price cuts pull the glut into 2028</text><text x="24.0" y="406.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Thresholds are our model's base values. Dates are estimates before company announcements</text></svg>