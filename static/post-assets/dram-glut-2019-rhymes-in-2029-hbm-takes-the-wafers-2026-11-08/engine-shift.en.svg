<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="engine shift"><rect x="-20" y="-20" width="800" height="384" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">The engine of bit growth has changed: shrinks in 2018, new wafers in 2028</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Where industry DRAM bit growth comes from, % a year. 2018 is an estimate, 2028 an assumption</text><line x1="170.0" y1="72.0" x2="170.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="170.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0%</text><line x1="255.0" y1="72.0" x2="255.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="255.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">5%</text><line x1="340.0" y1="72.0" x2="340.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="340.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">10%</text><line x1="425.0" y1="72.0" x2="425.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="425.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">15%</text><line x1="510.0" y1="72.0" x2="510.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="510.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">20%</text><line x1="595.0" y1="72.0" x2="595.0" y2="222.0" stroke="#e6e9ee" stroke-width="1"/><text x="595.0" y="238.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">25%</text><text x="158.0" y="116.0" font-size="13" fill="#17212b" text-anchor="end" font-weight="bold">2018</text><text x="158.0" y="132.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">industry bits 20%+</text><rect x="170.0" y="92.0" width="297.5" height="40.0" fill="#7a5cc2" rx="2" fill-opacity="0.85"/><text x="318.8" y="117.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Shrinks 15–20%</text><line x1="425.0" y1="138.0" x2="510.0" y2="138.0" stroke="#7a5cc2" stroke-width="2"/><rect x="467.5" y="92.0" width="42.5" height="40.0" fill="#2a6fc9" rx="2" fill-opacity="0.85"/><text x="527.0" y="117.0" font-size="11" fill="#2a6fc9" text-anchor="start" font-weight="normal">almost no new wafers</text><text x="158.0" y="186.0" font-size="13" fill="#17212b" text-anchor="end" font-weight="bold">2028</text><text x="158.0" y="202.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">~+24% before HBM</text><rect x="170.0" y="162.0" width="258.4" height="40.0" fill="#2a6fc9" rx="2" fill-opacity="0.85"/><text x="299.2" y="187.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">New wafers +15.2%</text><rect x="428.4" y="162.0" width="136.0" height="40.0" fill="#7a5cc2" rx="2" fill-opacity="0.85"/><text x="496.4" y="187.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">Shrinks 6–11%</text><line x1="530.4" y1="208.0" x2="615.4" y2="208.0" stroke="#7a5cc2" stroke-width="2"/><text x="24.0" y="268.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">New wafers need new cleanrooms and tools. About 30% of wafers (2027) already go to HBM first.</text><text x="24.0" y="316.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Source: Micron call copies (secondary); wafers +15.2% is a four-maker capacity estimate (SemiAnalysis); shrinks</text><text x="24.0" y="330.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">6–11% = node gain × conversion share</text></svg>