<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="roadmap"><rect x="-20" y="-20" width="800" height="470" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">The process engine may return around 2030 with 3D DRAM</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">DRAM, HBM and NAND technology timing (company plans and reports; may change)</text><line x1="190.0" y1="70.0" x2="190.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="236.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2026</text><line x1="282.0" y1="70.0" x2="282.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="328.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2027</text><line x1="374.0" y1="70.0" x2="374.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="420.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2028</text><line x1="466.0" y1="70.0" x2="466.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="512.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2029</text><line x1="558.0" y1="70.0" x2="558.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="604.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2030</text><line x1="650.0" y1="70.0" x2="650.0" y2="330.0" stroke="#e6e9ee" stroke-width="1"/><text x="696.0" y="346.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">2031</text><text x="24.0" y="101.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">DRAM 6F² shrinks</text><rect x="192.0" y="85.0" width="88.0" height="22.0" fill="#7a5cc2" rx="3" fill-opacity="0.85"/><text x="236.0" y="100.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1γ</text><rect x="330.0" y="85.0" width="134.0" height="22.0" fill="#7a5cc2" rx="3" fill-opacity="0.85"/><text x="397.0" y="100.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1δ·1d</text><text x="24.0" y="149.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">New DRAM structures</text><rect x="376.0" y="133.0" width="180.0" height="22.0" fill="#2a6fc9" rx="3" fill-opacity="0.25" stroke="#2a6fc9" stroke-width="1" stroke-dasharray="4 3"/><text x="466.0" y="148.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="bold">4F²/VCT, 10a target 2028 (uncertain)</text><text x="24.0" y="197.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold"></text><rect x="523.2" y="181.0" width="216.8" height="22.0" fill="#2a6fc9" rx="3" fill-opacity="0.25" stroke="#2a6fc9" stroke-width="1" stroke-dasharray="4 3"/><text x="631.6" y="196.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="bold">3D DRAM, around 2030 (est.)</text><text x="24.0" y="245.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">HBM</text><rect x="192.0" y="229.0" width="88.0" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="236.0" y="244.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HBM4</text><rect x="284.0" y="229.0" width="88.0" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="328.0" y="244.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HBM4E</text><rect x="376.0" y="229.0" width="106.4" height="22.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="429.2" y="244.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HBM5, vertical</text><text x="24.0" y="293.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">NAND</text><rect x="330.0" y="277.0" width="134.0" height="22.0" fill="#3f8f5a" rx="3" fill-opacity="0.85"/><text x="397.0" y="292.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">G11 400+ layers, ~2x bits</text><text x="24.0" y="372.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">6F² will be stretched with EUV as long as possible (SK hynix). 3D DRAM adds bits by stacking layers, like NAND.</text><text x="24.0" y="402.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Source: Micron webinar, SK hynix Sep 8 forum, The Elec, The Bell, imec (secondary). 4F² bits per wafer may gain less</text><text x="24.0" y="416.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">than cell area</text></svg>