<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="hbm share"><rect x="-20" y="-20" width="800" height="370" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">In 2027 HBM is set to take 30% of wafers and make 13% of bits</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">HBM share of the three makers' DRAM wafer starts, % (incl. outlook)</text><line x1="60.0" y1="250.0" x2="520.0" y2="250.0" stroke="#b9bec8" stroke-width="1"/><line x1="60.0" y1="200.0" x2="520.0" y2="200.0" stroke="#e6e9ee" stroke-width="1"/><text x="54.0" y="204.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">10%</text><line x1="60.0" y1="150.0" x2="520.0" y2="150.0" stroke="#e6e9ee" stroke-width="1"/><text x="54.0" y="154.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">20%</text><line x1="60.0" y1="100.0" x2="520.0" y2="100.0" stroke="#e6e9ee" stroke-width="1"/><text x="54.0" y="104.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">30%</text><rect x="90.0" y="160.0" width="64.0" height="90.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="122.0" y="153.0" font-size="13" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">18%</text><text x="122.0" y="267.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">wafers 2025</text><rect x="200.0" y="140.0" width="64.0" height="110.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="232.0" y="133.0" font-size="13" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">22%</text><text x="232.0" y="267.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">wafers 2026</text><rect x="310.0" y="100.0" width="64.0" height="150.0" fill="#d9822b" rx="3" fill-opacity="0.85"/><text x="342.0" y="93.0" font-size="13" fill="#17212b" text-anchor="middle" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">30%</text><text x="342.0" y="267.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">wafers 2027</text><rect x="420.0" y="185.0" width="64.0" height="65.0" fill="#d9822b" rx="3" fill-opacity="0.35" stroke="#d9822b" stroke-width="1" stroke-dasharray="4 3"/><text x="452.0" y="178.0" font-size="13" fill="#17212b" text-anchor="middle" font-weight="bold">~13%</text><text x="452.0" y="267.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="normal">bits 2027</text><rect x="548.0" y="92.0" width="188.0" height="150.0" fill="#eef0f3" rx="6" fill-opacity="1.0"/><text x="560.0" y="116.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Two numbers, same year</text><text x="560.0" y="140.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">HBM: 30 wafers → 13 bits</text><text x="560.0" y="160.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Conv.: 70 wafers → 87 bits</text><text x="560.0" y="190.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">For the same bits, HBM</text><text x="560.0" y="208.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">uses ~2.9x the wafers</text><text x="560.0" y="226.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">(13/30 vs 87/70)</text><text x="24.0" y="316.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">Source: TrendForce (secondary). The 13% bit share for 2027 is our model value</text></svg>