<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="signposts"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="30.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">확인 순서: 12월 마이크론부터 2027년 하반기 2028년분 HBM 계약까지</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">각 일정이 답하는 질문과 판정 기준</text><circle cx="60.0" cy="94.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="104.0" x2="60.0" y2="146.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="90.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">12월 중순</text><text x="80.0" y="108.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">마이크론 FQ1 FY27(일정 미확정)</text><text x="310.0" y="100.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2028년 HBM·범용 비트 전망, 2028년분 계약, 장비 반입</text><circle cx="60.0" cy="156.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="166.0" x2="60.0" y2="208.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="152.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">1월 중순</text><text x="80.0" y="170.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">TSMC 4Q26</text><text x="310.0" y="162.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">CoWoS 2027년 말 월 20만장 안팎인지(23만↑ 상향, 17만↓ 하향)</text><circle cx="60.0" cy="218.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="228.0" x2="60.0" y2="270.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="214.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">1월 말</text><text x="80.0" y="232.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">SK하이닉스·삼성 4Q26</text><text x="310.0" y="224.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">2028 HBM 능력 +30% 안팎인지(+40%↑ 배정 확대, +20%↓ 축소)</text><circle cx="60.0" cy="280.0" r="8.0" fill="#2a6fc9" fill-opacity="1.0"/><line x1="60.0" y1="290.0" x2="60.0" y2="332.0" stroke="#b9bec8" stroke-width="2"/><text x="80.0" y="276.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">2027 상반기</text><text x="80.0" y="294.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">루빈 울트라 HBM 구성</text><text x="310.0" y="286.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">12단 HBM4E 확정인지, 8단 위주인지</text><circle cx="60.0" cy="342.0" r="8.0" fill="#d9822b" fill-opacity="1.0"/><text x="80.0" y="338.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="bold">2027 하반기</text><text x="80.0" y="356.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">2028년분 HBM 계약</text><text x="310.0" y="348.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">비트 +20% 미만과 가격 인하가 함께 오면 과잉이 2028년으로</text><text x="24.0" y="406.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">판정 기준은 저희 모형의 기본값입니다. 일정은 회사 발표 전 추정입니다</text></svg>