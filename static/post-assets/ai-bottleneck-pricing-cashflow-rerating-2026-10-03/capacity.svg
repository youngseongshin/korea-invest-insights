<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">Toshiba storage capacity target</title><desc id="d">Toshiba storage capacity FY25 index 100; FY27 target approximately 200. First shipment from newly expanded capacity occurred October 2, 2026 per company.</desc><style>text{font:18px Arial,Inter,sans-serif;fill:#22272e}.title{font-size:27px;font-weight:bold}.sub{fill:#59625c}.bold{font-weight:bold}.big{font-size:24px;font-weight:bold}.note{fill:#59625c}</style><rect width="720" height="480" rx="10" fill="#fffefa"/><text x="26" y="42" class="title">Toshiba storage capacity target</text><text x="26" y="74" class="sub">Toshiba storage capacity index | FY25 = 100</text><line x1="140" y1="350" x2="585" y2="350" stroke="#9aa39d" stroke-width="2"/><rect x="208" y="216" width="120" height="134" rx="8" fill="#2f7d6b"/><rect x="424" y="82" width="120" height="268" rx="8" fill="#2563eb"/><text x="268" y="200" text-anchor="middle" class="big">100</text><text x="484" y="68" text-anchor="middle" class="big">~200</text><text x="268" y="384" text-anchor="middle" class="bold">FY25</text><text x="484" y="384" text-anchor="middle" class="bold">FY27 target</text><rect x="54" y="385" width="612" height="43" rx="7" fill="#e8efeb"/><text x="70" y="414" class="bold">First expanded-capacity shipment: Oct 2, 2026</text><text x="26" y="460" class="note">As of 2026-10-03 | FY27 is a company target, not realized capacity.</text></svg>