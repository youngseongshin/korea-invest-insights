<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">From bottleneck to valuation</title><desc id="d">Six-step path from bottleneck through contract price, unit profit, cash, earnings duration, to stock valuation.</desc><style>text{font:18px Arial,Inter,sans-serif;fill:#22272e}.title{font-size:27px;font-weight:bold}.sub{fill:#59625c}.bold{font-weight:bold}.big{font-size:24px;font-weight:bold}.note{fill:#59625c}</style><rect width="720" height="480" rx="10" fill="#fffefa"/><text x="26" y="42" class="title">From bottleneck to valuation</text><text x="26" y="74" class="sub">Evidence path | each link needs independent support</text><rect x="64" y="100" width="592" height="42" rx="7" fill="#e8efeb" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="121" r="14" fill="#2f7d6b"/><text x="87" y="127" text-anchor="middle" style="fill:#fffefa;font-weight:bold">1</text><text x="115" y="128" class="bold">Bottleneck</text><path d="M360 142v10m-7-5 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="64" y="155" width="592" height="42" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="176" r="14" fill="#2f7d6b"/><text x="87" y="182" text-anchor="middle" style="fill:#fffefa;font-weight:bold">2</text><text x="115" y="183" class="bold">Contract price</text><path d="M360 197v10m-7-5 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="64" y="210" width="592" height="42" rx="7" fill="#e8efeb" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="231" r="14" fill="#2f7d6b"/><text x="87" y="237" text-anchor="middle" style="fill:#fffefa;font-weight:bold">3</text><text x="115" y="238" class="bold">Unit profit</text><path d="M360 252v10m-7-5 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="64" y="265" width="592" height="42" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="286" r="14" fill="#2f7d6b"/><text x="87" y="292" text-anchor="middle" style="fill:#fffefa;font-weight:bold">4</text><text x="115" y="293" class="bold">Cash</text><path d="M360 307v10m-7-5 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="64" y="320" width="592" height="42" rx="7" fill="#e8efeb" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="341" r="14" fill="#2f7d6b"/><text x="87" y="347" text-anchor="middle" style="fill:#fffefa;font-weight:bold">5</text><text x="115" y="348" class="bold">Earnings duration</text><path d="M360 362v10m-7-5 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="64" y="375" width="592" height="42" rx="7" fill="#fffefa" stroke="#2f7d6b" stroke-width="2"/><circle cx="87" cy="396" r="14" fill="#2f7d6b"/><text x="87" y="402" text-anchor="middle" style="fill:#fffefa;font-weight:bold">6</text><text x="115" y="403" class="bold">Stock valuation</text><text x="26" y="460" class="note">As of 2026-10-03 | Conceptual framework; every link is an assumption to test.</text></svg>