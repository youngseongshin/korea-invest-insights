<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="400" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">광고주는 타기팅과 소재를 엔진에 넘기고 있습니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">메타가 분기 실적 콜에서 밝힌 숫자</text><text x="24.0" y="74.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Advantage+ 자동 캠페인</text><text x="24.0" y="91.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">연 환산 매출(억 달러)</text><line x1="24.0" y1="280.0" x2="240.0" y2="280.0" stroke="#17212b" stroke-width="1"/><rect x="65.3" y="154.0" width="46.0" height="126.0" rx="0" fill="#9aa5b1"/><text x="88.3" y="148.0" font-size="11" fill="#17212b" text-anchor="middle" font-weight="bold">600</text><text x="88.3" y="296.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">3Q25</text><rect x="152.7" y="122.5" width="46.0" height="157.5" rx="0" fill="#2f5fd0"/><text x="175.7" y="116.5" font-size="11" fill="#17212b" text-anchor="middle" font-weight="bold">750 초과</text><text x="175.7" y="296.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">2Q26</text><text x="265.0" y="74.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">생성형 AI 소재 도구</text><text x="265.0" y="91.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">쓰는 광고주(만 곳)</text><line x1="265.0" y1="280.0" x2="481.0" y2="280.0" stroke="#17212b" stroke-width="1"/><rect x="284.5" y="157.8" width="46.0" height="122.2" rx="0" fill="#9aa5b1"/><text x="307.5" y="151.8" font-size="11" fill="#17212b" text-anchor="middle" font-weight="bold">800 초과</text><text x="307.5" y="296.0" font-size="11" fill="#5b6774" text-a