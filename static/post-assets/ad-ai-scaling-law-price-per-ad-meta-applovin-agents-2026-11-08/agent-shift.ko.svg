<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="418" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">구매 결정이 에이전트로 옮겨 가면 결과 데이터의 주인이 바뀝니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">지금의 광고 흐름과 에이전트를 거치는 흐름</text><text x="24.0" y="100.0" font-size="13" fill="#2f5fd0" text-anchor="start" font-weight="bold">지금</text><rect x="100.0" y="78.0" width="70.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="135.0" y="103.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">사람</text><line x1="172.0" y1="98.0" x2="180.0" y2="98.0" stroke="#5b6774" stroke-width="2"/><polygon points="188.0,98.0 178.0,93.0 178.0,103.0" fill="#5b6774"/><rect x="190.0" y="78.0" width="120.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="250.0" y="103.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">피드·검색</text><line x1="312.0" y1="98.0" x2="320.0" y2="98.0" stroke="#5b6774" stroke-width="2"/><polygon points="328.0,98.0 318.0,93.0 318.0,103.0" fill="#5b6774"/><rect x="330.0" y="78.0" width="180.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="420.0" y="103.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="bold">광고 경매(예측 모델)</text><line x1="512.0" y1="98.0" x2="520.0" y2="98.0" stroke="#5b6774" stroke-width="2"/><polygon points="528.0,98.0 518.0,93.0 518.0,103.0" fill="#5b6774"/><rect x="530.0" y="78.0" width="186.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="623.0" y="103.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">광고주 사이트에서 구매</text><text x="100.0" y="144.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">돈: 노출·클릭·전환당 광고비</text><text x="100.0" y="164.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">결과 데이터: 광고 플랫폼으로 돌아옴</text><text x="24.0" y="228.0" font-size="13" fill="#b26a00" text-anchor="start" font-weight="bold">에이전트</text><rect x="100.0" y="206.0" width="70.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="135.0" y="231.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">사람</text><line x1="172.0" y1="226.0" x2="180.0" y2="226.0" stroke="#5b6774" stroke-width="2"/><polygon points="188.0,226.0 178.0,221.0 178.0,231.0" fill="#5b6774"/><rect x="190.0" y="206.0" width="120.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="250.0" y="231.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">개인 에이전트</text><line x1="312.0" y1="226.0" x2="320.0" y2="226.0" stroke="#5b6774" stroke-width="2"/><polygon points="328.0,226.0 318.0,221.0 318.0,231.0" fill="#5b6774"/><rect x="330.0" y="206.0" width="180.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="420.0" y="231.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="bold">기업 에이전트·인증 API</text><line x1="512.0" y1="226.0" x2="520.0" y2="226.0" stroke="#5b6774" stroke-width="2"/><polygon points="528.0,226.0 518.0,221.0 518.0,231.0" fill="#5b6774"/><rect x="530.0" y="206.0" width="186.0" height="40.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="623.0" y="231.0" font-size="11.2" fill="#17212b" text-anchor="middle" font-weight="normal">에이전트 안에서 결제</text><text x="100.0" y="272.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">돈: 거래 수수료·구독·에이전트 안 광고</text><text x="100.0" y="292.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">결과 데이터: 에이전트를 가진 회사로 감</text><text x="24.0" y="330.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">메타 Muse: 주간 이용자 25% 이상이 쇼핑에 사용하고 평균 구매액은 200달러를 넘습니다(3Q26 콜).</text><text x="24.0" y="364.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">저커버그: 에이전트가 만든 가치의 일정 비율을 받는 모델을 만들겠다고 말했습니다. 출처: 메타 3Q26 실적 콜</text></svg>