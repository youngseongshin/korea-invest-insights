<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">메타는 매 분기 광고 모델을 한 단계씩 바꿨습니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">분기별 주요 광고 모델 변경과 회사가 밝힌 효과</text><text x="96.0" y="70.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">바꾼 것</text><text x="500.0" y="70.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">회사가 밝힌 효과</text><rect x="24.0" y="80.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="111.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">3Q25</text><text x="96.0" y="98.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">Lattice 확대, Andromeda 통합</text><text x="96.0" y="116.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Lattice 구조를 앱 광고로 넓힘</text><text x="96.0" y="130.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">후보 검색과 초기 순위를 한 모델로</text><text x="500.0" y="101.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">앱 광고 전환 약 +3%</text><text x="500.0" y="117.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">광고 품질 +14%(페이스북)</text><rect x="24.0" y="142.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="173.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">4Q25</text><text x="96.0" y="160.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">GEM 학습 GPU 2배</text><text x="96.0" y="178.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">GEM과 시퀀스 학습으로</text><text x="96.0" y="192.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">더 긴 행동 기록을 반영</text><text x="500.0" y="163.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">광고 클릭 +3.5%(페이스북)</text><text x="500.0" y="179.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">인스타그램 전환 +1% 초과</text><rect x="24.0" y="204.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="235.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">1Q26</text><text x="96.0" y="222.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">적응형 순위 모델, Lattice·GEM 개선</text><text x="96.0" y="240.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">전환 가능성이 높은 요청에만</text><text x="96.0" y="254.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">큰 연산을 배정</text><text x="500.0" y="225.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">주요 지면 전환율 +1.6%</text><text x="500.0" y="241.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">랜딩 조회 전환율 +6% 초과</text><rect x="24.0" y="266.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="297.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">2Q26</text><text x="96.0" y="284.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">생성형 추천기(LLM) 도입</text><text x="96.0" y="302.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">LLM으로 광고 내용과</text><text x="96.0" y="316.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">사용자 선호를 함께 추론</text><text x="500.0" y="287.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">페이스북 전환 +15.7%</text><text x="500.0" y="303.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">(GEM·시퀀스 학습 합산)</text><rect x="24.0" y="328.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="359.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">3Q26</text><text x="96.0" y="346.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">생성형 검색, GEM 확대</text><text x="96.0" y="364.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">페이스북 피드에 생성형 검색</text><text x="96.0" y="378.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">GEM을 새 지면과 목표로</text><text x="500.0" y="349.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">앱 광고 전환 +9.6%</text><text x="500.0" y="365.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">외부 전환 +1.7%</text><text x="24.0" y="406.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">각 효과는 회사가 밝힌 해당 지면·목표·구간 기준이라 서로 더할 수 없습니다. 출처: 메타 분기 실적 콜(3Q25~3Q26)</text></svg>