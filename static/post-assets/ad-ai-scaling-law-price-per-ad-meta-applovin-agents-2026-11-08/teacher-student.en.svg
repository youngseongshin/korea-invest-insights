<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="396" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">The big model learns; small models serve each ad in real time</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">How Meta moves knowledge into serving models, and the same effect at AppLovin</text><rect x="24.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">Central foundation model GEM</text><text x="36.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Trained on thousands of GPUs</text><text x="36.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Too costly to run on every</text><text x="36.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">ad request, so not served live</text><rect x="274.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="286.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">Knowledge transfer</text><text x="286.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Distillation from GEM's outputs</text><text x="286.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Structured representations: 2x</text><text x="286.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Precompute just before requests</text><rect x="524.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="536.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">Hundreds of serving models</text><text x="536.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Split by surface and objective</text><text x="536.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Rank ads for every request</text><text x="536.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">Heavy compute only where</text><text x="536.0" y="165.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">conversion is likely</text><line x1="240.0" y1="132.0" x2="262.0" y2="132.0" stroke="#5b6774" stroke-width="2"/><polygon points="270.0,132.0 260.0,127.0 260.0,137.0" fill="#5b6774"/><line x1="490.0" y1="132.0" x2="512.0" y2="132.0" stroke="#5b6774" stroke-width="2"/><polygon points="520.0,132.0 510.0,127.0 510.0,137.0" fill="#5b6774"/><rect x="24.0" y="222.0" width="712.0" height="88.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="40.0" y="246.0" font-size="12.5" fill="#b26a00" text-anchor="start" font-weight="bold">What is learned where data is rich is used where data is sparse</text><text x="40.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Meta: representations learned on clicks</text><text x="40.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">(rich data) feed conversion (sparse data)</text><text x="276.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">AppLovin: the new model gained most with</text><text x="276.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">new and small advertisers, new categories</text><text x="512.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Meta content recommendations: find new</text><text x="512.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">posts by meaning before engagement builds</text><text x="24.0" y="342.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Sources: Meta Engineering (2025-11-10, 2026-10-13), Meta calls (1Q26, 3Q26), AppLovin 3Q26 call</text></svg>