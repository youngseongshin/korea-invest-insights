<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Meta changed its ad models one step every quarter</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Main ad-model changes per quarter and the effect Meta reported</text><text x="96.0" y="70.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">What changed</text><text x="500.0" y="70.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="bold">Reported effect</text><rect x="24.0" y="80.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="111.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">3Q25</text><text x="96.0" y="98.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">Lattice expands, Andromeda merges</text><text x="96.0" y="116.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Lattice extended to app ads;</text><text x="96.0" y="130.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">retrieval and early ranking merged</text><text x="500.0" y="101.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">App ad conversions about +3%</text><text x="500.0" y="117.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Ads quality +14% (Facebook)</text><rect x="24.0" y="142.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="173.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">4Q25</text><text x="96.0" y="160.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">GPUs for GEM training doubled</text><text x="96.0" y="178.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">GEM plus sequence learning</text><text x="96.0" y="192.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">reads longer behaviour history</text><text x="500.0" y="163.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Ad clicks +3.5% (Facebook)</text><text x="500.0" y="179.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Instagram conversions over +1%</text><rect x="24.0" y="204.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="235.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">1Q26</text><text x="96.0" y="222.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">Adaptive ranking; Lattice and GEM</text><text x="96.0" y="240.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Heavy compute only for requests</text><text x="96.0" y="254.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">likely to convert</text><text x="500.0" y="225.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Major-surface conversion rate +1.6%</text><text x="500.0" y="241.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Landing-page views over +6%</text><rect x="24.0" y="266.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="297.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">2Q26</text><text x="96.0" y="284.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">Generative Recommender (LLM)</text><text x="96.0" y="302.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">LLMs reason over ad content</text><text x="96.0" y="316.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">and user preferences together</text><text x="500.0" y="287.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Facebook conversions +15.7%</text><text x="500.0" y="303.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">(with GEM and sequence learning)</text><rect x="24.0" y="328.0" width="712.0" height="54.0" rx="6" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="359.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">3Q26</text><text x="96.0" y="346.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">Generative retrieval, GEM wider</text><text x="96.0" y="364.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Generative retrieval on Facebook</text><text x="96.0" y="378.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">Feed; GEM on more surfaces</text><text x="500.0" y="349.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">App ad conversions +9.6%</text><text x="500.0" y="365.0" font-size="11.5" fill="#b26a00" text-anchor="start" font-weight="bold">Offsite conversions +1.7%</text><text x="24.0" y="406.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Each effect applies to the surface, objective or segment Meta named, so they cannot be added. Source: Meta earnings calls, 3Q25 to 3Q26</text></svg>