<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="440" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Recommendation models now improve as they grow: Meta's GEM loop</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">GEM as Meta described it in October 2026</text><rect x="60.0" y="70.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="74.0" y="96.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">1. Add more compute</text><text x="74.0" y="120.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Training compute 4x in 12 months</text><text x="74.0" y="137.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU utilisation (MFU) doubled</text><rect x="450.0" y="70.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="464.0" y="96.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">2. The model gets bigger</text><text x="464.0" y="120.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2.5x the complexity of earlier GEM</text><text x="464.0" y="137.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">New design: 2x gain at same compute</text><rect x="450.0" y="230.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="464.0" y="256.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">3. Longer history becomes useful</text><text x="464.0" y="280.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Accuracy follows a power law</text><text x="464.0" y="297.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">in history length</text><rect x="60.0" y="230.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="74.0" y="256.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">4. Ads match better</text><text x="74.0" y="280.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Conversions +18.9% across surfaces</text><text x="74.0" y="297.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">CTR +12% (baseline not given)</text><line x1="318.0" y1="116.0" x2="434.0" y2="116.0" stroke="#5b6774" stroke-width="2"/><polygon points="442.0,116.0 432.0,111.0 432.0,121.0" fill="#5b6774"/><line x1="575.0" y1="168.0" x2="575.0" y2="216.0" stroke="#5b6774" stroke-width="2"/><polygon points="575.0,224.0 580.0,214.0 570.0,214.0" fill="#5b6774"/><line x1="442.0" y1="276.0" x2="326.0" y2="276.0" stroke="#5b6774" stroke-width="2"/><polygon points="318.0,276.0 328.0,281.0 328.0,271.0" fill="#5b6774"/><line x1="185.0" y1="224.0" x2="185.0" y2="176.0" stroke="#5b6774" stroke-width="2"/><polygon points="185.0,168.0 180.0,178.0 190.0,178.0" fill="#5b6774"/><text x="380.0" y="196.0" font-size="12" fill="#b26a00" text-anchor="middle" font-weight="bold">Ad revenue pays for the next round of compute</text><text x="380.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">Bigger models gain more from longer histories, and longer histories justify bigger models.</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Most pre-2024 industry recommendation models did not scale with compute (HSTU paper). Sources: Meta Engineering 2026-10-13, arXiv 2402.17152</text></svg>