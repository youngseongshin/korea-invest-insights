<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="396" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">큰 모델은 배우고, 실시간 광고는 작은 모델이 맡습니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">메타 광고 시스템의 지식 이전 구조와 앱러빈의 같은 현상</text><rect x="24.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="36.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">중앙 기반 모델 GEM</text><text x="36.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">수천 개 GPU로 학습</text><text x="36.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">광고 요청마다 돌리기에는</text><text x="36.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">너무 비싸 실시간에는 안 씀</text><rect x="274.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="286.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">지식 이전</text><text x="286.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">증류: 큰 모델의 답을 학습</text><text x="286.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">구조 표현: 이전 효과 2배</text><text x="286.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">미리 계산: 요청 직전 준비</text><rect x="524.0" y="66.0" width="212.0" height="132.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="536.0" y="90.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">수백 개 실시간 모델</text><text x="536.0" y="114.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">지면·목표별로 나뉨</text><text x="536.0" y="131.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">요청마다 순위를 매김</text><text x="536.0" y="148.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">큰 연산은 전환 가능성이</text><text x="536.0" y="165.0" font-size="11.2" fill="#17212b" text-anchor="start" font-weight="normal">높은 요청에만 배정</text><line x1="240.0" y1="132.0" x2="262.0" y2="132.0" stroke="#5b6774" stroke-width="2"/><polygon points="270.0,132.0 260.0,127.0 260.0,137.0" fill="#5b6774"/><line x1="490.0" y1="132.0" x2="512.0" y2="132.0" stroke="#5b6774" stroke-width="2"/><polygon points="520.0,132.0 510.0,127.0 510.0,137.0" fill="#5b6774"/><rect x="24.0" y="222.0" width="712.0" height="88.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="40.0" y="246.0" font-size="12.5" fill="#b26a00" text-anchor="start" font-weight="bold">데이터가 많은 곳에서 배운 것을 데이터가 적은 곳에 씁니다</text><text x="40.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">메타: 클릭(데이터 많음)에서 배운 표현을</text><text x="40.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">전환(데이터 적음) 예측에 옮겨 씀</text><text x="276.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">앱러빈: 새 모델의 개선 폭은 데이터가 적은</text><text x="276.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">신규·소규모 광고주와 새 업종에서 가장 큼</text><text x="512.0" y="274.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">메타 콘텐츠 추천: 반응이 쌓이기 전인</text><text x="512.0" y="291.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">새 게시물도 의미로 찾아 추천</text><text x="24.0" y="342.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: Meta Engineering(2025-11-10, 2026-10-13), 메타 실적 콜(1Q26, 3Q26), 앱러빈 3Q26 실적 콜</text></svg>