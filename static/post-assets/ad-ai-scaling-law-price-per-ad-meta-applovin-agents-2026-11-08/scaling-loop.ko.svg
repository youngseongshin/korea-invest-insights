<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="440" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">추천 모델도 키울수록 정확해집니다: 메타 GEM의 선순환</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">메타가 2026년 10월에 밝힌 GEM</text><rect x="60.0" y="70.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="74.0" y="96.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">① 연산을 더 넣습니다</text><text x="74.0" y="120.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">12개월 동안 학습 연산 4배</text><text x="74.0" y="137.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">GPU 효율(MFU)도 2배로 개선</text><rect x="450.0" y="70.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="464.0" y="96.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">② 모델이 커집니다</text><text x="464.0" y="120.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">복잡도는 이전 GEM의 2.5배</text><text x="464.0" y="137.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">같은 연산에서 성능 2배인 새 구조</text><rect x="450.0" y="230.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="464.0" y="256.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">③ 더 긴 행동 기록이 쓸모 있어집니다</text><text x="464.0" y="280.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">정확도는 기록 길이의</text><text x="464.0" y="297.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">거듭제곱 법칙을 따름</text><rect x="60.0" y="230.0" width="250.0" height="92.0" rx="8" fill="#f4f6f9" stroke="#d5dbe3" stroke-width="1"/><text x="74.0" y="256.0" font-size="12.5" fill="#2f5fd0" text-anchor="start" font-weight="bold">④ 광고가 더 잘 맞습니다</text><text x="74.0" y="280.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">광고 지면 전반 전환 +18.9%</text><text x="74.0" y="297.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">클릭률 +12%(기준·기간 미공개)</text><line x1="318.0" y1="116.0" x2="434.0" y2="116.0" stroke="#5b6774" stroke-width="2"/><polygon points="442.0,116.0 432.0,111.0 432.0,121.0" fill="#5b6774"/><line x1="575.0" y1="168.0" x2="575.0" y2="216.0" stroke="#5b6774" stroke-width="2"/><polygon points="575.0,224.0 580.0,214.0 570.0,214.0" fill="#5b6774"/><line x1="442.0" y1="276.0" x2="326.0" y2="276.0" stroke="#5b6774" stroke-width="2"/><polygon points="318.0,276.0 328.0,281.0 328.0,271.0" fill="#5b6774"/><line x1="185.0" y1="224.0" x2="185.0" y2="176.0" stroke="#5b6774" stroke-width="2"/><polygon points="185.0,168.0 180.0,178.0 190.0,178.0" fill="#5b6774"/><text x="380.0" y="196.0" font-size="12" fill="#b26a00" text-anchor="middle" font-weight="bold">광고 매출이 다음 연산 비용을 댑니다</text><text x="380.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="middle" font-weight="normal">큰 모델일수록 긴 기록에서 더 많이 얻고, 긴 기록은 다시 큰 모델을 정당화합니다.</text><text x="24.0" y="386.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2024년 이전 업계 추천 모델 대부분은 연산을 늘려도 좋아지지 않았습니다(메타 HSTU 논문). 출처: Meta Engineering 2026-10-13, arXiv 2402.17152</text></svg>