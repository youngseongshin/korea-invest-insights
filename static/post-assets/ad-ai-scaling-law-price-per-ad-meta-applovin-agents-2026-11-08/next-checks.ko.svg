<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="400" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">다음에 확인할 일정</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">날짜가 확정되지 않은 일정은 미정으로 적었습니다</text><line x1="150.0" y1="70.0" x2="150.0" y2="304.0" stroke="#d5dbe3" stroke-width="2"/><circle cx="150" cy="82.0" r="6" fill="#2f5fd0"/><text x="136.0" y="86.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 9일(미국)</text><text x="168.0" y="86.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">트레이드 데스크 3분기</text><text x="168.0" y="104.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">개방형 웹 중개의 감속이 이어지는지</text><circle cx="150" cy="132.0" r="6" fill="#2f5fd0"/><text x="136.0" y="136.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">11월 12일</text><text x="168.0" y="136.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">네이버 3분기</text><text x="168.0" y="154.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">검색·쇼핑 광고의 AI 효과와 AI 브리핑의 영향</text><circle cx="150" cy="182.0" r="6" fill="#2f5fd0"/><text x="136.0" y="186.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">1월 말(미정)</text><text x="168.0" y="186.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">메타 4분기와 2027년 계획</text><text x="168.0" y="204.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">단가 대 노출, 새 모델 효과, 설비투자 규모</text><circle cx="150" cy="232.0" r="6" fill="#2f5fd0"/><text x="136.0" y="236.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">2월 초(미정)</text><text x="168.0" y="236.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">알파벳·아마존 4분기</text><text x="168.0" y="254.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">유료 클릭 대 검색어, 아마존 광고 10%대 후반</text><circle cx="150" cy="282.0" r="6" fill="#2f5fd0"/><text x="136.0" y="286.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="bold">2월(미정)</text><text x="168.0" y="286.0" font-size="12" fill="#2f5fd0" text-anchor="start" font-weight="bold">앱러빈·유니티 4분기</text><text x="168.0" y="304.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">설치당 순매출, Vector 성장, 광고주 수</text><text x="24.0" y="346.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: 트레이드 데스크 공지, 국내 보도(네이버 일정), 각 회사 과거 발표 시기</text></svg>