<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="450" fill="#ffffff"/><text x="24.0" y="26.0" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">3분기 광고 관련 매출 증가율: 대행사와 개방형 웹 구매 플랫폼이 가장 느렸습니다</text><text x="24.0" y="44.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">전년 같은 분기 대비(%). 회사마다 매출 기준이 다릅니다</text><line x1="312.0" y1="64.0" x2="312.0" y2="340.0" stroke="#17212b" stroke-width="1"/><text x="286.0" y="84.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">앱러빈 매출</text><rect x="312.0" y="74.0" width="330.0" height="15.0" rx="0" fill="#2f5fd0"/><text x="648.0" y="85.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+55%</text><text x="286.0" y="111.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">레딧 광고매출</text><rect x="312.0" y="101.0" width="324.0" height="15.0" rx="0" fill="#2f5fd0"/><text x="642.0" y="112.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+54%</text><text x="286.0" y="138.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">메타 광고매출</text><rect x="312.0" y="128.0" width="156.0" height="15.0" rx="0" fill="#2f5fd0"/><text x="474.0" y="139.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+26%</text><text x="286.0" y="165.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">핀터레스트 매출</text><rect x="312.0" y="155.0" width="72.0" height="15.0" rx="0" fill="#2f5fd0"/><text x="390.0" y="166.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+12%</text><text x="286.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">아마존 광고매출</text><rect x="312.0" y="182.0" width="66.0" height="15.0" rx="0" fill="#2f5fd0"/><text x="384.0" y="193.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+11%</text><text x="430.0" y="193.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">프라임데이 이동, 2·3분기 합산 +18.6%(환율 제외)</text><text x="286.0" y="219.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">구글 광고매출</text><rect x="312.0" y="209.0" width="63.6" height="15.0" rx="0" fill="#2f5fd0"/><text x="381.6" y="220.0" font-size="11" fill="#2f5fd0" text-anchor="start" font-weight="bold">+10.6%</text><text x="427.6" y="220.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">검색 +12.0%, 유료 클릭 +8%</text><text x="286.0" y="246.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">옴니콤 유기 성장</text><rect x="312.0" y="236.0" width="43.2" height="15.0" rx="0" fill="#b26a00"/><text x="361.2" y="247.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">+7.2%</text><text x="407.2" y="247.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">월드컵·중간선거 효과 포함</text><text x="286.0" y="273.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">퍼블리시스 유기 성장</text><rect x="312.0" y="263.0" width="30.0" height="15.0" rx="0" fill="#b26a00"/><text x="348.0" y="274.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">+5%</text><text x="286.0" y="300.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">트레이드 데스크 매출(2분기)</text><rect x="312.0" y="290.0" width="18.0" height="15.0" rx="0" fill="#b26a00"/><text x="336.0" y="301.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">+3%</text><text x="382.0" y="301.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">3분기 실적은 11월 9일(미국)</text><text x="286.0" y="327.0" font-size="11.5" fill="#17212b" text-anchor="end" font-weight="normal">WPP 순매출(동일 기준)</text><rect x="299.4" y="317.0" width="12.6" height="15.0" rx="0" fill="#b26a00"/><text x="318.0" y="328.0" font-size="11" fill="#b26a00" text-anchor="start" font-weight="bold">-2.1%</text><text x="364.0" y="328.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">제작(크리에이티브) -5.1%</text><rect x="70.0" y="353.0" width="11.0" height="11.0" rx="0" fill="#2f5fd0"/><text x="86.0" y="362.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">경매와 결과 데이터를 직접 가진 광고 플랫폼</text><rect x="380.0" y="353.0" width="11.0" height="11.0" rx="0" fill="#b26a00"/><text x="396.0" y="362.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="normal">대행사와 개방형 웹 구매 플랫폼</text><text x="24.0" y="396.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">출처: 각 회사 실적 발표·실적 콜(옴니콤·WPP·핀터레스트·레딧·트레이드 데스크 1차, 퍼블리시스 2차), 메타·알파벳·아마존은 10월 30일 글</text></svg>