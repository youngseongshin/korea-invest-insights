<text x="24" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59625c">Chain bars show the median of stocks in the group. Samsung and SK hynix are single stocks.</text>
<text x="24" y="101" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#22272e">OSAT packaging (13 stocks)</text>
