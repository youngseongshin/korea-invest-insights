<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d"><title id="t">One-month median return by chain</title><desc id="d">Median return from Sep 8 to Oct 8, 2026. Suppliers rose 18 to 51 percent while Samsung Electronics fell 2.8 percent and SK hynix fell 6.2 percent.</desc>
<rect width="720" height="380" fill="#fffefa"/>
