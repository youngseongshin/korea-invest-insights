<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="484" fill="#ffffff"/><g transform="translate(0 12)">
      <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker>
      <marker id="a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker></defs>
      <g font-size="12" fill="#17212b">
        
        <text x="20" y="22" font-weight="600" fill="#0f766e">상승 고리(2025~2026 상반기가 이렇게 돌았습니다)</text>
        <g stroke="#17212b" fill="#ffffff">
          <rect x="20" y="36" width="120" height="40" rx="2"/><rect x="170" y="36" width="100" height="40" rx="2"/><rect x="300" y="36" width="100" height="40" rx="2"/><rect x="430" y="36" width="130" height="40" rx="2"/><rect x="590" y="36" width="150" height="40" rx="2"/>
        </g>
        <text x="80" y="60" text-anchor="middle">AI 설비투자</text>
        <text x="220" y="60" text-anchor="middle">성장</text>
        <text x="350" y="60" text-anchor="middle">주가 상승</text>
        <text x="495" y="60" text-anchor="middle">자산효과 소비</text>
        <text x="665" y="54" text-anchor="middle">물가·금리 상승</text>
        <text x="665" y="68" text-anchor="middle" fill="#5b6774">연준 등 떠밀려 인상</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <line x1="140" y1="56" x2="168" y2="56"/><line x1="270" y1="56" x2="298" y2="56"/><line x1="400" y1="56" x2="428" y2="56"/><line x1="560" y1="56" x2="588" y2="56"/>
        </g>
        <path d="M 665 76 L 665 100 L 80 100 L 80 78" fill="none" stroke="#17212b" stroke-dasharray="5 4" marker-end="url(#a3)"/>
        <text x="372" y="96" text-anchor="middle" fill="#5b6774">금리 상승은 시차를 두고 투자와 소비를 누릅니다(천천히 가면 나중에 더 많이 올려야 함)</text>
        
        <text x="20" y="150" font-weight="600" fill="#b3261e">하강 고리(10월에 이 고리가 켜졌는지 보는 중입니다)</text>
        <g stroke="#17212b" fill="#ffffff">
          <rect x="20" y="164" width="120" height="40" rx="2"/><rect x="170" y="164" width="100" height="40" rx="2"/><rect x="300" y="164" width="100" height="40" rx="2"/><rect x="430" y="164" width="100" height="40" rx="2"/><rect x="560" y="164" width="180" height="40" rx="2"/>
        </g>
        <text x="80" y="188" text-anchor="middle">AI 수익성 의구심</text>
        <text x="220" y="188" text-anchor="middle">AI 주가 하락</text>
        <text x="350" y="188" text-anchor="middle">소비 둔화</text>
        <text x="480" y="188" text-anchor="middle">성장 둔화</text>
        <text x="650" y="182" text-anchor="middle">금리 하락 → 채권이 헤지</text>
        <text x="650" y="196" text-anchor="middle" fill="#5b6774">10/22·10/30 실제로 작동</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <line x1="140" y1="184" x2="168" y2="184"/><line x1="270" y1="184" x2="298" y2="184"/><line x1="400" y1="184" x2="428" y2="184"/><line x1="530" y1="184" x2="558" y2="184"/>
        </g>
        
        <rect x="560" y="222" width="180" height="36" fill="#f7e7c9" stroke="#b26a00"/>
        <text x="650" y="238" text-anchor="middle" fill="#b26a00" font-weight="600">브렌트 113달러(이란 전쟁)</text>
        <text x="650" y="252" text-anchor="middle" fill="#b26a00">금리 하락 폭을 막음 · 2008년 선례</text>
        <line x1="650" y1="222" x2="650" y2="206" stroke="#b26a00" stroke-width="2" marker-end="url(#a3)"/>
        <text x="20" y="236" fill="#5b6774">상위 10%가 주식 88% 보유 → 주가가 멈춰도 소비가 약해짐(저축률 3.8%)</text>
        
        <text x="20" y="296" font-weight="600">분기: 하락의 원천이 헤지를 정합니다</text>
        <rect x="20" y="308" width="150" height="40" fill="#ffffff" stroke="#17212b"/>
        <text x="95" y="332" text-anchor="middle">충격의 원천은?</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <path d="M 170 328 L 230 318"/><path d="M 170 328 L 230 358"/><path d="M 170 328 L 230 398"/>
        </g>
        <rect x="232" y="304" width="200" height="28" fill="#d9efec" stroke="#c9d1da"/><text x="332" y="323" text-anchor="middle">AI 수요형 → 채권이 막아 줌</text>
        <rect x="232" y="344" width="200" height="28" fill="#f7e7c9" stroke="#c9d1da"/><text x="332" y="363" text-anchor="middle">유가·물가형 → 에너지가 막아 줌</text>
        <rect x="232" y="384" width="200" height="28" fill="#f6dcd9" stroke="#c9d1da"/><text x="332" y="403" text-anchor="middle">전면 디레버리징 → 달러만 남음</text>
        <text x="450" y="323" fill="#5b6774">10월 22·30일: 나스닥↓ 국채↑</text>
        <text x="450" y="363" fill="#5b6774">7월 하락일: 나스닥↓ 국채↓ 에너지↑</text>
        <text x="450" y="403" fill="#5b6774">신호 없음: 달러원 1,335원(7월 1,552원), 원화 강세</text>
      </g>
    </g></svg>