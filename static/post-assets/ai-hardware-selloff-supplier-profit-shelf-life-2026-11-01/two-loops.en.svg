<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="484" fill="#ffffff"/><g transform="translate(0 12)">
      <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker>
      <marker id="a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker></defs>
      <g font-size="12" fill="#17212b">
        
        <text x="20" y="22" font-weight="600" fill="#0f766e">Up loop (how 2025 to 1H26 worked)</text>
        <g stroke="#17212b" fill="#ffffff">
          <rect x="20" y="36" width="120" height="40" rx="2"/><rect x="170" y="36" width="100" height="40" rx="2"/><rect x="300" y="36" width="100" height="40" rx="2"/><rect x="430" y="36" width="130" height="40" rx="2"/><rect x="590" y="36" width="150" height="40" rx="2"/>
        </g>
        <text x="80" y="60" text-anchor="middle">AI capex</text>
        <text x="220" y="60" text-anchor="middle">Growth</text>
        <text x="350" y="60" text-anchor="middle">Stocks up</text>
        <text x="495" y="60" text-anchor="middle">Wealth-effect spending</text>
        <text x="665" y="54" text-anchor="middle">Inflation, yields up</text>
        <text x="665" y="68" text-anchor="middle" fill="#5b6774">Fed pushed to hike</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <line x1="140" y1="56" x2="168" y2="56"/><line x1="270" y1="56" x2="298" y2="56"/><line x1="400" y1="56" x2="428" y2="56"/><line x1="560" y1="56" x2="588" y2="56"/>
        </g>
        <path d="M 665 76 L 665 100 L 80 100 L 80 78" fill="none" stroke="#17212b" stroke-dasharray="5 4" marker-end="url(#a3)"/>
        <text x="372" y="96" text-anchor="middle" fill="#5b6774">Higher rates weigh on investment and spending with a lag (move slowly now, hike more later)</text>
        
        <text x="20" y="150" font-weight="600" fill="#b3261e">Down loop (we are checking whether it switched on in October)</text>
        <g stroke="#17212b" fill="#ffffff">
          <rect x="20" y="164" width="120" height="40" rx="2"/><rect x="170" y="164" width="100" height="40" rx="2"/><rect x="300" y="164" width="100" height="40" rx="2"/><rect x="430" y="164" width="100" height="40" rx="2"/><rect x="560" y="164" width="180" height="40" rx="2"/>
        </g>
        <text x="80" y="188" text-anchor="middle">Doubt on AI returns</text>
        <text x="220" y="188" text-anchor="middle">AI stocks down</text>
        <text x="350" y="188" text-anchor="middle">Spending slows</text>
        <text x="480" y="188" text-anchor="middle">Growth slows</text>
        <text x="650" y="182" text-anchor="middle">Yields fall → bonds hedge</text>
        <text x="650" y="196" text-anchor="middle" fill="#5b6774">Worked on Oct 22 and Oct 30</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <line x1="140" y1="184" x2="168" y2="184"/><line x1="270" y1="184" x2="298" y2="184"/><line x1="400" y1="184" x2="428" y2="184"/><line x1="530" y1="184" x2="558" y2="184"/>
        </g>
        
        <rect x="560" y="222" width="180" height="36" fill="#f7e7c9" stroke="#b26a00"/>
        <text x="650" y="238" text-anchor="middle" fill="#b26a00" font-weight="600">Brent $113 (Iran war)</text>
        <text x="650" y="252" text-anchor="middle" fill="#b26a00">Caps yield drop · cf. 2008</text>
        <line x1="650" y1="222" x2="650" y2="206" stroke="#b26a00" stroke-width="2" marker-end="url(#a3)"/>
        <text x="20" y="236" fill="#5b6774">Top 10% own 88% of stocks → flat prices alone weaken spending (saving rate 3.8%)</text>
        
        <text x="20" y="296" font-weight="600">Fork: the source of the drop picks the hedge</text>
        <rect x="20" y="308" width="150" height="40" fill="#ffffff" stroke="#17212b"/>
        <text x="95" y="332" text-anchor="middle">Source of shock?</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a3)">
          <path d="M 170 328 L 230 318"/><path d="M 170 328 L 230 358"/><path d="M 170 328 L 230 398"/>
        </g>
        <rect x="232" y="304" width="200" height="28" fill="#d9efec" stroke="#c9d1da"/><text x="332" y="323" text-anchor="middle">AI demand → bonds protect</text>
        <rect x="232" y="344" width="200" height="28" fill="#f7e7c9" stroke="#c9d1da"/><text x="332" y="363" text-anchor="middle">Oil, inflation → energy protects</text>
        <rect x="232" y="384" width="200" height="28" fill="#f6dcd9" stroke="#c9d1da"/><text x="332" y="403" text-anchor="middle">Full deleveraging → only the dollar</text>
        <text x="450" y="323" fill="#5b6774">Oct 22, 30: Nasdaq↓ Treasuries↑</text>
        <text x="450" y="363" fill="#5b6774">July sell-off: Nasdaq↓ Treasuries↓ energy↑</text>
        <text x="450" y="403" fill="#5b6774">No signal: USD/KRW 1,335 (1,552 in July), won stronger</text>
      </g>
    </g></svg>