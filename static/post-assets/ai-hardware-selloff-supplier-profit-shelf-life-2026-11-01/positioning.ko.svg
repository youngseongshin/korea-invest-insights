<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" width="760" height="354" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="394" fill="#ffffff"/><g transform="translate(0 12)">
      <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker></defs>
      <g font-size="12" fill="#17212b">
        <g stroke="#17212b" fill="#ffffff">
          <rect x="20" y="30" width="210" height="96" rx="2"/><rect x="275" y="30" width="210" height="96" rx="2"/><rect x="530" y="30" width="210" height="96" rx="2"/>
        </g>
        <text x="32" y="52" font-weight="600">① 기관 롱 청산(9/24~10/15)</text>
        <text x="32" y="72" fill="#5b6774">헤지펀드 기술주 매도 10년 만에 최대</text>
        <text x="32" y="88" fill="#5b6774">순레버리지 1년 저점</text>
        <text x="32" y="112" fill="#0f766e" font-weight="600">→ 팔 수 있는 기관 롱은 비었다</text>
        <text x="287" y="52" font-weight="600">② 숏은 종목이 아니라 ETF로</text>
        <text x="287" y="72" fill="#5b6774">QQQ +16% · SOXX +36% · EWY +57%</text>
        <text x="287" y="88" fill="#5b6774">마이크론 개별 숏 -13%</text>
        <text x="287" y="112" fill="#0f766e" font-weight="600">→ 커버가 오면 반도체·한국에 집중</text>
        <text x="542" y="52" font-weight="600">③ 남은 매도자</text>
        <text x="542" y="72" fill="#5b6774">CTA 롱 잔존(가격이 촉발)</text>
        <text x="542" y="88" fill="#5b6774">개인 레버리지 SOXL 183억달러, 손실 중</text>
        <text x="542" y="112" fill="#b3261e" font-weight="600">→ 1~2주 기계적 매도 우세</text>
        <g stroke="#17212b" fill="none" marker-end="url(#a5)"><line x1="230" y1="78" x2="273" y2="78"/><line x1="485" y1="78" x2="528" y2="78"/></g>
        
        <rect x="20" y="146" width="720" height="48" fill="#e4e9f0" stroke="#c9d1da"/>
        <text x="32" y="166" font-weight="600">한국 외국인</text>
        <text x="120" y="166">현물 -28.5조원(9/21~10/30), 국내 선물은 +3.2조원 순매수 → 롱을 줄이는 중, 숏을 쌓는 단계는 아님</text>
        <text x="120" y="184" fill="#5b6774">10/27~29 사흘 순매수 뒤 10/30 재매도. 신용융자 38.6조(6월) → 32.8조(10/15), 반대매매 비중 6.6% → 1%(10/26, 2차)</text>
        
        <line x1="40" y1="250" x2="720" y2="250" stroke="#17212b" marker-end="url(#a5)"/>
        <rect x="40" y="236" width="200" height="28" fill="#f6dcd9" stroke="#b3261e"/>
        <text x="140" y="255" text-anchor="middle" fill="#b3261e" font-weight="600">1~2주: 가격이 촉발하는 매도</text>
        <rect x="280" y="236" width="400" height="28" fill="#d9efec" stroke="#0f766e"/>
        <text x="480" y="255" text-anchor="middle" fill="#0f766e" font-weight="600">1~3개월: 숏 과밀이 반등 폭을 키우는 비대칭</text>
        <text x="40" y="290" fill="#5b6774">스위치(참고값): S&amp;P500 7,508 아래면 하방 가속, 7,716 위 이틀이면 상방 전환(10/16 주 골드만 CTA 모형값)</text>
        <text x="40" y="310" fill="#5b6774">촉매가 몰린 창: 11/10 CPI·FINRA 숏 잔고, 11/11 코어위브, 11/17~18 엔비디아</text>
      </g>
    </g></svg>