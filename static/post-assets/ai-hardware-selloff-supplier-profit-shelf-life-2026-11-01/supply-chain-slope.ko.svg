<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="13"><rect width="760" height="462" fill="#ffffff"/><text x="20" y="34" font-size="16" font-weight="700" fill="#17212b">낙폭은 공급 사슬 아래로 갈수록 깊습니다</text><rect x="20" y="46" width="12" height="12" fill="#2f5fd0"/><text x="38" y="56" fill="#5b6774">수요 쪽</text><rect x="130" y="46" width="12" height="12" fill="#b3261e"/><text x="148" y="56" fill="#5b6774">공급 쪽</text><text x="240" y="100" text-anchor="end" fill="#17212b">수요를 만든다 · S&amp;P500</text><rect x="250" y="88" width="26" height="15" fill="#2f5fd0"/><text x="282" y="100" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-3.0%</text><text x="240" y="126" text-anchor="end" fill="#17212b">수요를 집계한다 · 엔비디아</text><rect x="250" y="114" width="125" height="15" fill="#2f5fd0"/><text x="381" y="126" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-14.5%</text><text x="240" y="152" text-anchor="end" fill="#17212b">장기계약·독점 · TSMC</text><rect x="250" y="140" width="71" height="15" fill="#2f5fd0"/><text x="327" y="152" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-8.3%</text><text x="240" y="178" text-anchor="end" fill="#17212b">메모리 · 마이크론</text><rect x="250" y="166" width="233" height="15" fill="#b3261e"/><text x="489" y="178" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-27.1%</text><text x="240" y="204" text-anchor="end" fill="#17212b">메모리 · 삼성전자</text><rect x="250" y="192" width="320" height="15" fill="#b3261e"/><text x="576" y="204" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-37.2%</text><text x="240" y="230" text-anchor="end" fill="#17212b">메모리 · SK하이닉스</text><rect x="250" y="218" width="442" height="15" fill="#b3261e"/><text x="698" y="230" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-51.4%</text><text x="240" y="256" text-anchor="end" fill="#17212b">장비 · 도쿄일렉트론</text><rect x="250" y="244" width="341" height="15" fill="#b3261e"/><text x="597" y="256" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-39.6%</text><text x="240" y="282" text-anchor="end" fill="#17212b">장비 · 램리서치</text><rect x="250" y="270" width="385" height="15" fill="#b3261e"/><text x="641" y="282" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-44.8%</text><text x="240" y="308" text-anchor="end" fill="#17212b">장비 · AMAT</text><rect x="250" y="296" width="396" height="15" fill="#b3261e"/><text x="652" y="308" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">-46.0%</text><text x="20" y="330" fill="#5b6774" font-size="11">6/22~10/30 구간 최고 종가 대비 10/30 종가, 현지 통화(Yahoo 일봉). TSMC 미국 ADR은 -16.4%.</text><text x="20" y="364" font-size="14" font-weight="700" fill="#17212b">외국인 순매도 중 AI 하드웨어 종목 비중(9/21~10/30)</text><text x="20" y="392" fill="#17212b">대만</text><rect x="80" y="380" width="200" height="15" fill="#e4e9f0"/><rect x="80" y="380" width="165" height="15" fill="#b3261e"/><text x="288" y="392" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">82.5%</text><text x="350" y="392" fill="#5b6774">TSMC 41% · 미디어텍 18%, 금융·통신·철강은 순매수</text><text x="20" y="420" fill="#17212b">한국</text><rect x="80" y="408" width="200" height="15" fill="#e4e9f0"/><rect x="80" y="408" width="145" height="15" fill="#b3261e"/><text x="288" y="420" font-family="Menlo, 'DejaVu Sans Mono', monospace" fill="#17212b">72.3%</text><text x="350" y="420" fill="#5b6774">삼성전자·SK하이닉스 -20.6조원, 비AI 대형주는 종목당 0.6조원 미만</text><text x="20" y="444" fill="#5b6774" font-size="11">대만은 TWSE T86, 한국은 네이버 종목별 투자자(2차 집계). 순매도 합계가 분모라 매수가 상쇄된 비율입니다.</text></svg>