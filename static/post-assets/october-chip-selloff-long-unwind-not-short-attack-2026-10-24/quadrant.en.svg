<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Four-box map of foreign cash and KOSPI200 futures flows. Selloffs were cash selling plus futures buying (de-grossing); 10/16–23 moved to flat cash plus futures selling (keep longs, hedge the index). A lasting rebound sits where cash and futures buying arrive together." width="1000" height="410" style="font-family:-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1000" height="410" fill="#ffffff" /><defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#6f7a88" /></marker></defs>
<rect x="40" y="20" width="580" height="380" rx="10" style="fill:#ffffff;stroke:#d6dce3;stroke-width:1.2" />
<rect x="330" y="20" width="290" height="190" rx="0" style="fill:#2a78d6;fill-opacity:0.078" />
<line x1="40" y1="210" x2="620" y2="210" style="stroke:#6f7a88;stroke-width:1.2" />
<line x1="330" y1="20" x2="330" y2="400" style="stroke:#6f7a88;stroke-width:1.2" />
<text x="612" y="238" font-size="11" text-anchor="end" style="fill:#6f7a88">Futures buying →</text>
<text x="48" y="238" font-size="11" text-anchor="start" style="fill:#6f7a88">← Futures selling</text>
<text x="338" y="36" font-size="11" text-anchor="start" style="fill:#6f7a88">↑ Cash buying</text>
<text x="338" y="392" font-size="11" text-anchor="start" style="fill:#6f7a88">↓ Cash selling</text>
<text x="475" y="70" font-size="14" text-anchor="middle" font-weight="700" style="fill:#121821">① Recovery mix</text>
<text x="475" y="90" font-size="12" text-anchor="middle" style="fill:#465160">Cash buying + futures buying</text>
<text x="475" y="108" font-size="12" text-anchor="middle" style="fill:#465160">Samsung + hynix net buying, 2+ days</text>
<text x="185" y="70" font-size="14" text-anchor="middle" font-weight="700" style="fill:#121821">Keep longs + hedge index</text>
<text x="185" y="90" font-size="12" text-anchor="middle" style="fill:#465160">Cash flat or buying, futures selling</text>
<text x="185" y="108" font-size="12" text-anchor="middle" style="fill:#465160">Forming in 10/16–23</text>
<text x="475" y="290" font-size="14" text-anchor="middle" font-weight="700" style="fill:#121821">③ De-grossing</text>
<text x="475" y="310" font-size="12" text-anchor="middle" style="fill:#465160">Cash selling + futures buying</text>
<text x="475" y="328" font-size="12" text-anchor="middle" style="fill:#465160">Sell longs, cover index shorts</text>
<text x="185" y="290" font-size="14" text-anchor="middle" font-weight="700" style="fill:#121821">Cash and futures both sold</text>
<text x="185" y="310" font-size="12" text-anchor="middle" style="fill:#465160">Directional exit</text>
<text x="185" y="328" font-size="11" text-anchor="middle" style="fill:#6f7a88" />
<rect x="342" y="196" width="270" height="28" rx="6" style="fill:#ffffff;stroke:#eb6834;stroke-width:1.2;stroke-dasharray:4 3" />
<text x="477" y="215" font-size="12" text-anchor="middle" font-weight="600" style="fill:#121821">② Hedge-only unwind: futures buying</text>
<circle cx="370" cy="352" r="7" style="fill:#6250d6;stroke:#ffffff;stroke-width:2" />
<text x="358" y="350" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">9/24–10/15</text>
<text x="358" y="365" font-size="11" text-anchor="end" style="fill:#465160">Cash −27.0tn · futures +0.6tn</text>
<circle cx="400" cy="255" r="7" style="fill:#6250d6;stroke:#ffffff;stroke-width:2" />
<text x="412" y="253" font-size="12" text-anchor="start" font-weight="700" style="fill:#121821">10/12–15</text>
<text x="412" y="268" font-size="11" text-anchor="start" style="fill:#465160">Cash −11.5tn · futures +3.2tn</text>
<circle cx="270" cy="184" r="7" style="fill:#6250d6;stroke:#ffffff;stroke-width:2" />
<text x="258" y="182" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">10/16–23</text>
<text x="258" y="197" font-size="11" text-anchor="end" style="fill:#465160">Cash −0.3tn · futures −1.45tn</text>
<path d="M370,343 C360,300 290,240 274,192" marker-end="url(#a6)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<text x="650" y="50" font-size="14" text-anchor="start" font-weight="700" style="fill:#121821">How to read it</text>
<text x="650" y="78" font-size="12" text-anchor="start" style="fill:#465160">Both selloffs (6/23–7/29, 9/24–10/15) were</text>
<text x="650" y="98" font-size="12" text-anchor="start" style="fill:#465160">cash selling plus futures buying. Prices fell</text>
<text x="650" y="118" font-size="12" text-anchor="start" style="fill:#465160">because longs were sold, not because shorts built.</text>
<text x="650" y="138" font-size="12" text-anchor="start" style="fill:#465160" />
<text x="650" y="158" font-size="12" text-anchor="start" style="fill:#465160">Since 10/16 cash selling has stopped, and</text>
<text x="650" y="178" font-size="12" text-anchor="start" style="fill:#465160">futures are sold on up days: longs kept, hedged.</text>
<text x="650" y="198" font-size="12" text-anchor="start" style="fill:#465160" />
<text x="650" y="218" font-size="12" text-anchor="start" style="fill:#465160">Covering alone is not enough. The futures</text>
<text x="650" y="238" font-size="12" text-anchor="start" style="fill:#465160">short is KRW 1.45tn; cash moves 1–4tn a day.</text>
<text x="650" y="258" font-size="12" text-anchor="start" style="fill:#465160">A recovery needs box ①: real cash buying.</text>
<text x="650" y="278" font-size="12" text-anchor="start" style="fill:#465160" />
<text x="650" y="298" font-size="12" text-anchor="start" style="fill:#465160">④ Ignore expiry and roll days.</text></svg>