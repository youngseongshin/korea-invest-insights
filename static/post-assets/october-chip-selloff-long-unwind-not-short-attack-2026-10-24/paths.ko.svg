<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-label="약 11/6까지 숏커버 시나리오(주관 확률, 10/23 기준): A 이벤트 통과형 숏커버 50%, B 한 번 더 디그로싱 뒤 커버 25%, C 커버 없는 횡보 15%, D 숏이 맞는 신용 이벤트 10%. 관문 사건은 10/27~11/3." width="1000" height="475" style="font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect x="0" y="0" width="1000" height="475" fill="#ffffff" /><defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#6f7a88" /></marker></defs>
<rect x="10" y="150" width="180" height="160" rx="8" style="fill:#ffffff;stroke:#d6dce3;stroke-width:1.2" />
<text x="22" y="172" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">지금(10/24)</text>
<text x="22" y="192" font-size="12" text-anchor="start" style="fill:#465160">헤지된 쏠림 유지</text>
<text x="22" y="210" font-size="12" text-anchor="start" style="fill:#465160">숏 레버리지 99백분위</text>
<text x="22" y="228" font-size="12" text-anchor="start" style="fill:#465160">CTA 롱 −69% 소진</text>
<text x="22" y="246" font-size="12" text-anchor="start" style="fill:#465160">개인 레버리지는 남음</text>
<rect x="240" y="105" width="220" height="250" rx="8" style="fill:#6250d6;stroke:#6250d6;stroke-width:1.6;fill-opacity:0.071" />
<text x="252" y="127" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">관문 사건</text>
<text x="252" y="147" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/27</tspan> FINRA 숏 잔고</text>
<text x="252" y="165" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/28</tspan> SK하이닉스 3Q</text>
<text x="252" y="183" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/29 새벽</tspan> 오라클 투자자의 날</text>
<text x="252" y="201" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/29</tspan> FOMC·알파벳·MS</text>
<text x="252" y="219" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/29</tspan> 삼성 3Q 콜</text>
<text x="252" y="237" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">10/30</tspan> 아마존·샌디스크</text>
<text x="252" y="255" font-size="12" style="fill:#465160"><tspan font-weight="700" style="fill:#121821">11/3</tspan> 미국 중간선거</text>
<text x="252" y="273" font-size="12" text-anchor="start" style="fill:#465160" />
<text x="252" y="291" font-size="12" text-anchor="start" style="fill:#465160">판정 11/6</text>
<rect x="560" y="20" width="430" height="94" rx="8" style="fill:#2a78d6;stroke:#2a78d6;stroke-width:1.6;fill-opacity:0.078" />
<text x="572" y="42" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">A. 이벤트 통과형 숏커버</text>
<text x="572" y="62" font-size="12" text-anchor="start" style="fill:#465160">capex 유지·상향, FOMC 무난 → 헤지 해제</text>
<text x="572" y="80" font-size="12" text-anchor="start" style="fill:#465160">숏 많은 종목 초과 상승(스퀴즈)</text>
<text x="572" y="98" font-size="12" text-anchor="start" style="fill:#465160">한국은 외국인 현물 매수가 붙어야 지속</text>
<rect x="875" y="30" width="100" height="10" rx="5" style="fill:#e4e8ed" />
<rect x="875" y="30" width="100.0" height="10" rx="5" style="fill:#2a78d6" />
<text x="869" y="40" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">50%</text>
<path d="M460,230 C510,230 510,67 558,67" marker-end="url(#a7)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<rect x="560" y="135" width="430" height="94" rx="8" stroke-dasharray="5 4" style="fill:#ffffff;stroke:#d6dce3;stroke-width:1.2" />
<text x="572" y="157" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">B. 한 번 더 디그로싱 뒤 커버</text>
<text x="572" y="177" font-size="12" text-anchor="start" style="fill:#465160">롱 쪽 악재 → 크라우디드 롱 하락·숏 종목 상승</text>
<text x="572" y="195" font-size="12" text-anchor="start" style="fill:#465160">강제 축소로 추가 하락, 그 뒤 커버</text>
<text x="572" y="213" font-size="12" text-anchor="start" style="fill:#465160">디그로싱 중 커버는 반등이 아님</text>
<rect x="875" y="145" width="100" height="10" rx="5" style="fill:#e4e8ed" />
<rect x="875" y="145" width="50.0" height="10" rx="5" style="fill:#6250d6" />
<text x="869" y="155" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">25%</text>
<path d="M460,230 C510,230 510,182 558,182" marker-end="url(#a7)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<rect x="560" y="250" width="430" height="76" rx="8" style="fill:#ffffff;stroke:#d6dce3;stroke-width:1.2" />
<text x="572" y="272" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">C. 커버 없는 횡보</text>
<text x="572" y="292" font-size="12" text-anchor="start" style="fill:#465160">사건은 무난, 변동성은 높게 유지</text>
<text x="572" y="310" font-size="12" text-anchor="start" style="fill:#465160">헤지 유지, 방향 없음</text>
<rect x="875" y="260" width="100" height="10" rx="5" style="fill:#e4e8ed" />
<rect x="875" y="260" width="30.0" height="10" rx="5" style="fill:#6f7a88" />
<text x="869" y="270" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">15%</text>
<path d="M460,230 C510,230 510,288 558,288" marker-end="url(#a7)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<rect x="560" y="345" width="430" height="76" rx="8" style="fill:#eb6834;stroke:#eb6834;stroke-width:1.6;fill-opacity:0.078" />
<text x="572" y="367" font-size="13" text-anchor="start" font-weight="700" style="fill:#121821">D. 숏이 맞는 신용 이벤트</text>
<text x="572" y="387" font-size="12" text-anchor="start" style="fill:#465160">HY 350bp 위·오라클 CDS 300bp 지속</text>
<text x="572" y="405" font-size="12" text-anchor="start" style="fill:#465160">코어위브 채권 신저가 → 조달 고리 붕괴</text>
<rect x="875" y="355" width="100" height="10" rx="5" style="fill:#e4e8ed" />
<rect x="875" y="355" width="20.0" height="10" rx="5" style="fill:#eb6834" />
<text x="869" y="365" font-size="12" text-anchor="end" font-weight="700" style="fill:#121821">10%</text>
<path d="M460,230 C510,230 510,383 558,383" marker-end="url(#a7)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<path d="M190,230 L238,230" marker-end="url(#a7)" style="fill:none;stroke:#6f7a88;stroke-width:1.6" />
<text x="508" y="460" font-size="12" text-anchor="middle" style="fill:#465160">빅테크 capex 유보 → A에서 B로 15%p 이동</text></svg>