<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="510" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">실제 분기선은 엔비디아 생태계 대 브로드컴 진영입니다</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">마벨·미디어텍 투자 이후 비엔비디아 구매자의 위치</text><rect x="24.0" y="70.0" width="270.0" height="250.0" fill="#fdeee6" fill-opacity="1.0" rx="10" stroke="#d9622b" stroke-width="1.6"/><text x="40.0" y="96.0" font-size="13" fill="#d9622b" text-anchor="start" font-weight="bold">엔비디아 생태계(NV링크 퓨전)</text><rect x="40.0" y="118.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="134.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">AWS 트레이니엄4</text><text x="52.0" y="149.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">NVHBM 첫 협력사</text><rect x="40.0" y="166.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="182.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">마벨</text><text x="52.0" y="197.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">지분 20억달러, 3/31</text><rect x="40.0" y="214.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="230.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">미디어텍</text><text x="52.0" y="245.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">전환사채 35억달러, 8/31</text><rect x="40.0" y="262.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="278.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">알칩</text><text x="52.0" y="293.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2025년부터 퓨전 협력사</text><rect x="466.0" y="70.0" width="270.0" height="250.0" fill="#e8f0fb" fill-opacity="1.0" rx="10" stroke="#2a6fc9" stroke-width="1.6"/><text x="482.0" y="96.0" font-size="13" fill="#2a6fc9" text-anchor="start" font-weight="bold">브로드컴 진영</text><rect x="482.0" y="118.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="134.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">구글 TPU</text><text x="494.0" y="149.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">최대 비엔비디아 구매자, 2027 HBM의 36%</text><rect x="482.0" y="166.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="182.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">메타 MTIA·TPU 임차</text><text x="494.0" y="197.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">TPU 구매는 협상 단계</text><rect x="482.0" y="214.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="230.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">오픈AI 타이탄</text><text x="494.0" y="245.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">삼성 HBM4 독점(보도)</text><rect x="482.0" y="262.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="278.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">브로드컴</text><text x="494.0" y="293.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">베이스다이 해법 없음(카운터포인트)</text><rect x="304.0" y="150.0" width="152.0" height="112.0" fill="#f3f0fc" fill-opacity="1.0" rx="10" stroke="#6250d6" stroke-width="1.6"/><text x="380.0" y="172.0" font-size="13" fill="#6250d6" text-anchor="middle" font-weight="bold">삼성</text><text x="380.0" y="190.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">일괄 공급</text><text x="380.0" y="204.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">베이스다이(4·2나노):</text><text x="380.0" y="218.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">브로드컴의 공백을 메울</text><text x="380.0" y="232.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">수 있는 유일한 메모리</text><text x="380.0" y="246.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">업체</text><text x="380.0" y="128.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="bold">분기점</text><line x1="296.0" y1="206.0" x2="304.0" y2="206.0" stroke="#6250d6" stroke-width="2"/><line x1="456.0" y1="206.0" x2="464.0" y2="206.0" stroke="#6250d6" stroke-width="2"/><rect x="24.0" y="336.0" width="712.0" height="62.0" fill="#ffffff" fill-opacity="1.0" rx="8" stroke="#c9d0d8" stroke-width="1"/><text x="40.0" y="358.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">하나의 변수: 구글이 TPU 메모리를 퓨전 밖에 두는가</text><text x="40.0" y="376.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">구글의 차기 TPU(Icefish)를 설계하는 미디어텍이 퓨전 안으로 들어갔고, 알파벳도 같은 사채에</text><text x="40.0" y="390.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">참여했습니다. 통로가 열린 것이지 결정이 난 것은 아닙니다.</text><text x="24.0" y="424.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">두 진영 밖: AMD(표준 HBM4, 삼성과의 합의는 1차 공시로 확인된 유일한 공급 관계)와 HBM 회피 칩(퀄컴·인텔).</text><text x="24.0" y="440.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">투자 금액은 회사 발표를 전한 보도입니다. 브로드컴 평가는 분석가(카운터포인트)의 견해입니다.</text></svg>