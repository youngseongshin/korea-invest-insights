<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="570" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">베이스다이를 누가 설계하느냐가 마진의 주인을 정합니다</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">구매자 진영 다섯 곳과, 각 진영에서 메모리 업체가 가진 협상력</text><text x="24.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">진영</text><text x="170.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">베이스다이 설계</text><text x="360.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">베이스다이 제조</text><text x="532.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">메모리 업체 협상력</text><line x1="24.0" y1="94.0" x2="736.0" y2="94.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="116.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">엔비디아</text><text x="24.0" y="132.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">루빈: 표준</text><text x="24.0" y="146.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">HBM4/4E, 파인만:</text><text x="24.0" y="160.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">NVHBM(2028)</text><text x="170.0" y="116.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2027년까지 메모리 업체,</text><text x="170.0" y="130.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2028년부터 엔비디아</text><text x="360.0" y="116.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">TSMC(NVHBM 3나노), 하이닉스</text><text x="360.0" y="130.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">12나노급, 삼성 4나노(표준)</text><rect x="532.0" y="106.0" width="110.0" height="28.0" fill="#c0392b" fill-opacity="0.92" rx="14"/><text x="587.0" y="125.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">가장 약함</text><line x1="24.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="192.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">브로드컴 진영</text><text x="24.0" y="208.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">구글 TPU, 메타</text><text x="24.0" y="222.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">MTIA, 오픈AI 타이탄</text><text x="170.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">메모리 업체(표준</text><text x="170.0" y="206.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">HBM4/4E)</text><text x="360.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">메모리 업체 선택: 삼성 4·2나노,</text><text x="360.0" y="206.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">하이닉스는 TSMC</text><rect x="532.0" y="182.0" width="110.0" height="28.0" fill="#159a6c" fill-opacity="0.92" rx="14"/><text x="587.0" y="201.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">강함</text><line x1="24.0" y1="246.0" x2="736.0" y2="246.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="268.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">설계 하우스</text><text x="24.0" y="284.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">AWS 트레이니엄, MS</text><text x="24.0" y="298.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">마이아(마벨·GUC·알칩)</text><text x="170.0" y="268.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">설계 파트너</text><text x="360.0" y="268.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">TSMC N3P(C-HBM4E), 마벨</text><text x="360.0" y="282.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2·3나노</text><rect x="532.0" y="258.0" width="110.0" height="28.0" fill="#c8811a" fill-opacity="0.92" rx="14"/><text x="587.0" y="277.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">중간</text><line x1="24.0" y1="322.0" x2="736.0" y2="322.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="344.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">AMD</text><text x="24.0" y="360.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">MI455X, HBM4</text><text x="24.0" y="374.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">12스택</text><text x="170.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">메모리 업체</text><text x="360.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">주로 삼성 4나노</text><rect x="532.0" y="334.0" width="110.0" height="28.0" fill="#159a6c" fill-opacity="0.92" rx="14"/><text x="587.0" y="353.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">강함</text><line x1="24.0" y1="398.0" x2="736.0" y2="398.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="420.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">HBM 회피</text><text x="24.0" y="436.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">퀄컴 AI200·250,</text><text x="24.0" y="450.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">인텔 크레센트 아일랜드</text><text x="170.0" y="420.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">해당 없음(LPDDR·근접</text><text x="170.0" y="434.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">메모리 연산)</text><text x="360.0" y="420.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">해당 없음</text><rect x="532.0" y="410.0" width="110.0" height="28.0" fill="#9aa4b0" fill-opacity="0.92" rx="14"/><text x="587.0" y="429.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">HBM 밖</text><line x1="24.0" y1="474.0" x2="736.0" y2="474.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="494.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">설계 하우스는 더 이상 독립 진영이 아닙니다. 엔비디아가 2026년에 마벨(20억달러)과 미디어텍(35억달러)에 투자했습니다.</text><text x="24.0" y="512.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">TSMC 3나노 NVHBM 베이스다이는 언론 보도(2차)입니다. 다른 진영의 역할은 보도와 회사 발표를 따랐습니다.</text></svg>