<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="440" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">베이스다이 시장은 76억달러이고, 엔비디아 물량 가격 10%는 그보다 큽니다</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">2028년, 억달러(같은 가정을 계속 사용, 범위로 읽어 주십시오)</text><line x1="300.0" y1="78.0" x2="300.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="300.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0</text><line x1="395.0" y1="78.0" x2="395.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="395.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">50</text><line x1="490.0" y1="78.0" x2="490.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="490.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">100</text><line x1="585.0" y1="78.0" x2="585.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="585.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">150</text><line x1="680.0" y1="78.0" x2="680.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="680.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">200</text><text x="24.0" y="116.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">베이스다이 시장 전체</text><text x="24.0" y="132.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">HBM 스택 가치의 2.7%</text><rect x="300.0" y="106.0" width="144.4" height="26.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="452.4" y="124.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">76</text><text x="24.0" y="186.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">구글 HBM 구매가 10% 변동</text><text x="24.0" y="202.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2027 수요의 36%</text><rect x="300.0" y="176.0" width="193.8" height="26.0" fill="#6250d6" fill-opacity="0.92" rx="4"/><text x="501.8" y="194.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">102</text><text x="24.0" y="256.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">엔비디아 HBM 구매가 10%</text><text x="24.0" y="270.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">변동</text><text x="24.0" y="286.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2027 수요의 37~58%</text><rect x="300.0" y="246.0" width="199.5" height="26.0" fill="#d9622b" fill-opacity="0.92" rx="4"/><rect x="499.5" y="246.0" width="112.1" height="26.0" fill="#f7cdb4" fill-opacity="1.0" rx="4" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="5 3"/><text x="619.6" y="264.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">105~164</text><text x="24.0" y="336.0" font-size="11.5" fill="#d9622b" text-anchor="start" font-weight="bold">저희 해석: 엔비디아는 나머지 97%의 가격을 정하려고 베이스다이 설계를 가져갑니다.</text><text x="24.0" y="356.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2028년 HBM 시장 2,820억달러(JP모건, 2차 인용)에 베이스다이 가치 비중 2.7%를 곱하면 76억달러입니다.</text><text x="24.0" y="372.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">수요 비중은 모건스탠리(엔비디아 37%)와 더 높은 추정(58%)입니다. 둘 다 외부 추정입니다.</text></svg>