<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="440" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">The base die is a $7.6B market; 10% of NVIDIA's HBM price is bigger</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">2028, $ billion (same assumptions throughout; read as ranges)</text><line x1="300.0" y1="78.0" x2="300.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="300.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">0</text><line x1="395.0" y1="78.0" x2="395.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="395.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">5</text><line x1="490.0" y1="78.0" x2="490.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="490.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">10</text><line x1="585.0" y1="78.0" x2="585.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="585.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">15</text><line x1="680.0" y1="78.0" x2="680.0" y2="294.0" stroke="#e3e7ec" stroke-width="1"/><text x="680.0" y="310.0" font-size="10.5" fill="#5b6774" text-anchor="middle" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">20</text><text x="24.0" y="116.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Base die, whole market</text><text x="24.0" y="132.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">2.7% of the HBM stack value</text><rect x="300.0" y="106.0" width="144.4" height="26.0" fill="#0f8a8a" fill-opacity="0.92" rx="4"/><text x="452.4" y="124.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">7.6</text><text x="24.0" y="186.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">10% price on Google's HBM</text><text x="24.0" y="200.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">purchases</text><text x="24.0" y="216.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">36% of 2027 demand</text><rect x="300.0" y="176.0" width="193.8" height="26.0" fill="#6250d6" fill-opacity="0.92" rx="4"/><text x="501.8" y="194.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">10.2</text><text x="24.0" y="256.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">10% price on NVIDIA's HBM</text><text x="24.0" y="270.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">purchases</text><text x="24.0" y="286.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">37% to 58% of 2027 demand</text><rect x="300.0" y="246.0" width="199.5" height="26.0" fill="#d9622b" fill-opacity="0.92" rx="4"/><rect x="499.5" y="246.0" width="112.1" height="26.0" fill="#f7cdb4" fill-opacity="1.0" rx="4" stroke="#d9622b" stroke-width="1.6" stroke-dasharray="5 3"/><text x="619.6" y="264.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">10.5 to 16.4</text><text x="24.0" y="336.0" font-size="11.5" fill="#d9622b" text-anchor="start" font-weight="bold">Our reading: NVIDIA takes the base-die design to control the price of the other 97% of the stack.</text><text x="24.0" y="356.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">HBM market $282B in 2028 (JPMorgan, secondary) times 2.7% base-die value share = $7.6B.</text><text x="24.0" y="372.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Demand shares are Morgan Stanley (NVIDIA 37%) and a higher estimate (58%). Both are third-party estimates.</text></svg>