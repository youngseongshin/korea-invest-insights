<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">다음 확인 일정</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">날짜 순서이며 간격은 실제 기간과 다릅니다</text><line x1="176.0" y1="84.0" x2="176.0" y2="354.0" stroke="#c9d0d8" stroke-width="2"/><text x="158.0" y="88.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">2026년 12월 2일</text><circle cx="176.0" cy="84.0" r="7" fill="#d9622b" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="88.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">엔비디아 GTC DC: 구글·메타·미디어텍 고객이 퓨전·NVHBM에</text><text x="198.0" y="103.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">참여하는가. 참여하면 엔비디아 표준 확산 경로 확률이 약 15%p</text><text x="198.0" y="118.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">오릅니다(저희 추정)</text><text x="158.0" y="142.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">12월 중순(추정)</text><circle cx="176.0" cy="138.0" r="7" fill="#2a6fc9" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="142.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">브로드컴 FQ4: 맞춤 HBM 베이스다이를 삼성과 TSMC 중 누가</text><text x="198.0" y="157.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">만드는가</text><text x="158.0" y="196.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">12월 17일(추정)</text><circle cx="176.0" cy="192.0" r="7" fill="#0f8a8a" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="196.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">마이크론 FQ1 FY27: 맞춤 HBM4E 고객 수, 구글 진입 여부</text><text x="158.0" y="250.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">2027년 1월 14일(관행)</text><circle cx="176.0" cy="246.0" r="7" fill="#159a6c" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="250.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">TSMC 4Q26: C-HBM4E 고객, CoWoS 배분, 3D D램</text><text x="198.0" y="265.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">질의</text><text x="158.0" y="304.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">2027년 1월 27~28일</text><circle cx="176.0" cy="300.0" r="7" fill="#6250d6" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">SK하이닉스·삼성 4Q26: 맞춤 HBM4E 수주, 2나노</text><text x="198.0" y="319.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">베이스다이(고객명은 대개 비공개)</text><text x="158.0" y="358.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">수시</text><circle cx="176.0" cy="354.0" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="358.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">메타 TPU 구매 확정, MS 마이아 300 HBM4 공급사 공개</text><text x="24.0" y="408.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">추정·관행 표시 날짜는 회사가 확정한 것이 아닙니다.</text></svg>