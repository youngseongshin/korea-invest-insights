xt-anchor="start" font-weight="bold">확률 가중</text><text x="24.0" y="274.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">범위 중간값</text><polygon points="471.6,260.0 480.6,249.0 489.6,260.0 480.6,271.0" fill="#17212b"/><text x="464.6" y="265.0" font-size="12.5" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">−10.5</text><text x="736.0" y="380.0" font-size="1" fill="#17212b" text-anchor="start" font-weight="normal"></text><text x="24.0" y="310.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">상쇄: 수요 5~10%p가</text><text x="24.0" y="324.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">비엔비디아로 이동</text><text x="24.0" y="338.0" font-size="10" fill="#5b6774" text-anchor="start" font-weight="normal">삼성 비중 비엔비디아 51%, 엔비디아 28%</text><rect x="616.5" y="301.0" width="40.1" height="22.0" fill="#159a6c" fill-opacity="0.92" rx="4"/><rect x="656.6" y="301.0" width="40.1" height="22.0" fill="#cfeedd" fill-opacity="1.0" rx="4" stroke="#159a6c" stroke-width="1.4" stroke-dasharray="5 3"/><text x="606.5" y="317.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold" font-family="Menlo, 'DejaVu Sans Mono', monospace">+3.1~+6.2</text><text x="736.0" y="380.0" font-size="1" fill="#17212b" text-anchor="start" font-weight="normal"></text><line x1="616.5" y1="78.0" x2="616.5" y2="344.0" stroke="#8a94a0" stroke-width="1.4"/><text x="24.0" y="392.0" font-size="11.5" fill="#d9622b" text-anchor="start" font-weight="bold">가장 나쁜 경로도 2028년 영업이익의 4% 미만입니다. 1차 변수는 여전히 범용 D램 가격입니다.</text><text x="24.0" y="410.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">삼성 2028 HBM 매출 990억달러(시장 2,820억달러, 점유율 35%), 점유율 1%p = 2.66조원, 영향 물량 가격 10% 인하를 가정했습니다.</text><text x="24.0" y="426.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">확률과 범위는 저희의 주관 추정이며 회사 가이던스나 컨센서스가 아닙니다.</text></svg>