.5" fill="#5b6774" text-anchor="start" font-weight="normal">Assumes 2028 Samsung HBM revenue of $99B ($282B market, 35% share); 1 point of share = ₩2.66T; 10% price cut on affected volume.</text><text x="24.0" y="426.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Odds and ranges are our subjective estimates. They are not company guidance or consensus.</text></svg>