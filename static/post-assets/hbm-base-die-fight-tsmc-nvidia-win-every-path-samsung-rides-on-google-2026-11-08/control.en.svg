<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="570" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">Who designs the base die decides who keeps the margin</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Five buyer camps, and how much bargaining power the memory makers keep in each</text><text x="24.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Camp</text><text x="170.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Who designs the base die</text><text x="360.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Who makes it</text><text x="532.0" y="80.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="bold">Memory-maker power</text><line x1="24.0" y1="94.0" x2="736.0" y2="94.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="116.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">NVIDIA</text><text x="24.0" y="132.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Rubin: standard HBM4/4E.</text><text x="24.0" y="146.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Feynman: NVHBM (2028)</text><text x="170.0" y="116.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Memory maker until 2027,</text><text x="170.0" y="130.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">NVIDIA from 2028</text><text x="360.0" y="116.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">TSMC (NVHBM 3nm), SK hynix</text><text x="360.0" y="130.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">12nm-class, Samsung 4nm</text><text x="360.0" y="144.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">for standard</text><rect x="532.0" y="106.0" width="110.0" height="28.0" fill="#c0392b" fill-opacity="0.92" rx="14"/><text x="587.0" y="125.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Weakest</text><line x1="24.0" y1="170.0" x2="736.0" y2="170.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="192.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Broadcom camp</text><text x="24.0" y="208.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Google TPU, Meta MTIA,</text><text x="24.0" y="222.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">OpenAI Titan</text><text x="170.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Memory maker (standard</text><text x="170.0" y="206.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">HBM4/4E)</text><text x="360.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Memory maker's pick:</text><text x="360.0" y="206.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Samsung 4nm and 2nm I/O,</text><text x="360.0" y="220.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">SK hynix at TSMC</text><rect x="532.0" y="182.0" width="110.0" height="28.0" fill="#159a6c" fill-opacity="0.92" rx="14"/><text x="587.0" y="201.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Strong</text><line x1="24.0" y1="246.0" x2="736.0" y2="246.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="268.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Design houses</text><text x="24.0" y="284.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">AWS Trainium, Microsoft</text><text x="24.0" y="298.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Maia (Marvell, GUC,</text><text x="24.0" y="312.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Alchip)</text><text x="170.0" y="268.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">The design partner</text><text x="360.0" y="268.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">TSMC N3P (C-HBM4E),</text><text x="360.0" y="282.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Marvell 2nm and 3nm</text><rect x="532.0" y="258.0" width="110.0" height="28.0" fill="#c8811a" fill-opacity="0.92" rx="14"/><text x="587.0" y="277.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Middle</text><line x1="24.0" y1="322.0" x2="736.0" y2="322.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="344.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">AMD</text><text x="24.0" y="360.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">MI455X, 12 stacks of HBM4</text><text x="170.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Memory maker</text><text x="360.0" y="344.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Samsung 4nm, mainly</text><rect x="532.0" y="334.0" width="110.0" height="28.0" fill="#159a6c" fill-opacity="0.92" rx="14"/><text x="587.0" y="353.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Strong</text><line x1="24.0" y1="398.0" x2="736.0" y2="398.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="420.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">HBM avoiders</text><text x="24.0" y="436.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Qualcomm AI200/250, Intel</text><text x="24.0" y="450.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Crescent Island</text><text x="170.0" y="420.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Not applicable (LPDDR,</text><text x="170.0" y="434.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">near-memory compute)</text><text x="360.0" y="420.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Not applicable</text><rect x="532.0" y="410.0" width="110.0" height="28.0" fill="#9aa4b0" fill-opacity="0.92" rx="14"/><text x="587.0" y="429.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Outside HBM</text><line x1="24.0" y1="474.0" x2="736.0" y2="474.0" stroke="#e3e7ec" stroke-width="1"/><text x="24.0" y="494.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Design houses are no longer a separate camp: NVIDIA bought into Marvell ($2B) and MediaTek ($3.5B) in 2026.</text><text x="24.0" y="512.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">NVHBM base die on TSMC 3nm is a press report (secondary). Roles in the other camps follow press and company statements.</text></svg>