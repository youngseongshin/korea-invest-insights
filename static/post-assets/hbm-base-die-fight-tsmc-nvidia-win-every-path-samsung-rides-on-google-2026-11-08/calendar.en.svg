<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">What to check next</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Dates in order; spacing is not to scale</text><line x1="176.0" y1="84.0" x2="176.0" y2="354.0" stroke="#c9d0d8" stroke-width="2"/><text x="158.0" y="88.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Dec 2, 2026</text><circle cx="176.0" cy="84.0" r="7" fill="#d9622b" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="88.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">NVIDIA GTC DC: do Google, Meta or MediaTek customers join Fusion</text><text x="198.0" y="103.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">or NVHBM? If yes, the NVIDIA-standard path gains about 15 points</text><text x="198.0" y="118.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">(our estimate)</text><text x="158.0" y="142.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Mid-Dec (est.)</text><circle cx="176.0" cy="138.0" r="7" fill="#2a6fc9" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="142.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Broadcom FQ4: who builds the custom HBM base die, Samsung or TSMC?</text><text x="158.0" y="196.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Dec 17 (est.)</text><circle cx="176.0" cy="192.0" r="7" fill="#0f8a8a" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="196.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Micron FQ1 FY27: custom HBM4E customers, any Google entry</text><text x="158.0" y="250.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Jan 14, 2027 (customary)</text><circle cx="176.0" cy="246.0" r="7" fill="#159a6c" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="250.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">TSMC 4Q26: C-HBM4E customers, CoWoS allocation, the 3D DRAM</text><text x="198.0" y="265.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">question</text><text x="158.0" y="304.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Jan 27 to 28, 2027</text><circle cx="176.0" cy="300.0" r="7" fill="#6250d6" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="304.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">SK hynix and Samsung 4Q26: custom HBM4E wins, 2nm base die</text><text x="198.0" y="319.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">(customer names are rarely given)</text><text x="158.0" y="358.0" font-size="12" fill="#17212b" text-anchor="end" font-weight="bold">Any time</text><circle cx="176.0" cy="354.0" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/><text x="198.0" y="358.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Meta confirms TPU purchases; Microsoft names the Maia 300 HBM4</text><text x="198.0" y="373.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">suppliers</text><text x="24.0" y="408.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Dates marked estimated or customary are not company-confirmed.</text></svg>