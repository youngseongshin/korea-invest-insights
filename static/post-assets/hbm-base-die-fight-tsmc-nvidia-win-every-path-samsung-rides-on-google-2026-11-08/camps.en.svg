<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="-20" y="-20" width="800" height="510" fill="#ffffff"/><text x="24.0" y="28.0" font-size="16" fill="#17212b" text-anchor="start" font-weight="bold">The real fault line: NVIDIA's ecosystem versus Broadcom's camp</text><text x="24.0" y="48.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Where non-NVIDIA buyers sit after the Marvell and MediaTek deals</text><rect x="24.0" y="70.0" width="270.0" height="250.0" fill="#fdeee6" fill-opacity="1.0" rx="10" stroke="#d9622b" stroke-width="1.6"/><text x="40.0" y="96.0" font-size="13" fill="#d9622b" text-anchor="start" font-weight="bold">NVIDIA ecosystem (NVLink Fusion)</text><rect x="40.0" y="118.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="134.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">AWS Trainium4</text><text x="52.0" y="149.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">first NVHBM partner</text><rect x="40.0" y="166.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="182.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Marvell</text><text x="52.0" y="197.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">$2B equity, Mar 31</text><rect x="40.0" y="214.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="230.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">MediaTek</text><text x="52.0" y="245.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">$3.5B convertible, Aug 31</text><rect x="40.0" y="262.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#f0c2a8" stroke-width="1"/><text x="52.0" y="278.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Alchip</text><text x="52.0" y="293.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Fusion partner since 2025</text><rect x="466.0" y="70.0" width="270.0" height="250.0" fill="#e8f0fb" fill-opacity="1.0" rx="10" stroke="#2a6fc9" stroke-width="1.6"/><text x="482.0" y="96.0" font-size="13" fill="#2a6fc9" text-anchor="start" font-weight="bold">Broadcom camp</text><rect x="482.0" y="118.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="134.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Google TPU</text><text x="494.0" y="149.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">largest non-NVIDIA buyer, 36% of 2027 HBM</text><rect x="482.0" y="166.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="182.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Meta MTIA and TPU rental</text><text x="494.0" y="197.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">TPU purchase still in talks</text><rect x="482.0" y="214.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="230.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">OpenAI Titan</text><text x="494.0" y="245.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Samsung HBM4 exclusive (report)</text><rect x="482.0" y="262.0" width="238.0" height="38.0" fill="#ffffff" fill-opacity="1.0" rx="6" stroke="#b9cdee" stroke-width="1"/><text x="494.0" y="278.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Broadcom</text><text x="494.0" y="293.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">no base-die answer yet (Counterpoint)</text><rect x="304.0" y="150.0" width="152.0" height="112.0" fill="#f3f0fc" fill-opacity="1.0" rx="10" stroke="#6250d6" stroke-width="1.6"/><text x="380.0" y="172.0" font-size="13" fill="#6250d6" text-anchor="middle" font-weight="bold">Samsung</text><text x="380.0" y="190.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">turnkey base die</text><text x="380.0" y="204.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">(4nm, 2nm): the only</text><text x="380.0" y="218.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">memory maker that</text><text x="380.0" y="232.0" font-size="10.5" fill="#17212b" text-anchor="middle" font-weight="normal">fills Broadcom's gap</text><text x="380.0" y="128.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="bold">swing</text><line x1="296.0" y1="206.0" x2="304.0" y2="206.0" stroke="#6250d6" stroke-width="2"/><line x1="456.0" y1="206.0" x2="464.0" y2="206.0" stroke="#6250d6" stroke-width="2"/><rect x="24.0" y="336.0" width="712.0" height="62.0" fill="#ffffff" fill-opacity="1.0" rx="8" stroke="#c9d0d8" stroke-width="1"/><text x="40.0" y="358.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">The one variable: does Google keep TPU memory outside NVLink Fusion?</text><text x="40.0" y="376.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">MediaTek, which designs Google's next TPU (Icefish), is now inside Fusion, and Alphabet bought into the same bond.</text><text x="40.0" y="390.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">That is a path opening, not a decision.</text><text x="24.0" y="424.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Outside both camps: AMD (standard HBM4, Samsung agreement, the only primary-source supply deal) and HBM avoiders (Qualcomm, Intel).</text><text x="24.0" y="440.0" font-size="10.5" fill="#5b6774" text-anchor="start" font-weight="normal">Investment amounts are from press reports of company announcements. Broadcom's view is an analyst's (Counterpoint).</text></svg>