<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" width="760" height="654" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="One chain from industry inventory to value per share. Industry inventory ledger / Samsung memory profit / Company profit and EPS / Capital and cash books / Normal year / Value per share"><rect x="0" y="0" width="760" height="654" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">One chain from industry inventory to value per share</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Every layer hands the same quarterly state to the next and uses one rulebook. The right column shows each layer&#x27;s main</text><text x="24.0" y="66.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">assumption</text><rect x="24.0" y="92.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="125.0" r="13" fill="#2563a8"/><text x="46.0" y="130.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="121.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Industry inventory</text><text x="68.0" y="139.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">ledger</text><text x="228.0" y="114.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Chips made − shipped = supplier stock.</text><text x="228.0" y="129.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Shipped − used = buyer stock. Prices rise</text><text x="228.0" y="144.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">when stock runs thin.</text><rect x="492.0" y="100.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="114.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2027 DRAM supply +10.7% or +22%.</text><text x="502.0" y="129.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">End-2026 stock: 4.5 weeks at</text><text x="502.0" y="144.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">suppliers, 11 at buyers</text><path d="M46 159.0 L46 169.0" stroke="#2563a8" stroke-width="2"/><path d="M41 164.0 L46 170.0 L51 164.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="170.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="203.0" r="13" fill="#2563a8"/><text x="46.0" y="208.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="68.0" y="199.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Samsung memory</text><text x="68.0" y="217.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">profit</text><text x="228.0" y="199.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Bits × price for conventional DRAM, HBM and</text><text x="228.0" y="214.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">NAND, minus costs.</text><rect x="492.0" y="178.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="192.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Fixed costs 55% of memory costs,</text><text x="502.0" y="207.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">tested on costs in the 2019 and 2023</text><text x="502.0" y="222.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">downturns</text><path d="M46 237.0 L46 247.0" stroke="#2563a8" stroke-width="2"/><path d="M41 242.0 L46 248.0 L51 242.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="248.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="281.0" r="13" fill="#2563a8"/><text x="46.0" y="286.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="68.0" y="277.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Company profit and</text><text x="68.0" y="295.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">EPS</text><text x="228.0" y="277.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Adds chips beyond memory and other</text><text x="228.0" y="292.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">divisions, then tax, over one share count.</text><rect x="492.0" y="256.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="277.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Tax 23.8%, 6.6486 billion shares,</text><text x="502.0" y="292.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">₩1,340 per dollar from 2027</text><path d="M46 315.0 L46 325.0" stroke="#2563a8" stroke-width="2"/><path d="M41 320.0 L46 326.0 L51 320.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="326.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="359.0" r="13" fill="#2563a8"/><text x="46.0" y="364.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="68.0" y="364.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Capital and cash books</text><text x="228.0" y="355.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Capex, depreciation, payouts and the cash</text><text x="228.0" y="370.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">that piles up.</text><rect x="492.0" y="334.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="348.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Half of free cash flow returned.</text><text x="502.0" y="363.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Retained cash earns 3% before tax</text><text x="502.0" y="378.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">(about 2.3% after)</text><path d="M46 393.0 L46 403.0" stroke="#2563a8" stroke-width="2"/><path d="M41 398.0 L46 404.0 L51 398.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="404.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="437.0" r="13" fill="#2563a8"/><text x="46.0" y="442.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="68.0" y="442.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Normal year</text><text x="228.0" y="433.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">What buyers can keep paying once the</text><text x="228.0" y="448.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">shortage ends, checked against supply.</text><rect x="492.0" y="412.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="433.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Memory keeps 25% of big-cloud capex,</text><text x="502.0" y="448.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">plus phones and PCs</text><path d="M46 471.0 L46 481.0" stroke="#2563a8" stroke-width="2"/><path d="M41 476.0 L46 482.0 L51 476.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="482.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="515.0" r="13" fill="#2563a8"/><text x="46.0" y="520.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="68.0" y="520.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">Value per share</text><text x="228.0" y="511.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Two methods on the same books: residual</text><text x="228.0" y="526.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">income and cash paid to shareholders.</text><rect x="492.0" y="490.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="511.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Discount rate 10%. Both methods</text><text x="502.0" y="526.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">must give the same answer</text><rect x="24.0" y="562.0" width="712.0" height="74.0" fill="#eef6f1" rx="4"/><text x="40.0" y="584.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  Consensus is a check. It is never an input.</text><text x="40.0" y="602.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  Main judgment calls sit on 8 named dials. No factor is tuned to hit a target.</text><text x="40.0" y="620.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  Across 4,212 dial settings, the two value methods differ by at most 8×10⁻¹⁶.</text></svg>