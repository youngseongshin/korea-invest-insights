<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 638" width="760" height="638" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="업계 재고에서 주당 가치까지 한 줄로 잇습니다. 업계 재고 장부 / 삼성 메모리 이익 / 전사 이익과 EPS / 자본·현금 장부 / 정상 연도 / 주당 가치"><rect x="0" y="0" width="760" height="638" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">업계 재고에서 주당 가치까지 한 줄로 잇습니다</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">모든 층이 같은 분기 상태를 다음 층에 넘기고 같은 규약을 씁니다. 오른쪽은 각 층의 주요 가정입니다</text><rect x="24.0" y="76.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="109.0" r="13" fill="#2563a8"/><text x="46.0" y="114.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="68.0" y="114.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">업계 재고 장부</text><text x="228.0" y="105.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">생산 − 출하 = 공급사 재고, 출하 − 사용 = 구매자</text><text x="228.0" y="120.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">재고. 재고가 얇을수록 가격이 오릅니다.</text><rect x="492.0" y="84.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="98.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2027년 D램 공급 +10.7% 또는 +22%.</text><text x="502.0" y="113.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2026년 말 재고는 공급사 4.5주, 구매자</text><text x="502.0" y="128.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">11주</text><path d="M46 143.0 L46 153.0" stroke="#2563a8" stroke-width="2"/><path d="M41 148.0 L46 154.0 L51 148.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="154.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="187.0" r="13" fill="#2563a8"/><text x="46.0" y="192.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="68.0" y="192.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">삼성 메모리 이익</text><text x="228.0" y="183.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">범용 D램·HBM·낸드의 비트 × 가격에서 비용을</text><text x="228.0" y="198.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">뺍니다.</text><rect x="492.0" y="162.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="183.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">고정비는 메모리 비용의 55%.</text><text x="502.0" y="198.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2019·2023년 하강기 비용으로 검증</text><path d="M46 221.0 L46 231.0" stroke="#2563a8" stroke-width="2"/><path d="M41 226.0 L46 232.0 L51 226.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="232.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="265.0" r="13" fill="#2563a8"/><text x="46.0" y="270.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="68.0" y="270.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">전사 이익과 EPS</text><text x="228.0" y="261.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">비메모리와 다른 사업부를 더하고 세금을 뺀 뒤</text><text x="228.0" y="276.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">주식 수 하나로 나눕니다.</text><rect x="492.0" y="240.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="261.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">세율 23.8%, 66.486억주, 2027년부터</text><text x="502.0" y="276.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">달러당 1,340원</text><path d="M46 299.0 L46 309.0" stroke="#2563a8" stroke-width="2"/><path d="M41 304.0 L46 310.0 L51 304.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="310.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="343.0" r="13" fill="#2563a8"/><text x="46.0" y="348.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="68.0" y="348.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">자본·현금 장부</text><text x="228.0" y="339.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">시설투자, 감가상각, 주주환원, 쌓이는 현금을</text><text x="228.0" y="354.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">기록합니다.</text><rect x="492.0" y="318.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="339.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">잉여현금흐름의 절반 환원. 유보현금은 세전</text><text x="502.0" y="354.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">3%(세후 약 2.3%)</text><path d="M46 377.0 L46 387.0" stroke="#2563a8" stroke-width="2"/><path d="M41 382.0 L46 388.0 L51 382.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="388.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="421.0" r="13" fill="#2563a8"/><text x="46.0" y="426.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="68.0" y="426.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">정상 연도</text><text x="228.0" y="417.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">부족이 끝난 뒤 구매자가 계속 낼 수 있는 돈을 공급</text><text x="228.0" y="432.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">능력과 맞춰 봅니다.</text><rect x="492.0" y="396.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="417.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">대형 클라우드 투자의 25%가 메모리로 지속,</text><text x="502.0" y="432.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">여기에 폰·PC 수요</text><path d="M46 455.0 L46 465.0" stroke="#2563a8" stroke-width="2"/><path d="M41 460.0 L46 466.0 L51 460.0" fill="none" stroke="#2563a8" stroke-width="2"/><rect x="24.0" y="466.0" width="712.0" height="66.0" fill="#f6f8fa" rx="4"/><circle cx="46.0" cy="499.0" r="13" fill="#2563a8"/><text x="46.0" y="504.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="68.0" y="504.0" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="bold">주당 가치</text><text x="228.0" y="495.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">같은 장부에서 잔여이익과 주주 현금흐름 두</text><text x="228.0" y="510.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">방식으로 계산합니다.</text><rect x="492.0" y="474.0" width="236.0" height="50.0" fill="#ffffff" rx="3" stroke="#9cc0e6" stroke-width="1"/><text x="502.0" y="503.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">할인율 10%. 두 방식의 답이 같아야 통과</text><rect x="24.0" y="546.0" width="712.0" height="74.0" fill="#eef6f1" rx="4"/><text x="40.0" y="568.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  컨센서스는 입력에 넣지 않고 대조에만 씁니다.</text><text x="40.0" y="586.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  주요 판단은 이름 붙은 다이얼 8개에 둡니다. 목표값에 맞추는 보정값은 없습니다.</text><text x="40.0" y="604.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">✓  다이얼 설정 4,212개에서 두 가치 계산의 차이는 최대 8×10⁻¹⁶입니다.</text></svg>