<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="What we watch next, and what each answer changes"><rect x="0" y="0" width="760" height="472" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">What we watch next, and what each answer changes</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Dates are expected timing. The right column shows what each observation moves in the model</text><line x1="40.0" y1="78.0" x2="40.0" y2="448.0" stroke="#9cc0e6" stroke-width="3"/><circle cx="40.0" cy="88.0" r="8" fill="#2563a8"/><text x="58.0" y="93.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">Mid-Dec 2026</text><text x="58.0" y="112.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Micron&#x27;s 2027 industry DRAM supply</text><text x="58.0" y="128.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">view</text><rect x="310.0" y="76.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="96.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">+20% or more with no inventory build: the +22% path (2027 operating</text><text x="322.0" y="111.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">profit about ₩617tn). +12% or less: the structural path (about ₩725tn).</text><circle cx="40.0" cy="166.0" r="8" fill="#2563a8"/><text x="58.0" y="171.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">Late Dec 2026</text><text x="58.0" y="190.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">TrendForce 1Q27 DRAM contract price</text><text x="58.0" y="206.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">outlook</text><rect x="310.0" y="154.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="174.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Both paths expect +4% to +5%, so it does not pick a path. Flat or lower</text><text x="322.0" y="189.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">means end-2026 inventory is higher than we assume.</text><circle cx="40.0" cy="244.0" r="8" fill="#2563a8"/><text x="58.0" y="249.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">Late Jan 2027</text><text x="58.0" y="268.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">Samsung 4Q26 results, inventory</text><text x="58.0" y="284.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">weeks, board return policy</text><rect x="310.0" y="232.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="252.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Replaces the starting inventory and capital conventions with reported</text><text x="322.0" y="267.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">values. Value moves −₩52,000 to +₩19,000.</text><circle cx="40.0" cy="322.0" r="8" fill="#159a6c"/><text x="58.0" y="327.0" font-size="13" fill="#159a6c" text-anchor="start" font-weight="bold">Late Mar 2027</text><text x="58.0" y="346.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">TrendForce 2Q27 contract price</text><text x="58.0" y="362.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">outlook</text><rect x="310.0" y="310.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="330.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">The first real fork. A double-digit rise backs the structural path; a</text><text x="322.0" y="345.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">decline backs +22% (model: +11.2% vs −1.4%).</text><circle cx="40.0" cy="400.0" r="8" fill="#2563a8"/><text x="58.0" y="405.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">2H 2027</text><text x="58.0" y="424.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">2028 contracts for HBM and</text><text x="58.0" y="440.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">conventional DRAM</text><rect x="310.0" y="388.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="408.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">Prices and volumes held: keep counting 2028. Cuts in the mid-teens or</text><text x="322.0" y="423.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">deeper: count through 2027 only (−₩42,000 to −₩64,000).</text></svg>