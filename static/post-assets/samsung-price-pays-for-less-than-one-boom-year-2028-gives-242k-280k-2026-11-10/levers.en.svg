<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="What moves the value most, and where our view rests"><rect x="0" y="0" width="760" height="402" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">What moves the value most, and where our view rests</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">Swing in value per share (₩ thousand) when counting through 2028, and the evidence that settles each variable</text><line x1="300.0" y1="78.0" x2="300.0" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="300.0" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">0</text><line x1="365.7" y1="78.0" x2="365.7" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="365.7" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">20</text><line x1="431.4" y1="78.0" x2="431.4" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="431.4" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">40</text><line x1="497.1" y1="78.0" x2="497.1" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="497.1" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">60</text><rect x="20.0" y="78.0" width="720.0" height="56.0" fill="#eef6f1" rx="4"/><text x="32.0" y="104.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Does 2028 boom profit survive?</text><rect x="300.0" y="88.0" width="138.7" height="22.0" fill="#159a6c" rx="3" fill-opacity="0.9"/><rect x="438.7" y="88.0" width="72.0" height="22.0" fill="#159a6c" rx="3" fill-opacity="0.45"/><text x="516.6" y="104.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">42~64</text><text x="584.0" y="95.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">2028 contracts for HBM</text><text x="584.0" y="110.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">and DRAM · 2H 2027</text><text x="32.0" y="158.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Height of the normal year (memory at</text><text x="32.0" y="174.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">20–30% of cloud capex)</text><rect x="300.0" y="150.0" width="209.3" height="22.0" fill="#2563a8" rx="3" fill-opacity="0.9"/><rect x="509.3" y="150.0" width="6.2" height="22.0" fill="#2563a8" rx="3" fill-opacity="0.45"/><text x="521.5" y="166.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">64~66</text><text x="584.0" y="157.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Measured memory spend vs</text><text x="584.0" y="172.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">cloud capex · 2027</text><text x="32.0" y="220.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">Capital conventions (base vs</text><text x="32.0" y="236.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">conservative)</text><rect x="300.0" y="212.0" width="172.2" height="22.0" fill="#2563a8" rx="3" fill-opacity="0.9"/><rect x="472.2" y="212.0" width="25.3" height="22.0" fill="#2563a8" rx="3" fill-opacity="0.45"/><text x="503.5" y="228.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">52~60</text><text x="584.0" y="219.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Board return policy · Jan</text><text x="584.0" y="234.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">2027</text><text x="32.0" y="290.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">2027 supply definition (+10.7% vs +22%)</text><rect x="300.0" y="274.0" width="123.2" height="22.0" fill="#2563a8" rx="3" fill-opacity="0.9"/><text x="429.2" y="290.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">38</text><text x="584.0" y="281.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Micron&#x27;s 2027 supply view ·</text><text x="584.0" y="296.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">mid-Dec</text><text x="24.0" y="375.1" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">The dark bar is the smallest swing and the light extension the largest. We side with 2028 profit surviving. The reason is the</text><text x="24.0" y="390.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">inventory ledger; the evidence against is in the text.</text></svg>