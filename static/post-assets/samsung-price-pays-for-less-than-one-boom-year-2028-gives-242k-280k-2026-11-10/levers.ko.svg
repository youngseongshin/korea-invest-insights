390.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">짙은 막대는 최소 폭, 옅은 연장은 최대 폭입니다. 저희는 2028년 초과이익이 남는 쪽에 섭니다. 근거는 재고 장부이고 반대 근거는 본문에 적었습니다.</text></svg>