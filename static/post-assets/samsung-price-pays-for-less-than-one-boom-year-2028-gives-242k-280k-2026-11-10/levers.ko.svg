<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="가치를 크게 움직이는 변수와 저희의 방점"><rect x="0" y="0" width="760" height="402" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">가치를 크게 움직이는 변수와 저희의 방점</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">2028년까지 인정한 가치 기준, 변수가 움직일 때 주당 가치의 변화 폭(천원)과 답을 줄 관측</text><line x1="300.0" y1="78.0" x2="300.0" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="300.0" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">0</text><line x1="365.7" y1="78.0" x2="365.7" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="365.7" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">20</text><line x1="431.4" y1="78.0" x2="431.4" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="431.4" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">40</text><line x1="497.1" y1="78.0" x2="497.1" y2="324.0" stroke="#e3e7eb" stroke-width="1"/><text x="497.1" y="340.0" font-size="11" fill="#5b6774" text-anchor="middle" font-weight="normal">60</text><rect x="20.0" y="78.0" width="720.0" height="56.0" fill="#eef6f1" rx="4"/><text x="32.0" y="104.0" font-size="12.5" fill="#17212b" text-anchor="start" font-weight="bold">2028년 초과이익이 남는가</text><rect x="300.0" y="88.0" width="138.7" height="22.0" fill="#159a6c" rx="3" fill-opacity="0.9"/><rect x="438.7" y="88.0" width="72.0" height="22.0" fill="#159a6c" rx="3" fill-opacity="0.45"/><text x="516.6" y="104.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">42~64</text><text x="584.0" y="95.5" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">2028년분 HBM·범용 장기계약 ·</text><text x="58