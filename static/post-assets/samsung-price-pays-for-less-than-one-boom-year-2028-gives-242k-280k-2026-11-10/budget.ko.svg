<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="높은 가치는 지속 가능한 수요의 3~4배 지출을 요구합니다"><rect x="0" y="0" width="760" height="450" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">높은 가치는 지속 가능한 수요의 3~4배 지출을 요구합니다</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">모형이 함의하는 업계 메모리 매출과 지속 가능한 지출 예산, 조 달러</text><rect x="24.0" y="62.0" width="12.0" height="12.0" fill="#9aa3ad" rx="2"/><text x="42.0" y="72.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">지속 가능한 예산</text><rect x="149.8" y="62.0" width="12.0" height="12.0" fill="#d9822b" rx="2"/><text x="167.8" y="72.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">공급 +22% 경로</text><rect x="273.3" y="62.0" width="12.0" height="12.0" fill="#2563a8" rx="2"/><text x="291.3" y="72.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">구조 공급 경로</text><line x1="60.0" y1="360.0" x2="740.0" y2="360.0" stroke="#e3e7eb" stroke-width="1"/><text x="52.0" y="364.0" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">0.0</text><line x1="60.0" y1="309.6" x2="740.0" y2="309.6" stroke="#e3e7eb" stroke-width="1"/><text x="52.0" y="313.6" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">0.5</text><line x1="60.0" y1="259.2" x2="740.0" y2="259.2" stroke="#e3e7eb" stroke-width="1"/><text x="52.0" y="263.2" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">1.0</text><line x1="60.0" y1="208.8" x2="740.0" y2="208.8" stroke="#e3e7eb" stroke-width="1"/><text x="52.0" y="212.8" font-size="11" fill="#5b6774" text-anchor="end" font-weight="normal">1.5</text><line x1="60.0" y1="158.5" x2="740.0" y2="158.5" stroke="#e3e7eb" stroke-