<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Helvetica Neue', Arial, sans-serif" font-size="12" role="img" aria-label="다음에 볼 숫자와 각 답이 바꾸는 것"><rect x="0" y="0" width="760" height="472" fill="#ffffff"/><text x="24.0" y="28.0" font-size="15.5" fill="#17212b" text-anchor="start" font-weight="bold">다음에 볼 숫자와 각 답이 바꾸는 것</text><text x="24.0" y="50.0" font-size="12" fill="#5b6774" text-anchor="start" font-weight="normal">날짜는 예상 시점입니다. 오른쪽은 각 관측이 모형에서 움직이는 값입니다</text><line x1="40.0" y1="78.0" x2="40.0" y2="448.0" stroke="#9cc0e6" stroke-width="3"/><circle cx="40.0" cy="88.0" r="8" fill="#2563a8"/><text x="58.0" y="93.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">12월 중순</text><text x="58.0" y="112.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">마이크론의 2027년 업계 D램 공급 전망</text><rect x="310.0" y="76.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="96.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">+20% 이상이고 재고 증가 언급이 없으면 +22% 경로(2027년 영업이익 약 617조원).</text><text x="322.0" y="111.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">+12% 이하면 구조 경로(약 725조원).</text><circle cx="40.0" cy="166.0" r="8" fill="#2563a8"/><text x="58.0" y="171.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">12월 말</text><text x="58.0" y="190.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">트렌드포스 1Q27 범용 D램 계약가 전망</text><rect x="310.0" y="154.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="174.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">두 경로 모두 +4~5%라 경로를 가르지 않습니다. 보합 이하면 2026년 말 재고가</text><text x="322.0" y="189.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">가정보다 많다는 신호입니다.</text><circle cx="40.0" cy="244.0" r="8" fill="#2563a8"/><text x="58.0" y="249.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">2027년 1월 말</text><text x="58.0" y="268.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">삼성 4Q26 실적, 재고 주수, 이사회 환원</text><text x="58.0" y="284.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">정책</text><rect x="310.0" y="232.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="252.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">출발 재고와 자본 규약을 실측값으로 바꿉니다. 가치 −5.2만~+1.9만원.</text><circle cx="40.0" cy="322.0" r="8" fill="#159a6c"/><text x="58.0" y="327.0" font-size="13" fill="#159a6c" text-anchor="start" font-weight="bold">2027년 3월 말</text><text x="58.0" y="346.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">트렌드포스 2Q27 계약가 전망</text><rect x="310.0" y="310.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="330.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">첫 판별입니다. 두 자릿수 상승이면 구조 경로, 하락이면 +22% 경로(모형 +11.2% 대</text><text x="322.0" y="345.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">−1.4%).</text><circle cx="40.0" cy="400.0" r="8" fill="#2563a8"/><text x="58.0" y="405.0" font-size="13" fill="#2563a8" text-anchor="start" font-weight="bold">2027년 하반기</text><text x="58.0" y="424.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">2028년분 HBM·범용 D램 장기계약</text><rect x="310.0" y="388.0" width="430.0" height="66.0" fill="#f6f8fa" rx="4"/><text x="322.0" y="408.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">가격 유지와 물량 확약이면 2028년 인정 유지. 두 자릿수 중반 이상 인하면</text><text x="322.0" y="423.5" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="normal">2027년까지로 낮춥니다(−4.2만~−6.4만원).</text></svg>