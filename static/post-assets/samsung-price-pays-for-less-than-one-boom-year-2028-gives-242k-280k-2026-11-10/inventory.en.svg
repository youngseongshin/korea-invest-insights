uarterly DRAM price</text><text x="600.0" y="136.0" font-size="12" fill="#17212b" text-anchor="start" font-weight="bold">change</text><text x="600.0" y="166.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">2Q27</text><text x="600.0" y="185.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Structural +11.2%</text><text x="600.0" y="204.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">+22% path −1.4%</text><text x="600.0" y="227.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="bold">2028</text><text x="600.0" y="246.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">Structural flat</text><text x="600.0" y="265.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">+22%: −1.1% to −1.4%</text><text x="600.0" y="280.0" font-size="11.5" fill="#5b6774" text-anchor="start" font-weight="normal">a quarter</text><text x="24.0" y="443.1" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">The model has no order cancellations and no unwinding of double orders, so it cannot produce a crash. That does not make a crash</text><text x="24.0" y="458.0" font-size="11" fill="#5b6774" text-anchor="start" font-weight="normal">unlikely. The end-2026 starting stock (4.5 and 11 weeks) is also an assumption.</text></svg>