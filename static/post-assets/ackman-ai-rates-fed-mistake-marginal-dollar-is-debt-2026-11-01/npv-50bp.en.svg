<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="0" y="0" width="760" height="340" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">NPV and equity-multiple change when the discount rate rises from 5.0% to 5.5% (50bp)</text><rect x="20" y="44" width="12" height="12" fill="#2f5fd0"/><text x="38" y="54" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">Short-lived, high-return investment</text><rect x="260" y="44" width="12" height="12" fill="#b3261e"/><text x="278" y="54" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">Long-lived assets and equity multiples</text><line x1="320" y1="74" x2="320" y2="290" stroke="#17212b" stroke-width="1"/><text x="310" y="95" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">200 back in one year</text><text x="310" y="110" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 100%</text><rect x="320" y="87" width="30.0" height="18" rx="3" fill="#2f5fd0"/><text x="358.0" y="101" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-1.0%</text><text x="310" y="139" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">100 a year for five years</text><text x="310" y="154" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 96.6%</text><rect x="320" y="131" width="54.0" height="18" rx="3" fill="#2f5fd0"/><text x="382.0" y="145" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-1.8%</text><text x="310" y="183" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">GPU server (5 years)</text><text x="310" y="198" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 19.9%</text><rect x="320" y="175" width="132.0" height="18" rx="3" fill="#2f5fd0"/><text x="460.0" y="189" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-4.4%</text><text x="310" y="227" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">Data center building (15 years)</text><text x="310" y="242" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 10.0%</text><rect x="320" y="219" width="369.0" height="18" rx="3" fill="#b3261e"/><text x="697.0" y="233" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-12.3%</text><text x="310" y="271" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">Perpetual-growth equity multiple</text><text x="310" y="286" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">20.0x to 18.2x</text><rect x="320" y="263" width="273.0" height="18" rx="3" fill="#b3261e"/><text x="601.0" y="277" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-9.1%</text><text x="20" y="318" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Hypothetical examples; each invests 100 today. Equity multiple = 1/(discount rate - growth), 9% discount rate and 4% growth.</text></svg>
