<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="0" y="0" width="760" height="340" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">할인율이 5.0%에서 5.5%로 오를 때(50bp) NPV와 주식 배수 변화</text><rect x="20" y="44" width="12" height="12" fill="#2f5fd0"/><text x="38" y="54" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">수명이 짧고 기대수익이 높은 투자</text><rect x="250" y="44" width="12" height="12" fill="#b3261e"/><text x="268" y="54" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">수명이 긴 자산과 주식 배수</text><line x1="320" y1="74" x2="320" y2="290" stroke="#17212b" stroke-width="1"/><text x="310" y="95" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">1년 뒤 200 회수</text><text x="310" y="110" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 100%</text><rect x="320" y="87" width="30.0" height="18" rx="3" fill="#2f5fd0"/><text x="358.0" y="101" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-1.0%</text><text x="310" y="139" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">5년간 매년 100 회수</text><text x="310" y="154" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 96.6%</text><rect x="320" y="131" width="54.0" height="18" rx="3" fill="#2f5fd0"/><text x="382.0" y="145" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-1.8%</text><text x="310" y="183" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">GPU 서버(5년)</text><text x="310" y="198" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 19.9%</text><rect x="320" y="175" width="132.0" height="18" rx="3" fill="#2f5fd0"/><text x="460.0" y="189" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-4.4%</text><text x="310" y="227" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">데이터센터 건물(15년)</text><text x="310" y="242" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">IRR 10.0%</text><rect x="320" y="219" width="369.0" height="18" rx="3" fill="#b3261e"/><text x="697.0" y="233" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-12.3%</text><text x="310" y="271" font-size="13" fill="#17212b" text-anchor="end" font-weight="normal">영구성장 주식 배수</text><text x="310" y="286" font-size="11" fill="#5b6670" text-anchor="end" font-weight="normal">20.0배에서 18.2배로</text><rect x="320" y="263" width="273.0" height="18" rx="3" fill="#b3261e"/><text x="601.0" y="277" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal" font-family="Menlo, 'DejaVu Sans Mono', monospace">-9.1%</text><text x="20" y="318" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">가상 예시입니다. 모두 지금 100을 투자합니다. 주식 배수는 1/(할인율-성장률), 할인율 9%와 성장률 4% 가정입니다.</text></svg>
