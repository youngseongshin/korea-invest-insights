<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">Most accept the premise; they split on the conclusion</text><text x="20" y="50" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">Premise: core AI capex funded with own cash shrugs off a 25bp hike</text><text x="135.0" y="78" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="bold">Rebuttal</text><path d="M265 84 V78 H740 V84" fill="none" stroke="#17212b" stroke-width="1"/><rect x="444.5" y="68" width="116" height="16" fill="#ffffff"/><text x="502.5" y="80" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">Accept the premise</text><rect x="20" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#5b6670" stroke-width="1.5"/><path d="M20 132 V98 a6 6 0 0 1 6 -6 H244 a6 6 0 0 1 6 6 V132 Z" fill="#eef0f2"/><line x1="20" y1="132" x2="250" y2="132" stroke="#5b6670" stroke-width="1"/><text x="34" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Rebut the argument</text><text x="34" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Kevin Warsh</text><text x="34" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Fed Chair · capex is rate-sensitive</text><text x="34" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Cullen Roche</text><text x="34" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Discipline Funds · hikes do not lift inflation</text><rect x="265" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="1.5"/><path d="M265 132 V98 a6 6 0 0 1 6 -6 H489 a6 6 0 0 1 6 6 V132 Z" fill="#e8eefb"/><line x1="265" y1="132" x2="495" y2="132" stroke="#2f5fd0" stroke-width="1"/><text x="279" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">Accept, critical of hikes</text><text x="279" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Bill Ackman</text><text x="279" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Pershing Square · hike may be a mistake</text><text x="279" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Mark Zandi</text><text x="279" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Moody's</text><text x="279" y="246" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Gregory Daco</text><text x="279" y="262" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">EY-Parthenon</text><rect x="510" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/><path d="M510 132 V98 a6 6 0 0 1 6 -6 H734 a6 6 0 0 1 6 6 V132 Z" fill="#f8e9e8"/><line x1="510" y1="132" x2="740" y2="132" stroke="#b3261e" stroke-width="1"/><text x="524" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">So stay restrictive</text><text x="524" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Beth Hammack</text><text x="524" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Cleveland Fed · dissented for a hike</text><text x="524" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Christopher Waller</text><text x="524" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Fed Governor</text><text x="524" y="246" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">Lisa Cook</text><text x="524" y="262" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Fed Governor · dissented for a hike</text><rect x="20" y="302" width="720" height="52" rx="6" fill="#f4f5f6"/><text x="34" y="323" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">Data · Joe Brusuelas (RSM): after the September hike, AI capex does not look rate-sensitive</text><text x="34" y="342" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">Q3 nonresidential fixed investment +12.7%, equipment +24.7% (annualized, BEA advance); most of Q3 predates the hike</text><text x="20" y="380" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Sources: Fed statement (Oct 28), Yahoo Finance, Scotsman Guide, TIKR, TipRanks, InvestorPlace. As of Nov 1, 2026.</text></svg>
