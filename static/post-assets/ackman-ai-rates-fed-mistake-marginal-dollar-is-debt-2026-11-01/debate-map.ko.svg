<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif" font-size="12"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#17212b" text-anchor="start" font-weight="bold">전제는 대부분 받아들이고, 결론에서 갈립니다</text><text x="20" y="50" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">전제: 자기 돈으로 하는 코어 AI 투자는 25bp 인상에 흔들리지 않는다</text><text x="135.0" y="78" font-size="12" fill="#5b6670" text-anchor="middle" font-weight="bold">반박</text><path d="M265 84 V78 H740 V84" fill="none" stroke="#17212b" stroke-width="1"/><rect x="444.5" y="68" width="116" height="16" fill="#ffffff"/><text x="502.5" y="80" font-size="12" fill="#17212b" text-anchor="middle" font-weight="bold">전제 수용</text><rect x="20" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#5b6670" stroke-width="1.5"/><path d="M20 132 V98 a6 6 0 0 1 6 -6 H244 a6 6 0 0 1 6 6 V132 Z" fill="#eef0f2"/><line x1="20" y1="132" x2="250" y2="132" stroke="#5b6670" stroke-width="1"/><text x="34" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">애크먼의 논리를 반박</text><text x="34" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">케빈 워시</text><text x="34" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">연준 의장 · 투자 둔감 부정</text><text x="34" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">컬런 로시</text><text x="34" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">Discipline Funds · 물가 상승론 반박</text><rect x="265" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="1.5"/><path d="M265 132 V98 a6 6 0 0 1 6 -6 H489 a6 6 0 0 1 6 6 V132 Z" fill="#e8eefb"/><line x1="265" y1="132" x2="495" y2="132" stroke="#2f5fd0" stroke-width="1"/><text x="279" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">전제 수용, 인상에 비판적</text><text x="279" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">빌 애크먼</text><text x="279" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">퍼싱스퀘어 · 인상은 실수일 수 있다</text><text x="279" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">마크 잔디</text><text x="279" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">무디스</text><text x="279" y="246" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">그레고리 다코</text><text x="279" y="262" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">EY-Parthenon</text><rect x="510" y="92" width="230" height="196" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/><path d="M510 132 V98 a6 6 0 0 1 6 -6 H734 a6 6 0 0 1 6 6 V132 Z" fill="#f8e9e8"/><line x1="510" y1="132" x2="740" y2="132" stroke="#b3261e" stroke-width="1"/><text x="524" y="117" font-size="13" fill="#17212b" text-anchor="start" font-weight="bold">그러니 제약적 기조를 유지하라</text><text x="524" y="158" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">베스 해맥</text><text x="524" y="174" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">클리블랜드 연은 · 인상 소수의견</text><text x="524" y="202" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">크리스토퍼 월러</text><text x="524" y="218" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">연준 이사</text><text x="524" y="246" font-size="13" fill="#17212b" text-anchor="start" font-weight="normal">리사 쿡</text><text x="524" y="262" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">연준 이사 · 인상 소수의견</text><rect x="20" y="302" width="720" height="52" rx="6" fill="#f4f5f6"/><text x="34" y="323" font-size="12" fill="#17212b" text-anchor="start" font-weight="normal">자료 · 조 브루셀라스(RSM): 9월 인상 뒤에도 AI 투자는 금리에 민감해 보이지 않는다</text><text x="34" y="342" font-size="12" fill="#5b6670" text-anchor="start" font-weight="normal">3분기 비주거 고정투자 +12.7%, 장비 투자 +24.7%(연율, BEA 속보치). 3분기는 대부분 인상 전 기간입니다</text><text x="20" y="380" font-size="11" fill="#5b6670" text-anchor="start" font-weight="normal">자료: 연준 성명(10/28), Yahoo Finance, Scotsman Guide, TIKR, TipRanks, InvestorPlace. 2026년 11월 1일 기준.</text></svg>
