name: Verify Astra office post 20260911

# One publication only. No scheduled runs and no cookie-backed distribution.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-astra-office-post-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check publication diff
        run: git diff --check 33922b1c0d68a39907ed91a075957d5318b11c73 4522e7dfe09fcc225ec6e71e9962849bf0a1ea43 -- content/post/astra-office-agent-token-demand-korean-equities-2026-09-11
      - name: Verify source, live pages, feeds, taxonomies and IndexNow
        run: |
          python3 - <<'PY'
          import datetime, html, json, os, pathlib, re, time
          import urllib.error, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          slug = 'astra-office-agent-token-demand-korean-equities-2026-09-11'
          host = 'koreainvestinsights.com'
          base = 'https://' + host
          langs = ['en', 'ko', 'es', 'vi', 'fr', 'ja', 'zh']
          urls = {lang: base + ('' if lang == 'en' else '/' + lang) + '/post/' + slug + '/' for lang in langs}
          root = pathlib.Path('content/post') / slug
          report = {'slug': slug, 'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'source': {}, 'pages': {}, 'feeds': {}, 'taxonomies': {}, 'indexnow': {'status': 'not_attempted'}, 'private_distribution': 'not_executed_by_this_workflow'}
          output = pathlib.Path('publication-verification.json')
          def save():
              output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'KII-Publication-Verification/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.status, resp.geturl(), resp.read().decode('utf-8')
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical = []; self.alternates = {}; self.anchors = []; self.h1 = []; self.in_h1 = False; self.tables = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'link':
                      rel = a.get('rel', '').split()
                      if 'canonical' in rel: self.canonical.append(a.get('href', ''))
                      if 'alternate' in rel and a.get('hreflang'): self.alternates[a['hreflang']] = a.get('href', '')
                  if tag == 'a': self.anchors.append(a.get('href', ''))
                  if tag == 'h1': self.in_h1 = True
                  if tag == 'table': self.tables += 1
              def handle_endtag(self, tag):
                  if tag == 'h1': self.in_h1 = False
              def handle_data(self, data):
                  if self.in_h1: self.h1.append(data)
          titles = {}
          try:
              for lang in langs:
                  text = (root / ('index.' + lang + '.md')).read_text(encoding='utf-8')
                  title_line = next(line for line in text.splitlines() if line.startswith('title: '))
                  titles[lang] = json.loads(title_line[len('title: '):])
                  definitions = set(re.findall(r'^\[\^([^\]]+)\]:', text, re.M))
                  references = set(re.findall(r'\[\^([^\]]+)\]', text))
                  headings = len(re.findall(r'^## ', text, re.M))
                  tables = len(re.findall(r'^\|---', text, re.M))
                  assert definitions == references and len(definitions) == 13, (lang, 'footnotes')
                  assert headings >= 11 and tables == 5, (lang, 'structure', headings, tables)
                  assert 'draft: false' in text and 'slug: "' + slug + '"' in text
                  assert all(code in text for code in ['000660', '005930', '010120', '018260'])
                  if lang == 'ko':
                      assert '**' not in text and '\u2014' not in text, 'Korean prohibited formatting'
                  report['source'][lang] = {'status': 'passed', 'bytes': len(text.encode('utf-8')), 'sections': headings, 'tables': tables, 'sources': len(definitions)}
              assert 1000 * .2 * 10 * 22 * 2000 == 88_000_000
              assert 1000 * .5 * 3 * 22 * 40000 == 1_320_000_000
              assert round(.036 * 10 + .004 * 50, 2) == .56
              assert round((5 + .2 * 30) * 50 / 60 + .56, 2) == 9.73
              assert round((25 + .2 * 30) * 50 / 60 + .56, 2) == 26.39
              report['arithmetic'] = 'passed'
              save()
              pending = dict(urls)
              deadline = time.monotonic() + 480
              while pending and time.monotonic() < deadline:
                  for lang, url in list(pending.items()):
                      try:
                          code, final, body = get(url)
                          parser = Page(); parser.feed(body)
                          title_ok = titles[lang] in ''.join(parser.h1)
                          canonical_ok = url in parser.canonical
                          if code != 200 or not title_ok or parser.tables < 5:
                              raise RuntimeError('Unexpected page or incomplete article')
                          alternates_ok = all(value in parser.alternates.values() for value in urls.values())
                          linked_languages = {language: (target in parser.alternates.values() or target in parser.anchors) for language, target in urls.items()}
                          report['pages'][lang] = {'status': 'passed' if canonical_ok else 'canonical_mismatch', 'http_status': code, 'url': final, 'title_matches': title_ok, 'table_count': parser.tables, 'canonical_matches': canonical_ok, 'all_hreflang_links': alternates_ok, 'language_links': linked_languages}
                          del pending[lang]
                      except Exception as exc:
                          report['pages'][lang] = {'status': 'pending', 'error': str(exc)}
                  save()
                  if pending: time.sleep(15)
              assert not pending, 'Live verification did not pass: ' + ', '.join(pending)
              for lang in langs:
                  path = '' if lang == 'en' else '/' + lang
                  sitemap_url = base + path + '/sitemap.xml'
                  try:
                      code, _, xml = get(sitemap_url)
                      tree = ET.fromstring(xml)
                      locations = [e.text for e in tree.iter() if e.tag.rsplit('}', 1)[-1] == 'loc']
                      if urls[lang] not in locations and tree.tag.rsplit('}', 1)[-1] == 'sitemapindex':
                          candidates = [u for u in locations if u and urllib.parse.urlsplit(u).hostname == host]
                          for child in candidates[:10]:
                              _, _, child_xml = get(child)
                              locations.extend(e.text for e in ET.fromstring(child_xml).iter() if e.tag.rsplit('}', 1)[-1] == 'loc')
                      report['feeds'][lang + '_sitemap'] = {'status': 'passed' if urls[lang] in locations else 'missing', 'http_status': code}
                  except Exception as exc:
                      report['feeds'][lang + '_sitemap'] = {'status': 'failed', 'error': str(exc)}
              for lang in ['en', 'ko']:
                  path = '' if lang == 'en' else '/' + lang
                  try:
                      code, _, xml = get(base + path + '/index.xml')
                      report['feeds'][lang + '_rss'] = {'status': 'passed' if slug in xml else 'missing', 'http_status': code}
                  except Exception as exc:
                      report['feeds'][lang + '_rss'] = {'status': 'failed', 'error': str(exc)}
              for path in ['/ko/tags/' + code + '/' for code in ['005930', '000660', '010120', '018260']] + ['/ko/categories/ai-infrastructure/', '/ko/categories/semiconductors/']:
                  try:
                      code, _, body = get(base + path)
                      report['taxonomies'][path] = {'status': 'passed' if slug in body else 'missing', 'http_status': code}
                  except Exception as exc:
                      report['taxonomies'][path] = {'status': 'failed', 'error': str(exc)}
              save()
              keys = [p for p in pathlib.Path('static').glob('*.txt') if re.fullmatch(r'[0-9a-f]{32}', p.stem)]
              assert len(keys) == 1, 'IndexNow ownership file must be unambiguous'
              key = keys[0].read_text(encoding='utf-8').strip()
              assert key == keys[0].stem, 'IndexNow ownership file mismatch'
              key_location = base + '/' + keys[0].name
              _, _, published_key = get(key_location)
              assert published_key.strip() == key, 'Published ownership file mismatch'
              payload = {'host': host, 'key': key, 'keyLocation': key_location, 'urlList': list(urls.values())}
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json; charset=utf-8', 'User-Agent': 'KII-Publication-Verification/1.0'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                      report['indexnow'] = {'status': 'submitted' if status == 200 else 'accepted_key_validation_pending' if status == 202 else 'unexpected', 'http_status': status, 'url_count': len(urls), 'indexing_guaranteed': False}
              except urllib.error.HTTPError as exc:
                  report['indexnow'] = {'status': 'failed', 'http_status': exc.code}
              except Exception as exc:
                  report['indexnow'] = {'status': 'failed', 'error': str(exc)}
              save()
              public_ok = all(p['status'] == 'passed' for p in report['pages'].values()) and all(p['status'] == 'passed' for p in report['feeds'].values()) and all(p['status'] == 'passed' for p in report['taxonomies'].values()) and report['indexnow']['status'] in ['submitted', 'accepted_key_validation_pending']
              report['overall'] = 'passed' if public_ok else 'partial'
              save()
              compact = {'overall': report['overall'], 'source_languages': len(report['source']), 'pages': {k: v['status'] for k, v in report['pages'].items()}, 'feeds': {k: v['status'] for k, v in report['feeds'].items()}, 'taxonomies': {k: v['status'] for k, v in report['taxonomies'].items()}, 'indexnow': report['indexnow'], 'private_distribution': report['private_distribution']}
              message = json.dumps(compact, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=KII publication verification::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('# Astra office post verification\n\n```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n')
              if not public_ok: raise SystemExit('Public verification has incomplete checks; inspect report')
          except BaseException as exc:
              report.setdefault('overall', 'failed')
              report['error'] = str(exc)
              save()
              raise
          PY
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-office-post-publication-verification
          path: publication-verification.json
          retention-days: 30
