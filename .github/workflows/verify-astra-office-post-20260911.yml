name: Verify Astra office post 20260911

# One publication only. This follow-up corrects the RSS endpoint check.
# Prior page, source, sitemap, taxonomy and IndexNow evidence is preserved.
# No additional IndexNow submission or cookie-backed distribution occurs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-astra-office-post-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm article matches previously verified publication
        run: git diff --exit-code 4522e7dfe09fcc225ec6e71e9962849bf0a1ea43 HEAD -- content/post/astra-office-agent-token-demand-korean-equities-2026-09-11
      - name: Read original verification evidence
        uses: actions/download-artifact@v4
        with:
          name: astra-office-post-publication-verification
          run-id: 34560671109
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Verify configured RSS feeds without resending IndexNow
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, tomllib, urllib.request
          import xml.etree.ElementTree as ET
          slug = 'astra-office-agent-token-demand-korean-equities-2026-09-11'
          report = json.loads(pathlib.Path('prior-evidence/publication-verification.json').read_text())
          assert report['slug'] == slug
          assert report['indexnow']['http_status'] == 200 and report['indexnow']['url_count'] == 7
          assert all(v['status'] == 'passed' for v in report['source'].values())
          assert all(v['status'] == 'passed' and v['all_hreflang_links'] and all(v['language_links'].values()) for v in report['pages'].values())
          assert all(v['status'] == 'passed' for k, v in report['feeds'].items() if k.endswith('_sitemap'))
          assert all(v['status'] == 'passed' for v in report['taxonomies'].values())
          config = tomllib.loads(pathlib.Path('hugo.toml').read_text())
          feed_name = config['outputFormats']['RSS']['baseName']
          assert feed_name == 'feed', 'Review changed feed configuration before running'
          report['prior_evidence_run'] = 34560671109
          report['rss_checked_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report['indexnow']['receipt_reused_without_resubmission'] = True
          report.pop('error', None)
          for lang in ['en', 'ko', 'es', 'vi', 'fr', 'ja', 'zh']:
              prefix = '' if lang == 'en' else '/' + lang
              url = 'https://koreainvestinsights.com' + prefix + '/' + feed_name + '.xml'
              article = 'https://koreainvestinsights.com' + prefix + '/post/' + slug + '/'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'KII-Publication-Verification/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      code = response.status
                      tree = ET.fromstring(response.read())
                  links = [e.text for e in tree.iter() if e.tag.rsplit('}', 1)[-1] == 'link' and e.text]
                  assert code == 200 and article in links, 'Published article missing from RSS'
                  report['feeds'][lang + '_rss'] = {'status': 'passed', 'http_status': code, 'url': url, 'article_present': True}
              except Exception as exc:
                  report['feeds'][lang + '_rss'] = {'status': 'failed', 'url': url, 'error': str(exc)}
          report['overall'] = 'passed' if all(v['status'] == 'passed' for v in report['feeds'].values()) else 'partial'
          pathlib.Path('publication-verification.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          compact = {'overall': report['overall'], 'feeds': {k: v['status'] for k, v in report['feeds'].items()}, 'indexnow': report['indexnow'], 'private_distribution': report['private_distribution']}
          notice = json.dumps(compact, ensure_ascii=False).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=KII corrected publication verification::' + notice)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('# Publication verification\n\n```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n')
          if report['overall'] != 'passed': raise SystemExit('RSS verification incomplete; inspect report')
          PY
      - name: Retain corrected verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-office-post-publication-verification-corrected
          path: publication-verification.json
          retention-days: 30
